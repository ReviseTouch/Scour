# Scour's settings. They live in %APPDATA%\scour\config\config.toml, which
# the first start writes with one source for every fixed drive.
#
# `roots` is what gets indexed. Write paths with their drive letter. Listing
# any source here replaces the drives, so list everything you want indexed.

[[source]]
name  = "documents"
kind  = "local"
roots = ['C:\Users\YOU\Documents', 'C:\Users\YOU\Downloads']
watch = true

# A whole drive works too; the first scan takes a while.
# [[source]]
# name  = "d-drive"
# kind  = "local"
# roots = ['D:\']
# watch = true

[scan]
hidden          = true
follow_symlinks = false
threads         = 0      # 0 = chosen to suit the disk

[exclude]
dirs  = ["node_modules", "target", ".git", "$RECYCLE.BIN", "System Volume Information"]
files = []
