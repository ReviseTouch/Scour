name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Tests run where the program has been run: Linux. Windows and macOS are
  # compiled below, which is what the README claims for them and no more.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq pkg-config libfontconfig1-dev
      - run: cargo build --workspace --locked
      - run: cargo test --workspace --locked

  # One Linux runner, three targets: every cross-platform break so far was a
  # `std::os::unix` call with no `cfg` around it, and `cargo check --target`
  # finds all of them in a minute.
  cross:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc, x86_64-apple-darwin, aarch64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace --locked --target x86_64-pc-windows-msvc
      - run: cargo check --workspace --locked --target x86_64-apple-darwin
      - run: cargo check --workspace --locked --target aarch64-apple-darwin

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq pkg-config libfontconfig1-dev
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked
