[package]
name        = "scour-grep"
description = "Which of these files hold this text: read by what each disk can bear."
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
repository.workspace   = true
publish.workspace      = true

[lints]
workspace = true

# **Nothing of Scour's.** What arrives is a list of paths and what to look
# for; what leaves is where it was found. The vectorised search is `regex`'s
# and `memchr`'s own, and what a disk can bear is `surefoot`'s answer — the
# same one the walk asks, so the two cannot disagree about a disk.
[dependencies]
flate2   = { workspace = true }
scour-extract = { workspace = true }
# Which documents are handed over, and what a name inside a zip is: the
# format table.
scour-formats = { workspace = true }
regex    = { workspace = true }
memchr   = { workspace = true }
simdutf8 = { workspace = true }
surefoot = { workspace = true }

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = ["Win32_System_Threading"] }

[dev-dependencies]
tempfile = "3"
# The name query's rule of how many mistakes a word is forgiven, for the
# tests and the bench; the library is handed it by its caller.
scour-core = { workspace = true }
