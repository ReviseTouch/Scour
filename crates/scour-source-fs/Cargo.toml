[package]
name        = "scour-source-fs"
description = "The local filesystem as a scour_core::Source. Portable: one implementation for Linux, Windows and macOS."
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
repository.workspace   = true
publish.workspace      = true

[lints]
workspace = true

[dependencies]
scour-core        = { workspace = true }
ignore            = { workspace = true }
crossbeam-channel = { workspace = true }

# **Not on Linux**, where the only watching mechanism is fanotify placed by a
# privileged helper — see `watch::start`. Elsewhere `notify` is the way to reach
# ReadDirectoryChangesW and FSEvents.
[target.'cfg(not(target_os = "linux"))'.dependencies]
notify            = { workspace = true }

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true }

[dev-dependencies]
tempfile = "3"
