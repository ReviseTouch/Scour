[package]
name        = "scour-index-native"
description = "The Scour index, written for this workload. One implementation of scour_core::Index."
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
repository.workspace   = true
publish.workspace      = true

[lints]
workspace = true

[features]
memory-trace = []

[dependencies]
scour-core  = { workspace = true }
scour-query = { workspace = true }
memmap2     = { workspace = true }
memchr      = { workspace = true }
# Already in the tree through globset, so the facade costs no new compilation.
regex       = { workspace = true }
parking_lot = { workspace = true }
serde       = { workspace = true }
serde_json  = { workspace = true }

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true }

[dev-dependencies]
scour-mock = { workspace = true }
tempfile   = "3"
