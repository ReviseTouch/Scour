[package]
name = "scour-openers"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

# **Nothing.** Which programs claim a type is written in files the desktop
# already ships, in a format that has not changed since 2007. What *type* a
# file is stays with `scour-thumbs`, which already reads that table — two
# readers of one table is the drift this workspace keeps writing down.
[dependencies]

# Windows opens and shows through the shell itself: `explorer` given a path
# with a space, quoted as Rust quotes it, opened Documents instead (PC2,
# 17 November).
[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = [
    "Win32_System_Com",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_WindowsAndMessaging",
] }

[lints]
workspace = true
