[package]
name        = "scour-preview"
description = "What a browser can draw of a file, and where the desktop's own quick-look is."
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
repository.workspace   = true
publish.workspace      = true

[lints]
workspace = true

# **`serde` and `scour-extract`, not even `scour-core`.** Nothing here knows what
# an index is, what a `Kind` is, or that Scour exists: it answers "can this be
# shown, and how much of it", which is a question about a file and a browser.
# That is what makes it usable from the bridge, the window, or anything else
# that ever needs to show a file — and what makes its tests need no fixtures.
# `scour-extract` is the one reader of what is inside a document, shared with
# grep, and knows nothing of Scour either.
# `serde` arrived when the *decision* started crossing the wire, so that four
# frontends stop each having their own idea of what is readable.
[dependencies]
serde = { workspace = true }
scour-extract = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Data_Pdf",
    "Graphics_Imaging",
    "Storage",
    "Storage_Streams",
    "Win32_Foundation",
    "Win32_System_WinRT",
] }
