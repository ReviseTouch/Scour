[package]
name        = "scour-engine"
description = "Wires sources to an index. Names no concrete implementation."
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
repository.workspace   = true
publish.workspace      = true

[lints]
workspace = true

[features]
memory-trace = []

# Note what is *not* here: no tantivy, no notify, no ignore, no filesystem.
# This crate is handed a `Box<dyn Source>` and an `Arc<dyn Index>` and has no
# way of finding out what they are. If that ever stops being true, the
# abstraction they need is missing from scour-core.
[dependencies]
scour-core        = { workspace = true }
scour-query       = { workspace = true }
# Not about search: it takes paths and sizes and answers which of them hold
# the same bytes. Here rather than in the index because the index's job is to
# say which files there are, and this one's is what to do with that list.
scour-dupes       = { workspace = true }
# Also not about search: it takes rows and answers what they look like as a
# file something else can open. Here, and only here, because the service is the
# one thing all four frontends talk to — four copies of RFC 4180 quoting is
# four chances for a spreadsheet to open and be quietly wrong.
scour-export      = { workspace = true }
crossbeam-channel = { workspace = true }
parking_lot       = { workspace = true }

[dev-dependencies]
scour-index-native = { workspace = true }
scour-mock          = { workspace = true }
tempfile            = "3"
