[package]
name        = "scour-extract"
description = "The text inside a file: ZIP containers read under bounds, XML made plain."
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
repository.workspace   = true
publish.workspace      = true

[lints]
workspace = true

# **Nothing of Scour's**, so `scour-grep` and `scour-preview`, which know
# nothing of Scour either, can share it: one reader of a ZIP's directory, one
# inflater, one way of turning a document's XML into lines.
[dependencies]
# Which documents are read here, by extension: the format table.
scour-formats = { workspace = true }
# An archive's listing is a sheet the faces already draw.
scour-flow = { workspace = true }
# A 7z archive's headers are LZMA-packed: read with a pure-Rust reader,
# its compressors beyond LZMA left out (`default-features = false`). Held
# at a release three weeks old (2026-11-06), not the newest.
sevenz-rust2 = { version = "=0.25.0", default-features = false }
flate2 = { workspace = true }
memchr = { workspace = true }
icu_normalizer = { workspace = true }
