[package]
name        = "scour-i18n"
description = "Translation. gettext catalogues, compiled in, with the English source as the key."
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
repository.workspace   = true
publish.workspace      = true

[lints]
workspace = true

[dependencies]
scour-core = { workspace = true }

# The account's locale on Windows, where no variable says it.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Globalization"] }
