[package]
name        = "scour-ipc"
description = "Carrying scour-proto over a local socket. Transport only."
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
repository.workspace   = true
publish.workspace      = true

[lints]
workspace = true

[dependencies]
scour-core   = { workspace = true }
scour-proto  = { workspace = true }
serde_json   = { workspace = true }
interprocess = { workspace = true }

# An access list on the service's pipe, written as SDDL: already in the tree
# through `interprocess`, which takes the descriptor as a wide string.
[target.'cfg(windows)'.dependencies]
widestring = "1.2"

[dev-dependencies]
tempfile = "3"
interprocess = { workspace = true }
