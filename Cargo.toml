[workspace]
resolver = "3"
members = [
    "crates/scour-core",
    "crates/scour-query",
    "crates/scour-icon",
    "crates/scour-mock",
    "crates/scour-source-fs",
    "crates/scour-config",
    "crates/scour-proto",
    "crates/scour-engine",
    "crates/scour-ipc",
    "crates/scour-client",
    "crates/scour-i18n",
    "crates/scour-preview",
    "crates/scour-flow",
    "crates/scour-dupes",
    "crates/scour-grep",
    "crates/scour-extract",
    "crates/scour-doctext",
    "crates/scour-textcache",
    "crates/scour-trash",
    "crates/scour-clip",
    "crates/scour-drag",
    "crates/scour-name",
    "crates/scour-openers",
    "crates/scour-sendto",
    "crates/scour-export",
    "crates/scour-settings",
    "crates/scour-places",
    "crates/scour-volumes",
    "crates/scour-page",
    "crates/scour-launch",
    "crates/scour-hotkey",
    "crates/scour-chart",

    "crates/scour-thumbs",
    "crates/scour-ui",
    "crates/scour-index-native",
    "apps/scourd",
    "apps/scour",
    "apps/scour-mcp",
    "apps/scour-web",
    "apps/scour-gui",
    "apps/scour-tui",
    "apps/scour-watch",
    "apps/scour-extractor",
]

[workspace.package]
# **Alpha, and the number says so.** `0.2.0-alpha.1` rather than `0.2.0`:
# the Linux side is used daily against 4.6 M entries, but the Windows build
# has had one afternoon on one machine, macOS has never been run, and the
# performance round that halved the service's CPU landed the same week. A
# version without a suffix is a promise about all of that.
version      = "0.2.0-alpha.12"
edition      = "2024"
rust-version = "1.92"          # structured-zstd's MSRV, the highest of any dependency
license      = "MIT OR Apache-2.0"
repository   = "https://github.com/ReviseTouch/Scour"
publish      = false

[workspace.dependencies]
# --- internal -----------------------------------------------------------
#
# The dependency rule of this workspace: nothing but `scour-core` may be
# depended on by more than one layer. Every other crate is an implementation
# that is chosen at the top, in `apps/scourd`. If you find yourself adding an
# implementation crate to another implementation crate's dependencies, the
# abstraction it needs is missing from `scour-core`.
scour-core          = { path = "crates/scour-core" }
scour-query         = { path = "crates/scour-query" }
scour-icon          = { path = "crates/scour-icon" }
scour-proto         = { path = "crates/scour-proto" }
scour-ipc           = { path = "crates/scour-ipc" }
scour-client        = { path = "crates/scour-client" }
scour-index-native  = { path = "crates/scour-index-native" }
scour-source-fs     = { path = "crates/scour-source-fs" }
scour-config        = { path = "crates/scour-config" }
scour-i18n          = { path = "crates/scour-i18n" }
scour-preview       = { path = "crates/scour-preview" }
scour-flow          = { path = "crates/scour-flow" }
scour-dupes        = { path = "crates/scour-dupes" }
scour-grep          = { path = "crates/scour-grep" }
scour-extract       = { path = "crates/scour-extract" }
scour-doctext       = { path = "crates/scour-doctext" }
scour-textcache     = { path = "crates/scour-textcache" }
scour-trash         = { path = "crates/scour-trash" }
scour-clip           = { path = "crates/scour-clip" }
scour-drag           = { path = "crates/scour-drag" }
scour-name           = { path = "crates/scour-name" }
scour-openers        = { path = "crates/scour-openers" }
scour-sendto         = { path = "crates/scour-sendto" }
scour-export        = { path = "crates/scour-export" }
scour-settings      = { path = "crates/scour-settings" }
scour-places        = { path = "crates/scour-places" }
scour-volumes       = { path = "crates/scour-volumes" }
scour-page          = { path = "crates/scour-page" }
scour-launch        = { path = "crates/scour-launch" }
scour-hotkey        = { path = "crates/scour-hotkey" }
scour-chart         = { path = "crates/scour-chart" }
scour-thumbs        = { path = "crates/scour-thumbs" }
scour-ui            = { path = "crates/scour-ui" }
scour-engine        = { path = "crates/scour-engine" }
scour-mock          = { path = "crates/scour-mock" }

# --- external -----------------------------------------------------------
serde       = { version = "1", features = ["derive"] }
serde_json  = "1"
toml        = "1"
bitflags    = { version = "2", features = ["serde"] }
anyhow      = "1"
clap        = { version = "4", features = ["derive"] }
ratatui     = "0.30.2"


# Filesystem traversal and watching. `surefoot` is this project's own walker,
# kept in a repository of its own so that other programs can use it: it asks
# what the roots are standing on and reads through the open directory.
surefoot    = { git = "https://github.com/ReviseTouch/surefoot", tag = "v0.1.0" }
notify      = "8"

# The text cache's compression: zstd at any level, written and read in pure
# Rust, so every target builds without a C compiler (Apache-2.0). Its frames
# are libzstd's, the same size at each level, and C reads them: a switch back
# to the C library loses nothing. Measured against libzstd, ruzstd, brotli
# and lz4 in `docs/MEASUREMENTS.md`.
structured-zstd = { version = "=0.4.4", default-features = false, features = ["std", "hash", "kernel-scalar", "kernel-sse", "kernel-bmi2", "kernel-avx2", "kernel-neon"] }

# Unicode composition for `scour-extract`'s one normal form. Already in the
# tree through Slint; Unicode-3.0 licence, like every Unicode table.
icu_normalizer = { version = "2", default-features = false, features = ["compiled_data"] }

# Platform config/data directories. Replaces the hand-rolled XDG logic, which
# put macOS config in ~/.config instead of ~/Library/Application Support.
directories = "6"

# Local IPC: Unix domain socket on unix, named pipe on Windows, one API.
interprocess = "2"

crossbeam-channel = "0.5"
ctrlc             = "3"
parking_lot = "0.12"
humansize   = "2"
memmap2     = "0.9"
memchr      = "2"
flate2      = { version = "1.1", default-features = false, features = ["zlib-rs"] }

# For `regex:` terms in a query. Its engine, regex-automata and regex-syntax,
# is here for this alone since the walker stopped being `ignore`.
regex       = "1"
# Whether a buffer is UTF-8, at the speed of the search that follows: `std`'s
# check reads Turkish text at 0.9 GB/s, slower than the search it decides.
# Already here under `encoding_rs`.
simdutf8    = "0.1"
# The text cache's table, keyed by paths kept in one buffer of their own.
# Already here under three crates; no default hasher, the cache hashes.
hashbrown   = { version = "0.16", default-features = false }

# One writer per index directory. The lock has to be released by the *kernel*
# when a process dies — a pid file leaves a stale claim after exactly the crash
# it exists to survive — so this is `flock` and `LockFileEx` directly rather
# than a crate wrapping them.
libc        = "0.2"
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Ioctl",
    "Win32_System_Memory",
    "Win32_System_SystemServices",
] }

# MCP. Only `apps/scour-mcp` depends on these, which is the whole reason it is
# a separate binary: the CLI and the daemon stay free of an async runtime.
rmcp        = { version = "3", features = ["server", "macros", "transport-io"] }
tokio       = { version = "1", features = ["rt-multi-thread", "macros", "io-std", "signal"] }
schemars    = "1"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "warn"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
# Interfaces here are `&dyn Trait` heavy on purpose; the lint fires on shapes
# that are the point rather than an accident.
too_many_arguments = "allow"
type_complexity    = "allow"

[profile.release]
opt-level     = 3
lto           = "thin"
codegen-units = 1
# **Line tables, and the binary keeps them.**
#
# `strip = "symbols"` was here, and it cost more than it saved: the window
# panicked inside the renderer on somebody else's machine and the crash it
# wrote down said `0: <unknown>` eleven times. A stripped backtrace names
# nothing, so a crash that happens once an hour stays unexplained for as long
# as nobody can make it happen on demand.
#
# `line-tables-only` is the cheap half of debug info — file and line for each
# frame, no variables, no types. It changes no code and costs nothing at run
# time; it is bytes on disk, and a crash report that names a line is worth
# more than those bytes.
debug         = 0
strip         = "none"

[profile.dev]
opt-level = 1   # a debug-speed walker makes the scan tests unbearable
