<!doctype html>
<!-- Without the doctype the `height: 100%` chain from `html` to the results
     list does not connect. `lang` is the source language, rewritten by
     `applyLanguage` when the catalogue lands. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark light">
<title>Scour</title>
</head>
<body>

<style>
  /* One loud voice: freshness. */
  /* @THEME@ — see `scour-ui`; the bridge writes this block when it serves
     the page, so that the window and this page cannot drift apart. */

  * { box-sizing: border-box; }

  /* Only the results list scrolls; the query line must never leave the screen. */
  html, body { height: 100%; overflow: hidden; margin: 0; }

  .wrap {
    background: var(--ground);
    color: var(--ink);
    font-family: var(--sans);
    font-size: 14px;
    line-height: 1.45;
    padding: calc(var(--u) * 5);
    height: 100%;
    box-sizing: border-box;
    display: grid;
    /* One column: the help is an overlay and re-lays out nothing. */
    grid-template-columns: minmax(0, 1fr);
    grid-template-rows: minmax(0, 1fr);
    align-items: stretch;
  }

  .app  { grid-column: 1; grid-row: 1; }

  /* The `<b>` in the help panel's "permission" paragraph depends on this. */
  .help b { color: var(--ink); font-weight: 620; }

  /* ---------------- the application window ---------------- */
  .app {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 3px;
    overflow: hidden;
    box-shadow: 0 18px 50px -28px rgba(0,0,0,.7);
    /* Every child but the list is `auto`, so leftover height lands on the list. */
    display: grid;
    grid-template-rows: auto auto auto minmax(0, 1fr);
    min-height: 0;
    height: 100%;
  }

  .query {
    display: flex;
    align-items: baseline;
    gap: calc(var(--u) * 3);
    padding: calc(var(--u) * 4) calc(var(--u) * 5) calc(var(--u) * 3);
    border-bottom: 1px solid var(--line-soft);
  }
  .brand {
    font-size: 12px;
    font-weight: 700;
    letter-spacing: .28em;
    text-transform: uppercase;
    color: var(--ink-3);
    flex: none;
    padding-top: 3px;
  }
  /* With an empty query: a prompt glyph, an underline, a focus colour. */
  .qline {
    display: flex;
    align-items: baseline;
    gap: calc(var(--u) * 3);
    flex: 1;
    min-width: 0;
    border-bottom: 2px solid var(--line);
    padding-bottom: calc(var(--u) * 1.5);
  }
  .qline:focus-within { border-bottom-color: var(--t1); }
  .prompt {
    flex: none;
    font: 600 17px/1.35 var(--mono);
    color: var(--ink-3);
    user-select: none;
  }
  .qline:focus-within .prompt { color: var(--t1); }

  .qfield { flex: 1; min-width: 0; position: relative; overflow: visible; }
  .qfield input {
    width: 100%;
    background: none;
    border: 0;
    outline: 0;
    color: transparent;
    caret-color: var(--ink);
    font: 600 20px/1.3 var(--mono);
    letter-spacing: -.01em;
    padding: 0;
    position: relative;
    z-index: 2;
  }
  /* The query stays real text — selectable, copyable — and this layer colours it. */
  .qshadow {
    position: absolute;
    inset: 0;
    font: 600 20px/1.3 var(--mono);
    letter-spacing: -.01em;
    white-space: pre;
    overflow: hidden;
    pointer-events: none;
    /* A bare term: blue for wanted, red for `!`. See `scour_ui::Palette`. */
    color: var(--q-term);
    z-index: 1;
  }
  /* Role → colour is the frontend's only job; the engine sends the spans. */
  .qshadow .r-field { color: var(--q-key); font-weight: 700; }
  .qshadow .r-value { color: var(--q-val); }
  .qshadow .r-cmp   { color: var(--q-key); }
  .qshadow .r-colon,
  .qshadow .r-sep,
  /* A `;` typed instead of a space carries this role. */
  .qshadow .r-space,
  .qshadow .r-quote { color: var(--ink-3); }
  .qshadow .r-phrase{ color: var(--q-val); }
  .qshadow .r-glob  { color: var(--q-glob); }
  .qshadow .r-not   { color: var(--q-not); font-weight: 700; }
  /* `|` is structure, not exclusion: it says how terms combine. */
  .qshadow .r-or    { color: var(--q-key); font-weight: 700; }

  /* The whole excluded term (`Span::not`): after the roles, before the warnings. */
  .qshadow .excluded { color: var(--q-not); }

  /* A term the parser cannot read is searched for as its own text. */
  .qshadow .r-bad_value,
  .qshadow .r-unknown_field {
    color: var(--q-bad);
    text-decoration: underline wavy var(--q-bad);
    text-underline-offset: 4px;
    text-decoration-thickness: 1px;
  }

  /* The syntax the caret touches: `ext:pdf` less its `:` searches for "extpdf". */
  .qshadow .caret-touch {
    border-radius: 2px;
    background: var(--q-not);
    color: var(--panel);
    box-shadow: 0 0 0 1px var(--q-not);
  }

  .qfield input::placeholder { color: var(--ink-3); font-weight: 500; }

  /* No node per term: the face is monospace, so the caret index is
     `x / charWidth`. No z-index here, or the layer hides what it points at. */
  #qpast {
    position: absolute;
    right: 0;
    top: 50%;
    transform: translateY(-50%);
    z-index: 3;
    width: 20px;
    height: 20px;
    padding: 0;
    border: 0;
    border-radius: 3px;
    background: none;
    color: var(--ink-3);
    font: 600 11px/1 var(--sans);
    cursor: pointer;
  }
  #qpast[hidden] { display: none; }
  #qpast:hover { color: var(--ink); background: var(--line-soft); }
  #qpast[aria-expanded="true"] { color: var(--ink); background: var(--line-soft); }
  #qpast:focus-visible { outline: 2px solid var(--focus); outline-offset: 1px; }
  .qfield input { padding-right: 22px; }

  .qacts {
    position: absolute;
    inset: 0;
    pointer-events: none;
  }
  /* Behind the shadow layer (1) and the input (2), or it covers the term. */
  .qacts .band {
    position: absolute;
    top: -3px;
    bottom: -3px;
    z-index: 0;
    border-radius: 4px;
    background: var(--line-soft);
  }
  /* The line box is 26px, so -19px is clear air above the glyphs. */
  .qacts button {
    width: 17px;
    height: 17px;
    padding: 0;
    border: 0;
    border-radius: 50%;
    background: var(--line);
    color: var(--ink-2);
    font: 600 10px/1 var(--sans);
    cursor: pointer;
    pointer-events: auto;
    display: grid;
    place-items: center;
  }
  /* One box over both buttons and the gap: a bare pixel loses the pointer. */
  .qacts .pair {
    position: absolute;
    top: -19px;
    display: flex;
    gap: 3px;
    padding-bottom: 8px;
    pointer-events: auto;
    z-index: 4;
  }
  .qacts button:hover { background: var(--ink-3); color: var(--panel); }
  .qacts button.drop:hover { background: var(--q-bad); color: #fff; }
  .qacts button.neg:hover { background: var(--q-not); color: #fff; }
  .qacts button:focus-visible { outline: 2px solid var(--focus); outline-offset: 1px; }

  /* The query as a sentence: `explain`'s `description`, red when misread. */
  .qread {
    margin: calc(var(--u) * 2) 0 0;
    min-height: 15px;
    font: 500 11.5px/1.3 var(--sans);
    color: var(--ink-3);
    letter-spacing: .01em;
  }
  .qread b { color: var(--ink-2); font-weight: 600; }
  .qread.warn { color: var(--q-bad); }

  /* Completions, from the engine's field table. */
  .hints {
    position: absolute;
    top: calc(100% + 8px);
    left: 0;
    min-width: 280px;
    max-height: 232px;
    overflow-y: auto;
    background: var(--panel-2);
    border: 1px solid var(--line);
    border-radius: 8px;
    box-shadow: 0 20px 44px -24px rgba(0,0,0,.75);
    padding: calc(var(--u) * 1);
    z-index: 30;
  }
  .hints[hidden] { display: none; }
  .hints button {
    display: flex;
    align-items: baseline;
    gap: calc(var(--u) * 3);
    width: 100%;
    background: none;
    border: 0;
    border-radius: 5px;
    padding: calc(var(--u) * 1.5) calc(var(--u) * 2);
    text-align: left;
    cursor: pointer;
    color: var(--ink-2);
    font: 500 12px/1.3 var(--sans);
  }
  .hints button code {
    font: 700 12.5px/1.3 var(--mono);
    color: var(--q-key);
    flex: none;
  }
  .hints button[aria-selected="true"] { background: var(--line-soft); color: var(--ink); }
  .hints button:hover { background: var(--line-soft); }

  .meter {
    display: flex;
    align-items: center;
    gap: calc(var(--u) * 4);
    padding: 0 calc(var(--u) * 5) calc(var(--u) * 3);
    font: 500 11.5px/1 var(--mono);
    font-variant-numeric: tabular-nums;
    color: var(--ink-3);
    letter-spacing: .02em;
    flex-wrap: wrap;
  }
  .meter .big { color: var(--ink); font-size: 12.5px; font-weight: 650; }
  .meter .ms  { color: var(--t0); font-weight: 650; }
  .meter .sep { color: var(--line); }

  /* ---------------- body ---------------- */
  .body { display: grid; grid-template-columns: 186px minmax(0, 1fr); min-height: 0; overflow: hidden; }
  /* `hidden` has to win over `display: grid`, or the inactive tab keeps its row. */
  .body[hidden], .report[hidden] { display: none; }
  #view-search, #view-report { grid-row: 4; }
  .rail { overflow-y: auto; min-height: 0; }
  /* Advice, not an alarm: the window works, it is only slower than it should be. */
  .stale { color: var(--t1); }
  /* The previous query's counts, dimmed; the 0.12s delay stops a flicker. */
  .rail.settling { opacity: .55; transition: opacity .18s ease-in .12s; }
  @media (max-width: 720px) { .body { grid-template-columns: 1fr; } .rail { display: none; } }

  .rail {
    border-right: 1px solid var(--line-soft);
    padding: calc(var(--u) * 3) 0;
    background: var(--panel-2);
  }
  .rail h2 {
    margin: calc(var(--u) * 3) calc(var(--u) * 4) calc(var(--u) * 1.5);
    font-size: 10px;
    letter-spacing: .18em;
    text-transform: uppercase;
    color: var(--ink-3);
    font-weight: 650;
  }
  .rail h2:first-child { margin-top: 0; }
  .facet {
    display: flex;
    align-items: center;
    gap: calc(var(--u) * 2);
    width: 100%;
    background: none;
    border: 0;
    text-align: left;
    padding: 3px calc(var(--u) * 4);
    color: var(--ink-2);
    font: inherit;
    font-size: 12.5px;
    cursor: pointer;
    border-left: 2px solid transparent;
  }
  .facet:hover { background: var(--panel); color: var(--ink); }
  .facet:focus-visible { outline: 2px solid var(--focus); outline-offset: -2px; }
  .facet[aria-pressed="true"] { color: var(--ink); border-left-color: var(--t1); background: var(--panel); }
  .facet .dot { width: 7px; height: 7px; border-radius: 1px; flex: none; }
  /* Kinds get no colour — colour means time — so a bar carries the count. */
  .facet.bar { position: relative; }
  .facet.bar > .fill {
    position: absolute; left: 0; top: 2px; bottom: 2px;
    background: var(--line); border-radius: 0 2px 2px 0; z-index: 0;
  }
  .facet.bar > .nm, .facet.bar > .ct { position: relative; z-index: 1; }
  .facet.bar[aria-pressed="true"] > .fill { background: var(--line); opacity: 1; }
  .facet .nm { flex: 1; min-width: 0; }
  .facet .ct {
    font-family: var(--mono);
    font-variant-numeric: tabular-nums;
    font-size: 11px;
    color: var(--ink-3);
  }

  /* ---------------- results ---------------- */
  .results { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
  .scroll {
    flex: 1;
    overflow: auto;
    position: relative;
    /* A reused row moves index, so an anchor would correct `scrollTop`,
       fire `scroll`, and move the spacer again. */
    overflow-anchor: none;
  }
  /* What the list is as tall as: stated, never summed. See `paintWindow`. */
  .sizer { position: absolute; top: 0; left: 0; width: 1px; height: 0; pointer-events: none; }
  table { width: 100%; border-collapse: collapse; table-layout: fixed; }
  /* A fixed layout alone still lets an unbreakable word push the row out. */
  tbody td { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  thead th {
    position: sticky; top: 0; z-index: 3;
    background: var(--panel);
    border-bottom: 1px solid var(--line);
    padding: calc(var(--u) * 2) calc(var(--u) * 3);
    text-align: left;
    font-size: 10px;
    letter-spacing: .14em;
    text-transform: uppercase;
    color: var(--ink-3);
    font-weight: 650;
    white-space: nowrap;
    cursor: pointer;
    user-select: none;
  }
  thead th { position: sticky; }
  /* Nine pixels centred on the line a hand aims at; headings rank downwards
     so a grip beats its neighbour — see `buildHeads`. */
  thead th .grip {
    position: absolute; top: 0; right: -4px; bottom: 0;
    width: 9px; cursor: col-resize; z-index: 4;
  }
  /* Five pixels of inset keeps the line off the row's own bottom rule. */
  thead th .grip::after {
    content: ""; position: absolute; top: 5px; bottom: 5px; left: 4px;
    width: 1px; background: var(--line);
  }
  thead th .grip:hover::after,
  thead th .grip.dragging::after {
    background: var(--q-key); top: 0; bottom: 0; width: 2px;
  }
  /* Carrying a column: the heading fades so the drop line is what the eye follows. */
  thead th.moving { opacity: .4; }
  .dropline {
    position: absolute; top: 0; bottom: 0; width: 2px;
    background: var(--t1); z-index: 6; pointer-events: none;
  }
  .dropline[hidden] { display: none; }
  body.moving-col { cursor: grabbing; user-select: none; }
  body.moving-col * { cursor: grabbing !important; }
  /* Nothing else reacts to the pointer mid-drag: a crossed row would select. */
  body.resizing { cursor: col-resize; user-select: none; }
  body.resizing * { cursor: col-resize !important; }

  thead th:hover { color: var(--ink); }
  thead th.num { text-align: right; }
  thead th[aria-sort]:not([aria-sort="none"]) { color: var(--ink); }
  thead th .arrow { color: var(--t1); }

  tbody tr { border-bottom: 1px solid var(--line-soft); }
  tbody tr:hover { background: var(--panel-2); }
  /* Selection, hover and match stack, so the wash is translucent and on the cells. */
  #scanning { color: var(--q-key); font-weight: 650; }

  tbody tr.sel td { background: var(--pick); }
  tbody td { padding: 0 calc(var(--u) * 3); height: var(--row); vertical-align: middle; }

  /* What is selected, said in a line. Gone when nothing is selected. */
  .selbar {
    display: flex; align-items: center; gap: calc(var(--u) * 3);
    padding: calc(var(--u) * 2) calc(var(--u) * 3);
    border-top: 1px solid var(--line);
    background: var(--panel-2);
    font: 500 12px/1 var(--mono); color: var(--ink-2);
    flex-wrap: wrap;
  }
  .selbar[hidden] { display: none; }
  .selbar .n { color: var(--ink); font-weight: 650; }
  .selbar .sum { color: var(--ink-3); }
  .selbar .grow { flex: 1; }
  .selbar button {
    background: none; border: 1px solid var(--line); border-radius: 3px;
    padding: calc(var(--u) * 1.25) calc(var(--u) * 2.5);
    font: inherit; color: var(--ink-2); cursor: pointer;
  }
  .selbar button:hover { color: var(--ink); border-color: var(--ink-3); }
  .selbar button:focus-visible { outline: 2px solid var(--focus); outline-offset: 1px; }
  .selbar button.asking { color: var(--q-not); border-color: var(--q-not); }

  /* The mark column: the freshness rule and the type glyph share it, and
   * `top: 0; bottom: 0` beats a stated height a fractional row rounds past. */
  td.age { padding: 0 0 0 3px; width: 30px; position: relative; text-align: center; }
  td.age i { position: absolute; left: 0; top: 0; bottom: 0; width: 3px; }

  .name { font: 500 13px/1 var(--mono); color: var(--ink); white-space: nowrap; }
  /* A wash, not a highlighter: it stacks over a selected row. */
  .name mark { background: var(--mark); color: inherit; padding: 1px 0; border-radius: 2px; }
  /* No width of its own: the cell is the constraint, and this agrees to be cut. */
  .path {
    font: 400 11.5px/1 var(--mono);
    color: var(--ink-3);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .path b { color: var(--ink-2); font-weight: 400; }
  /* Dates are right-aligned as numbers, left when they are words. */
  td.n.left { text-align: left; }
  td.n {
    font: 400 12px/1 var(--mono);
    font-variant-numeric: tabular-nums;
    text-align: right;
    color: var(--ink-2);
    white-space: nowrap;
  }
  td.kind { font-size: 11.5px; color: var(--ink-2); white-space: nowrap; }
  .empty { padding: calc(var(--u) * 12); text-align: center; color: var(--ink-3); font-size: 13px; }
  .empty code { font-family: var(--mono); color: var(--ink-2); }

  /* The grid is the same list, `PER_ROW` to a line. The tile height and
   * `TILE[…].h` are one number, guarded by a test; the heading row stays as
   * the sort control and gives up its widths. */
  body.grid[data-view="icons"] { --tile-h: 104px; --pic: 56px; --nm: 11px; }
  body.grid[data-view="large"] { --tile-h: 172px; --pic: 120px; --nm: 12px; }
  /* The gutter is reserved either way: `PER_ROW` is read from `clientWidth`. */
  body.grid .scroll { scrollbar-gutter: stable; }
  body.grid .results table { display: block; }
  body.grid .results thead { display: block; }
  body.grid .results thead tr { display: flex; align-items: stretch; }
  body.grid .results thead th { width: auto; flex: 0 0 auto; }
  /* Nothing to drag: the widths mean nothing while the tiles are showing. */
  body.grid .results thead th .grip { display: none; }
  body.grid #rows-body { display: grid; gap: 0; }
  body.grid #rows-body > tr { display: block; border-bottom: 0; }
  body.grid #rows-body > tr.spacer,
  body.grid #rows-body > tr.far { grid-column: 1 / -1; }
  body.grid #rows-body > tr.ghost { height: auto; }
  body.grid #rows-body > tr > td { display: block; padding: 0; }
  body.grid #rows-body > tr.spacer > td { height: 0; }
  /* `height` is the pitch and the whole outer box, so `lines * pitch` is what
     the list occupies. Written this deep to beat `display: block` above. */
  body.grid #rows-body > tr > td.tile {
    position: relative;
    height: var(--tile-h);
    /* Separates one tile's rule from the next, inside the stated height. */
    border-bottom: 1px solid transparent;
    padding: calc(var(--u) * 2) calc(var(--u) * 2) 0;
    display: flex; flex-direction: column; align-items: center;
    gap: calc(var(--u) * 1.5);
    overflow: hidden;
  }
  /* Three pixels here too, and `top: 0; bottom: 0` as `td.age i` has them. */
  body.grid td.tile > i { position: absolute; left: 0; top: 0; bottom: 0; width: 3px; }
  body.grid td.tile .ico {
    width: var(--pic); height: var(--pic);
    object-fit: contain;
    flex: none;
  }
  body.grid td.tile span.ico {
    background-color: var(--k, var(--ink-3));
    -webkit-mask: var(--g) center / var(--pic) var(--pic) no-repeat;
    mask: var(--g) center / var(--pic) var(--pic) no-repeat;
  }
  /* Two lines and then an ellipsis: a third would break the stated pitch. */
  body.grid td.tile .nm {
    font: 500 var(--nm)/1.35 var(--mono);
    color: var(--ink);
    text-align: center;
    width: 100%;
    display: -webkit-box;
    -webkit-box-orient: vertical;
    -webkit-line-clamp: 2;
    overflow: hidden;
    overflow-wrap: anywhere;
    white-space: normal;
  }
  body.grid td.tile .nm mark { background: var(--mark); color: inherit; border-radius: 2px; }
  body.grid tbody tr:hover td.tile { background: var(--panel-2); }
  body.grid tbody tr:focus-visible { outline: none; }
  body.grid tbody tr:focus-visible td.tile { outline: 2px solid var(--focus); outline-offset: -2px; }
  body.grid #rows-body > tr.far > td { height: auto; }

  /* The three shapes, in the bar that carries what is true of the window. */
  .views { display: flex; gap: 2px; }
  .views button {
    background: none; border: 1px solid var(--line); color: var(--ink-3);
    width: 18px; height: 18px; border-radius: 3px; cursor: pointer;
    font: 600 11px/1 var(--sans); padding: 0;
  }
  .views button:hover { color: var(--ink); border-color: var(--ink-3); }
  .views button[aria-pressed="true"] { color: var(--q-key); border-color: var(--q-key); }
  .views button:focus-visible { outline: 2px solid var(--focus); outline-offset: 1px; }

  /* ---------------- the time ribbon ---------------- */
  .ribbon {
    border-top: 1px solid var(--line);
    background: var(--panel-2);
    padding: calc(var(--u) * 2.5) calc(var(--u) * 5) calc(var(--u) * 3);
  }
  .ribbon-head {
    display: flex; justify-content: space-between; align-items: baseline;
    font-size: 10px; letter-spacing: .14em; text-transform: uppercase;
    color: var(--ink-3); font-weight: 650; margin-bottom: calc(var(--u) * 2);
  }
  .ribbon-head span { letter-spacing: .02em; text-transform: none; font-weight: 500;
                      font-family: var(--mono); font-size: 10.5px; }
  .bars { display: flex; align-items: flex-end; gap: 2px; height: 46px; }
  .bars button {
    flex: 1; border: 0; padding: 0; background: none; cursor: pointer;
    display: flex; align-items: flex-end; height: 100%;
    border-radius: 1px;
  }
  .bars button:focus-visible { outline: 2px solid var(--focus); outline-offset: 1px; }
  .bars i { display: block; width: 100%; border-radius: 1px 1px 0 0; opacity: .9; }
  .bars button:hover i { opacity: 1; }
  .bars button[aria-pressed="true"] i { opacity: 1; box-shadow: 0 0 0 1px var(--ink) inset; }
  .scale {
    display: flex; justify-content: space-between;
    margin-top: 5px;
    font: 500 9.5px/1 var(--mono);
    letter-spacing: .04em;
    color: var(--ink-3);
  }

  /* ---------------- duplicates ---------------- */
  .dupes { margin-top: calc(var(--u) * 7); }
  .dupes-head {

  .floors button[aria-pressed="true"] { color: var(--ink); background: var(--panel-2); border-color: var(--ink-3); }
  .floors button:focus-visible { outline: 2px solid var(--focus); outline-offset: 1px; }
  #d-open {
    flex: none; font: inherit; font-size: 11.5px;
    background: var(--panel-2); color: var(--ink-2);
    border: 1px solid var(--line); border-radius: 3px;
    padding: 3px calc(var(--u) * 2.5); cursor: pointer;
  }
  #d-open:hover { color: var(--ink); border-color: var(--ink-3); }
  #d-open:focus-visible { outline: 2px solid var(--focus); outline-offset: 1px; }
  .dupes-head button {
    flex: none; font: inherit; font-size: 11.5px;
    background: var(--panel-2); color: var(--ink-2);
    border: 1px solid var(--line); border-radius: 3px;
    padding: 3px calc(var(--u) * 2.5); cursor: pointer;
  }
  .dupes-head button:hover:enabled { color: var(--ink); border-color: var(--ink-3); }
  .dupes-head button:disabled { opacity: .5; cursor: default; }
  .dupes-head button:focus-visible { outline: 2px solid var(--focus); outline-offset: 1px; }
  .dupe {
    border-top: 1px solid var(--line-soft);
    padding: calc(var(--u) * 2) 0;
  }
  .dupe .top {
    display: flex; align-items: baseline; gap: calc(var(--u) * 2.5);

  }
  .dupe .save { color: var(--ink); font-weight: 650; }
  .dupe .of { color: var(--ink-3); }
  /* Proven and same-length-only are different claims, so this is coloured. */
  .dupe .sure { margin-left: auto; font-size: 10.5px; letter-spacing: .04em; }
  /* Read and compared is calm; not-yet-read must catch the eye. */
  .dupe .sure.content { color: var(--ink-2); }
  .dupe .sure.size, .dupe .sure.edges { color: var(--t1); font-weight: 650; }
  .dupe ul { margin: 3px 0 0; padding: 0 0 0 calc(var(--u) * 3); list-style: none; }
  .dupe li {
    font-family: var(--mono); font-size: 11px; color: var(--ink-2);
    overflow-wrap: anywhere; line-height: 1.5;
  }

  /* This face has handed over to another one, so the server is going. */
  .handover {
    position: fixed; inset: auto 0 0 0; z-index: 40;
    padding: calc(var(--u) * 3);
    background: var(--panel-2);
    border-top: 1px solid var(--line);
    font: 500 12.5px/1.4 var(--sans); color: var(--ink-2);
    text-align: center;
  }

  /* The preview: a third column, shut by default, a third of the width open. */
  .body { --peek-w: 380px; }
  .body.peeking { grid-template-columns: 186px minmax(0, 1fr) var(--peek-w); }
  /* Under 900px there is no room for three, so the panel becomes the window. */
  @media (max-width: 900px) {
    .body.peeking { grid-template-columns: 0 0 1fr; }
    .body.peeking .rail, .body.peeking .results { display: none; }
  }
  .peek {
    border-left: 1px solid var(--line-soft);
    background: var(--panel-2);
    display: flex; flex-direction: column;
    min-width: 0; min-height: 0; overflow: hidden;
  }
  .peek[hidden] { display: none; }
  .peek-head {
    display: flex; align-items: center; gap: calc(var(--u) * 2);
    padding: calc(var(--u) * 2.5) calc(var(--u) * 3);
    border-bottom: 1px solid var(--line-soft);
    flex: none;
  }
  .peek-head .nm {
    flex: 1; min-width: 0;
    font-size: 12.5px; font-weight: 600; color: var(--ink);
    /* It wraps: an rtl clip renders `2023 NTP.pdf` as `NTP.pdf 2023`. */
    overflow-wrap: anywhere;
    max-height: 2.8em; overflow: hidden;
    line-height: 1.35;
  }
  .peek-head button {
    flex: none; background: none; border: 0; cursor: pointer;
    color: var(--ink-3); font-size: 15px; line-height: 1;
    padding: 2px 6px; border-radius: 3px;
  }
  .peek-head button:hover { color: var(--ink); background: var(--line-soft); }
  .peek-head button:focus-visible { outline: 2px solid var(--focus); outline-offset: 1px; }

  .peek-body {
    flex: 1; min-height: 0; overflow: auto;
    display: flex; align-items: center; justify-content: center;
    padding: calc(var(--u) * 3);
  }
  /* Text fills the panel; a picture is centred in it. */
  .peek-body.text { display: block; padding: 0; }
  .peek-body pre {
    margin: 0; padding: calc(var(--u) * 3);
    font: 400 11.5px/1.55 var(--mono);
    color: var(--ink-2);
    white-space: pre-wrap; word-break: break-word;
    tab-size: 4;
  }
  .peek-body pre mark {
    background: var(--mark); color: inherit;
    padding: 1px 0; border-radius: 2px;
  }
  .peek-body img, .peek-body video {
    max-width: 100%; max-height: 100%;
    object-fit: contain;
    /* A transparent PNG on a dark panel is a picture of nothing. */
    background:
      repeating-conic-gradient(var(--line-soft) 0% 25%, transparent 0% 50%) 50% / 16px 16px;
    border-radius: 2px;
  }
  .peek-body audio { width: 100%; }
  .peek-body embed { width: 100%; height: 100%; border: 0; }
  .peek-body .none {
    text-align: center; color: var(--ink-3); font-size: 12px; line-height: 1.6;
  }
  .peek-body .none img {
    display: block; margin: 0 auto calc(var(--u) * 2);
    max-width: 128px; max-height: 128px; background: none;
  }
  .peek-cut {
    flex: none;
    padding: calc(var(--u) * 1.5) calc(var(--u) * 3);
    border-top: 1px solid var(--line-soft);
    font: 500 10.5px var(--mono); color: var(--ink-3);
  }
  .peek-facts {
    flex: none; margin: 0;
    border-top: 1px solid var(--line-soft);
    padding: calc(var(--u) * 2.5) calc(var(--u) * 3);
    display: grid; grid-template-columns: auto 1fr;
    gap: 3px calc(var(--u) * 3);
    font-size: 11.5px;
    max-height: 42%; overflow: auto;
  }
  .peek-facts dt { color: var(--ink-3); white-space: nowrap; }
  .peek-facts dd {
    margin: 0; color: var(--ink-2);
    font-family: var(--mono); font-size: 11px;
    overflow-wrap: anywhere;
  }

  /* The help panel is `fixed`, anchored by measurement (`placeHelp`), and not
   * modal — the box still takes keystrokes. */
  .help {
    position: fixed;
    z-index: 60;
    width: min(430px, calc(100vw - 40px));
    max-height: min(560px, calc(100vh - 120px));
    overflow-y: auto;
    overscroll-behavior: contain;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 4px;
    box-shadow: 0 24px 60px -20px rgba(0,0,0,.75);
    padding: calc(var(--u) * 4) calc(var(--u) * 5) calc(var(--u) * 5);
    color: var(--ink-2);
    font-size: 13px;
    line-height: 1.55;
  }
  .help[hidden] { display: none; }

  /* What is skipped: an overlay, so its switches do not push the table down. */
  .sheet {
    position: fixed;
    top: 64px; right: 20px;
    z-index: 60;
    width: min(400px, calc(100vw - 40px));
    max-height: min(620px, calc(100vh - 120px));
    overflow-y: auto;
    overscroll-behavior: contain;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 4px;
    box-shadow: 0 24px 60px -20px rgba(0,0,0,.75);
    padding: calc(var(--u) * 4) calc(var(--u) * 5) calc(var(--u) * 5);
    color: var(--ink-2);
    font-size: 13px;
    line-height: 1.55;
  }
  .sheet[hidden] { display: none; }
  /* One face per row: a dot for the running one, and once armed a button. */
  .face { border-radius: 3px; }
  .face.armed { background: var(--hover); }
  .face .pick {
    display: flex; align-items: center; gap: 8px; width: 100%;
    padding: 6px; background: none; border: 0; color: var(--ink);
    font: inherit; font-size: 12px; text-align: left; cursor: pointer;
  }
  .face .pick:hover:not(:disabled) { background: var(--hover); border-radius: 3px; }
  .face .pick:disabled { color: var(--ink-3); cursor: default; }
  .face .dot { width: 12px; color: var(--ink-3); }
  .face .pick:disabled .dot { color: var(--q-key); }
  .face .name { flex: 1; }
  .face .aside { color: var(--ink-3); font-size: 11px; }
  .face .say {
    display: flex; align-items: center; gap: 8px;
    padding: 0 6px 8px 26px;
  }
  .face .say p { flex: 1; margin: 0; color: var(--ink-2); font-size: 11px; }
  .face .say .go {
    padding: 5px 12px; border: 1px solid var(--q-key); border-radius: 3px;
    background: none; color: var(--q-key); font: inherit; font-size: 11px;
    cursor: pointer; white-space: nowrap;
  }
  .sheet h2 {
    font-size: 13px; letter-spacing: .16em; text-transform: uppercase;
    font-weight: 650; color: var(--ink); margin: 0 0 calc(var(--u) * 3);
  }
  .sheet h3 {
    font-size: 10px; letter-spacing: .16em; text-transform: uppercase;
    font-weight: 650; color: var(--ink-3);
    margin: calc(var(--u) * 5) 0 calc(var(--u) * 2);
    padding-top: calc(var(--u) * 3);
    border-top: 1px solid var(--line);
  }
  .sheet .why { margin: 0 0 calc(var(--u) * 2); font-size: 12px; color: var(--ink-3); }
  ul.rules { list-style: none; margin: 0; padding: 0; }
  ul.rules li {
    display: flex; align-items: center; gap: calc(var(--u) * 2);
    padding: 2px 0;
  }
  /* The label is the hit target: a 13px checkbox is hard to aim at. */
  ul.rules label {
    flex: 1; display: flex; align-items: center; gap: calc(var(--u) * 2);
    cursor: pointer; min-width: 0;
  }
  ul.rules code {
    font-family: var(--mono); font-size: 11.5px; color: var(--ink);
    overflow-wrap: anywhere;
  }
  /* In a list of forty, the checkbox alone does not read as off. */
  ul.rules li.off code { color: var(--ink-3); text-decoration: line-through; }
  ul.rules .drop {
    background: none; border: 0; padding: 0 calc(var(--u));
    color: var(--ink-3); font-size: 15px; line-height: 1; cursor: pointer;
  }
  ul.rules .drop:hover { color: var(--q-bad, var(--ink)); }
  form.add { display: flex; gap: calc(var(--u) * 2); margin-top: calc(var(--u) * 3); }
  form.add input {
    flex: 1; min-width: 0;
    background: var(--panel-2); color: var(--ink);
    border: 1px solid var(--line); border-radius: 2px;
    padding: 3px 6px; font: inherit; font-size: 12px;
  }
  form.add button {
    background: var(--panel-2); color: var(--ink);
    border: 1px solid var(--line); border-radius: 2px;
    padding: 3px 10px; font: inherit; font-size: 12px; cursor: pointer;
  }
  form.add button:hover { border-color: var(--ink-3); }

  .help-head { display: flex; align-items: baseline; gap: calc(var(--u) * 3); }
  .help h1 {
    flex: 1;
    font-size: 13px; letter-spacing: .16em; text-transform: uppercase;
    font-weight: 650; color: var(--ink); margin: 0;
  }
  .help-head button {
    background: none; border: 0; padding: 0 calc(var(--u));
    color: var(--ink-3); font-size: 17px; line-height: 1; cursor: pointer;
  }
  .help-head button:hover { color: var(--ink); }
  .help-head button:focus-visible { outline: 2px solid var(--focus); outline-offset: 1px; }
  .help h2 {
    font-size: 10px; letter-spacing: .16em; text-transform: uppercase;
    font-weight: 650; color: var(--ink-3);
    margin: calc(var(--u) * 5) 0 calc(var(--u) * 2);
    padding-top: calc(var(--u) * 3);
    border-top: 1px solid var(--line);
  }
  .help-lead { margin: 0 0 calc(var(--u) * 3); font-size: 12.5px; }
  .help code {
    font-family: var(--mono); font-size: 11.5px;
    color: var(--ink); background: var(--panel-2);
    padding: 1px 4px; border-radius: 2px;
  }
  /* `grid`, so descriptions line up against the longest term. */
  .help-fields, .help-keys {
    display: grid;
    grid-template-columns: max-content minmax(0, 1fr);
    gap: calc(var(--u) * 1.5) calc(var(--u) * 4);
    margin: 0;
    align-items: baseline;
  }
  .help-fields dt, .help-keys dt {
    font: 500 11.5px/1.4 var(--mono);
    color: var(--ink);
    white-space: nowrap;
  }
  .help-fields dd, .help-keys dd {
    margin: 0; font-size: 12.5px; color: var(--ink-2);
  }

  /* The design notes: one column, in a panel narrower than any track minimum. */
  .legend { display: flex; flex-direction: column; gap: calc(var(--u) * 4); }
  .legend section { padding-top: 0; }
  .legend h3 {
    margin: 0 0 calc(var(--u) * 1.5);
    font-size: 11px; letter-spacing: .16em; text-transform: uppercase;
    color: var(--ink); font-weight: 650;
  }
  .legend p { margin: 0; color: var(--ink-2); font-size: 12.5px; line-height: 1.5; }
  /* The maker, at the foot of the panel: a colophon, not a banner. */
  .made {
    margin: calc(var(--u) * 5) 0 0;
    padding-top: calc(var(--u) * 3);
    border-top: 1px solid var(--line);
    font-size: 11.5px; color: var(--ink-3);
  }
  .made a { color: var(--ink-2); text-decoration: none; border-bottom: 1px solid var(--line); }
  .made a:hover { color: var(--ink); border-bottom-color: var(--ink-3); }
  .legend code {
    font-family: var(--mono); font-size: 11.5px;
    color: var(--ink); background: var(--panel-2);
    padding: 1px 4px; border-radius: 2px;
  }

  /* ---------------- theme switch ---------------- */
  .tabs { display: flex; gap: 1px; padding: 0 calc(var(--u) * 5); background: var(--panel); }
  .tabs button {
    background: none; border: 0; border-bottom: 2px solid transparent;
    padding: calc(var(--u) * 2) calc(var(--u) * 3);
    font: 650 10.5px/1 var(--sans); letter-spacing: .16em; text-transform: uppercase;
    color: var(--ink-3); cursor: pointer;
  }
  .tabs button:hover { color: var(--ink-2); }
  .tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--t1); }
  .tabs button:focus-visible { outline: 2px solid var(--focus); outline-offset: -2px; }

  /* The report: the same last row as the list, so it scrolls inside. */
  .report {
    padding: calc(var(--u) * 4) calc(var(--u) * 5) calc(var(--u) * 5);
    overflow-y: auto;
    min-height: 0;
  }
  .crumb { font: 500 12.5px/1 var(--mono); color: var(--ink-3); margin-bottom: calc(var(--u) * 3); }
  .crumb button {
    background: none; border: 0; padding: 0 2px; font: inherit;
    color: var(--ink-2); cursor: pointer; border-radius: 2px;
  }
  .crumb button:hover { color: var(--ink); text-decoration: underline; }
  .crumb button:last-child { color: var(--ink); font-weight: 650; }
  .crumb .s { color: var(--line); padding: 0 1px; }
  /* The filter, said where the scope is: together they are what the numbers
     below are about. */
  .crumb .filt {
    display: inline-flex; align-items: center; gap: 3px;
    margin-left: calc(var(--u) * 2); padding: 2px 3px 2px 6px;
    border-radius: 3px; background: var(--mark); color: var(--ink-2);
  }
  .crumb .filt b { color: var(--ink); font-weight: 650; }
  .crumb .filt button { color: var(--ink-3); padding: 0 3px; }
  .crumb .filt button:hover { color: var(--ink); text-decoration: none; }

  .headline { display: flex; align-items: baseline; gap: calc(var(--u) * 5); flex-wrap: wrap;
              margin-bottom: calc(var(--u) * 4); }
  .headline .b {
    font: 700 34px/1 var(--mono); letter-spacing: -.02em;
    font-variant-numeric: tabular-nums; color: var(--ink);
  }
  .headline .m { font: 500 12px/1.4 var(--mono); color: var(--ink-3); }
  .headline .m b { color: var(--ink-2); font-weight: 500; }

  .kids { width: 100%; border-collapse: collapse; }
  .kids th {
    text-align: left; padding: 0 calc(var(--u) * 2) calc(var(--u) * 1.5);
    font-size: 9.5px; letter-spacing: .16em; text-transform: uppercase;
    color: var(--ink-3); font-weight: 650; border-bottom: 1px solid var(--line);
  }
  .kids th.r { text-align: right; }
  .kids td { padding: calc(var(--u) * 1.5) calc(var(--u) * 2); border-bottom: 1px solid var(--line-soft); }
  .kids tr:hover td { background: var(--panel-2); }
  .kids .nmcell button {
    background: none; border: 0; padding: 0; cursor: pointer;
    font: 500 12.5px/1 var(--mono); color: var(--ink); text-align: left;
  }
  .kids .nmcell button:hover { text-decoration: underline; }
  .kids .nmcell button:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
  .kids td.r {
    text-align: right; font: 400 12px/1 var(--mono);
    font-variant-numeric: tabular-nums; color: var(--ink-2); white-space: nowrap;
  }
  .kids td.r.big { color: var(--ink); font-weight: 600; }

  .stack { display: flex; height: 13px; border-radius: 2px; overflow: hidden; background: var(--line-soft); }
  .stack i { display: block; height: 100%; }
  .stack-wrap { min-width: 120px; }

  .agekey { display: flex; gap: calc(var(--u) * 3); flex-wrap: wrap;
            margin: calc(var(--u) * 3) 0 calc(var(--u) * 5);
            font: 500 10px/1 var(--mono); color: var(--ink-3); }
  .agekey span { display: inline-flex; align-items: center; gap: 5px; }
  .agekey i { width: 9px; height: 9px; border-radius: 1px; display: block; }

  .panels { display: grid; grid-template-columns: repeat(auto-fit, minmax(215px, 1fr));
            gap: calc(var(--u) * 4); margin-top: calc(var(--u) * 5); }
  .panel {
    border: 1px solid var(--line-soft); border-radius: 3px;
    background: var(--panel-2); padding: calc(var(--u) * 3);
  }
  .panel h4 {
    margin: 0 0 calc(var(--u) * 2); font-size: 9.5px; letter-spacing: .16em;
    text-transform: uppercase; color: var(--ink-3); font-weight: 650;
  }
  .panel .line {
    display: flex; justify-content: space-between; gap: calc(var(--u) * 2);
    font: 400 11.5px/1.7 var(--mono); color: var(--ink-2);
  }
  .panel .line span:last-child { color: var(--ink); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .panel .line em { font-style: normal; color: var(--ink-3); }
  .panel .hint { margin: calc(var(--u) * 2) 0 0; font-size: 10.5px; color: var(--ink-3); line-height: 1.5; }

  /* One `margin-left: auto`, on the group: a second one does nothing. */
  .tools { display: flex; gap: 2px; margin-left: auto; align-items: center; }
  .about {
    background: none; border: 1px solid var(--line); color: var(--ink-3);
    width: 18px; height: 18px; border-radius: 3px; cursor: pointer;
    font: 600 11px/1 var(--sans); padding: 0;
  }
  .about:hover { color: var(--ink); border-color: var(--ink-3); }
  .about[aria-pressed="true"] { color: var(--q-key); border-color: var(--q-key); }
  .about[aria-expanded="true"] { color: var(--q-key); border-color: var(--q-key); }
  .about:focus-visible { outline: 2px solid var(--focus); outline-offset: 1px; }
  /* Left of the line is about the window, right of it about the list's shape. */
  .tools + .views {
    margin-left: calc(var(--u) * 3);
    padding-left: calc(var(--u) * 3);
    border-left: 1px solid var(--line);
  }

  /* ---------------- the row menu ---------------- */
  tbody tr { cursor: default; }
  tbody tr.spacer, tbody tr.ghost { pointer-events: none; }
  tbody tr.spacer td, tbody tr.ghost td { padding: 0; border: 0; }
  tbody tr.ghost { height: 31px; }
  /* A row on its way: two bars, unanimated — a shimmer is compositor work
   * every frame for as long as a list fills. */
  tbody tr.ghost td:nth-child(2)::after,
  tbody tr.ghost td:nth-child(3)::after {
    content: ""; display: block; height: 8px; border-radius: 2px;
    margin: 11px calc(var(--u) * 3); background: var(--line);
  }
  tbody tr.ghost td:nth-child(3)::after { background: var(--line-soft); }
  tbody tr.far td {
    padding: calc(var(--u) * 4) calc(var(--u) * 5);
    color: var(--ink-3); font-size: 12px;
    border-top: 1px solid var(--line);
  }
  tbody tr.far:hover { background: none; }
  tbody tr.spacer:hover, tbody tr.ghost:hover { background: none; }
  tbody tr:focus-visible { outline: 2px solid var(--q-key); outline-offset: -2px; }

  /* Fading over 1.6 s, as an overlay's opacity and never the row's
     `background`: animating that costs 36.2% of a core against 22.4%. The
     delay is inherited, so a repaint carries a half-finished fade. */
  tbody tr.fresh { position: relative; z-index: 0; }
  tbody tr.fresh::after {
    content: ""; position: absolute; inset: 0; z-index: -1;
    pointer-events: none;

  /* The English source text is the msgid, so an untranslated string degrades

   * machinery, and the catalogue test greps for `T(`. */

  let LANGUAGES = [];
  let STRINGS = {};
  const T = (msgid, vars) => {
    let s = Object.hasOwn(STRINGS, msgid) ? STRINGS[msgid] : msgid;
    if (vars) {
      for (const k of Object.keys(vars)) s = s.split("{" + k + "}").join(vars[k]);
    }
    return s;

  const DATE_PARTS = {
    day: "numeric", month: "long", year: "numeric",
    hour: "2-digit", minute: "2-digit", second: "2-digit",
  };
  /* Two decimals always, so the meter keeps its width while somebody types. */
  const MS_PARTS = { minimumFractionDigits: 2, maximumFractionDigits: 2 };
  const MB_PARTS = { minimumFractionDigits: 1, maximumFractionDigits: 1 };

    [3600,     DAY,        "--t0"],

    { name: "under",   alias: ["in", "altinda"],           takes: "path",  about: "under this folder, at any depth",                eg: "under:/home" },
    { name: "parent",  alias: ["child", "children"],       takes: "path",  about: "directly inside this folder, one level",         eg: "parent:/etc" },
    { name: "file",    alias: ["files"],                   takes: "none",  about: "files only",                                     eg: "" },
    { name: "folder",  alias: ["folders", "dir"],          takes: "none",  about: "folders only",                                   eg: "" },

    "source", "kod", "kaynak",
    "img", "pic", "gorsel", "görsel", "resim",
    "arsiv", "arşiv", "zip",
    "document", "belge",
    "exe", "bin", "executable", "calistirilabilir", "çalıştırılabilir",
    "ses", "muzik", "müzik",
    "film",
    "media", "medya",
    "derleme", "cikti", "çıktı",
    "veri",
    "conf", "settings", "ayar", "yapilandirma", "yapılandırma",

      case "text": case "path": return v.length > 0;
      case "ext":  return v.split(";").some((e) => e.replace(/^\./, "").length > 0);
      case "size": return SIZE_RE.test(v);
      case "time": return TIME_RE.test(v);

    return [name, t.slice(i + 1)];

  function tokenise(text) {

      const space = /\s/.test(text[i]);

      while (i < text.length) {
        const c = text[i];
        if (c === '"') quoted = !quoted;
        else if (!quoted && /\s/.test(c) !== space) break;
        i++;
      }
      out.push(text.slice(start, i));
    }
    return out;

  function spans(text) {

    const toks = tokenise(text).filter(Boolean);
    /* A list is a context: in `ext:rs ; toml` the spaces are separators. */

    toks.forEach((tok, i) => {
      if (/^\s+$/.test(tok)) {
        const next = toks.slice(i + 1).find((t) => !/^\s+$/.test(t));
        const joins = list && (expectValue || (next && next.startsWith(";")));

        if (!joins) { list = null; expectValue = false; }
        return;

        let rest = tok;
        if (rest.startsWith(";")) { out.push(["sep", ";"]); rest = rest.slice(1); expectValue = true; }
        if (rest) expectValue = rest.endsWith(";");
        valueSpans(out, rest, list);
        return;
      }
      if (tok === "|") { out.push(["or", tok]); list = null; expectValue = false; return; }
      if (tok === "!") { out.push(["not", tok]); list = null; expectValue = false; return; }

      expectValue = !!list && tok.endsWith(";");

    if (tok.startsWith('"')) return null;
    const sp = fieldSplit(tok.startsWith("!") ? tok.slice(1) : tok);
    return sp ? field(sp[0]) : null;

    let rest = text;
    if (rest.startsWith("!")) { out.push(["not", "!"]); rest = rest.slice(1); }
    if (!rest) return;
    const split = fieldSplit(rest);
    if (!split) return plain(out, rest);
    const [name, value] = split;
    const f = field(name);
    if (!f) { out.push(["unknown", rest]); return; }
    out.push(["field", name]);
    out.push(["colon", ":"]);
    valueSpans(out, value, f);

  function valueSpans(out, value, f) {
    if (!value) return;                       // being typed — not yet wrong
    if (!accepts(f, value)) { out.push(["bad", value]); return; }
    let v = value;
    if (f.takes === "size" || f.takes === "time") {

      if (m) { out.push(["cmp", m[1]]); v = v.slice(m[1].length); }

      v.split(";").forEach((part, i) => {

        if (part) out.push(["value", part]);

    if (v) out.push(["value", v]);

      const closed = text.length > 1 && text.endsWith('"');

      if (closed) out.push(["quote", '"']);

    out.push([/[*?]/.test(text) ? "glob" : "text", text]);

      } else if (start === null) {

      at += t.length;

    const width = (b - a) * w;
    const negated = q.value[a] === "!";

      `title="${escape_(negated ? T("Stop excluding this") : T("Exclude this term"))}">` +

  function editTerm(term, replacement) {
    const [a, b] = term;
    let before = q.value.slice(0, a), after = q.value.slice(b);
    if (!replacement) {
      // Removing a term leaves neither a double space nor a leading one.
      if (before.endsWith(" ") && after.startsWith(" ")) after = after.slice(1);
      else if (before.endsWith(" ") && !after) before = before.slice(0, -1);
      // The first term has nothing before it, so neither branch above fires.
      else if (!before && after.startsWith(" ")) after = after.slice(1);
    }
    q.value = before + replacement + after;
    const caret = (before + replacement).length;
    q.setSelectionRange(caret, caret);
    drawActs(null);
    render();
    q.focus();
  }

  q.addEventListener("mousemove", (e) => {
    const t = termAt(e.clientX);
    /* Moving off a term does not put its buttons away: reaching them means
     * leaving it. */
    if (!t) return;
    const same = hoverTerm && t[0] === hoverTerm[0] && t[1] === hoverTerm[1];
    if (!same) drawActs(t);
  });
  // Only leaving the whole field clears the buttons.
  document.querySelector(".qfield").addEventListener("mouseleave", (e) => {
    // The buttons are descendants drawn outside the box, so a gap can fire this.
    if (e.relatedTarget && acts.contains(e.relatedTarget)) return;
    drawActs(null);
  });
  q.addEventListener("scroll", () => drawActs(hoverTerm));

  acts.addEventListener("mousedown", (e) => {
    const b = e.target.closest("button");
    if (!b || !hoverTerm) return;
    e.preventDefault();
    const [a, end] = hoverTerm;
    const term = q.value.slice(a, end);
    if (b.classList.contains("drop")) return editTerm(hoverTerm, "");
    // Negation toggles rather than accumulating: `!!a` means nothing.
    editTerm(hoverTerm, term.startsWith("!") ? term.slice(1) : "!" + term);
  });

  /* The roles that make a query worth reading back: anything here means the
     text is more than words to look for. */
  const TELLING = new Set([
    "field", "colon", "cmp", "quote", "phrase", "glob", "regex", "not", "or",
    "unknown_field", "bad_value",
  ]);

  /* Words written as operators that this language does not read as any: the
     one case where a query is wrong and nothing is marked wrong. */
  const MISTAKEN = new Set(["or", "and", "not", "ve", "veya", "değil"]);

  /* Which roles are punctuation rather than something typed to search for.
     The engine's own list is `Role::is_syntax`. */
  const SYNTAX = new Set(["colon", "sep", "quote", "cmp", "not", "or"]);

  /* The engine says and the page draws: spans, sentence and completions from
   * one `explain` call, and this file maps role to colour. */
  let readGeneration = 0;
  let LAST_SPANS = [];
  /* The reading this keystroke asked for. Under a millisecond on the service,
     but it is one of the six connections, shared with the search. */
  let reading = null;

  function refreshReading(text) {
    const mine = ++readGeneration;
    // In bytes: see `jsIndexByByte`. A code-unit index puts the caret inside a
    // character as soon as one `İ` precedes it, and the service slices there.
    const where = document.activeElement === q ? (q.selectionStart ?? null) : null;
    const caret = where === null ? null : bytesBefore(text, where);
    if (reading) reading.abort();
    reading = new AbortController();
    SERVICE.explain(text, caret, reading.signal)
      .then((res) => {
        if (mine !== readGeneration) return;
        LAST_SPANS = res.spans || [];
        paint(text);
        qread.textContent = res.description || "";
        const wrong = LAST_SPANS.some(
          (s) => s.role === "unknown_field" || s.role === "bad_value",
        );
        qread.classList.toggle("warn", wrong);
        /* Shown only when it has something to say: any part of the query
         * more than a plain word, or wrong. */
        // Byte offsets, so through the map, as `paintSpans` does.
        const js = jsIndexByByte(text);
        qread.hidden =
          !wrong &&
          !LAST_SPANS.some((s) => TELLING.has(s.role)) &&
          !LAST_SPANS.some(
            (s) =>
              s.role === "text" &&
              MISTAKEN.has(text.slice(js(s.start), js(s.start + s.len)).toLowerCase()),
          );
        /* The reading lives in an `auto` grid row, so a longer one wraps after
           the list has painted, with no resize or scroll to notice it. */
        repaint(true);
      })
      .catch((e) => {
        // Let go of by the next keystroke: the normal case while typing.
        if (e.name === "AbortError") return;
        console.error("scour: query explanation did not draw:", e);
      });
  }

  /* Role → colour is in the style sheet, keyed on the role as the engine
     spells it. A role with no rule inherits the layer's own colour. */

  /* Bytes against UTF-16 code units — `İ` is one unit and two bytes —
   * reconciled here and nowhere else. Built per call. */
  const ENCODER = new TextEncoder();
  const bytesBefore = (text, i) => ENCODER.encode(text.slice(0, i)).length;

  function jsIndexByByte(text) {
    const at = new Map([[0, 0]]);
    let b = 0;
    for (let i = 0; i < text.length; ) {
      const cp = text.codePointAt(i);
      const wide = cp > 0xffff;
      b += cp < 0x80 ? 1 : cp < 0x800 ? 2 : wide ? 4 : 3;
      i += wide ? 2 : 1;
      at.set(b, i);
    }
    /* An offset that is not a boundary means the two are looking at different
       strings. The end still draws; `undefined` slices from `NaN`. */
    return (off) => (at.has(off) ? at.get(off) : text.length);
  }

  function paintSpans(text) {
    if (!LAST_SPANS.length) return [["text", text, false]];
    const js = jsIndexByByte(text);
    const out = [];
    let at = 0;
    for (const s of LAST_SPANS) {
      const start = js(s.start);
      const end = js(s.start + s.len);
      if (start > at) out.push(["text", text.slice(at, start), false]);
      out.push([s.role, text.slice(start, end), !!s.not]);
      at = end;
    }
    if (at < text.length) out.push(["text", text.slice(at), false]);
    return out;
  }

  function paint(text) {
    // A caret sits between characters, so both neighbours are candidates:
    // backspace takes the one behind, Delete the one ahead.
    const caret = document.activeElement === q ? (q.selectionStart ?? -1) : -1;
    const touch = new Set();
    if (caret >= 0 && q.selectionEnd === caret) {
      if (caret > 0) touch.add(caret - 1);
      if (caret < text.length) touch.add(caret);
    }
    let at = 0;
    let html = "";
    for (const [role, t, not] of paintSpans(text)) {
      // An excluded run needs an element of its own, even the space inside
      // `!ext:rs; toml`: the layer's own colour means the opposite.
      const plain = role === "text" && !not;
      const cls = "r-" + role + (not ? " excluded" : "");
      const marked = SYNTAX.has(role) && [...t].some((_, k) => touch.has(at + k));
      if (marked) {
        // Only the touched character is marked: `<=` is one span, and
        // backspace takes one of its two characters.
        html += [...t].map((ch, k) =>
          touch.has(at + k)
            ? '<span class="' + cls + ' caret-touch">' + escape_(ch) + "</span>"
            : '<span class="' + cls + '">' + escape_(ch) + "</span>").join("");
      } else {
        html += plain ? escape_(t) : '<span class="' + cls + '">' + escape_(t) + "</span>";
      }
      at += t.length;
    }
    shadow.innerHTML = html;
  }

  /* Whether a row has a picture arrives with it from one `stat`. Never
   * `loading="lazy"`: a browser will not start one for a page it thinks
   * nobody is looking at. */
  const iconUrl = (f) =>
    `/api/icon?t=${TOKEN}&p=${encodeURIComponent(f.path + "/" + f.name)}`;

  /* The type tokens something is drawn for; anything else falls back to the
     plain page rather than to no picture. */
  const GLYPHS = new Set([
    "folder", "file", "doc", "code", "image", "video", "media",
    "audio", "archive", "exec", "data", "config", "font", "build",
  ]);

  /* The freshness rule and the type glyph belong to the row, not a column.
   * Off removes the element: hidden nodes are still laid out on every scroll. */
  function writeMark(td, f) {
    /* The rule is first and stays first: `writeRow` reaches for it as
       `firstElementChild`, and a ghost row keeps it. */
    let rule = td.firstElementChild;
    if (!rule || rule.tagName !== "I") {
      rule = document.createElement("i");
      td.prepend(rule);
    }
    /* Only the picture: a tile holds its name in this cell too. Asked by
       class, since the glyph is a `<span>` and a thumbnail an `<img>`. */
    let el = rule.nextElementSibling;
    if (el && !el.classList.contains("ico")) el = null;
    if (!f || !ICONS) {
      if (el) el.remove();
      return rule;
    }
    const want = f.thumb ? "IMG" : "SPAN";
    if (el && el.tagName !== want) {
      el.remove();
      el = null;
    }
    if (!el) {
      el = f.thumb ? new Image() : document.createElement("span");
      el.className = "ico";
      if (f.thumb) {
        el.alt = "";
        // A thumbnail gone since the row was read is ordinary: the box stays
        // empty and the row does not jump.
        el.onerror = () => { el.style.visibility = "hidden"; };
      }
      // After the rule rather than at the end of the cell: a tile's name is
      // already there and the picture goes above it.
      rule.after(el);
    }
    if (f.thumb) {
      const url = iconUrl(f);
      if (el.getAttribute("src") !== url) {
        el.style.visibility = "";
        el.setAttribute("src", url);
      }
    } else {
      const cls = "ico k-" + (GLYPHS.has(f.ktoken) ? f.ktoken : "file");
      if (el.className !== cls) el.className = cls;
    }
    return rule;
  }

  /* The name, appended as nodes rather than through `innerHTML`: a parse per
   * row measured 15 ms a paint over two hundred rows. */
  function writeName(td, f, terms) {
    // Rewritten whole: the marked run moves with every keystroke.
    td.replaceChildren();
    const at = span(f.name, terms);
    if (!at) {
      td.append(f.name);
      return;
    }
    const mark = document.createElement("mark");
    mark.textContent = f.name.slice(at[0], at[0] + at[1]);
    td.append(f.name.slice(0, at[0]), mark, f.name.slice(at[0] + at[1]));
  }

  function span(name, terms) {
    if (!terms.length) return null;
    const lower = name.toLowerCase();
    let best = null;
    for (const t of terms) {
      const i = lower.indexOf(t);
      if (i >= 0 && (!best || i < best[0])) best = [i, t.length];
    }
    return best;
  }

  /* Completions come from the field table, so one the parser would read as
     plain text cannot be offered. */
  function completions(text, cursor) {
    let a = cursor, b = cursor;
    while (a > 0 && !/\s/.test(text[a - 1])) a--;
    while (b < text.length && !/\s/.test(text[b])) b++;
    const typed = text.slice(a, cursor).replace(/^!/, "");
    const sp = fieldSplit(typed);
    if (sp) {
      const f = field(sp[0]);
      if (!f) return [];
      const list = f.takes === "kind" ? KIND_VALUES : f.takes === "time" ? TIME_VALUES : [];
      const pre = fold(sp[1]);
      return list.filter((v) => v.startsWith(pre)).map((v) => ({
        insert: sp[0] + ":" + v, label: f.name + ":" + v, about: T(f.about), at: [a, b],
      }));
    }
    const pre = fold(typed);
    return FIELDS
      .filter((f) => f.name.startsWith(pre) || f.alias.some((x) => x.startsWith(pre)))
      .map((f) => ({ insert: f.name + ":", label: f.eg || f.name + ":", about: T(f.about), at: [a, b] }));
  }

  const hintBox = document.getElementById("hints");
  const qread   = document.getElementById("qread");
  let hints = [], hintSel = 0;

  function showHints() {
    // Nothing while the box is unfocused (`render()` also runs on load), and
    // nothing while the word under the caret is empty.
    if (document.activeElement !== q) { hideHints(); return; }
    const cur = q.selectionStart ?? q.value.length;
    let a = cur;
    while (a > 0 && !/\s/.test(q.value[a - 1])) a--;
    if (cur === a) { hideHints(); return; }
    hints = completions(q.value, cur);
    if (hints.length === 0) { hideHints(); return; }
    hintSel = Math.min(hintSel, hints.length - 1);
    hintBox.innerHTML = hints.map((h, i) =>
      '<button role="option" data-i="' + i + '" aria-selected="' + (i === hintSel) + '">' +
      "<code>" + escape_(h.label) + "</code><span>" + escape_(h.about) + "</span></button>").join("");
    hintBox.hidden = false;
    q.setAttribute("aria-expanded", "true");
  }
  function hideHints() {
    hintBox.hidden = true;
    hints = [];
    hintSel = 0;
    q.setAttribute("aria-expanded", "false");
    const arrow = document.getElementById("qpast");
    if (arrow) arrow.setAttribute("aria-expanded", "false");
  }

  /* The past, in the completions' own box: a remembered query is a completion
   * whose insert is the whole line, so every key already works. */
  function showHistory() {
    const typed = q.value.trim().toLowerCase();
    // What was typed narrows it; an empty box offers everything, newest first.
    const past = HISTORY.filter((h) => !typed || h.toLowerCase().includes(typed));
    if (!past.length) { hideHints(); return; }
    hints = past.map((h) => ({ insert: h, label: h, about: "", at: [0, q.value.length] }));
    hintSel = 0;
    hintBox.innerHTML = hints.map((h, i) =>
      '<button role="option" data-i="' + i + '" aria-selected="' + (i === hintSel) + '">' +
      "<code>" + escape_(h.label) + "</code><span></span></button>").join("");
    hintBox.hidden = false;
    q.setAttribute("aria-expanded", "true");
  }

  /* The box searches per keystroke, so the history holds what was committed
   * to — Enter, or opening a result — rather than `r`, `ra`, `rap`. */
  const qpast = document.getElementById("qpast");
  /* Shown only when there is a past. */
  function showPastAffordance() {
    qpast.hidden = HISTORY.length === 0;
  }
  qpast.addEventListener("mousedown", (e) => {
    // `mousedown`: by `click` the input has lost focus and the list is closed.
    e.preventDefault();
    if (hintBox.hidden) { q.focus(); showHistory(); } else { hideHints(); }
    qpast.setAttribute("aria-expanded", String(!hintBox.hidden));
  });

  function remember(text) {
    text = (text || "").trim();
    if (!text || HISTORY[0] === text) return;
    HISTORY = [text, ...HISTORY.filter((h) => h !== text)].slice(0, 100);
    showPastAffordance();
    /* The query, not the list: the service holds the history and applies the
       cap, so no frontend has to know the number. */
    keep({ remember: text });
  }
  function acceptHint(i) {
    const h = hints[i];
    if (!h) return;
    const before = q.value.slice(0, h.at[0]);
    const after = q.value.slice(h.at[1]);
    /* A space, unless there is one: otherwise a completion taken against the
       end of another word welds to it, as `raporkind:exec`. */
    const lead = before && !/\s$/.test(before) ? " " : "";
    const tail = after && !/^\s/.test(after) ? " " : "";
    q.value = before + lead + h.insert + tail + after;
    const caret = before.length + lead.length + h.insert.length + tail.length;
    q.setSelectionRange(caret, caret);
    hideHints();
    render();
    q.focus();
  }

  hintBox.addEventListener("mousedown", (e) => {
    // `mousedown`, not `click`: by `click` the input has lost focus and the
    // list has closed itself, so the click never lands.
    const b = e.target.closest("button");
    if (!b) return;
    e.preventDefault();
    acceptHint(+b.dataset.i);
  });

  q.addEventListener("keydown", (e) => {
    /* `Alt+↓` opens what was searched before; plain `↓` walks into the
       results. */
    if (e.altKey && e.key === "ArrowDown") {
      e.preventDefault();
      if (hintBox.hidden) showHistory(); else hideHints();
      return;
    }
    /* Enter commits the query to the history and keeps the text. With the
       list open it takes the selection instead — handled below. */
    if (e.key === "Enter" && hintBox.hidden) {
      remember(q.value);
      return;
    }
    /* Down goes to the list, but only when no completion is showing: there
       the arrows belong to the completions until Escape closes them. */
    if (hintBox.hidden && e.key === "ArrowDown") {
      const first = [...body.querySelectorAll("tr[data-path]")][0];
      if (first) {
        e.preventDefault();
        first.focus();
        return;
      }
    }
    if (hintBox.hidden) return;
    if (e.key === "ArrowDown" || e.key === "ArrowUp") {
      e.preventDefault();
      hintSel = (hintSel + (e.key === "ArrowDown" ? 1 : hints.length - 1)) % hints.length;
      [...hintBox.children].forEach((b, i) => b.setAttribute("aria-selected", i === hintSel));
      return;
    }
    if (e.key === "Enter" || e.key === "Tab") { e.preventDefault(); acceptHint(hintSel); return; }
    if (e.key === "Escape") { e.preventDefault(); hideHints(); }
  });
  q.addEventListener("blur", hideHints);

  /* Only what is on screen is drawn, with spacers sized in pixels: it rests on
   * every row being 31px and a 200-row window landing in milliseconds. */
  /* Measured: paging happens after the merge, so a window at offset N costs one
   * built row per row skipped — 3 ms at 0 against 1,373 ms at 750,000. */
  const REACH = 20_000;

  /* Logical and deliberately not measured: at 1.667 scale the same row draws
   * as 30.6 or 30.99 CSS pixels, and a paint must not size the scroller. */
  const ROW_H = 31;

  /* The three shapes are one arithmetic, written in lines: `PER_ROW = 1` and
   * `lineH() = ROW_H` give the single-column case back. `visibleRange` answers
   * in items, so nothing that fetches, caches or counts changes shape. */

  /* Decisions, not measurements. `w` is a minimum and the count across is
   * stated, since `auto-fill` could fit one more and index every later tile
   * wrongly. `h` is the pitch; a test fails when it drifts from `--tile-h`. */
  const TILE = {
    icons: { w: 132, h: 104 },
    large: { w: 204, h: 172 },
  };
  const MODES = ["detail", "icons", "large"];
  /* Which of the three is showing; the service holds it (see `applySettings`)
     and it is `detail` until that answer lands. */
  let MODE = "detail";
  const grid = () => MODE !== "detail";

  /* The largest line each shape has drawn: a clearance bound, never the
     logical pitch. Per shape, or a 31px row shares a 172px tile's maximum. */
  const linePx = { detail: ROW_H, icons: TILE.icons.h, large: TILE.large.h };
  let headPx = ROW_H;        /* largest heading seen; likewise */
  /* A browser stops at about 33.5 M pixels and 2.1 M rows at 31px want 66 M,
     so above it the rows pack into whatever fits. */
  const MAX_PX = 33_000_000;
  const WINDOW = 200;        /* rows fetched at a time */
  /* Extra rows either side of the viewport. Sixty rebuilt 137 rows a scroll,
   * 18.5 ms against a 16.7 ms frame; this covers one frame's travel. */
  const MARGIN = 20;

  /* The same, in a grid, counted in nodes rather than pixels: two lines is
   * `2 * PER_ROW`, the same order as forty rows at any width. */
  const GRID_MARGIN = 2;

  const LIST = {
    query: null, sort: null, desc: null,
    total: 0,                /* what the scrollbar is sized by */
    rows: new Map(),
    /* Every path the cache holds, and how many rows hold it: constant time
     * over twenty thousand entries. Counted, since a file that moves down is
     * briefly at two indices. */
    seen: new Map(),         /* path -> how many rows hold it */
    pending: new Map(),      /* start -> the exact request in flight */
    exact: false,            /* has the exact count landed yet */
    since: 0,                /* when this result set landed */
    /* What one window costs the service, in its own measure. Read by the
     * reading-ahead; see `READ_AHEAD_MAX`. */
    cost: 0,
    /* Which revision each window came from: positions move, so only visible
     * ones are refetched — replacing the map discarded twenty thousand rows
     * 1.26 times a second. An entry also means fetched, empty or not. */
    at: new Map(),           /* window start -> the revision it was fetched at */
  };

  /* Every write goes through `putRows` and every removal through `dropRows`,
   * so `LIST.seen` cannot drift from what the cache holds. */

  const fullPath = (f) => f.path + "/" + f.name;

  /* One window, replacing those indices. Only a refresh can hold an arrival,
   * or the whole list flashes when the reading-ahead first runs. */
  function putRows(start, rows, mark) {
    const at = Date.now();
    if (mark) {
      /* Aged out here as well as on the timer, which only runs when the
         refreshes stop: rescheduling it held rows lit for 7.8 s. */
      for (const [p, when] of arrivals) if (when <= at - FRESH_MS) arrivals.delete(p);
      /* Asked before the swap below, while `seen` still describes the list
         as it was a moment ago. */
      for (const f of rows) {
        const p = fullPath(f);
        if (!LIST.seen.has(p) && !arrivals.has(p)) arrivals.set(p, at);
      }
    }
    /* The whole window, not only what came back: a short answer means the
       list has shrunk, and the rows past the new end are not rows. */
    dropRows(start, WINDOW);
    rows.forEach((f, i) => {
      const p = fullPath(f);
      /* The moment it arrived, not a flag: the row is redrawn while it is
         highlighted and the fade has to carry on rather than restart. */
      if (arrivals.has(p)) f.fresh = arrivals.get(p);
      LIST.rows.set(start + i, f);
      LIST.seen.set(p, (LIST.seen.get(p) || 0) + 1);
    });
    if (mark && arrivals.size) armFresh();
  }

  function dropRows(start, count) {
    for (let i = start; i < start + count; i++) {
      const f = LIST.rows.get(i);
      if (!f) continue;
      LIST.rows.delete(i);
      const p = fullPath(f);
      const n = LIST.seen.get(p);
      if (n > 1) LIST.seen.set(p, n - 1);
      else LIST.seen.delete(p);
    }
  }

  function clearRows() {
    LIST.rows.clear();
    LIST.seen.clear();
    LIST.at.clear();
  }

  /* Rows past the end, once the exact count says where it is: their paths
     would otherwise sit in `seen` and suppress a later arrival. */
  function dropBeyond() {
    const end = reach();
    for (const i of [...LIST.rows.keys()]) if (i >= end) dropRows(i, 1);
    for (const s of [...LIST.at.keys()]) if (s >= end) LIST.at.delete(s);
  }

  /* A short window means the list ended inside it, so a count saying otherwise
   * makes it out of date — without this the screen reads `1 / 2.235.938` over
   * an empty list. Only the stamp goes, which `fillWindow` refetches. */
  function dropShort() {
    /* A capped count is a floor, not a length, and contradicts nothing. */
    if (!LIST.exact) return;
    const end = reach();
    for (const start of [...LIST.at.keys()]) {
      if (start >= end) continue;              /* dropBeyond's half */
      const last = start + Math.min(WINDOW, end - start) - 1;
      if (!LIST.rows.has(last)) LIST.at.delete(start);
    }
  }

  const KEEP_WINDOWS = 32;     /* 6,400 rows, independent of scroll distance */
  const AHEAD_WINDOWS = 2;     /* at most two windows beyond either edge */

  function keepWindow(start, revision) {
    LIST.at.delete(start);
    LIST.at.set(start, revision);
    if (LIST.at.size <= KEEP_WINDOWS) return;
    const [from, to] = visibleRange();
    for (const old of [...LIST.at.keys()]) {
      if (LIST.at.size <= KEEP_WINDOWS) break;
      if (old < to && old + WINDOW > from) continue;
      if (LIST.pending.has(old)) continue;
      dropRows(old, WINDOW);
      LIST.at.delete(old);
    }
  }

  /* The one way to say how long the list is: `empty.hidden`, `dropBeyond` and
   * `dropShort` all follow from it. */
  function setTotal(total, exact) {
    LIST.total = total;
    LIST.exact = exact;
    empty.hidden = LIST.total !== 0;
    dropBeyond();
    dropShort();
  }

  const scrollEl = document.querySelector(".scroll");

  /* Not how many matched: a capped count is a floor, and sizing by it moved
   * the scrollbar 620,004 → 31,005 → 620,005 px in two tenths of a second.
   * Every row inside `REACH` is fetchable, counted or not. */
  const reach = () => {
    if (LIST.query === null) return 0;
    return LIST.exact ? Math.min(LIST.total, REACH) : REACH;
  };

  /* How many tiles fit across, read once a frame where the layout is settled.
   * `scrollbar-gutter: stable` cuts the loop: more across → fewer lines → no
   * scrollbar → wider scroller. */
  let PER_ROW = 1;
  function measurePerRow() {
    PER_ROW = grid()
      ? Math.max(1, Math.floor(scrollEl.clientWidth / TILE[MODE].w))
      : 1;
  }

  /* How many lines the list is, and how tall one of them is; in `detail` they
     are `reach()` and `ROW_H`. */
  const lines = () => Math.ceil(reach() / PER_ROW);
  const lineH = () => (grid() ? TILE[MODE].h : ROW_H);

  /* Pixels per logical line until the set is too tall to draw, then whatever
     fits. A painted row never feeds back into this. */
  const pitch = () => (lines() * lineH() > MAX_PX ? MAX_PX / lines() : lineH());

  /* The margin, in lines: `MARGIN` already counts lines where a line is a row. */
  const marginLines = () => (grid() ? GRID_MARGIN : MARGIN);

  function visibleRange() {
    const p = pitch();
    const m = marginLines();
    const rows = lines();
    const count = Math.ceil(scrollEl.clientHeight / p) + m * 2;
    const end = reach();
    const wanted = Math.max(0, Math.floor(scrollEl.scrollTop / p) - m);
    /* `end` can move before Chromium clamps the old `scrollTop`, and a range
       of `[19000, 1500]` pops past an empty pool for good. */
    const first = Math.min(wanted, Math.max(0, rows - count));
    /* Out in items: the multiplication is the only place the two coordinate
       systems meet. */
    return [first * PER_ROW, Math.min(end, (first + count) * PER_ROW)];
  }

  /* The nodes are kept and rewritten, never rebuilt: replacing the body's HTML
   * measured 18.5 ms a scroll against a 16.7 ms frame. The sizer makes the
   * scrollbar honest; the spacer places the drawn window in it. */
  let pool = [];
  const sizer = document.getElementById("sizer");
  const spTop = document.createElement("tr");
  const farRow = document.createElement("tr");
  spTop.className = "spacer";
  farRow.className = "far";
  spTop.innerHTML = "<td></td>";
  farRow.innerHTML = "<td></td>";

  function widen(node) {
    /* Age + shown columns + the picker. A short span makes the table grid
       reconcile a short row on every paint. */
    const span = SHOWN.length + 2;
    if (node.firstElementChild.colSpan !== span) {
      node.firstElementChild.colSpan = span;
    }
  }

  function makeRow() {
    const tr = document.createElement("tr");
    tr.tabIndex = 0;
    tr.innerHTML = `<td class="age"><i></i></td>` + shownColumns().map(() => "<td></td>").join("");
    return tr;
  }

  /* Still a `<tr>`: selection, the menu and the keyboard walk all reach for
   * `closest("tr")`. The picture is `writeMark`'s, so the name is `__nm`. */
  function makeTile() {
    const tr = document.createElement("tr");
    tr.tabIndex = 0;
    const td = document.createElement("td");
    td.className = "tile";
    const rule = document.createElement("i");
    const nm = document.createElement("div");
    nm.className = "nm";
    td.append(rule, nm);
    tr.append(td);
    tr.__nm = nm;
    return tr;
  }

  /* Which shape the pool is made of, so a change of shape can throw it away. */
  let poolShape = "detail";
  /* What the sizer and the spacer were last told, which is not what they
     would say if asked. See the note in `paintWindow`. */
  let sizedTo = -1;
  let spacedTo = -1;

  function paintWindow() {
    const [from, to] = visibleRange();
    const p = pitch();
    const cols = shownColumns();
    const parsed = parse(q.value);
    const tiles = grid();

    /* The shape first: one spacer with the right height, and enough rows after
       it. Only a resize or a column change gets past the `while`s. */
    if (body.firstElementChild !== spTop) {
      body.replaceChildren(spTop, farRow);
      pool = [];
    }
    /* The check below cannot tell a tile from a one-cell row. Thrown away
       rather than rewritten: a shape change is a click, not a scroll. */
    if (poolShape !== MODE) {
      for (const tr of pool) tr.remove();
      pool = [];
      poolShape = MODE;
    }
    while (pool.length < to - from) {
      const tr = tiles ? makeTile() : makeRow();
      pool.push(tr);
      body.insertBefore(tr, farRow);
    }
    while (pool.length > to - from) {
      pool.pop().remove();
    }
    /* How many across, said by the page: under `auto-fill` a browser fitting
       one more indexes every later tile wrongly, in silence. */
    if (tiles) {
      const across = `repeat(${PER_ROW}, minmax(0, 1fr))`;
      if (body.style.gridTemplateColumns !== across) {
        body.style.gridTemplateColumns = across;
      }
    } else if (body.style.gridTemplateColumns) {
      body.style.gridTemplateColumns = "";
    }
    if (!tiles && pool.length && pool[0].children.length !== cols.length + 1) {
      for (const tr of pool) {
        tr.innerHTML =
          `<td class="age"><i></i></td>` + cols.map(() => "<td></td>").join("");
        /* The cells are new even though the row object is not: a stamp from
           the old shape makes `writeRow` return and leaves them blank. */
        tr.__stamp = null;
        tr.__marks = null;
      }
    }
    /* Stated, not summed: a summed height moves as rows round, and a moving
     * scroll extent makes the browser correct its position, fire a scroll,
     * paint, and move it again. */
    /* Decided here: one more thing that must fit above the bottom. */
    const far = LIST.total > REACH && to >= reach();
    if (farRow.hidden === far) farRow.hidden = !far;

    [spTop, farRow].forEach(widen);
    const tall = Math.round(lines() * p);
    /* Remembered rather than read back: Chromium re-serialises a length to
     * six figures, so `1146724px` reads back as `1.14672e+06px`. */
    if (sizedTo !== tall) {
      sizedTo = tall;
      sizer.style.height = `${tall}px`;
    }
    /* Everything besides the spacer, generously, so the spacer stops short of
       what `.sizer` claimed. The end note measures against a row. */
    const drawn = Math.ceil((to - from) / PER_ROW);
    const inside =
      headPx + drawn * (linePx[MODE] + 0.5) + (far ? linePx.detail + 12 : 0) + 4;
    const above = Math.max(0, Math.min(tall - inside, Math.round((from / PER_ROW) * p)));
    // Remembered, for the reason the sizer's height is: the spacer runs to
    // seven figures at the far end of a grid too.
    if (spacedTo !== above) {
      spacedTo = above;
      spTop.firstElementChild.style.height = `${above}px`;
    }
    if (far) {
      const note = T(
        "the first {reach} rows · of {total} matches. Narrow the search to go further.",
        { reach: fmt(REACH), total: fmt(LIST.total) },
      );
      if (farRow.firstElementChild.textContent !== note) {
        farRow.firstElementChild.textContent = note;
      }
    }

    /* The rows are reused, so what is restored is which one holds the focus
       rather than the element itself. */
    const had = document.activeElement;
    const keep = had && body.contains(had) ? had.dataset.path : null;

    // The marked letters move with the query, so a row whose file has not
    // changed is still rewritten when the terms have. Joined once, not per row.
    const marks = parsed.text.join("\u0001");
    for (let i = from; i < to; i++) {
      // Which row of the whole list this slot shows; a shift-range is measured
      // in these, and a slot shows a different one after every scroll.
      pool[i - from].dataset.i = String(i);
      writeRow(pool[i - from], LIST.rows.get(i), cols, parsed, marks);
    }
    // After the writes, never inside them: `writeRow` assigns `className`
    // outright and returns early when only the selection has changed.
    paintSelection();
    /* And the clock's next wake: scrolling changes which rows are on screen
       and so when any of them next reads differently. */
    scheduleClock();
    if (keep) {
      const back = pool.find((tr) => tr.dataset.path === keep);
      if (back) back.focus({ preventScroll: true });
    }
  }

  /* One row, rewritten in place; none of it goes through HTML. A row with no
   * data yet is a ghost — the same node, emptied. */
  function writeRow(tr, f, cols, parsed, marks) {
    /* Every fact a visible cell can read, so a live refresh of unchanged rows
       costs nothing. A stamp short of a column leaves that column stale. */
    const under = f && f.under;
    const stamp = f ? [
      f.path, f.name, f.mtime, f.size, f.fresh || 0,
      f.is_dir ? 1 : 0, f.thumb ? 1 : 0, f.ktoken || "", f.kind || "",
      f.ext || "", f.ctime || 0, f.atime || 0, f.perm || "",
      f.user || "", f.group || "", f.disk || 0, f.items || 0,
      under ? under.disk : "", under ? under.files : "",
    ].join("\u0001") : "";
    if (tr.__stamp === stamp && tr.__marks === marks) {
      return;
    }
    tr.__stamp = stamp;
    tr.__marks = marks;
    if (!f) {
      if (tr.className !== "ghost") {
        tr.className = "ghost";
        tr.removeAttribute("data-path");
        tr.removeAttribute("title");
        tr.style.animationDelay = "";
        // From the second cell on: the first holds the freshness rule, which
        // is an element rather than text, and emptying it takes the rule away.
        if (tr.__nm) tr.__nm.textContent = "";
        else for (let i = 1; i < tr.children.length; i++) tr.children[i].textContent = "";
        // The glyph does go: a row waiting for its file must not wear the
        // picture of the one before it. The rule keeps its colour.
        writeMark(tr.firstElementChild, null);
      }
      return;
    }
    const full = f.path + "/" + f.name;
    // The preview panel wants the row, not the path: it already holds every
    // fact the panel shows.
    tr.__row = f;
    tr.className = f.fresh ? "fresh" : "";
    tr.style.animationDelay = f.fresh ? `-${Date.now() - f.fresh}ms` : "";
    if (tr.dataset.path !== full) {
      tr.dataset.path = full;
      tr.title = full;
    }
    // `firstElementChild`: a row's first cell holds the rule and the glyph,
    // and a tile's only cell holds those and the name.
    const dot = writeMark(tr.firstElementChild, f);
