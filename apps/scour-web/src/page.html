      `<th class="pick"><button type="button" id="pick" title="${escape_(T("columns"))}"
         aria-label="${escape_(T("choose the columns"))}">⋮</button></th>`;
    // Back at the front, with its button and its listener intact, and before
    // the numbering below — which counts across the row and has to see it.
    row.prepend(mark);
    /* **Numbered downwards, left to right, and that is not decoration.**
     *
     * Each sticky heading is its own stacking context, so a grip's `z-index`
     * ranks it against its siblings inside one cell and against nothing
     * outside. The grip hangs four pixels into the next column — it has to,
     * because the divider is what a hand aims at — and the next heading was
     * painting over exactly that half. Measured: the cell's edge sits at 334,
     * the grip spans 330 to 337, and every pixel from 334 on answered as the
     * *next* heading. So aiming at the line sorted instead of dragging, which
     * is what was reported.
     *
     * Giving each heading a lower number than the one before it puts every
     * grip above its right-hand neighbour, whatever the column count. */
    [...row.querySelectorAll("th")].forEach((th, i) => {
      th.style.zIndex = String(40 - i);
    });
    fitGrips();
    applyWidths();
    syncHeads();
    /* A reorder keeps the same number of cells, so the pool's shape check will
       not rebuild them. Invalidate their content explicitly: otherwise the
       headings move locally while every value remains in its old column. A
       column can also add or remove the horizontal scrollbar, which changes
       the list's client height without resizing the window. */
    for (const tr of pool) tr.__stamp = "";
    painted = "";
    repaint(true);
  }

  function columnMenu() {
    const menu = document.createElement("div");
    menu.className = "rowmenu cols";
    menu.innerHTML = COLUMNS.map((c) => {
      const on = SHOWN.includes(c.id);
      // The last one standing cannot be turned off: a table of no columns is
      // not a smaller table, it is a broken one.
      const locked = on && SHOWN.length === 1;
      return `<button type="button" data-col="${c.id}"${locked ? " disabled" : ""}>
        <span class="tick">${on ? "✓" : ""}</span>${escape_(T(c.msgid))}</button>`;
    }).join("")
      + `<button type="button" data-col="" class="reset">${escape_(T("Back to the default"))}</button>`;
    return menu;
  }

  function fitGrips() {
    const heads = [...document.querySelectorAll("thead th[data-sort]")];
    heads.forEach((th, i) => {
      const last = i === heads.length - 1;
      const has = th.querySelector(".grip");
      if (last) { if (has) has.remove(); return; }
      if (has) return;
      const g = document.createElement("span");
      g.className = "grip";
      g.title = T("drag · double-click to reset");
      th.appendChild(g);
    });
  }

  document.querySelector("thead").addEventListener("pointerdown", (e) => {
    const grip = e.target.closest(".grip");
    if (!grip) return;
    e.preventDefault();
    e.stopPropagation();          // not a click on the heading, so no sort
    const th = grip.closest("th");
    const startX = e.clientX;
    const startW = th.getBoundingClientRect().width;
    grip.classList.add("dragging");
    document.body.classList.add("resizing");
    grip.setPointerCapture(e.pointerId);

    const move = (ev) => {
      const w = Math.max(MIN_COL, Math.round(startW + ev.clientX - startX));
      WIDTHS[th.dataset.col] = w;
      // Through `applyWidths` rather than straight onto the cell, so that the
      // table's declared minimum grows with the drag. Setting the style here
      // and the minimum nowhere is how a widened column used to start eating
      // its neighbours instead of making the list wider.
      applyWidths();
    };
    const up = () => {
      grip.classList.remove("dragging");
      document.body.classList.remove("resizing");
      grip.removeEventListener("pointermove", move);
      grip.removeEventListener("pointerup", up);
      saveWidths();
      painted = "";
      repaint(true);
    };
    grip.addEventListener("pointermove", move);
    grip.addEventListener("pointerup", up);
  });

  // Double-click a grip: that column goes back to deciding for itself.
  document.querySelector("thead").addEventListener("dblclick", (e) => {
    const grip = e.target.closest(".grip");
    if (!grip) return;
    e.preventDefault();
    e.stopPropagation();
    delete WIDTHS[grip.closest("th").dataset.col];
    applyWidths();
    saveWidths();
    painted = "";
    repaint(true);
  });

  function syncHeads() {
    document.querySelectorAll("thead th[data-sort]").forEach((th) => {
      const on = th.dataset.sort === sortKey;
      th.setAttribute("aria-sort", on ? (sortDesc ? "descending" : "ascending") : "none");
      // The grip is not part of the label and must survive being relabelled.
      const grip = th.querySelector(".grip");
      const label = (th.dataset.label ||= th.textContent.replace(/[▾▴]\s*$/, "").trim());
      th.innerHTML = label + (on ? ` <span class="arrow">${sortDesc ? "▾" : "▴"}</span>` : "");
      if (grip) th.appendChild(grip);
    });
  }

  // Clicking a filter adds the term to the *text*, not to hidden state.
  function toggleTerm(term) {
    const parts = q.value.trim().split(/\s+/).filter(Boolean);
    /* **Which term this replaces is a question about the field, not about the
     * spelling of it.**
     *
     * This compared the literal prefix — `kind:` against the start of each
     * term — so a box already holding `tur:image`, which is the *same field*
     * written the way the rail itself offers it, matched nothing. The new term
     * was appended instead of substituted, and a query asking for two kinds at
     * once matches no file at all: every rail read zero and the list emptied.
     *
     * Reported as "veri, derleme çıktısı, yazı tipi seçince diğer alanlar
     * boşalıyor" — and it is not those three, it is every pair of spellings.
     *
     * `field()` resolves an alias to the field it names, and comparing what it
     * returns makes the toggle answer the question it was always asking. A
     * term whose field is unknown falls back to the old prefix rule, because
     * an unrecognised `foo:` should still replace another `foo:`. */
    const mine = term.slice(0, Math.max(0, term.indexOf(":")));
    const want = field(mine);
    const at = parts.findIndex((t) => {
      const i = t.indexOf(":");
      if (i < 0) return false;
      const his = t.slice(0, i);
      const f = want && field(his);
      return f ? f === want : his === mine;
    });
    if (at >= 0 && parts[at] === term) parts.splice(at, 1);
    else if (at >= 0) parts[at] = term;
    else parts.push(term);
    q.value = parts.join(" ");
    render();
    q.focus();
  }

  document.querySelector(".rail").addEventListener("click", (e) => {
    const b = e.target.closest(".facet");
    if (b) toggleTerm(b.dataset.term);
  });
  bars.addEventListener("click", (e) => {
    const b = e.target.closest("button");
    if (b) toggleTerm("dm:" + b.dataset.days + "d");
  });
  document.querySelector("thead").addEventListener("click", (e) => {
    const th = e.target.closest("th[data-sort]");
    if (!th) return;
    // A heading that was just carried somewhere else is not a heading that was
    // clicked. Without this every reorder also re-sorted the list, which reads
    // as the drag having done two things.
    if (justMoved) return;
    if (sortKey === th.dataset.sort) sortDesc = !sortDesc;
    else { sortKey = th.dataset.sort; sortDesc = th.dataset.sort === "modified" || th.dataset.sort === "size"; }
    keep({ sort: sortKey, descending: sortDesc });
    render();
  });

  /* ---------------- the column order ----------------
   *
   * Take a heading and put it somewhere else. The menu could already say
   * *which* columns are shown and nothing could say **in what order** — the
   * order was `COLUMNS`, a list in this file, the same for everybody.
   *
   * **The same pointer does three things on one strip**, so they are told
   * apart by where and how far: the last nine pixels of a heading are the
   * resize grip and never get here; a press that moves less than five pixels
   * is a click and sorts; anything else is a carry. That threshold is the
   * whole mechanism — without it a slightly shaky click would reorder the
   * table, which is the sort of thing that makes people stop touching a
   * heading at all. */
  const DRAG_SLOP = 5;
  let moving = null;      /* the heading being carried */
  let movingFrom = 0;     /* where the press started, in page pixels */
  let dropAt = -1;        /* the gap it would fall into, as an index */
  let justMoved = false;  /* so the click that follows a carry does not sort */

  const dropLine = document.createElement("div");
  dropLine.className = "dropline";
  dropLine.hidden = true;
  document.querySelector(".results .scroll").appendChild(dropLine);

  const headCells = () =>
    [...document.querySelectorAll("#view-search thead th[data-col]")];

  function showDrop(x) {
    const cells = headCells();
    let at = cells.length;
    for (let i = 0; i < cells.length; i++) {
      const r = cells[i].getBoundingClientRect();
      if (x < r.left + r.width / 2) { at = i; break; }
    }
    dropAt = at;
    /* The line sits on the edge the column would land against — the left edge
       of the heading it goes before, or the right edge of the last one. Placed
       against the scroller, which is what it is drawn inside, so a list
       scrolled sideways still puts it where the pointer is. */
    const host = document.querySelector(".results .scroll").getBoundingClientRect();
    const edge = at < cells.length
      ? cells[at].getBoundingClientRect().left
      : cells[cells.length - 1].getBoundingClientRect().right;
    dropLine.style.left = Math.round(edge - host.left +
      document.querySelector(".results .scroll").scrollLeft) + "px";
    dropLine.hidden = false;
  }

  document.querySelector("thead").addEventListener("pointerdown", (e) => {
    if (e.target.closest(".grip")) return;        /* that press is a resize */
    const th = e.target.closest("th[data-col]");
    if (!th) return;
    moving = th;
    movingFrom = e.clientX;
    dropAt = -1;
    justMoved = false;
    th.setPointerCapture(e.pointerId);
  });

  document.querySelector("thead").addEventListener("pointermove", (e) => {
    if (!moving) return;
    if (!justMoved && Math.abs(e.clientX - movingFrom) < DRAG_SLOP) return;
    if (!justMoved) {
      justMoved = true;
      moving.classList.add("moving");
      document.body.classList.add("moving-col");
    }
    showDrop(e.clientX);
  });

  const endMove = () => {
    if (!moving) return;
    const th = moving;
    moving = null;
    dropLine.hidden = true;
    th.classList.remove("moving");
    document.body.classList.remove("moving-col");
    if (justMoved && dropAt >= 0) {
      const from = SHOWN.indexOf(th.dataset.col);
      // Taking it out shifts everything after it one place left, so a gap to
      // the right of where it started is one lower once it is gone.
      let to = dropAt > from ? dropAt - 1 : dropAt;
      if (from >= 0 && to !== from) {
        const [id] = SHOWN.splice(from, 1);
        SHOWN.splice(to, 0, id);
        keep({ columns: SHOWN });
        buildHeads();
      }
    }
    /* Cleared after the click this press is about to produce, not before it —
       the click fires on the way out of the same gesture. */
    setTimeout(() => { justMoved = false; }, 0);
  };
  document.querySelector("thead").addEventListener("pointerup", endMove);
  document.querySelector("thead").addEventListener("pointercancel", endMove);
  /* **The box does not edit what is being typed, and it used to.**
   *
   * A `;` was rewritten to ` ; ` as it was entered. The reasoning was about
   * reading — `ext:rs;toml;md` is a wall and `ext:rs ; toml ; md` is a list —
   * and it is a fair thing to notice and not the box's call to act on. Typing
   * a semicolon and watching two spaces appear around it, with the caret
   * moving, reads as a fault whatever the intent; the first person to try it
   * reported it as one. Both spellings are already the same query to the
   * engine — the syntax reference says so — so there was nothing here to fix
   * and something to break.
   *
   * It was also the last thing in this file still calling the page's own
   * tokeniser, which is the second parser everything else has been moved off. */
  q.addEventListener("input", render);
  // Moving the caret to another term with an arrow key changes the offer
  // too — it depends on where you are, not on what you last typed.
  q.addEventListener("click", () => { paint(q.value); showHints(); });
  q.addEventListener("focus", () => paint(q.value));
  q.addEventListener("blur", () => paint(q.value));
  document.addEventListener("selectionchange", () => {
    if (document.activeElement === q) paint(q.value);
  });
  q.addEventListener("keyup", (e) => {
    if (e.key.startsWith("Arrow") && hintBox.hidden) showHints();
  });
  q.addEventListener("scroll", () => { shadow.scrollLeft = q.scrollLeft; });

  /* ---------------- opening things ----------------
   *
   * A browser cannot open a local file, and that is the sandbox working
   * rather than something to route around: the request goes to the bridge and
   * the bridge asks the desktop. Two fences are on the other side — the path
   * must be one the *index* holds, and anything the desktop would run rather
   * than view has its folder revealed instead. Neither is enforced here,
   * because a check that lives in the page is a check an attacker skips. */
  async function launch(path, what) {
    // Opening a result is the strongest thing a person can say about a query:
    // it found what they were looking for. That belongs in the history even if
    // they never pressed Enter.
    remember(q.value);
    try {
      const q = new URLSearchParams({ path, what: what || "file", t: TOKEN });
      const r = await fetch(`/api/open?${q}`, { method: "POST" });
      const j = await r.json();
      if (j.error) { flash(j.error); return; }
      if (j.instead) flash(j.instead);
    } catch (e) { flash(T("could not open: {why}", { why: e.message || e })); }
  }

  /* One line, under the meter, that says what just happened and then stops.
     A double-click that silently does something else is worse than one that
     explains. */
  let flashTimer = null;
  function flash(text) {
    const el = document.getElementById("rows");
    if (!el) return;
    el.dataset.was = el.dataset.was || el.textContent;
    el.textContent = text;
    clearTimeout(flashTimer);
    flashTimer = setTimeout(() => {
      el.textContent = el.dataset.was || "";
      delete el.dataset.was;
    }, 4000);
  }


  /* Choosing columns. The list is stored beside the widths and for the same
     reason and with the same shelf life — see `WIDTH_KEY`. */
  let colMenu = null;
  document.addEventListener("click", (e) => {
    const opener = e.target.closest("#pick");
    if (colMenu && !e.target.closest(".cols")) {
      colMenu.remove();
      colMenu = null;
      if (!opener) return;
    }
    if (!opener) return;
    colMenu = columnMenu();
    document.body.appendChild(colMenu);
    const r = opener.getBoundingClientRect();
    const m = colMenu.getBoundingClientRect();
    colMenu.style.left = Math.max(8, Math.min(r.left, innerWidth - m.width - 8)) + "px";
    colMenu.style.top = Math.min(r.bottom + 4, innerHeight - m.height - 8) + "px";
    colMenu.addEventListener("click", (ev) => {
      const b = ev.target.closest("[data-col]");
      if (!b || b.disabled) return;
      const id = b.dataset.col;
      if (id === "") {
        SHOWN = COL_DEFAULT.slice();
      } else if (SHOWN.includes(id)) {
        SHOWN = SHOWN.filter((x) => x !== id);
      } else {
        /* Added where its neighbours would expect it — but **without
           rearranging the ones already there**, which is what this used to do.
           It rebuilt the whole list in `COLUMNS` order, and once headings
           could be dragged that threw away the arrangement somebody had made
           every time they showed one more column.
         *
           So: in front of the first shown column that comes after it in the
           table's own order, and at the end when there is none. */
        const rank = (x) => COLUMNS.findIndex((c) => c.id === x);
        const at = SHOWN.findIndex((x) => rank(x) > rank(id));
        if (at < 0) SHOWN = [...SHOWN, id];
        else SHOWN = [...SHOWN.slice(0, at), id, ...SHOWN.slice(at)];
      }
      keep({ columns: SHOWN });
      buildHeads();
      colMenu.remove();
      colMenu = null;
    });
  });

  const pathOf = (tr) => tr && tr.dataset && tr.dataset.path;

  /* ------------------------------------------------------------------ *
   * The selection — more than one row at a time.
   *
   * Everything's staple and the one thing this list could not do: every
   * action was about the row under the pointer, so "copy these eleven paths"
   * meant eleven right-clicks.
   *
   * **Keyed by path, not by position.** The list is virtual and its positions
   * move — it is sorted by time, so a file being written walks to the top and
   * everything under it shifts down. A selection stored as row numbers would
   * silently become a selection of different files the moment the index
   * moved. The path is what a person picked.
   *
   * **What it can select is what the list has fetched.** That is a real limit
   * and it is stated rather than hidden: a result set of eight hundred
   * thousand is never all in memory, so `Ctrl+A` takes the windows that have
   * arrived and the bar says how many that is. Anyone who wants all of
   * something narrows the query, which is the tool's whole point.
   * ------------------------------------------------------------------ */
  const selbar = document.getElementById("selbar");
  /* path -> the row object, because the bar adds up sizes and the menu needs
     to know a folder from a file. */
  const SEL = new Map();
  /* Where a shift-range measures from. A list index, not a path: the anchor is
     a position in the current ordering and means nothing once that changes. */
  let selAnchor = null;

  function clearSel() {
    if (!SEL.size) return;
    SEL.clear();
    selAnchor = null;
    paintSelection();
    drawSelBar();
  }

  function pickRow(tr, keep) {
    const p = pathOf(tr);
    if (!p) return;
    if (!keep) SEL.clear();
    if (keep && SEL.has(p)) SEL.delete(p);
    else SEL.set(p, tr.__row);
  }

  /* Every row between two positions, in whatever order they were clicked.
   *
   * Rows the list has not fetched cannot be selected — there is nothing to
   * select — so the count in the bar is what was really taken rather than the
   * width of the range. A gap only happens when somebody scrolls a long way
   * fast and then shift-clicks; the bar showing 40 where the range spans 300
   * is the honest reading of that. */
  function selectRange(a, b) {
    const [lo, hi] = a <= b ? [a, b] : [b, a];
    for (let i = lo; i <= hi; i++) {
      const f = LIST.rows.get(i);
      if (f) SEL.set(f.path + "/" + f.name, f);
    }
  }

  /* The class the rows wear, put on after every paint.
   *
   * Not inside `writeRow`: that one returns early when the file in a slot has
   * not changed, which is exactly the case where the selection *has*. And it
   * assigns `className` outright, so this has to run after it or the mark is
   * wiped by the next repaint. */
  function paintSelection() {
    for (const tr of body.querySelectorAll("tr[data-path]")) {
      tr.classList.toggle("sel", SEL.has(tr.dataset.path));
    }
  }

  function drawSelBar() {
    const n = SEL.size;
    selbar.hidden = n === 0;
    if (!n) return;
    let total = 0;
    let dirs = 0;
    for (const f of SEL.values()) {
      if (!f) continue;
      if (f.is_dir) dirs++;
      else total += f.size > 0 ? f.size : 0;
    }
    /* Folders are counted, not weighed. What a folder holds is the `~` number
       in the size column — the part of it this index has — and quietly adding
       that into a total beside exact file sizes would make one number out of
       two different kinds of claim. */
    /* The count is inside the msgid rather than glued to the front of it: a
       language does not have to put the number first, and Turkish does not
       always want the same word order English does. `{n}` carries the markup
       with it, which is the only reason this one is HTML. */
    const parts = [T('<span class="n">{n}</span> selected', { n: fmt(n) })];
    if (n - dirs > 0) parts.push(`<span class="sum">${bytes(total)}</span>`);
    if (dirs) parts.push(T('<span class="sum">{n} folders</span>', { n: fmt(dirs) }));
    const nFolders = foldersOf().length;
    selbar.innerHTML =
      parts.join(' <span class="sum">·</span> ') +
      `<span class="grow"></span>` +
      `<button type="button" data-sel="copy">${escape_(T("Copy the paths"))}</button>` +
      `<button type="button" data-sel="folder"${asking ? ' class="asking"' : ""}>` +
      escape_(asking
        ? T("Open {n} windows?", { n: fmt(nFolders) })
        : T("Open their folders ({n})", { n: fmt(nFolders) })) +
      `</button>` +
      `<button type="button" data-sel="clear">${escape_(T("Drop it"))}</button>`;
  }

  /* The folders a selection sits in, each one once.
   *
   * Eleven files from the same directory is one window, not eleven — and that
   * is the ordinary shape of a selection, because a search that found them
   * together usually found them together somewhere. */
  const foldersOf = () => [...new Set([...SEL.values()].filter(Boolean).map((f) => f.path))];

  /* **Opening windows is asked about past a handful.** A file manager window
     is cheap and eight of them is not, and this is the one action here that
     reaches out of the app and cannot be undone by pressing something again.
     Under the threshold it simply happens: being asked about two windows is
     its own kind of rude.
   *
   * The question is asked on the bar's own button whichever way it was
   * reached, including from the row menu — a menu closes when it is clicked,
   * so it has nowhere to put a question, and an action that behaves one way
   * from a menu and another from a button is two actions. */
  const OPEN_MANY = 5;
  let asking = false;
  let askTimer = null;

  function askFolders() {
    asking = true;
    drawSelBar();
    clearTimeout(askTimer);
    // The question expires. A button left mid-question is a button that does
    // something unexpected the next time somebody presses it.
    askTimer = setTimeout(() => { asking = false; drawSelBar(); }, 5000);
  }

  function openFolders() {
    const dirs = foldersOf();
    if (dirs.length > OPEN_MANY && !asking) { askFolders(); return; }
    asking = false;
    clearTimeout(askTimer);
    for (const d of dirs) launch(d, "folder");
    drawSelBar();
  }

  function copySelected() {
    const text = [...SEL.keys()].join("\n");
    navigator.clipboard.writeText(text).then(
      () => flash(T("{n} paths copied", { n: fmt(SEL.size) })),
      () => flash(T("could not copy")));
  }

  selbar.addEventListener("click", (e) => {
    const btn = e.target.closest("button[data-sel]");
    if (!btn) return;
    if (btn.dataset.sel === "clear") clearSel();
    else if (btn.dataset.sel === "copy") copySelected();
    else openFolders();
  });

  /* Clicking picks. Plain replaces, `Ctrl` adds one, `Shift` takes the run. */
  body.addEventListener("click", (e) => {
    const tr = e.target.closest("tr[data-path]");
    if (!tr) { return; }
    const i = Number(tr.dataset.i);
    if (e.shiftKey && selAnchor !== null && Number.isFinite(i)) {
      SEL.clear();
      selectRange(selAnchor, i);
    } else if (e.ctrlKey || e.metaKey) {
      pickRow(tr, true);
      selAnchor = i;
    } else {
      pickRow(tr, false);
      selAnchor = i;
    }
    paintSelection();
    drawSelBar();
  });

  body.addEventListener("keydown", (e) => {
    if ((e.ctrlKey || e.metaKey) && (e.key === "a" || e.key === "A")) {
      e.preventDefault();
      SEL.clear();
      for (const [, f] of LIST.rows) SEL.set(f.path + "/" + f.name, f);
      paintSelection();
      drawSelBar();
      return;
    }
    if (e.key === "Escape" && SEL.size) { e.preventDefault(); clearSel(); }
  });

  /* **The column decides which one is opened**, as Everything does it: the
     name is the file, the location is the folder it is in. A row is two
     answers to "where is it", and clicking one of them should give that one
     rather than a rule the user has to remember. */
  body.addEventListener("dblclick", (e) => {
    const p = pathOf(e.target.closest("tr"));
    if (!p) return;
    const cell = e.target.closest("td");
    const onPath = !!cell && !!cell.querySelector(".path");
    launch(p, onPath ? "folder" : "file");
  });
  /* Enter opens, because a list you can arrow through is a list you should be
     able to open from. */
  body.addEventListener("keydown", (e) => {
    const row = e.target.closest("tr");
    if (!row) return;
    /* **A screenful at a time, and the ends.** The arrows were the only way
       down a two-million-row list from the keyboard. The rows are virtual, so
       these move the scroller and let the list draw what lands there — the
       same thing dragging the bar does. */
    if (e.key === "PageDown" || e.key === "PageUp" || e.key === "Home" || e.key === "End") {
      e.preventDefault();
      const screenful = scrollEl.clientHeight - ROW_H;
      if (e.key === "Home") scrollEl.scrollTop = 0;
      else if (e.key === "End") scrollEl.scrollTop = scrollEl.scrollHeight;
      else scrollEl.scrollTop += e.key === "PageDown" ? screenful : -screenful;
      return;
    }
    if (e.key === "ArrowDown" || e.key === "ArrowUp") {
      e.preventDefault();
      const rows = [...body.querySelectorAll("tr[data-path]")];
      const at = rows.indexOf(row);
      const next = rows[at + (e.key === "ArrowDown" ? 1 : -1)];
      if (next) {
        /* Held shift walks and takes the rows it walks over, which is what
           every list does. The anchor is where the walk began, so reversing
           direction gives the rows back rather than adding more. */
        if (e.shiftKey) {
          const i = Number(next.dataset.i);
          if (selAnchor === null) selAnchor = Number(row.dataset.i);
          if (Number.isFinite(i) && selAnchor !== null) {
            SEL.clear();
            selectRange(selAnchor, i);
            paintSelection();
            drawSelBar();
          }
        }
        next.focus();
        // Only when it is off the edge: `nearest` leaves the list still when
        // the row is already on screen, which is what a keyboard walk should
        // feel like.
        next.scrollIntoView({ block: "nearest" });
      } else if (e.key === "ArrowUp") {
        // Off the top is back to the query, where the caret was.
        q.focus();
      }
      return;
    }
    if (e.key !== "Enter") return;
    const p = pathOf(row);
    if (p) { e.preventDefault(); launch(p, e.shiftKey ? "folder" : "file"); }
  });

  /* The menu. Three things, which is all there is to do with a found file:
     open it, open where it lives, or take its path somewhere else. */
  const menu = document.createElement("div");
  menu.className = "rowmenu";
  menu.hidden = true;
  document.body.appendChild(menu);

  body.addEventListener("contextmenu", (e) => {
    const tr = e.target.closest("tr");
    const p = pathOf(tr);
    if (!p) return;
    e.preventDefault();
    /* **Right-clicking outside the selection selects what was right-clicked.**
       Otherwise the menu is about rows the pointer is not on, which is how
       somebody copies eleven paths while looking at a twelfth. Inside it, the
       selection stands — that is the whole point of having made one. */
    if (!SEL.has(p)) {
      pickRow(tr, false);
      selAnchor = Number(tr.dataset.i);
      paintSelection();
      drawSelBar();
    }
    const many = SEL.size > 1;
    menu.innerHTML = (many
      ? [
          [T("Copy {n} paths", { n: fmt(SEL.size) }), "copy"],
          // Not "open them": opening a selection means as many programs as
          // there are rows, and the bar's button is where that lives, behind
          // a question. What a menu offers should be safe to press.
          [T("Open their folders"), "folders"],
          [T("Drop the selection"), "clear"],
        ]
      : [
          [T("Open"), "file"],
          [T("Open its folder"), "folder"],
          [T("Copy the path"), "copy"],
        ]
    ).map(([label, act]) =>
      `<button type="button" data-act="${act}">${escape_(label)}</button>`).join("");
    menu.dataset.path = p;
    menu.hidden = false;
    /* Kept on screen: near the pointer, but never past the edge. */
    const r = menu.getBoundingClientRect();
    menu.style.left = Math.min(e.clientX, innerWidth - r.width - 8) + "px";
    menu.style.top = Math.min(e.clientY, innerHeight - r.height - 8) + "px";
    menu.querySelector("button").focus();
  });

  menu.addEventListener("click", (e) => {
    const act = e.target.dataset && e.target.dataset.act;
    if (!act) return;
    const p = menu.dataset.path;
    menu.hidden = true;
    if (act === "clear") {
      clearSel();
    } else if (act === "folders") {
      openFolders();
    } else if (act === "copy") {
      // One row or the whole selection, and the same key order the bar copies
      // in — insertion order, which is the order they were picked.
      const text = SEL.size > 1 ? [...SEL.keys()].join("\n") : p;
      const said = SEL.size > 1
        ? T("{n} paths copied", { n: fmt(SEL.size) })
        : T("path copied");
      navigator.clipboard.writeText(text).then(() => flash(said),
                                               () => flash(T("could not copy")));
    } else {
      launch(p, act);
    }
  });
  const hideMenu = () => { menu.hidden = true; };
  document.addEventListener("click", hideMenu);
  document.addEventListener("scroll", hideMenu, true);
  document.addEventListener("keydown", (e) => { if (e.key === "Escape") hideMenu(); });

  /* ------------------------------------------------------------------ *
   * The preview — the panel the window draws itself.
   *
   * A search that finds the right *name* and then cannot tell you whether it
   * is the right *file* has stopped one step early. Three `rapor-son.pdf`s in
   * three folders is the ordinary case, and the row that tells them apart is
   * the one you can see inside.
   *
   * **Space, because every quick-look is space** — macOS since 2007, GNOME's
   * sushi, and the file managers that copied both. Nobody has to be told.
   *
   * What can be shown of a file is asked of the bridge and never guessed here.
   * A page cannot know that `notes.bak` is readable text and
   * `model.safetensors` is not: that is decided by looking at the bytes. And
   * once the answer is in, the bytes are reached by pointing an element at the
   * URL rather than by fetching them — a `<video>` given a URL streams and
   * seeks, where a fetch into a blob holds four gigabytes to show one frame.
   * ------------------------------------------------------------------ */
  const peek = document.getElementById("peek");
  const peekBody = document.getElementById("peek-body");
  const peekName = document.getElementById("peek-name");
  const peekFacts = document.getElementById("peek-facts");
  const peekToggle = document.getElementById("peek-toggle");
  const peekCut = document.getElementById("peek-cut");
  const peekNative = document.getElementById("peek-native");
  const viewSearch = document.getElementById("view-search");

  const PEEK = {
    on: false,
    /* What is drawn now, so that arrowing back onto the same row does not
       redraw it — and, more to the point, does not restart a video. */
    path: null,
    ctrl: null,
    timer: 0,
  };

  /* The row that has the keyboard, or the one that had it last.
     `document.activeElement` is the whole of the selection model here: the
     rows are focusable and the list already restores focus across a repaint,
     so there is no second notion of "selected" to keep in step with it. */
  const focusedRow = () => {
    const el = document.activeElement;
    return el && el.closest ? el.closest("tr[data-path]") : null;
  };

  /* `keeping` is false only when the settings are what asked for this: writing
     back what was just read is a request the service does not need. */
  function setPeek(on, keeping = true) {
    PEEK.on = on;
    peek.hidden = !on;
    peekToggle.setAttribute("aria-pressed", on ? "true" : "false");
    if (keeping) keep({ preview: on });
    viewSearch.classList.toggle("peeking", on);
    if (!on) {
      /* **Emptied on the way out, not left to be garbage.** A `<video>` whose
         node is merely hidden keeps decoding, and one that was hidden while
         playing keeps playing — from a panel nobody can see. */
      showNothing("");
      PEEK.path = null;
      if (PEEK.ctrl) PEEK.ctrl.abort();
    } else {
      const row = focusedRow();
      if (row) drawPeek(row.__row);
    }
  }

  /* Everything the panel says about a file, from the row the list already
     has. No request: these are the same values the columns are drawn from. */
  function peekFactsOf(f) {
    const full = f.path + "/" + f.name;
    const shown = HOME && f.path.startsWith(HOME + "/")
      ? "~" + f.path.slice(HOME.length) : f.path;
    /* The same words the column headings use, and deliberately the same
       msgids: a panel that called the date "Changed" while the column above it
       said "Modified" would be two names for one field. */
    const rows = [
      [T("Location"), shown],
      [T("Kind"), f.kind || ""],
      [f.is_dir ? T("Contents") : T("Size"),
       f.is_dir ? (f.items ? T("{n} items", { n: fmt(f.items) }) : "") : bytes(f.size)],
      [T("Modified"), f.mtime ? ago(f.mtime) : ""],
      [T("Created"), f.ctime ? ago(f.ctime) : ""],
      [T("Accessed"), f.atime ? ago(f.atime) : ""],
      [T("Mode"), f.perm || ""],
      [T("Owner"), [f.user, f.group].filter(Boolean).join(" · ")],
    ].filter(([, v]) => v);
    peekFacts.textContent = "";
    for (const [k, v] of rows) {
      const dt = document.createElement("dt");
      dt.textContent = k;
      const dd = document.createElement("dd");
      dd.textContent = v;
      peekFacts.append(dt, dd);
    }
    peekName.textContent = f.name;
    peekName.title = full;
  }

  function showNothing(message, thumbPath) {
    peekBody.className = "peek-body";
    peekBody.textContent = "";
    peekCut.hidden = true;
    const box = document.createElement("div");
    box.className = "none";
    /* The picture somebody's file manager already made, when there is one. It
       is the only thing there is for the formats a browser cannot open at all
       — a `.docx`, a `.psd`, a video in a codec it does not have — and showing
       it beats showing the word "no". */
    if (thumbPath) {
      const img = document.createElement("img");
      img.src = `/api/icon?${new URLSearchParams({ p: thumbPath, t: TOKEN })}`;
      img.alt = "";
      box.appendChild(img);
    }
    box.appendChild(document.createTextNode(message));
    peekBody.appendChild(box);
  }

  /* The head of a text file, with the words that were searched for marked.
   *
   * Marked here rather than in the bridge because the terms are the page's:
   * the same folded list the name column uses, so a hit in the file is marked
   * the same way as a hit in the name. Built with nodes rather than by
   * assembling HTML — this is somebody else's file, and the one thing it must
   * never be is parsed. */
  function writePeekText(text, terms) {
    peekBody.className = "peek-body text";
    peekBody.textContent = "";
    const pre = document.createElement("pre");
    const hay = fold(text);
    const wanted = terms.filter((t) => t.length > 1);
    let at = 0;
    /* A bounded number of marks. A one-letter term in a quarter of a megabyte
       is tens of thousands of elements, and the panel would take longer to
       lay out than the search took to run. */
    let left = wanted.length ? 2000 : 0;
    while (left > 0) {
      let best = -1, len = 0;
      for (const t of wanted) {
        const i = hay.indexOf(t, at);
        if (i >= 0 && (best < 0 || i < best)) { best = i; len = t.length; }
      }
      if (best < 0) break;
      pre.append(text.slice(at, best));
      const m = document.createElement("mark");
      m.textContent = text.slice(best, best + len);
      pre.appendChild(m);
      at = best + len;
      left--;
    }
    pre.append(text.slice(at));
    peekBody.appendChild(pre);
  }

  /* One more fact, added when the browser learns it.
   *
   * **The two facts the index does not hold and cannot** — how many pixels
   * wide a picture is, how long a recording runs — and they are the two people
   * actually want. Nothing but a decoder knows them, and a decoder is what is
   * already being asked to draw the thing. So they arrive late, from the
   * element, rather than costing every row a decode at scan time. */
  function addFact(key, value) {
    if (!value) return;
    const dt = document.createElement("dt");
    dt.textContent = key;
    const dd = document.createElement("dd");
    dd.textContent = value;
    peekFacts.append(dt, dd);
  }

  const clock = (s) => {
    if (!isFinite(s) || s <= 0) return "";
    const m = Math.floor(s / 60), sec = Math.round(s % 60);
    return m >= 60
      ? `${Math.floor(m / 60)}:${String(m % 60).padStart(2, "0")}:${String(sec).padStart(2, "0")}`
      : `${m}:${String(sec).padStart(2, "0")}`;
  };

  function media(tag, url, type) {
    const el = document.createElement(tag);
    /* The panel the fact belongs to, caught now: by the time a forty-megabyte
       video has its metadata the reader may have arrowed on, and appending to
       whatever the panel shows *then* would put one file's length under
       another file's name. */
    const mine = PEEK.path;
    if (tag === "img") {
      el.alt = "";
      el.addEventListener("load", () => {
        if (PEEK.path === mine) addFact("Boyutlar", `${el.naturalWidth} × ${el.naturalHeight}`);
      });
    } else {
      el.controls = true;
      /* No autoplay: a list you arrow through would otherwise start a
         soundtrack per row. `metadata` is what makes the length known without
         fetching the whole file — which is the reason ranges exist. */
      el.preload = "metadata";
      if (type) el.type = type;
      el.addEventListener("loadedmetadata", () => {
        if (PEEK.path !== mine) return;
        addFact(T("Length"), clock(el.duration));
        if (tag === "video" && el.videoWidth) {
          addFact(T("Dimensions"), `${el.videoWidth} × ${el.videoHeight}`);
        }
      });
    }
    el.src = url;
    return el;
  }

  /* Draw one file. Debounced, because arrowing down a list is not a request
     to preview forty files — it is a request to preview the one the hand
     stops on. */
  function drawPeek(f) {
    if (!PEEK.on || !f) return;
    const full = f.path + "/" + f.name;
    if (full === PEEK.path) return;
    PEEK.path = full;
    peekFactsOf(f);
    clearTimeout(PEEK.timer);
    if (PEEK.ctrl) PEEK.ctrl.abort();
    peekBody.className = "peek-body";
    peekBody.textContent = "";
    peekCut.hidden = true;
    /* Hidden until the bridge says there is a previewer, so it never flashes
       on for the moment between one file and the next. */
    peekNative.hidden = true;
    if (f.is_dir) {
      showNothing(T("A folder — what is in it is in the list."));
      return;
    }
    PEEK.timer = setTimeout(() => {
      const ctrl = new AbortController();
      PEEK.ctrl = ctrl;
      SERVICE.peek(full, ctrl.signal)
        .then((meta) => {
          if (ctrl.signal.aborted) return;
          const url = SERVICE.peekUrl(full);
          /* Offered only where it leads somewhere. GNOME has `sushi` and
             macOS has `qlmanage`; KDE's preview lives inside Dolphin, and
             Hyprland and Windows have no such thing at all — so on three
             desktops out of five this button would be a promise nothing
             keeps. The bridge looks for the binary and says. */
          peekNative.hidden = !meta.native;
          if (meta.shape === "image") {
            peekBody.appendChild(media("img", url));
          } else if (meta.shape === "video") {
            peekBody.appendChild(media("video", url, meta.type));
          } else if (meta.shape === "audio") {
            peekBody.appendChild(media("audio", url, meta.type));
          } else if (meta.shape === "pdf") {
            /* `<embed>` rather than `<iframe>`: the PDF viewer is a plugin,
               and an iframe would also be a document this page's origin has
               to reason about. */
            const e = document.createElement("embed");
            e.src = url;
            e.type = "application/pdf";
            peekBody.appendChild(e);
          } else if (meta.shape === "text") {
            fetch(url, { cache: "no-store", signal: ctrl.signal })
              .then((r) => r.text().then((t) => [r, t]))
              .then(([r, t]) => {
                if (ctrl.signal.aborted) return;
                /* Read at draw time rather than captured: the query moves
                   while a panel is open, and the marks should be whatever is
                   in the box now. Same `parse` the name column uses, so a hit
                   inside the file is marked exactly as a hit in the name is. */
                writePeekText(t, parse(q.value).text);
                if (r.headers.get("X-Scour-Complete") === "0") {
                  peekCut.textContent = T("the first {shown} — the file is {total}", {
                    shown: bytes(new Blob([t]).size), total: bytes(meta.size),
                  });
                  peekCut.hidden = false;
                }
              })
              .catch(() => {});
          } else {
            showNothing(T("This kind of file cannot be shown in a browser."),
                        meta.thumb ? full : null);
          }
        })
        .catch((e) => {
          if (ctrl.signal.aborted) return;
          /* 403 is the one refusal worth naming, because it is a decision
             somebody made rather than a failure: `--no-preview`. */
          showNothing(String(e).includes("403")
            ? T("Previewing is off (--no-preview).")
            : T("It could not be previewed."));
        });
    }, 120);
  }

  /* Space toggles, wherever the focus is in the list — and only there, so the
     same key still scrolls the page everywhere else. */
  body.addEventListener("keydown", (e) => {
    if (e.key !== " " || e.ctrlKey || e.altKey || e.metaKey) return;
    const row = e.target.closest("tr[data-path]");
    if (!row) return;
    e.preventDefault();
    if (PEEK.on && row.__row && row.__row.path + "/" + row.__row.name === PEEK.path) {
      setPeek(false);
    } else {
      PEEK.path = null;
      setPeek(true);
      drawPeek(row.__row);
    }
  });
  peekToggle.addEventListener("click", () => setPeek(!PEEK.on));

  /* Whatever takes the focus is what is previewed: one rule for the arrow
     keys, a click, and the focus the list restores after a repaint. */
  body.addEventListener("focusin", (e) => {
    const row = e.target.closest && e.target.closest("tr[data-path]");
    if (row && PEEK.on) drawPeek(row.__row);
  });
  document.getElementById("peek-close").addEventListener("click", () => {
    setPeek(false);
    const row = focusedRow();
    if (row) row.focus();
  });
  peekNative.addEventListener("click", () => {
    if (PEEK.path) launch(PEEK.path, "preview");
  });
  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape" && PEEK.on && !peek.hidden) setPeek(false);
  });

  /* The index's size, for the "x / y" meter.
   *
   * **The last one is kept, for the same reason the last search's cost is.**
   * `applyMarkup` writes `#path-note` back to its msgid — that is what makes
   * "connecting…" the honest thing to show before the first status — so a
   * language switch put the window back to "connecting…" over a service it was
   * plainly connected to, and left it there until the next reply. Which is up
   * to twenty-five seconds: `/api/wait` answers when the index moves, and on an
   * idle machine it does not. */
  let LAST_STATUS = null;
  function applyStatus(s) {
    LAST_STATUS = s;
    TOTAL = s.entries;
    TOTAL_KNOWN = true;
    let moved = false;
    const note = document.getElementById("path-note");
    if (note) {
      // `Intl` rather than `.replace(".", ",")`, for the same reason the
      // millisecond figure changed: the separator belongs to the language.
      const mb = MB.format(s.index_bytes / 1048576);
      // Singular picked here for the same reason `ago` does it: almost every
      // machine has one or two sources, so `1 sources` would be the ordinary
      // reading of this line rather than an edge case.
      const text = (s.sources === 1
        ? T("index {mb} MB · 1 source · {watching} watched", { mb, watching: s.watching })
        : T("index {mb} MB · {sources} sources · {watching} watched", {
            mb, sources: s.sources, watching: s.watching,
          })) + (s.scanning ? T(" · scanning") : "");
      if (text !== note.textContent) { note.textContent = text; moved = true; }
    }
    /* `LIST`, not the search reply. The search answers under a cap so it can
       keep up with typing; the exact number arrives with the sidebar a moment
       later, and a heartbeat that rewrote the line from the capped one put
       `1.000+` back over it every ten seconds. */
    if (LIST.query !== null) {
      const shown = LIST.exact ? fmt(LIST.total) : fmt(LIST.total) + "+";
      document.getElementById("count").textContent = withIndexTotal(shown);
    }
    /* **The status sentence is in a wrapping `auto` row above the list**, so a
       longer one takes a line from the rows and they have to be laid out
       again. That is the whole reason there is a repaint here.
     *
     * What it is not is a heartbeat. This runs for every reply to `/api/wait`,
     * and most of those say what the last one said — including the
     * twenty-five-second timeouts, which mean *nothing changed*. An
     * unconditional `repaint(true)` marked the rows dirty, redrew the pool and
     * ran `fillWindow` for each of them. */
    if (moved) repaint(true);
  }

  /* ------------------------------------------------------------------ *
   * The list keeps up with the filesystem.
   *
   * A search box over an index that is one second stale is a search box that
   * lies about the file you just saved, and this one did: the rows were
   * whatever the last keystroke asked for and stayed that way until the next
   * one. Everything's list updates itself, and so does this.
   *
   * **Nothing polls.** `/api/wait` does not answer until the index would
   * answer differently — the service holds the request and wakes it on the
   * commit — so an idle desktop costs one round trip every twenty-five
   * seconds, not one a second. It is also what tells the service that
   * somebody is looking, which is what makes it write a change out promptly
   * instead of batching it for fifteen seconds; stop waiting and the batching
   * comes back.
   *
   * What arrives is a revision number and nothing about *what* changed, which
   * is on purpose: re-running the query is a few milliseconds and always
   * right, while a client-side patch of the visible rows would be a second
   * implementation of sorting, filtering and paging that could disagree with
   * the first. So the answer to "a file appeared" is "ask again" — and asking
   * again puts it wherever the current sort says it belongs, which for the
   * default one is the top, with no rule here that says so.
   * ------------------------------------------------------------------ */
  let REV = 0;                 /* the newest revision the service has told us of */
  /* **The revision the visible windows are being kept at**, which is not the
     same thing and is the whole leash. `fillWindow` refetches a window whose
     stamp is not this, and only `refreshRows` moves this up to `REV` — so a
     window that is *missing* is still fetched on the frame it is scrolled to,
     while one that is merely *out of date* waits for the clock. Without the
     split, a scan — which commits continuously — would have the list refetching
     itself as fast as the network allowed for as long as it ran. */
  let SHOWING = 0;
  let missedWhileAway = false; /* something changed while the window was hidden */
  let freshTimer = null;
  /* Paths that were not in the list a moment ago, and when they turned up.
     Bounded by the highlight's own length: nothing stays in here longer than
     it is drawn for. */
  const arrivals = new Map();
  const FRESH_MS = 1800;       /* and it must outlast the CSS animation */

  /* At most one call per `ms`, and never dropped: the last one always runs.
     A scan commits continuously and every commit is a wake-up; without this
     the list would refetch itself as fast as the network allows for as long
     as the scan lasts.
   *
   * **And never more often than the answer is worth.** A fixed interval asks
   * an expensive question exactly as often as a cheap one: measured on an idle
   * window showing a query with 1.35 M matches, the three-second count refresh
   * was taking **930 ms of the service each time** — a third of a core, spent
   * on a number nobody was reading. The refresh now pays for itself: whatever
   * the last one cost, the next one waits at least `COST` times that, so a
   * background refresh can never take more than about a tenth of a machine.
   * Cheap answers are unaffected, which is the point — this slows down exactly
   * the queries that deserve it and nothing else. */
  const COST = 10;

  /* Run `fn` once the calls stop for `ms`, and lengthen that wait for a `fn`
     that turns out to be expensive. The other side of `atMostEvery`: that one
     keeps a steady stream from being too fast, this one keeps a burst from
     starting anything until the burst is over.
   *
   * **The wait is what the last call cost, and no more than `PATIENCE`.** A
   * plain "ten times the cost" belongs on a background refresh nobody is
   * waiting for; here somebody *is* waiting — a 1.3 s walk would push the
   * count 13 s behind the query it belongs to, which is worse than the
   * problem. Waiting one walk's length means two of them never overlap, and
   * the ceiling keeps even a pathological one answerable. */
  const PATIENCE = 1500;
  function afterQuiet(fn, ms) {
    let timer = null, floor = ms;
    return () => {
      clearTimeout(timer);
      timer = setTimeout(() => {
        timer = null;
        const began = Date.now();
        const out = fn();
        if (out && typeof out.then === "function") {
          const charge = () => {
            floor = Math.min(PATIENCE, Math.max(ms, Date.now() - began));
          };
          out.then(charge, charge);
        }
      }, floor);
    };
  }

  function atMostEvery(fn, ms) {
    let last = 0, timer = null, floor = ms;
    const done = (spent) => { floor = Math.max(ms, spent * COST); };
    const call = () => {
      last = Date.now();
      const began = last;
      const out = fn();
      // A promise says when it finished; anything else is charged as free.
      if (out && typeof out.then === "function") {
        out.then(() => done(Date.now() - began), () => done(Date.now() - began));
      }
    };
    return () => {
      if (timer) return;
      const wait = Math.max(0, floor - (Date.now() - last));
      if (!wait) { call(); return; }
      timer = setTimeout(() => { timer = null; call(); }, wait);
    };
  }

  /* The highlight marks the arrival, not the row, so it is taken off on its
     own clock rather than by whatever redraws next. */
  function armFresh() {
    clearTimeout(freshTimer);
    freshTimer = setTimeout(() => {
      const cut = Date.now() - FRESH_MS;
      let any = false;
      for (const [p, when] of arrivals) if (when <= cut) { arrivals.delete(p); any = true; }
      for (const f of LIST.rows.values()) {
        if (f.fresh && !arrivals.has(fullPath(f))) { delete f.fresh; any = true; }
      }
      if (any) repaint(true);
    }, FRESH_MS);
  }

  /* **Keeping a visible window current is `fillWindow`'s job and nobody
   * else's.**
   *
   * There were two of these, and they did the same work twice. `reviseRows`
   * refetched the visible windows whenever the index moved, and `fillWindow`
   * refetched them one frame later from `paintWindow` — because `reviseRows`
   * registered nothing in `LIST.pending` and stamped `LIST.at` only when its
   * answer came back, so for that frame the window looked neither in flight
   * nor current. Then `reviseRows` aborted `fillWindow`'s copy, after the
   * service had already built the page. Measured on an untouched window, the
   * offsets asked for were **all of them offset zero, 2.55 and 2.75 a second
   * over two forty-second rounds, thirteen and fifteen of them abandoned** —
   * about two requests per index revision for a list that changes once.
   *
   * Two smaller repairs were tried first and neither is the answer:
   *
   *   - Registering `reviseRows`' requests in `LIST.pending` did not reduce
   *     the duplicates at all — 5 of 12 became 9 of 18. `reviseRows` was on a
   *     400 ms leash and `fillWindow` runs on the frame, so `fillWindow` still
   *     went first and `reviseRows` still asked again.
   *   - Removing `fillWindow`'s staleness rule made the duplicates vanish and
   *     would have taken the live refresh with it. Nothing proved that it did
   *     not, which is why it was reverted rather than shipped.
   *
   * So the second fetcher is gone rather than arbitrated with. What it did
   * that nothing else did — marking which rows had just turned up, and taking
   * the exact total off an answer the count cap did not cut — moved into
   * `fillWindow` with it. What is left here is the leash and the two lines
   * that arm it. */
  function refreshRows() {
    if (LIST.query === null) return;           /* the first search has not landed */
    SHOWING = REV;
    // Returned so the throttle above can charge for what this cost.
    return fillWindow();
  }

  /* The exact count, the kind rail and the histogram.
     On a longer leash than the rows, and that is measured rather than
     cautious: this walks the whole matching set and cost 119 ms on the empty
     query, against single-digit milliseconds for a window of rows. Worth
     paying every few seconds, not several times a second. */

  /* How dear a refresh may be and still be repeated for a change nobody
     asked about.
   *
   * **The leash above is not enough, by construction.** `atMostEvery` waits
   * `COST` times what the last call took, so a refresh that costs anything at
   * all settles at a fixed *share* of the machine — one eleventh — however
   * dear it is. Measured with an open window and nobody touching it: the
   * service sat at **8.14% of a core**, and six facet calls in thirty seconds
   * accounted for 1.73 of those seconds. A tenth of a core, forever, for
   * numbers nobody was reading.
   *
   * A share is the wrong shape for this. So: a query whose sidebar is cheap
   * stays live, because it costs nothing to keep it that way — and on a
   * narrow query, which is what somebody reading the rail has typed, it is
   * single-digit milliseconds. A query broad enough to be dear keeps the
   * numbers it was answered with until the query changes. The rows stay live
   * either way; they are a hundredth of the price.
   *
   * Deliberately generous, because the cost of being wrong is asymmetric: too
   * high wastes a little CPU on a narrow query, too low silently stops the
   * rail updating on one where somebody is watching it. */
  const SIDEBAR_LIVE_UNDER_MS = 40;

  function reviseCounts() {
    if (LIST.query === null) return;
    if (sidebarCost > SIDEBAR_LIVE_UNDER_MS) return;
    // Returned so the throttle above can charge for what it cost.
    return sidebar(LIST.query);
  }

  const rowsSoon = atMostEvery(refreshRows, 400);
  const countsSoon = atMostEvery(reviseCounts, 3000);

  function indexMoved() {
    /* A hidden window is a window nobody is reading. Refetching for it costs
       the same as refetching for a visible one and shows nobody anything, so
       it is remembered instead and done once, when it comes back. */
    if (document.hidden) { missedWhileAway = true; return; }
    rowsSoon();
    countsSoon();
  }

  document.addEventListener("visibilitychange", () => {
    if (document.hidden) return;
    if (missedWhileAway) { missedWhileAway = false; indexMoved(); }
    watch();                                  /* and start waiting again */
  });

  let waiting = false;
  /* Set when this face has handed over to another one. Everything that would
     otherwise keep asking a server that is on its way out reads it. */
  let HANDED_OVER = false;
  async function watch() {
    if (waiting || HANDED_OVER) return;
    waiting = true;
    try {
      /* A hidden window stops waiting altogether. That is not only the
         browser's saving: while anyone is waiting the service commits on the
         burst clock instead of batching, and a minimised window has no
         business making a laptop write a segment a second. */
      while (!document.hidden && !HANDED_OVER) {
        let s;
        try {
          s = await SERVICE.wait(REV, 25000);
        } catch {
          /* The bridge or the service went away. Try again, slowly, rather
             than in a tight loop against something that is not there. */
          await new Promise((r) => setTimeout(r, 3000));
          continue;
        }
        applyStatus(s);
        if (s.revision !== REV) {             /* `!=`: a restart counts back from zero */
          REV = s.revision;
          indexMoved();
        }
      }
    } finally {
      waiting = false;
    }
  }
  /* Pictures, behind a button and remembered.
   *
   * On by default because a list of names is what this replaced and a list of
   * names is what it looked like. Off is one click, and it is a real off: the
   * rows are drawn again without the `<img>` at all rather than hidden by CSS,
   * so nothing is requested and nothing is decoded. */
  /* **Both of these were in `localStorage` and are not any more.** They are
     the two settings this window has that no other frontend can act on — a
     terminal draws no thumbnails and has no notes column — so they live under
     `view.web` in the service's settings rather than in a typed field every
     frontend would have to ignore. What that buys is what the browser could
     never give: they survive the browser being killed, and they are in the
     same place as everything else somebody has chosen. */
  let ICONS = true;
  const iconBtn = document.getElementById("icons");
  function applyIcons() {
    iconBtn.setAttribute("aria-pressed", String(ICONS));
    document.body.classList.toggle("no-icons", !ICONS);
    draw(q.value, parse(q.value), FILES, lastMeter || { total: LIST.total, capped: !LIST.exact, took_us: 0, rows_visited: 0 });
  }
  iconBtn.addEventListener("click", () => {
    ICONS = !ICONS;
    keepView({ icons: ICONS });
    applyIcons();
  });
  iconBtn.setAttribute("aria-pressed", String(ICONS));

  /* ---------------- pictures nothing has made yet ----------------
   *
   * A folder somebody has never opened in a file manager has no thumbnails,
   * because nothing has ever previewed the files in it — so the grid came up
   * as a page of empty boxes. The fix is not to draw anything: it is to ask
   * the desktop's own thumbnailer, which is what the standard is for, so that
   * the picture Scour asked for is one Files and Loupe find already made.
   *
   * **All of that happens in the service.** How many decoders may run at once
   * is a fact about the machine and there is one of it; see `Request::Thumbnails`.
   * What is decided here is only *which* files, and the answer is: the ones on
   * the screen, once the screen has stopped moving.
   *
   * Four bounds, and each of them is something this project has paid for:
   *
   * - **`PICTURE_QUIET`** — nothing is asked while anything is moving. Flicking
   *   through twenty thousand tiles must cost nothing; `afterQuiet` restarts
   *   its timer on every repaint, so a scroll that never settles never asks.
   * - **`PICTURE_BATCH`** — less than a screenful on purpose. When the answer
   *   lands this asks again, so a still screen fills in a few rounds and a
   *   screen that has moved on never pays for the tiles it left behind.
   * - **One request at a time.** No queue, so nothing can grow with how fast
   *   somebody scrolls. The batch is rebuilt from what is visible *now* each
   *   time rather than drained from a list built when it was visible.
   * - **`PICTURE_MEMORY`** — the record of what has been asked for is capped
   *   and drops its oldest, because a set keyed by path over a session of
   *   scrolling is a set the size of the disk. It is only an optimisation
   *   anyway: the service keeps the real record, on disk, in the standard's
   *   failure directory, so a path that falls out of here costs one `stat`
   *   rather than one process.
   *
   * And it is all behind `ICONS`. Pictures off means not one request. */
  const PICTURE_QUIET = 250;
  const PICTURE_BATCH = 24;
  const PICTURE_MEMORY = 4096;
  /* The bridge can be started with `--no-thumbnails`, and then this route is
     403 rather than absent. Asked once and remembered: a window that keeps
     asking a door that is shut is the same defect as no bound at all. */
  let picturesRefused = false;
  let askingPictures = false;
  const askedForPictures = new Set();

  /* Oldest out first. A `Set` iterates in insertion order, so the first key is
     the least recently asked for. */
  function rememberAsking(path) {
    if (askedForPictures.size >= PICTURE_MEMORY) {
      askedForPictures.delete(askedForPictures.values().next().value);
    }
    askedForPictures.add(path);
  }

  function askForPictures() {
    if (!ICONS || picturesRefused || askingPictures || LIST.query === null) return;
    const [from, to] = visibleRange();
    const paths = [];
    for (let i = from; i < to && paths.length < PICTURE_BATCH; i++) {
      const f = LIST.rows.get(i);
      /* `make` is the bridge saying the machine declares a thumbnailer for
         this type. It costs it two hash lookups per row and no syscall, which
         is why the page never has to guess from an extension. */
      if (!f || !f.make || f.thumb) continue;
      const p = fullPath(f);
      if (askedForPictures.has(p)) continue;
      rememberAsking(p);
      paths.push(p);
    }
    if (!paths.length) return;
    askingPictures = true;
    /* Returned so `afterQuiet` can charge itself for what this cost — a batch
       of videos is seconds, and the next quiet period should be longer than
       the one that led to it. */
    return SERVICE.thumbs(paths)
      .then((res) => {
        askingPictures = false;
        if (!res || !res.ready || !res.ready.length) return;
        const made = new Set(res.ready);
        /* Over the visible range rather than over `LIST.rows`, which reaches
           twenty thousand entries once the reading-ahead has run. The rows
           this batch was about may have been refetched in the meantime, in
           which case they already carry `thumb` from the bridge and this
           finds nothing to do. */
        const [nowFrom, nowTo] = visibleRange();
        let any = false;
        for (let i = nowFrom; i < nowTo; i++) {
          const f = LIST.rows.get(i);
          if (f && !f.thumb && made.has(fullPath(f))) { f.thumb = true; any = true; }
        }
        if (any) repaint(true);
        /* The rest of the screen. A batch is deliberately less than a
           screenful, and this is what finishes it — through the same quiet
           timer, so a scroll that starts in the meantime still wins. */
        picturesSoon();
      })
      .catch((e) => {
        askingPictures = false;
        if (e && /\b403\b/.test(String(e.message))) {
          picturesRefused = true;
          return;
        }
        /* Not silent, and not retried either: the paths are already in
           `askedForPictures`, so a bridge that is down costs one failed
           request per screenful rather than one per frame. */
        console.error("scour: pictures could not be asked for:", e);
      });
  }
  const picturesSoon = afterQuiet(askForPictures, PICTURE_QUIET);

  /* ---------------- changing the shape ----------------
   *
   * **What is kept across the change is the item, not the pixel.** Row 12,000
   * is line 12,000 in the table and line 1,200 in a grid ten across, so the
   * scroll position means a different thing on each side of the switch;
   * carrying it over unchanged would land somebody ten times too far down.
   * So: read which item is at the top, change everything, put that item back
   * at the top.
   *
   * **And the extent is stated before the position is written.** A browser
   * clamps `scrollTop` to the extent it has *now*, and the sizer still says
   * what the old shape needed — going from `large` at five across to `detail`
   * makes the list twice as long, and the position would be clipped to the
   * shorter one and then never recovered. So the sizer is set here, from the
   * row count, exactly as `paintWindow` sets it a frame later. It is still a
   * decision and not a measurement; it is only made a moment earlier.
   *
   * This is the one place in this file that writes `scrollTop`, and it is
   * allowed to because it runs from a click. Nothing on the painting path may
   * do it — see the note in `paintWindow` about eight hundred steps in five
   * seconds. */
  const viewBox = document.getElementById("views");
  const viewBtns = [...viewBox.querySelectorAll("button")];

  /* Which item the viewport starts on, in the shape that is showing now. */
  const topItem = () =>
    Math.min(reach(), Math.floor(scrollEl.scrollTop / pitch()) * PER_ROW);

  function applyMode(next) {
    const at = topItem();
    MODE = MODES.includes(next) ? next : "detail";
    for (const b of viewBtns) {
      b.setAttribute("aria-pressed", String(b.dataset.view === MODE));
    }
    /* Both, because the style sheet needs one selector for "is this a grid"
       and another for "which of the two". */
    document.body.classList.toggle("grid", grid());
    document.body.dataset.view = MODE;
    applyWidths();
    // Forces the layout the two lines above asked for, which is what makes
    // the width below the new one rather than the old.
    measurePerRow();
    sizedTo = Math.round(lines() * pitch());
    sizer.style.height = `${sizedTo}px`;
    scrollEl.scrollTop = Math.round(Math.floor(at / PER_ROW) * pitch());
    /* Every slot is about to hold a different kind of node, so nothing a slot
       remembers about what it showed is worth anything. */
    for (const tr of pool) tr.__stamp = "";
    painted = "";
    repaint(true);
  }

  viewBox.addEventListener("click", (e) => {
    const b = e.target.closest("button[data-view]");
    if (!b || b.dataset.view === MODE) return;
    applyMode(b.dataset.view);
    keep({ layout: MODE });
  });

  /* The help, behind a button and remembered.
   *
   * `SIDE` and the `view.side` it is stored under keep their names: the
   * setting means "is the explaining thing open", which is still what it
   * means, and renaming it would make every window that has already saved a
   * preference forget it for nothing. */
  let SIDE = false;
  const aboutBtn = document.getElementById("about");
  const helpBox = document.getElementById("help");

  /* The fields, from the table the parser and the completions already share.
     Rebuilt on a language change because `about` is a msgid; the terms
     themselves are grammar and are never translated — `kind:` finds images in
     a Turkish window, which is the whole reason `FIELDS` splits the two. */
  function buildHelpFields() {
    const dl = document.getElementById("help-fields");
    const out = [];
    for (const f of FIELDS) {
      const dt = document.createElement("dt");
      dt.textContent = f.eg || f.name;
      const dd = document.createElement("dd");
      dd.textContent = T(f.about);
      out.push(dt, dd);
    }
    dl.replaceChildren(...out);
  }

  /* Under the button that opens it, and inside the window.
   *
   * Measured rather than positioned by constant: the button sits at the end of
   * a bar whose height depends on the font and on how the meter wrapped, and a
   * panel that is nearly under its button is worse than one that is obviously
   * not. `getBoundingClientRect` here is a read at the top of a click, which
   * is the cheap moment for one — nothing has been written to the DOM yet.
   *
   * The clamp is what makes it survive a narrow window: at 980px the panel is
   * wider than the space to the right of the button, so it slides left until
   * it fits rather than hanging off the edge. */
  function placeHelp() {
    const b = aboutBtn.getBoundingClientRect();
    const w = helpBox.offsetWidth;
    const left = Math.max(10, Math.min(b.right - w, innerWidth - w - 10));
    helpBox.style.left = `${Math.round(left)}px`;
    helpBox.style.top = `${Math.round(b.bottom + 8)}px`;
  }

  function applySide() {
    aboutBtn.setAttribute("aria-pressed", String(SIDE));
    helpBox.hidden = !SIDE;
    /* No `repaint` any more, and that is the point of the change rather than
       an oversight: the panel is an overlay, so the list is exactly as tall
       and as wide as it was a moment ago and every row already on screen is
       still the right row. Opening the help used to re-lay out the table. */
    if (SIDE) placeHelp();
  }
  aboutBtn.addEventListener("click", (e) => {
    // Otherwise the document listener below sees this click as "outside" and
    // closes the panel in the same tick it was opened in.
    e.stopPropagation();
    SIDE = !SIDE;
    keepView({ side: SIDE });
    applySide();
  });
  document.getElementById("help-x").addEventListener("click", () => {
    SIDE = false;
    keepView({ side: SIDE });
    applySide();
  });
  // A click anywhere else, and Escape. Both are what a panel over a window is
  // expected to answer to, and neither was available when it was a column.
  document.addEventListener("click", (e) => {
    if (SIDE && !e.target.closest("#help")) {
      SIDE = false;
      keepView({ side: SIDE });
      applySide();
    }
  });
  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape" && SIDE) {
      SIDE = false;
      keepView({ side: SIDE });
      applySide();
    }
  });
  addEventListener("resize", () => { if (SIDE) placeHelp(); });
  applySide();
  // The shape the window opens in, before the settings land. This is what
  // puts `data-view` on the body and the pressed state on the buttons; the
  // service's answer runs it again with whatever was chosen last time.
  applyMode(MODE);

  /* What the service handed back for this window, once it lands. Defaults
     until then — the window draws before the round trip, which is the whole
     reason `applySettings` exists. */
  function applyView() {
    ICONS = VIEW.icons !== false;
    SIDE = VIEW.side === true;
    applyIcons();
    applySide();
  }

  /* **The window opens on your disk, not on your last keystroke.**
   *
   * This used to restore the previous query and run it, and the argument for
   * it was a good one: a launcher brought up by a hotkey should come back with
   * what was last typed, selected, so the next keystroke replaces it. What it
   * did in practice was open the window searching for a leftover letter —
   * whatever half-typed thing the last session ended on, which for a search
   * box is usually one or two characters that meant nothing on their own.
   *
   * The empty query is a better opening: it is the whole index, newest first,
   * and it is the cheapest query there is — the count comes straight from
   * `stats().entries` rather than from a walk. So the box is empty, the list
   * is your disk, and the first key you press starts the search.
   *
   * It used to be saved anyway, on every keystroke, "in case somebody wants
   * the last query offered rather than run". Nothing ever read it, and a
   * write per keystroke to a store this window no longer uses is not a line
   * kept ready — it is a line nobody would find. The history has what was
   * meant, which is the better thing to offer. */
  q.focus();
  q.select();

  buildHeads();
  /* Start the useful request immediately. Taxonomy, places, settings and
     status decorate the window when they arrive; none is a prerequisite for
     asking the service for its first page. */
  render();
  /* One status to start from — the revision in it is what the wait is
     measured against — and after that the waiting loop is the heartbeat.
     There is no interval any more: a reply arrives whenever the index moves
     and at worst every twenty-five seconds, which is what the interval was
     for. */
  SERVICE.status()
    .then((s) => { applyStatus(s); REV = s.revision; })
    .catch(() => {})
    .finally(watch);

  /* The taxonomy, then the first search. The rail cannot be drawn before the
     engine has said what is in it. */
  /* Before anything else the window is told what it remembered. It has
     already drawn itself with defaults by now, which is deliberate: a blank
     window while a socket answers is worse than one whose columns settle a
     moment later. */
  SERVICE.settings()
    .then(applySettings)
    .catch(() => {});

  SERVICE.get("places", {})
    .then((res) => {
      HOME = res.home || "";
      MOUNTS = res.mounts || [];
      SCOPES = (res.places || []).map((p) => [p.label, p.path, null]);
      /* Places affect both the scope rail and how paths/access times already
         on screen are rendered. They are local display data, so repaint them
         without asking the index for the same rows again. */
      syncFacets(parse(q.value));
      for (const tr of pool) tr.__stamp = "";
      repaint(true);
    })
    .catch(() => {});

  /* ------------------------------------------------------------------ *
   * The language, and changing it without restarting anything.
   *
   * Two routes, asked together and applied together. `/api/strings` carries
   * the catalogue and the list of languages that exist; `/api/kinds` carries
   * the thirteen kind labels, which are the one part of the window whose words
   * the page does not hold a msgid for — they are the engine's taxonomy and
   * the bridge translates them, which is what keeps the rail from knowing a
   * different set of kinds than the engine has.
   *
   * **Applied together, not each on arrival.** Separately, a switch redrew the
   * rail in the new language a frame before the headings changed and a frame
   * after the sidebar did. One `Promise.all`, one repaint.
   * ------------------------------------------------------------------ */
  function applyKinds(res) {
    KINDS = res.kinds.map((k) => [k.label, k.token]);
    KIND_KEY = Object.fromEntries(res.kinds.map((k) => [k.token, k.label]));
    /* Rows may have beaten this request, or be left over from the language
       before this one. Bring their labels up to date without searching the
       index again — the rows did not change, only the word for their kind. */
    for (const f of LIST.rows.values()) f.kind = labelOfToken(f.ktoken);
    for (const f of FILES) f.kind = labelOfToken(f.ktoken);
  }

  /* Everything that has a word in it, redrawn.
   *
   * The list of what to redraw is the honest cost of not having a framework,
   * and it is written out rather than hidden behind a full reload because a
   * reload would lose the query, the scroll position and the selection —
   * "without restarting anything" has to mean the window keeps its place. */
  function applyLanguage() {
    document.documentElement.lang = LANG;
    buildFormatters();
    applyMarkup(document);
    buildLangMenu();
    /* The help's field list is generated rather than written in the markup,
       so `applyMarkup` above cannot reach it: `about` is a msgid and has just
       changed language like everything else. */
    buildHelpFields();
    buildHeads();               // the headings, and the picker's title
    syncFacets(parse(q.value)); // the three rails
    drawSelBar();               // the selection bar, if anything is selected
    /* The two lines in the meter that nothing else will rewrite until
       something happens. Both were caught in the window rather than reasoned
       about: `10,48 ms · 200 satır okundu` sat under English headings, and
       `#path-note` had been put back to "connecting…" by `applyMarkup` two
       lines above. See `drawCost` and `applyStatus`. */
    drawCost();
    if (LAST_STATUS) applyStatus(LAST_STATUS);
    /* The preview's fact list, if it is open. `drawPeek` returns early for the
       row it is already showing — deliberately, so that arrowing back onto a
       row does not restart a video — so the panel would have kept the previous
       language's `Tür`/`Boyut`/`Değişme` until the selection moved. Only the
       labels are rewritten; the bytes on screen have not changed. */
    if (PEEK.on && !peek.hidden) {
      const row = focusedRow();
      if (row && row.__row) peekFactsOf(row.__row);
    }
    if (window.SCOUR && window.SCOUR.relabel) window.SCOUR.relabel();
    /* The rows carry `ago(...)` and a kind label, both of which just changed,
       and the pool skips a row whose stamp is unchanged. */
    for (const tr of pool) tr.__stamp = "";
    painted = "";
    repaint(true);
  }

  /* Fetch a language and put it on. `tag` empty means "whatever the service
     works out" — the setting, then the config file, then `LANG`. */
  function loadLanguage(tag) {
    const params = tag ? { lang: tag } : {};
    return Promise.all([
      SERVICE.get("strings", params),
      SERVICE.get("kinds", params),
    ]).then(([words, kinds]) => {
      LANG = words.lang || "en";
      LANGUAGES = words.languages || [];
      STRINGS = words.strings || {};
      applyKinds(kinds);
      applyLanguage();
    });
  }

  /* **Saved before it is drawn, and drawn whether or not the save lands.**
     `keep` is fire-and-forget by design; a window that refused to change
     language because a settings write was slow would be worse than one that
     changes and writes a moment later. */
  function chooseLanguage(tag) {
    keep({ language: tag });
    langMenu.hidden = true;
    langBtn.setAttribute("aria-expanded", "false");
    loadLanguage(tag).catch((e) => console.error("scour: language:", e));
  }

  /* **The whole result set, not the list.**
   *
   * The list stops at `REACH` because past twenty thousand rows a query wants
   * narrowing and a person cannot read further anyway. An export is the other
   * case: it exists to hand the answer to something that is not a person, and
   * it now really is the whole of it — the service walks the matching set once
   * and streams the rows, where the bridge used to page through it and stop at
   * half a million.
   *
