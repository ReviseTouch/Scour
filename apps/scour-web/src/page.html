    dot.style.background = `var(${bandOf(f.mtime)})`;
    /* A tile is a picture and a name and no columns: which columns are shown
       says nothing about what a tile holds. */
    if (tr.__nm) {
      writeName(tr.__nm, f, parsed.text);
      return;
    }
    for (let c = 0; c < cols.length; c++) {
      cols[c].write(tr.children[c + 1], f, parsed);
    }
  }

  /* Ask at once and abandon what the screen has left behind: a page is a slice
   * of the kept ordering, 5.5 ms at row nineteen thousand and flat at every
   * depth, so at most `INFLIGHT` run, nearest the middle first. */
  const INFLIGHT = 4;

  /* How long a result set has to stand still before the page reads ahead into
     it: long enough that typing does not start a hundred fetches. */
  const SETTLED = 400;

  /* What a window may cost before even nearby speculation is too expensive,
     in the service's own milliseconds. */
  const READ_AHEAD_MAX = 25;

  /* Read a little beyond either visible edge: a bounded neighbourhood keeps
     the LRU cache from fetching its own evictions. */
  function nextMissing(from, to) {
    const end = Math.min(reach(), Math.ceil(to / WINDOW) * WINDOW + AHEAD_WINDOWS * WINDOW);
    const begin = Math.max(0, Math.floor(from / WINDOW) * WINDOW - AHEAD_WINDOWS * WINDOW);
    const here = Math.floor((from + to) / 2 / WINDOW) * WINDOW;
    for (let step = 0; step * WINDOW <= end - begin; step++) {
      const tries = step === 0 ? [here] : [here + step * WINDOW, here - step * WINDOW];
      for (const start of tries) {
        if (start < begin || start >= end) continue;
        /* `at` rather than `rows`: a window that came back empty is fetched,
           and `rows` would answer "missing" for ever. */
        if (!LIST.at.has(start) && !LIST.pending.has(start)) return start;
      }
    }
    return null;
  }

  function fillWindow() {
    if (document.hidden || HANDED_OVER || LIST.query === null) return Promise.resolve();
    const [from, to] = visibleRange();

    const first = Math.floor(from / WINDOW) * WINDOW;
    const wanted = [];
    for (let start = first; start < to; start += WINDOW) {
      if (LIST.pending.has(start)) continue;
      // On screen, out of date is as good as missing. Off screen it is not.
      if (LIST.at.get(start) === SHOWING) {
        keepWindow(start, SHOWING);
        continue;
      }
      wanted.push(start);
    }
    /* A list with nothing in it still has to be asked about: `reach()` is
       zero, so the range is `[0, 0]` and the loop above covers no window. */
    if (first >= to && LIST.at.get(0) !== SHOWING && !LIST.pending.has(0)) wanted.push(0);
    const eye = (from + to) / 2;
    wanted.sort((a, b) => Math.abs(a + WINDOW / 2 - eye) - Math.abs(b + WINDOW / 2 - eye));

    /* Except the window the reading-ahead started off screen on purpose, or
     * every other request is a page the service built and nobody read. */
    for (const [start, request] of LIST.pending) {
      const behind = start + WINDOW <= from || start >= to;
      if (request.ahead ? !wanted.length : !behind) continue;
      request.stop.abort();
      LIST.pending.delete(start);
    }

    /* Only once the query has settled and only while a window is cheap: one
     * window over 2,241,762 rows is 3.2 ms on `modified` against 2,463.6 ms
     * on `path`. The rows on screen are fetched at any price. */
    const affordable = LIST.cost <= READ_AHEAD_MAX;
    let ahead = null;
    if (affordable && Date.now() - LIST.since > SETTLED &&
        !wanted.length && LIST.pending.size === 0) {
      ahead = nextMissing(from, to);
      if (ahead !== null) wanted.push(ahead);
    }

    const started = [];
    for (const start of wanted.slice(0, Math.max(0, INFLIGHT - LIST.pending.size))) {
      const request = {
        generation,
        query: LIST.query,
        sort: LIST.sort,
        desc: LIST.desc,
        /* Recorded at the ask: a refresh starting mid-flight must leave this
           window out of date rather than stamped with a newer revision. */
        rev: SHOWING,
        ahead: start === ahead,
        stop: new AbortController(),
      };
      LIST.pending.set(start, request);
      started.push(SERVICE.search(request.query, request.sort, request.desc, WINDOW, start, request.stop.signal)
        .then((res) => {
          /* Clearing an old result set does not cancel its fetch: an old
             answer for window 400 must not delete a newer query's window 400. */
          if (LIST.pending.get(start) !== request) return;
          if (request.generation !== generation ||
              request.query !== LIST.query || request.sort !== LIST.sort ||
              request.desc !== LIST.desc) {
            LIST.pending.delete(start);
            return;
          }
          /* Convert before clearing the pending token, so a malformed row
             throws into a catch that can still name this request. */
          const rows = res.rows.map(fromService);
          LIST.pending.delete(start);
          // The service's own measure, not the round trip: a window queued
          // behind three others takes as long as all four.
          LIST.cost = res.took_us / 1000;
          /* A window already here is being refreshed, so what is in it now
             and was not a moment ago is a file that turned up. */
          const refreshing = LIST.at.has(start);
          putRows(start, rows, refreshing);
          keepWindow(start, request.rev);
          /* Only when the engine reached the end of the matching set: a capped
           * number snaps the scrollbar back to 1.000 on every change. */
          if (!res.capped && (!LIST.exact || LIST.total !== res.total)) {
            setTotal(res.total, true);
          }
          if (refreshing) now = Math.floor(Date.now() / 1000);  /* "5 min ago" moves */
          repaint(true);
          /* A slot has come free and the screen may be elsewhere: this is what
             keeps a still list filling without waiting for the hand. */
          fillWindow();
        })
        .catch((e) => {
          if (LIST.pending.get(start) !== request) return;
          LIST.pending.delete(start);
          // Being scrolled past is the ordinary case, not a fault.
          if (e && e.name === "AbortError") return;
          // Not silent: a failed window stays a ghost until something retries
          // it, but it must not masquerade as a draw.
          console.error("scour: a window did not load:", e);
        }));
    }
    /* What this call set going, so `refreshRows` can charge itself for it.
       Every branch above is caught, so this settles rather than rejects. */
    return Promise.all(started);
  }

  /* One door, opening on a frame: an inline paint reads `scrollTop` while the
   * tree is dirty, and that forced layout cost 24 to 32 ms. */
  let paintQueued = false;
  let dirty = false;          /* the rows changed, though the range did not */
  let painted = "";
  /* Not a fixed tick: it wakes when the soonest row's text would change, and
   * not at all with no date column or a hidden window. Only the date cells are
   * rewritten — `writeRow` returns early when the file has not changed. */
  let clockTimer = null;
  const HOUR = 3600;

  /* When `Math.round(s / unit)` next changes; the boundary rounds up, because
   * early is one wasted rewrite and late is the bug. */
  const nextRound = (s, unit) =>
    Math.max(1, Math.ceil((Math.round(s / unit) + 0.5) * unit - s));

  /* One line per band of `ago`, and the two must stay in step. */
  function nextChange(s) {
    if (s < 0) return Math.max(1, -s);          // a timestamp in the future
    if (s < 60) return 1;                       // seconds, counted not rounded
    if (s < HOUR) return nextRound(s, 60);
    if (s < DAY) return nextRound(s, HOUR);
    if (s < 30 * DAY) return nextRound(s, DAY);
    if (s < 365 * DAY) return nextRound(s, 30 * DAY);
    return nextRound(s, 365 * DAY);
  }

  function dateCells() {
    const keys = new Set(["modified", "created", "accessed"]);
    return shownColumns()
      .map((c, i) => (keys.has(c.key) ? { at: i + 1, col: c } : null))
      .filter(Boolean);
  }

  /* The value a date column reads, without asking the column to write itself. */
  const stampOf = (f, key) =>
    key === "modified" ? f.mtime : key === "created" ? f.ctime : f.atime;

  /* One walk over `pool`, writing only what a second can change: the column's
   * own `write` rebuilds titles through `Intl` too, 3.9 ms a tick. */
  function clockPass(write) {
    const where = dateCells();
    const awake = where.length && !document.hidden &&
      !document.getElementById("view-search").hidden;
    if (!awake) return 0;
    let soonest = HOUR;
    for (const tr of pool) {
      const f = tr.__row;
      if (!f) continue;
      for (const { at, col } of where) {
        if (col.key === "accessed" && frozenAtime(f)) continue;
        const v = stampOf(f, col.key);
        if (!v) continue;
        soonest = Math.min(soonest, nextChange(now - v));
        if (!write) continue;
        const td = tr.children[at];
        if (!td) continue;
        const text = ago(v);
        if (td.textContent !== text) td.textContent = text;
        if (col.key === "modified") {
          // Guarded: an unconditional style write invalidates the cell.
          const c = `var(${bandOf(v)})`;
          if (td.style.color !== c) td.style.color = c;
        }
      }
    }
    return soonest;
  }

  function tickClock() {
    clockTimer = null;
    now = Math.floor(Date.now() / 1000);
    arm(clockPass(true));
  }

  function scheduleClock() {
    arm(clockPass(false));
  }

  /* Zero means nothing on screen can change, so nothing is armed. */
  function arm(soonest) {
    clearTimeout(clockTimer);
    clockTimer = null;
    if (soonest > 0) clockTimer = setTimeout(tickClock, soonest * 1000);
  }

  /* A shown window may have been hidden for an hour. */
  document.addEventListener("visibilitychange", () => {
    if (document.hidden) { clearTimeout(clockTimer); clockTimer = null; }
    else tickClock();
  });

  function repaint(rowsChanged) {
    if (rowsChanged) dirty = true;
    if (paintQueued) return;
    paintQueued = true;
    requestAnimationFrame(() => {
      paintQueued = false;
      /* Both reads happen here, where the layout is settled. Measuring once
         is wrong: the first paint has nothing in its rows. */
      measurePerRow();
      const sample = pool.find((tr) => tr.dataset.path) || pool[0];
      if (sample) {
        const h = sample.getBoundingClientRect().height;
        /* A clearance bound grows and never oscillates, and is never the pitch. */
        if (h > linePx[MODE]) { linePx[MODE] = h; painted = ""; }
      }
      const head = body.previousElementSibling;
      if (head) headPx = Math.max(headPx, head.getBoundingClientRect().height || 0);
      const now = visibleRange().join();
      if (now === painted && !dirty) {
        return;
      }
      /* Bookkeeping after the draw, or a row that throws wedges the window. */
      try {
        paintWindow();
      } catch (e) {
        dirty = true;
        console.error("scour: a window did not draw:", e);
        return;
      }
      painted = now;
      dirty = false;
      fillWindow();
      /* After the draw: `picturesSoon` restarts on every repaint, so a moving
         scroll never gets as far as asking. */
      picturesSoon();
    });
  }
  const onScroll = () => repaint(false);
  scrollEl.addEventListener("scroll", onScroll, { passive: true });
  addEventListener("resize", () => { charW = 0; painted = ""; repaint(true); });
  document.addEventListener("scour-search-shown", () => { painted = ""; repaint(true); });
  document.fonts.ready.then(() => { charW = 0; painted = ""; repaint(true); });

  /* Only the newest answer may draw: they return out of order. */
  let generation = 0;
  /* The search this keystroke started, so the next one can let it go. */
  let typingSearch = null;
  let lastMeter = null;

  function render() {
    const text = q.value;
    /* Asked now: once the search lands, a re-sort looks like a new query. */
    const queryChanged = LIST.query !== text;
    /* Everything that depends only on the text happens at typing speed. */
    paint(text);
    refreshReading(text);
    showHints();
    syncHeads();

    /* One search in flight: a window is around a hundred kilobytes, and six
     * are parsed before `generation` discards them. `generation` stays — what
     * may draw is not what is worth finishing. */
    const mine = ++generation;
    if (typingSearch) typingSearch.abort();
    typingSearch = new AbortController();
    SERVICE.search(text, sortKey, sortDesc, WINDOW, 0, typingSearch.signal)
      .then((res) => {
        if (mine !== generation) return;   // a newer keystroke won
        /* Facets and an exact total belong to the set, not its order: a sort
           does not recount, so its floor would stick at `1000+`. */
        const keepExact = !queryChanged && LIST.exact && res.capped;
        LIST.query = text; LIST.sort = sortKey; LIST.desc = sortDesc;
        /* And so did the selection: a different query is different files. */
        if (queryChanged) clearSel();
        clearRows();
        for (const request of LIST.pending.values()) request.stop.abort();
        LIST.pending.clear();
        /* Before `putRows`: `clearRows` has just emptied `LIST.at`. */
        if (!keepExact) setTotal(res.total, !res.capped);
        LIST.since = Date.now();
        /* The first window, and the first word on what the rest would cost. */
        LIST.cost = res.took_us / 1000;
        /* Unstamped, `fillWindow` refetches window zero a frame later. */
        SHOWING = REV;
        const rows = res.rows.map(fromService);
        putRows(0, rows, false);
        keepWindow(0, SHOWING);
        scrollEl.scrollTop = 0;
        FILES = rows;
        lastMeter = res;
        /* The new rows and the old counts must not describe two sets. */
        if (queryChanged) markSidebarStale();
        draw(text, parse(text), FILES, res);
        /* Not on this keystroke, and not for a sort. See `sidebarSoon`. */
        if (queryChanged) {
          sidebarCost = 0;
          sidebarSoon();
        }
      })
      .catch((e) => {
        // Abandoned by the next keystroke, not a service that went away.
        if (e.name === "AbortError") return;
        if (mine !== generation) return;
        offline(e);
      });
  }

  /* Nothing below here learns where the rows came from. */
  function draw(text, p, hits, res) {
    now = Math.floor(Date.now() / 1000);

    /* The query changed, so the marked letters moved in every row. */
    for (const tr of pool) tr.__stamp = "";
    repaint(true);

    /* The query-scoped state, not this capped reply: a sort keeps the exact
       total the sidebar paid for. */
    const shown = LIST.exact ? fmt(LIST.total) : fmt(LIST.total) + "+";
    document.getElementById("count").textContent = withIndexTotal(shown);
    drawCost(res.took_us, res.rows_visited);

    syncFacets(p);
  }

  /* Kept, not only printed: a language switch rewrites both halves. */
  let LAST_COST = null;
  function drawCost(us, rowsVisited) {
    if (us !== undefined) LAST_COST = { us, rowsVisited };
    if (!LAST_COST) return;
    /* From `Intl`: a hand-written comma prints `0,29 ms` beside `4,864 rows`. */
    document.getElementById("ms").textContent = MS.format(LAST_COST.us / 1000) + " ms";
    document.getElementById("rows").textContent =
      T("{n} rows read", { n: fmt(LAST_COST.rowsVisited) });
  }

  /* Three views of the same rows, so one walk. They wait for the typing to
   * stop where the rows do not: a window is 7 to 13 ms, a sidebar 1,291 ms for
   * `r` against 29 ms for `rapor`, and the next wait is what this cost. */
  const sidebarSoon = afterQuiet(() => {
    /* Checked here: after the reply, the old walk has already been spent. */
    if (LIST.query !== null && LIST.query === q.value) sidebar(LIST.query);
  }, 220);

  let sidebarGeneration = 0;
  /* What the last one cost, so the live refresh can decline to repeat it. */
  let sidebarCost = 0;

  /* A rail answers what you would get instead, so counting it through its own
   * filter leaves one key and a column of zeros. Only its own terms come out,
   * matched by `field()`; null when there was nothing to take. */
  function without(text, names) {
    const toks = tokenise(text);
    const kept = toks.filter((tok) => {
      if (/^\s+$/.test(tok)) return true;
      const bare = tok.startsWith("!") ? tok.slice(1) : tok;
      const sp = fieldSplit(bare);
      const f = sp && field(sp[0]);
      return !(f && names.includes(f.name) && accepts(f, sp[1]));
    });
    /* By count, not by text: a dropped term leaves its space behind. */
    if (kept.length === toks.length) return null;
    return kept.join("").trim();
  }

  function sidebar(text) {
    /* Before the call: a stale answer costs CPU even unpainted. */
    if (text !== q.value) return Promise.resolve();
    const ours = ++sidebarGeneration;
    const began = Date.now();
    /* A stale walk must not poison the budget: broad queries finish late. */
    const charge = () => {
      if (ours === sidebarGeneration && text === q.value)
        sidebarCost = Date.now() - began;
    };
    /* A re-sort advances `generation` but does not change these counts. */
    const current = () => ours === sidebarGeneration && text === q.value;

    const forKind = without(text, ["kind"]);
    const forAge = without(text, ["dm"]);

    /* One request per distinct query, and every call keeps `by=kind,age`:
     * `NativeIndex::facets` scans unbounded only for an age band, so `by=kind`
     * alone samples 200,000 rows — images 1,430 against 210,551 exact. */
    const asked = new Map();
    const ask = (which) => {
      if (!asked.has(which)) asked.set(which, SERVICE.sidebar(which, BAR_EDGES));
      return asked.get(which);
    };
    const inForce = ask(text);
    const kindFrom = forKind === null ? inForce : ask(forKind);
    const ageFrom = forAge === null ? inForce : ask(forAge);

    const groupOf = (res, by) => (res.groups || []).find((g) => g.by === by);

    /* The total belongs to the query in force, or it says `2.238.902` over two
     * hundred thousand rows. Through `setTotal`, which drops stale rows. */
    const total = inForce.then((res) => {
      if (!current()) return;
      setTotal(res.total, !res.capped);
      repaint(true);
      const shown = res.capped ? fmt(res.total) + "+" : fmt(res.total);
      document.getElementById("count").textContent = withIndexTotal(shown);
    });

    /* Drawn as each answer lands: the slowest would hold the rail blank. */
    const kinds = kindFrom.then((res) => {
      if (!current()) return;
      const g = groupOf(res, "kind");
      if (!g) return;
      KIND_COUNTS = Object.fromEntries(g.facets.map((f) => [f.key, f.count]));
      sidebarSettled();
      syncFacets(parse(q.value));
    });

    const ages = ageFrom.then((res) => {
      if (!current()) return;
      const g = groupOf(res, "age");
      if (!g) return;
      const by = Object.fromEntries(g.facets.map((f) => [f.key, f.count]));
      const counts = BAR_EDGES.map((e) => by[String(e)] || 0).reverse();
      /* Older than the last edge belongs to the last bar: the scale ends
         at two years, the files do not. */
      counts[0] += by.older || 0;
      paintBars(counts, res.capped);
    });

    /* Charged for the whole set: one call is a third of the true price. */
    return Promise.all([total, kinds, ages]).then(charge, (e) => {
      charge();
      console.error("scour: sidebar did not draw:", e);
    });
  }

  /* Say so, rather than an empty list that reads as "nothing matched". */
  function offline(err) {
    /* The search's `catch` also catches anything the drawing throws. */
    console.error("scour:", err);
    LIST.query = null;
    clearSel();
    clearRows();
    for (const request of LIST.pending.values()) request.stop.abort();
    LIST.pending.clear();
    body.innerHTML = "";
    /* Which shows the message; the sentence under it says why. */
    setTotal(0, true);
    painted = "";
    repaint(true);
    document.getElementById("count").textContent = "—";
    document.getElementById("ms").textContent = "—";
    document.getElementById("rows").textContent =
      String(err.message || err).includes("403")
        ? T("connection refused — the key in the link is not this run's")
        : T("the service cannot be reached — is scourd running?");
  }


  /* Never drawn from the loaded rows: they are the two hundred newest matches,
   * so the chart would say "today" whatever was typed. The bands are sent
   * rather than assumed — the report wants six named periods. */
  const BAR_COUNT = 24;
  const BAR_SPAN_DAYS = 730;

  /* The upper edge of each bar, in days, logarithmic: a day, a week and a
     year all have room on one screen. */
  const BAR_EDGES = Array.from({ length: BAR_COUNT }, (_, i) =>
    Math.max(1, Math.round(((10 ** (1 - i / BAR_COUNT) - 1) / 9) * BAR_SPAN_DAYS))
  ).reverse();

  function paintBars(counts, capped) {
    const max = Math.max(1, ...counts);
    const edges = [...BAR_EDGES].reverse();
    bars.innerHTML = counts.map((v, i) => {
      const h = v === 0 ? 2 : Math.max(4, Math.round((v / max) * 46));
      const days = edges[i];
      const oldest = i === 0;
      const c = v === 0 ? "--line" : bandOf(now - days * DAY);
      /* The oldest bar has no upper bound: `dm:730d` would be everything. */
      const span = oldest
        ? T("older than {days} days", { days })
        : T("up to {days} days", { days });
      const title = T("{n} results · {span}", { n: fmt(v), span })
        + (capped ? T(" (sampled)") : "");
      const label = oldest
        ? T("{n} results, older than {days} days", { n: v, days })
        : T("{n} results, the last {days} days", { n: v, days });
      return `<button type="button" ${oldest ? "" : `data-days="${days}"`}
                title="${escape_(title)}"
                aria-label="${escape_(label)}">
                <i style="height:${h}px;background:var(${c})"></i></button>`;
    }).join("");
  }

  function facetRow(label, term, count, share, on) {
    const fill = share > 0
      ? `<span class="fill" style="width:${(share * 100).toFixed(1)}%"></span>` : "";
    return `<button class="facet${share > 0 ? " bar" : ""}" type="button"
        data-term="${term}" aria-pressed="${on}">${fill}
      ${share > 0 ? "" : `<span class="dot"></span>`}
      <span class="nm">${label}</span><span class="ct">${count === null || count === undefined ? "" : fmt(count)}</span></button>`;
  }

  /* By kind token, under the query with its `kind:` term taken out, so a row
     can read more than the list is showing. */
  let KIND_COUNTS = null;

  /* Dimmed rather than blanked: a zero reads as an answer, and the gap is
   * 247 ms for a kind and 556 ms for an age band. */
  function markSidebarStale() {
    /* Nothing to dim on the first query: the rail is an honest blank. */
    if (KIND_COUNTS === null) return;
    document.querySelector(".rail").classList.add("settling");
  }

  function sidebarSettled() {
    document.querySelector(".rail").classList.remove("settling");
  }

  function syncFacets(p) {
    const count = ([, key]) => (KIND_COUNTS ? (KIND_COUNTS[key] || 0) : null);
    const top = Math.max(1, ...KINDS.map((r) => count(r) || 0));
    document.getElementById("kinds").innerHTML =
      KINDS.map((row) => {
        const [tr, key] = row;
        const n = count(row);
        return facetRow(tr, "kind:" + key, n, n === null ? 0 : n / top, p.kind === key);
      }).join("");
    document.getElementById("scopes").innerHTML =
      SCOPES.map(([tr, path, n]) => facetRow(tr, "under:" + path, n, 0, p.under === path)).join("");
    document.getElementById("sizes").innerHTML =
      SIZES.map(([tr, v, n]) => facetRow(tr, "size:" + v, n, 0, p.size === v)).join("");
  }

  /* Which columns are shown and how wide is the service's, keyed by column id.
   * `table-layout: fixed` is what makes a width mean anything. `key` is what
   * the engine sorts by; `write` sets text on a cell that exists. */
  const writeText = (td, f, cls, get) => {
    if (td.className !== cls) td.className = cls;
    const v = get(f);
    if (td.textContent !== v) td.textContent = v;
  };
  const cell = (cls, get) => (td, f) => writeText(td, f, cls, get);

  /* `msgid`, translated at draw time. `id` keys the settings, `key` sorts. */
  const COLUMNS = [
    { id: "name",  msgid: "Name",      key: "name",  w: 240, min: 110, near: 52, far: 30, max: 520,
      write: (td, f, p) => {
        if (td.className !== "name") td.className = "name";
        writeName(td, f, p.text);
      } },
    { id: "path",  msgid: "Location",  key: "path",  w: 320, min: 120, near: 48, far: 70, max: 0,
      write: (td, f) => {
        if (td.className !== "") td.className = "";
        let div = td.firstElementChild;
        if (!div || div.className !== "path") {
          td.textContent = "";
          div = document.createElement("div");
          div.className = "path";
          td.appendChild(div);
        }
        const v = HOME && f.path.startsWith(HOME + "/") ? "~" + f.path.slice(HOME.length) : f.path;
        if (div.textContent !== v) div.textContent = v;
      } },
    /* A folder's number is what the index holds under it, so it carries a `~`
     * — every folder, since nothing knows which hide nothing without a walk. */
    { id: "size",  msgid: "Size",      key: "size",  w: 90, min: 68, near: 0, far: 0, max: 0,  num: true,
      write: (td, f) => {
        cell("n", (x) => (x.is_dir
          ? (x.under ? "~" + bytes(x.under.disk) : "")
          : bytes(x.size)))(td, f);
        const t = f.is_dir && f.under
          ? T("indexed size · {n} files", { n: fmt(f.under.files) })
            + "\n"
            + T("what is excluded (target, node_modules…) is not counted — see the settings")
          : "";
        if (td.title !== t) td.title = t;
      } },
    { id: "mtime", msgid: "Modified",  key: "modified", w: 120, min: 100, near: 0, far: 0, max: 0,
      write: (td, f) => {
        cell("n left", (x) => ago(x.mtime))(td, f);
        td.style.color = `var(${bandOf(f.mtime)})`;
        const t = exact(f.mtime);
        if (td.title !== t) td.title = t;
      } },
    { id: "kind",  msgid: "Kind",      key: "kind",  w: 110, min: 68, near: 0, far: 0, max: 0,
      write: cell("kind", (f) => f.kind || "") },
    { id: "ext",   msgid: "Extension", key: "ext",   w: 80, min: 56, near: 0, far: 0, max: 0,
      write: cell("kind", (f) => f.ext || "") },
    { id: "ctime", msgid: "Created",   key: "created", w: 120, min: 100, near: 0, far: 0, max: 0,
      write: (td, f) => {
        cell("n left", (x) => (x.ctime ? ago(x.ctime) : ""))(td, f);
        const t = exact(f.ctime);
        if (td.title !== t) td.title = t;
      } },
    /* A dash where nothing is recorded, checked against the mounts: one
     * volume can be `relatime` and another `noatime`. */
    { id: "atime", msgid: "Accessed",  key: "accessed", w: 120, min: 100, near: 0, far: 0, max: 0,
      write: (td, f) => {
        const dead = frozenAtime(f);
        cell("n left", (x) => (dead ? "—" : x.atime ? ago(x.atime) : ""))(td, f);
        // One literal, not two joined: the msgid is the catalogue's key.
        const t = dead
          ? T("this volume does not record reads (noatime) — the number shown would be left over from when the file was created")
          : exact(f.atime);
        if (td.title !== t) td.title = t;
        td.style.color = dead ? "var(--ink-3)" : "";
      } },
    { id: "perm",  msgid: "Mode",      key: "mode",  w: 108, min: 92, near: 0, far: 0, max: 0,
      write: cell("mono", (f) => f.perm || "") },
    { id: "user",  msgid: "Owner",     key: "uid",   w: 100, min: 72, near: 0, far: 0, max: 0,
      write: cell("mono", (f) => f.user || "") },
    { id: "group", msgid: "Group",     key: "gid",   w: 100, min: 72, near: 0, far: 0, max: 0,
      write: cell("mono", (f) => f.group || "") },
    { id: "disk",  msgid: "On disk",   key: "disk",  w: 90, min: 68, near: 0, far: 0, max: 0, num: true,
      write: cell("n", (f) => (f.disk > 0 ? bytes(f.disk) : "")) },
  ];
  const COL_DEFAULT = ["name", "path", "size", "mtime", "kind"];

  /* The service holds these; defaults until its reply. See `applySettings`. */
  let SHOWN = COL_DEFAULT.slice();
  const shownColumns = () => SHOWN.map((id) => COLUMNS.find((c) => c.id === id)).filter(Boolean);

  /* Keyed by column id, never by the sort key: they differ for five columns. */
  let WIDTHS = {};

  /* Under `table-layout: fixed` an unspecified column is the first thing a
   * browser takes space from, and at 900px that left the name at zero. The
   * moves are `scour_ui::lay_out`'s, integer at every step. */
  /* `scour_ui::NARROW` and `WIDE`; the test below fails if they drift. */
  const NARROW = 700, WIDE = 1900;

  /* A column's share of the stretching room, in parts per thousand, integer
     the whole way as Rust is. */
  function shareAt(c, avail) {
    const t = avail <= NARROW ? 0
      : avail >= WIDE ? 1000
      : Math.floor(((avail - NARROW) * 1000) / (WIDE - NARROW));
    return Math.floor((c.near * 10 * (1000 - t) + c.far * 10 * t) / 1000);
  }

  /* A wish, not a lock: it gives way, but never below its untouched share. */
  const DRAG_CAP = 450;

  function layOut(cols, room) {
    const chosen = cols.map((c) => !!WIDTHS[c.id]);
    const base = cols.map((c, i) =>
      Math.max(c.min, (chosen[i] ? WIDTHS[c.id] : 0) || c.w || 120));
    /* Only the columns that never stretch come off the top. */
    let taken = 0;
    cols.forEach((c, i) => { if (!c.near) taken += base[i]; });
    const budget = Math.max(0, room - taken);

    const w = base.slice();
    const stretchy = [];
    cols.forEach((c, i) => { if (c.near > 0) stretchy.push(i); });
    let handed = 0;
    stretchy.forEach((i, n) => {
      let want;
      if (chosen[i]) {
        const fair = Math.max(shareAt(cols[i], room), DRAG_CAP);
        want = Math.min(WIDTHS[cols[i].id], Math.floor((budget * fair) / 1000));
      } else if (n + 1 === stretchy.length) {
        /* The last takes what the others left, however they rounded. */
        want = Math.max(0, budget - handed);
      } else {
        want = Math.floor((budget * shareAt(cols[i], room)) / 1000);
      }
      handed += want;
      w[i] = Math.max(want, cols[i].min);
      if (cols[i].max) w[i] = Math.max(Math.min(w[i], cols[i].max), cols[i].min);
    });

    const sum = w.reduce((a, b) => a + b, 0);
    if (sum < room) shareOut(cols, chosen, w, room - sum);
    else if (sum > room) { takeBack(cols, w, sum - room); squash(w, room); }
    return w;
  }

  /* Move 4, when even the floors do not fit: every column gives way at once,
     which leaves each one visible and its edge reachable. */
  function squash(w, room) {
    const sum = w.reduce((a, b) => a + b, 0);
    if (sum <= room || !sum || room < w.length) return;
    /* The widest takes the rounding: a pixel matters least to it. */
    let widest = 0;
    for (let i = 1; i < w.length; i++) if (w[i] > w[widest]) widest = i;
    let spent = 0;
    for (let i = 0; i < w.length; i++) {
      if (i === widest) continue;
      w[i] = Math.max(1, Math.floor((w[i] * room) / sum));
      spent += w[i];
    }
    w[widest] = Math.max(1, room - spent);
  }

  /* Move 2: hand out the spare, a column at its ceiling dropping out. */
  function shareOut(cols, chosen, w, spare) {
    let left = spare;
    for (;;) {
      const open = [];
      for (let i = 0; i < cols.length; i++) {
        if (!chosen[i] && cols[i].near > 0 && (!cols[i].max || w[i] < cols[i].max)) open.push(i);
      }
      const weight = open.reduce((a, i) => a + Math.max(1, cols[i].far), 0);
      if (!left || !weight) return;
      let spent = 0;
      open.forEach((i, n) => {
        /* The last takes the rounding, or a hairline moves with the window. */
        const share = n + 1 === open.length
          ? left - spent
          : Math.floor((left * Math.max(1, cols[i].far)) / weight);
        const before = w[i];
        const want = before + share;
        w[i] = cols[i].max ? Math.min(want, cols[i].max) : want;
        spent += w[i] - before;
      });
      if (!spent) return;
      left -= spent;
    }
  }

  /* Move 3: take back what does not fit, in proportion to the room each
     column has above its floor. */
  function takeBack(cols, w, over) {
    let left = over;
    for (;;) {
      const open = [];
      for (let i = 0; i < cols.length; i++) if (w[i] > cols[i].min) open.push(i);
      const room = open.reduce((a, i) => a + (w[i] - cols[i].min), 0);
      /* Every column is on its floor: `.scroll` scrolls sideways from here. */
      if (!left || !room) return;
      const take = Math.min(left, room);
      let taken = 0;
      open.forEach((i, n) => {
        const want = n + 1 === open.length
          ? take - taken
          : Math.floor((take * (w[i] - cols[i].min)) / room);
        const share = Math.min(want, w[i] - cols[i].min);
        w[i] -= share;
        taken += share;
      });
      if (!taken) return;
      left -= taken;
    }
  }

  function applyWidths() {
    const table = document.querySelector(".results table");
    /* A grid has no columns to be wide: a declared `min-width` is a sideways
       scrollbar over tiles that fit. `WIDTHS` is untouched. */
    if (grid()) {
      for (const th of document.querySelectorAll("thead th[data-col]")) {
        th.style.width = "";
      }
      if (table) table.style.minWidth = "";
      return;
    }
    const heads = [...document.querySelectorAll("thead th[data-col]")];
    if (!heads.length) return;
    /* The mark column and the picker come out of the room first. */
    const FURNITURE = 30 + 30;
    /* `clientWidth`: `offsetWidth` still counts the scrollbar's lane. */
    const room = Math.max(0, (scrollEl ? scrollEl.clientWidth : 0) - FURNITURE);
    const cols = heads.map((th) => COLUMNS.find((c) => c.id === th.dataset.col));
    if (cols.some((c) => !c)) return;
    const w = layOut(cols, room);
    let sum = FURNITURE;
    heads.forEach((th, i) => {
      th.style.width = w[i] + "px";
      sum += w[i];
    });
    /* Only when the floors do not fit does this exceed the room. */
    if (table) table.style.minWidth = sum + "px";
  }


  /* The room changes for more than a resize, so the observer watches the box
     the columns divide up — guarded, since `applyWidths` writes inside it. */
  let lastRoom = -1;
  if (scrollEl && typeof ResizeObserver === "function") {
    new ResizeObserver(() => {
      const room = scrollEl.clientWidth;
      if (room === lastRoom) return;
      lastRoom = room;
      applyWidths();
    }).observe(scrollEl);
  }

  /* What changed and nothing else, so an unknown field survives a save
   * (`scour_settings::Change`). Debounced: one gesture is one write. */
  let pending = {};
  let keepTimer = null;
  function keep(change) {
    Object.assign(pending, change || {});
    clearTimeout(keepTimer);
    keepTimer = setTimeout(() => {
      const change = pending;
      pending = {};
      if (Object.keys(change).length) SERVICE.saveSettings(change);
    }, 250);
  }

  /* What no other frontend can act on. Merged key by key under `web`. */
  const keepView = (patch) => keep({ view: { web: patch } });

  /* Applied to a window that has already drawn itself with defaults. */
  function applySettings(s) {
    const oldSort = sortKey;
    const oldDescending = sortDesc;
    if (Array.isArray(s.columns) && s.columns.length) {
      const ok = s.columns.filter((id) => COLUMNS.some((c) => c.id === id));
      if (ok.length) SHOWN = ok;
    }
    if (s.widths && typeof s.widths === "object") WIDTHS = { ...s.widths };
    /* Against the column keys, the protocol's own words, so another face's
       settings file is accepted. */
    if (s.sort && COLUMNS.some((c) => c.key === s.sort)) sortKey = s.sort;
    if (typeof s.descending === "boolean") sortDesc = s.descending;
    HISTORY = Array.isArray(s.history) ? s.history : [];
    DUPES_OPEN = !!s.dupes_open;
    /* A shared field: pinning the panel open is not about this face. */
    if (s.preview) setPeek(true, false);
    peekToggle.setAttribute("aria-pressed", s.preview ? "true" : "false");
    VIEW = (s.view && s.view.web) || {};
    applyView();
    showPastAffordance();
    buildHeads();
    applyWidths();
    /* From the top of the settings, not `view.web`, and after the headings,
       whose widths it decides. An empty string means nobody has chosen. */
    if (typeof s.layout === "string" && MODES.includes(s.layout)) applyMode(s.layout);
    /* The list started with the defaults, so only a new ordering re-searches. */
    if (sortKey !== oldSort || sortDesc !== oldDescending) render();
  }

  /* Held, because both closures want it and only one owns the transport. */
  let VIEW = {};
  /* Shared: a duplicate hunt on opening the report means the same everywhere. */
  let DUPES_OPEN = false;

  /* Past queries, newest first, added to only when a search was meant. */
  let HISTORY = [];

  function saveWidths() {
    keep({ widths: WIDTHS });
  }

  /* The heading row. The sort arrow and the grip are added by their owners. */
  function buildHeads() {
    const row = document.getElementById("heads");
    const cols = shownColumns();
    /* Kept, not rebuilt: an `innerHTML` over the glyph switch loses its
       listener. */
    const mark = document.getElementById("markhead");
    mark.remove();
    row.innerHTML =
      cols
        .map(
          (c) =>
            `<th data-col="${c.id}"${c.key ? ` data-sort="${c.key}"` : ""}` +
            `${c.num ? ' class="num"' : ""}` +
            `${c.key ? "" : ` title="${escape_(T("this column cannot be sorted by"))}"`}>` +
            `${escape_(T(c.msgid))}</th>`
        )
        .join("") +
      `<th class="pick"><button type="button" id="pick" title="${escape_(T("columns"))}"
         aria-label="${escape_(T("choose the columns"))}">⋮</button></th>`;
    // Before the numbering below, which counts across the row.
    row.prepend(mark);
    /* Numbered downwards: each sticky heading is its own stacking context and
     * the grip hangs four pixels into the next column. */
    [...row.querySelectorAll("th")].forEach((th, i) => {
      th.style.zIndex = String(40 - i);
    });
    fitGrips();
    applyWidths();
    syncHeads();
    /* A reorder keeps the cell count, so the shape check will not rebuild. */
    for (const tr of pool) tr.__stamp = "";
    painted = "";
    repaint(true);
  }

  function columnMenu() {
    const menu = document.createElement("div");
    menu.className = "rowmenu cols";
    menu.innerHTML = COLUMNS.map((c) => {
      const on = SHOWN.includes(c.id);
      const locked = on && SHOWN.length === 1;
      return `<button type="button" data-col="${c.id}"${locked ? " disabled" : ""}>
        <span class="tick">${on ? "✓" : ""}</span>${escape_(T(c.msgid))}</button>`;
    }).join("")
      + `<button type="button" data-col="" class="reset">${escape_(T("Back to the default"))}</button>`;
    return menu;
  }

  function fitGrips() {
    const heads = [...document.querySelectorAll("thead th[data-sort]")];
    heads.forEach((th, i) => {
      const last = i === heads.length - 1;
      const has = th.querySelector(".grip");
      if (last) { if (has) has.remove(); return; }
      if (has) return;
      const g = document.createElement("span");
      g.className = "grip";
      g.title = T("drag · double-click to reset");
      th.appendChild(g);
    });
  }

  document.querySelector("thead").addEventListener("pointerdown", (e) => {
    const grip = e.target.closest(".grip");
    if (!grip) return;
    e.preventDefault();
    e.stopPropagation();          // not a click on the heading, so no sort
    const th = grip.closest("th");
    const startX = e.clientX;
    const startW = th.getBoundingClientRect().width;
    grip.classList.add("dragging");
    document.body.classList.add("resizing");
    grip.setPointerCapture(e.pointerId);

    const move = (ev) => {
      /* This column's own floor: a flat 56px is under what a date needs. */
      const floor = (COLUMNS.find((c) => c.id === th.dataset.col) || {}).min || 56;
      const w = Math.max(floor, Math.round(startW + ev.clientX - startX));
      WIDTHS[th.dataset.col] = w;
      // Through `applyWidths`, so the table's minimum grows with the drag.
      applyWidths();
    };
    const up = () => {
      grip.classList.remove("dragging");
      document.body.classList.remove("resizing");
      grip.removeEventListener("pointermove", move);
      grip.removeEventListener("pointerup", up);
      saveWidths();
      painted = "";
      repaint(true);
    };
    grip.addEventListener("pointermove", move);
    grip.addEventListener("pointerup", up);
  });

  document.querySelector("thead").addEventListener("dblclick", (e) => {
    const grip = e.target.closest(".grip");
    if (!grip) return;
    e.preventDefault();
    e.stopPropagation();
    delete WIDTHS[grip.closest("th").dataset.col];
    applyWidths();
    saveWidths();
    painted = "";
    repaint(true);
  });

  function syncHeads() {
    document.querySelectorAll("thead th[data-sort]").forEach((th) => {
      const on = th.dataset.sort === sortKey;
      th.setAttribute("aria-sort", on ? (sortDesc ? "descending" : "ascending") : "none");
      // The grip is not part of the label and must survive being relabelled.
      const grip = th.querySelector(".grip");
      const label = (th.dataset.label ||= th.textContent.replace(/[▾▴]\s*$/, "").trim());
      th.innerHTML = label + (on ? ` <span class="arrow">${sortDesc ? "▾" : "▴"}</span>` : "");
      if (grip) th.appendChild(grip);
    });
  }

  // Clicking a filter adds the term to the *text*, not to hidden state.
  function toggleTerm(term) {
    const parts = q.value.trim().split(/\s+/).filter(Boolean);
    /* A question about the field, not its spelling: `tur:image` and
     * `kind:image` left as two terms match no file at all. */
    const mine = term.slice(0, Math.max(0, term.indexOf(":")));
    const want = field(mine);
    const at = parts.findIndex((t) => {
      const i = t.indexOf(":");
      if (i < 0) return false;
      const his = t.slice(0, i);
      const f = want && field(his);
      return f ? f === want : his === mine;
    });
    if (at >= 0 && parts[at] === term) parts.splice(at, 1);
    else if (at >= 0) parts[at] = term;
    else parts.push(term);
    q.value = parts.join(" ");
    render();
    q.focus();
  }

  document.querySelector(".rail").addEventListener("click", (e) => {
    const b = e.target.closest(".facet");
    if (b) toggleTerm(b.dataset.term);
  });
  bars.addEventListener("click", (e) => {
    const b = e.target.closest("button");
    if (b) toggleTerm("dm:" + b.dataset.days + "d");
  });
  document.querySelector("thead").addEventListener("click", (e) => {
    const th = e.target.closest("th[data-sort]");
    if (!th) return;
    // A heading just carried is not one clicked, or a reorder also sorts.
    if (justMoved) return;
    if (sortKey === th.dataset.sort) sortDesc = !sortDesc;
    else { sortKey = th.dataset.sort; sortDesc = th.dataset.sort === "modified" || th.dataset.sort === "size"; }
    keep({ sort: sortKey, descending: sortDesc });
    render();
  });

  /* One pointer, three things, told apart by where and how far: the last nine
   * pixels resize, a press under `DRAG_SLOP` sorts, anything else carries. */
  const DRAG_SLOP = 5;
  let moving = null;      /* the heading being carried */
  let movingFrom = 0;     /* where the press started, in page pixels */
  let dropAt = -1;        /* the gap it would fall into, as an index */
  let justMoved = false;  /* so the click that follows a carry does not sort */

  const dropLine = document.createElement("div");
  dropLine.className = "dropline";
  dropLine.hidden = true;
  document.querySelector(".results .scroll").appendChild(dropLine);

  const headCells = () =>
    [...document.querySelectorAll("#view-search thead th[data-col]")];

  function showDrop(x) {
    const cells = headCells();
    let at = cells.length;
    for (let i = 0; i < cells.length; i++) {
      const r = cells[i].getBoundingClientRect();
      if (x < r.left + r.width / 2) { at = i; break; }
    }
    dropAt = at;
    /* Against the scroller it is drawn inside, for a sideways-scrolled list. */
    const host = document.querySelector(".results .scroll").getBoundingClientRect();
    const edge = at < cells.length
      ? cells[at].getBoundingClientRect().left
      : cells[cells.length - 1].getBoundingClientRect().right;
    dropLine.style.left = Math.round(edge - host.left +
      document.querySelector(".results .scroll").scrollLeft) + "px";
    dropLine.hidden = false;
  }

  document.querySelector("thead").addEventListener("pointerdown", (e) => {
    if (e.target.closest(".grip")) return;        /* that press is a resize */
    const th = e.target.closest("th[data-col]");
    if (!th) return;
    moving = th;
    movingFrom = e.clientX;
    dropAt = -1;
    justMoved = false;
    th.setPointerCapture(e.pointerId);
  });

  document.querySelector("thead").addEventListener("pointermove", (e) => {
    if (!moving) return;
    if (!justMoved && Math.abs(e.clientX - movingFrom) < DRAG_SLOP) return;
    if (!justMoved) {
      justMoved = true;
      moving.classList.add("moving");
      document.body.classList.add("moving-col");
    }
    showDrop(e.clientX);
  });

  const endMove = () => {
    if (!moving) return;
    const th = moving;
    moving = null;
    dropLine.hidden = true;
    th.classList.remove("moving");
    document.body.classList.remove("moving-col");
    if (justMoved && dropAt >= 0) {
      const from = SHOWN.indexOf(th.dataset.col);
      // Taking it out shifts everything after it one place left.
      let to = dropAt > from ? dropAt - 1 : dropAt;
      if (from >= 0 && to !== from) {
        const [id] = SHOWN.splice(from, 1);
        SHOWN.splice(to, 0, id);
        keep({ columns: SHOWN });
        buildHeads();
      }
    }
    /* Cleared after the click this press produces, not before it. */
    setTimeout(() => { justMoved = false; }, 0);
  };
  document.querySelector("thead").addEventListener("pointerup", endMove);
  document.querySelector("thead").addEventListener("pointercancel", endMove);
  /* The box never edits what is being typed: a caret that moves reads as a
   * fault, and the engine reads both spellings alike. */
  q.addEventListener("input", render);
  // The offer depends on where the caret is, not on what was last typed.
  q.addEventListener("click", () => { paint(q.value); showHints(); });
  q.addEventListener("focus", () => paint(q.value));
  q.addEventListener("blur", () => paint(q.value));
  document.addEventListener("selectionchange", () => {
    if (document.activeElement === q) paint(q.value);
  });
  q.addEventListener("keyup", (e) => {
    if (e.key.startsWith("Arrow") && hintBox.hidden) showHints();
  });
  q.addEventListener("scroll", () => { shadow.scrollLeft = q.scrollLeft; });

  /* A browser cannot open a local file, so the bridge asks the desktop. Both
   * fences are the bridge's — the path must be one the index holds, and
   * anything runnable has its folder revealed instead. */
  async function launch(path, what) {
    // Opening a result belongs in the history even without an Enter.
    remember(q.value);
    try {
      const q = new URLSearchParams({ path, what: what || "file", t: TOKEN });
      const r = await fetch(`/api/open?${q}`, { method: "POST" });
      const j = await r.json();
      if (j.error) { flash(j.error); return; }
      if (j.instead) flash(j.instead);
    } catch (e) { flash(T("could not open: {why}", { why: e.message || e })); }
  }

  let flashTimer = null;
  function flash(text) {
    const el = document.getElementById("rows");
    if (!el) return;
    el.dataset.was = el.dataset.was || el.textContent;
    el.textContent = text;
    clearTimeout(flashTimer);
    flashTimer = setTimeout(() => {
      el.textContent = el.dataset.was || "";
      delete el.dataset.was;
    }, 4000);
  }


  /* Choosing columns. The list is stored beside the widths, by the service. */
  let colMenu = null;
  document.addEventListener("click", (e) => {
    const opener = e.target.closest("#pick");
    if (colMenu && !e.target.closest(".cols")) {
      colMenu.remove();
      colMenu = null;
      if (!opener) return;
    }
    if (!opener) return;
    colMenu = columnMenu();
    document.body.appendChild(colMenu);
    const r = opener.getBoundingClientRect();
    const m = colMenu.getBoundingClientRect();
    colMenu.style.left = Math.max(8, Math.min(r.left, innerWidth - m.width - 8)) + "px";
    colMenu.style.top = Math.min(r.bottom + 4, innerHeight - m.height - 8) + "px";
    colMenu.addEventListener("click", (ev) => {
      const b = ev.target.closest("[data-col]");
      if (!b || b.disabled) return;
      const id = b.dataset.col;
      if (id === "") {
        SHOWN = COL_DEFAULT.slice();
      } else if (SHOWN.includes(id)) {
        SHOWN = SHOWN.filter((x) => x !== id);
      } else {
        /* Into the table's own order, without rearranging what is shown. */
        const rank = (x) => COLUMNS.findIndex((c) => c.id === x);
        const at = SHOWN.findIndex((x) => rank(x) > rank(id));
        if (at < 0) SHOWN = [...SHOWN, id];
        else SHOWN = [...SHOWN.slice(0, at), id, ...SHOWN.slice(at)];
      }
      keep({ columns: SHOWN });
      buildHeads();
      colMenu.remove();
      colMenu = null;
    });
  });

  const pathOf = (tr) => tr && tr.dataset && tr.dataset.path;

  /* Keyed by path, not position: the list is sorted by time, so positions
   * move. `Ctrl+A` takes the windows that have arrived, and no more. */
  const selbar = document.getElementById("selbar");
  /* path -> the row: the bar adds up sizes, the menu asks what a row is. */
  const SEL = new Map();
  /* Where a shift-range measures from: an index in the current ordering. */
  let selAnchor = null;

  function clearSel() {
    if (!SEL.size) return;
    SEL.clear();
    selAnchor = null;
    paintSelection();
    drawSelBar();
  }

  function pickRow(tr, keep) {
    const p = pathOf(tr);
    if (!p) return;
    if (!keep) SEL.clear();
    if (keep && SEL.has(p)) SEL.delete(p);
    else SEL.set(p, tr.__row);
  }

  /* Every row between two positions; unfetched rows cannot be selected, so
   * the bar counts what was taken and not the range. */
  function selectRange(a, b) {
    const [lo, hi] = a <= b ? [a, b] : [b, a];
    for (let i = lo; i <= hi; i++) {
      const f = LIST.rows.get(i);
      if (f) SEL.set(f.path + "/" + f.name, f);
    }
  }

  /* After every paint, never inside `writeRow`: it returns early when only
   * the selection changed, and assigns `className` outright. */
  function paintSelection() {
    for (const tr of body.querySelectorAll("tr[data-path]")) {
      tr.classList.toggle("sel", SEL.has(tr.dataset.path));
    }
  }

  function drawSelBar() {
    const n = SEL.size;
    selbar.hidden = n === 0;
    if (!n) return;
    let total = 0;
    let dirs = 0;
    for (const f of SEL.values()) {
      if (!f) continue;
      if (f.is_dir) dirs++;
      else total += f.size > 0 ? f.size : 0;
    }
    /* Folders are counted, not weighed. The count sits inside the msgid with
       its markup, because a language need not put the number first. */
    const parts = [T('<span class="n">{n}</span> selected', { n: fmt(n) })];
    if (n - dirs > 0) parts.push(`<span class="sum">${bytes(total)}</span>`);
    if (dirs) parts.push(T('<span class="sum">{n} folders</span>', { n: fmt(dirs) }));
    const nFolders = foldersOf().length;
    selbar.innerHTML =
      parts.join(' <span class="sum">·</span> ') +
      `<span class="grow"></span>` +
      `<button type="button" data-sel="copy">${escape_(T("Copy the paths"))}</button>` +
      `<button type="button" data-sel="folder"${asking ? ' class="asking"' : ""}>` +
      escape_(asking
        ? T("Open {n} windows?", { n: fmt(nFolders) })
        : T("Open their folders ({n})", { n: fmt(nFolders) })) +
      `</button>` +
      `<button type="button" data-sel="clear">${escape_(T("Drop it"))}</button>`;
  }

  /* The folders a selection sits in: eleven files there are one window. */
  const foldersOf = () => [...new Set([...SEL.values()].filter(Boolean).map((f) => f.path))];

  /* Asked about past a handful, and always on the bar's own button: a menu
   * closes when clicked and has nowhere to put a question. */
  const OPEN_MANY = 5;
  let asking = false;
  let askTimer = null;

  function askFolders() {
    asking = true;
    drawSelBar();
    clearTimeout(askTimer);
    // The question expires, or the button surprises the next press.
    askTimer = setTimeout(() => { asking = false; drawSelBar(); }, 5000);
  }

  function openFolders() {
    const dirs = foldersOf();
    if (dirs.length > OPEN_MANY && !asking) { askFolders(); return; }
    asking = false;
    clearTimeout(askTimer);
    for (const d of dirs) launch(d, "folder");
    drawSelBar();
  }

  function copySelected() {
    const text = [...SEL.keys()].join("\n");
    navigator.clipboard.writeText(text).then(
      () => flash(T("{n} paths copied", { n: fmt(SEL.size) })),
      () => flash(T("could not copy")));
  }

  selbar.addEventListener("click", (e) => {
    const btn = e.target.closest("button[data-sel]");
    if (!btn) return;
    if (btn.dataset.sel === "clear") clearSel();
    else if (btn.dataset.sel === "copy") copySelected();
    else openFolders();
  });

  /* Clicking picks. Plain replaces, `Ctrl` adds one, `Shift` takes the run. */
  body.addEventListener("click", (e) => {
    const tr = e.target.closest("tr[data-path]");
    if (!tr) { return; }
    const i = Number(tr.dataset.i);
    if (e.shiftKey && selAnchor !== null && Number.isFinite(i)) {
      SEL.clear();
      selectRange(selAnchor, i);
    } else if (e.ctrlKey || e.metaKey) {
      pickRow(tr, true);
      selAnchor = i;
    } else {
      pickRow(tr, false);
      selAnchor = i;
    }
    paintSelection();
    drawSelBar();
  });

  body.addEventListener("keydown", (e) => {
    if ((e.ctrlKey || e.metaKey) && (e.key === "a" || e.key === "A")) {
      e.preventDefault();
      SEL.clear();
      for (const [, f] of LIST.rows) SEL.set(f.path + "/" + f.name, f);
      paintSelection();
      drawSelBar();
      return;
    }
    if (e.key === "Escape" && SEL.size) { e.preventDefault(); clearSel(); }
  });

  /* The column decides: the name is the file, the location its folder. */
  body.addEventListener("dblclick", (e) => {
    const p = pathOf(e.target.closest("tr"));
    if (!p) return;
    const cell = e.target.closest("td");
    const onPath = !!cell && !!cell.querySelector(".path");
    launch(p, onPath ? "folder" : "file");
  });
  body.addEventListener("keydown", (e) => {
    const row = e.target.closest("tr");
    if (!row) return;
    /* A screenful at a time: the rows are virtual, so these move the
       scroller and let the list draw what lands. */
    if (e.key === "PageDown" || e.key === "PageUp" || e.key === "Home" || e.key === "End") {
      e.preventDefault();
      const screenful = scrollEl.clientHeight - ROW_H;
      if (e.key === "Home") scrollEl.scrollTop = 0;
      else if (e.key === "End") scrollEl.scrollTop = scrollEl.scrollHeight;
      else scrollEl.scrollTop += e.key === "PageDown" ? screenful : -screenful;
      return;
    }
    if (e.key === "ArrowDown" || e.key === "ArrowUp") {
      e.preventDefault();
      const rows = [...body.querySelectorAll("tr[data-path]")];
      const at = rows.indexOf(row);
      const next = rows[at + (e.key === "ArrowDown" ? 1 : -1)];
      if (next) {
        /* The anchor is where the walk began, so reversing gives rows back. */
        if (e.shiftKey) {
          const i = Number(next.dataset.i);
          if (selAnchor === null) selAnchor = Number(row.dataset.i);
          if (Number.isFinite(i) && selAnchor !== null) {
            SEL.clear();
            selectRange(selAnchor, i);
            paintSelection();
            drawSelBar();
          }
        }
        next.focus();
        // `nearest` leaves the list still when the row is already on screen.
        next.scrollIntoView({ block: "nearest" });
      } else if (e.key === "ArrowUp") {
        // Off the top is back to the query.
        q.focus();
      }
      return;
    }
    if (e.key !== "Enter") return;
    const p = pathOf(row);
    if (p) { e.preventDefault(); launch(p, e.shiftKey ? "folder" : "file"); }
  });

  /* The right-click menu. Built per press from `MENU`. */
  const menu = document.createElement("div");
  menu.className = "rowmenu";
  menu.hidden = true;
  document.body.appendChild(menu);

  body.addEventListener("contextmenu", (e) => {
    const tr = e.target.closest("tr");
    const p = pathOf(tr);
    if (!p) return;
    e.preventDefault();
    /* Right-clicking outside the selection selects what was clicked. */
    if (!SEL.has(p)) {
      pickRow(tr, false);
      selAnchor = Number(tr.dataset.i);
      paintSelection();
      drawSelBar();
    }
    const many = SEL.size > 1;
    const dir = !!(tr.__row && tr.__row.is_dir);
    /* Built from `MENU`; the count goes in through the catalogue's `{n}`. */
    const shape = (w) => (w === "many" ? many
                        : w === "one" ? !many
                        : w === "file" ? (!many && !dir)
                        : (!many && dir));
    let html = "", last = null;
    for (const it of MENU) {
      if (!shape(it.when)) continue;
      if (last !== null && it.group !== last) html += '<div class="mline"></div>';
      last = it.group;
      const label = escape_(T(it.msgid, { n: fmt(SEL.size || 1) }));
      const key = it.key ? `<span class="mkey">${escape_(it.key)}</span>` : "";
      html += `<button type="button" data-act="${it.id}" class="w-${it.weight}">${label}${key}</button>`;
    }
    menu.innerHTML = html;
    menu.dataset.path = p;
    /* The row itself: three items ask what kind or how big it is. */
    menu.__row = tr.__row || null;
    menu.hidden = false;
    const r = menu.getBoundingClientRect();
    menu.style.left = Math.min(e.clientX, innerWidth - r.width - 8) + "px";
    menu.style.top = Math.min(e.clientY, innerHeight - r.height - 8) + "px";
    menu.querySelector("button").focus();
  });

  menu.addEventListener("click", async (e) => {
    const b = e.target.closest("button");
    const act = b && b.dataset && b.dataset.act;
    if (!act) return;
    const p = menu.dataset.path;
    const row = menu.__row;
    const many = SEL.size > 1;
    const picked = many ? [...SEL.keys()] : [p];
    menu.hidden = true;

    /* Said once: the copy items differ only in what part of the path. */
    const put = (text, said) =>
      navigator.clipboard.writeText(text).then(() => flash(said),
                                               () => flash(T("could not copy")));
    const leaf = (x) => x.slice(x.lastIndexOf("/") + 1);
    const up = (x) => x.slice(0, x.lastIndexOf("/")) || "/";

    switch (act) {
      case "clear":   return clearSel();
      case "folders": return openFolders();
      case "open":    return launch(p, "file");
      case "folder":  return launch(p, "folder");

      case "open-all": {
        /* The trailing ellipsis in the label promises this question. */
        if (!confirm(T("Open all {n}…", { n: fmt(picked.length) }))) return;
        for (const x of picked) launch(x, "file");
        return;
      }

      case "copy-path":
        return put(picked.join("\n"), many
          ? T("{n} paths copied", { n: fmt(picked.length) })
          : T("path copied"));
      case "copy-name":
        return put(picked.map(leaf).join("\n"), many
          ? T("{n} names copied", { n: fmt(picked.length) })
          : T("name copied"));

      case "search-here":
        return toggleTerm("under:" + (row && row.is_dir ? p : up(p)));
      case "search-kind": {
        const dot = leaf(p).lastIndexOf(".");
        if (dot <= 0) return flash(T("no extension to search for"));
        return toggleTerm("ext:" + leaf(p).slice(dot + 1).toLowerCase());
      }
      case "duplicates": {
        /* Every copy of this file is in the set of files its exact size. */
        if (row && row.size !== undefined && row.size !== null) toggleTerm("size:=" + row.size);
        document.getElementById("tab-report").click();
        return;
      }
      case "usage":
        toggleTerm("under:" + p);
        document.getElementById("tab-report").click();
        return;
      case "skip": {
        rulesBtn.click();
        /* The name, not the path, and left unsent: a menu press must not add
           a rule by itself. */
        const field = rulesPanel.querySelector('input[type="text"]');
        if (field) { field.value = leaf(p); field.focus(); field.select(); }
        return;
      }

      case "csv": {
        const b = document.getElementById("csv");
        if (b) b.click();
        return;
      }
      case "details": {
        const t = document.getElementById("peek-toggle");
        if (t && t.getAttribute("aria-pressed") !== "true") t.click();
        return;
      }

      case "trash": {
        const said = many
          ? T("Move {n} to the wastebasket", { n: fmt(picked.length) })
          : T("Move to the wastebasket");
        if (!confirm(said + "\n\n" + picked.slice(0, 8).join("\n") +
                     (picked.length > 8 ? "\n…" : ""))) return;
        try {
          const r = await SERVICE.trash(picked);
          /* The rows go now rather than when a watcher gets round to them. */
          for (const x of picked) SEL.delete(x);
          /* Ask the current query again through the path a keystroke takes. */
          q.dispatchEvent(new Event("input", { bubbles: true }));
          flash(r.refused && r.refused.length
            ? T("{n} could not be moved", { n: fmt(r.refused.length) })
            : T("{n} moved to the wastebasket", { n: fmt(r.gone) }));
        } catch (err) {
          flash(String(err.message || err));
        }
        return;
      }

      case "open-with": {
        /* The menu becomes the list rather than growing a submenu. */
        try {
          const r = await SERVICE.openers(p);
          if (!r.openers.length) return flash(T("nothing on this machine claims it"));
          menu.innerHTML = r.openers.map((o) =>
            `<button type="button" data-act="open-with:${escape_(o.id)}">` +
            `${o.preferred ? "★ " : ""}${escape_(o.name)}</button>`).join("");
          menu.hidden = false;
        } catch (err) {
          flash(String(err.message || err));
        }
        return;
      }

      case "rename": {
        /* `prompt`: modal in the way a rename has to be, and a browser will
           not let a page select the stem alone. */
        const was = leaf(p);
        const name = prompt(T("Rename…"), was);
        if (name === null || name === was) return;
        try {
          const r = await SERVICE.rename(p, name);
          if (r.refused) return flash(T(r.refused));
          q.dispatchEvent(new Event("input", { bubbles: true }));
        } catch (err) {
          flash(String(err.message || err));
        }
        return;
      }

      default:
        if (act.startsWith("open-with:")) {
          try {
            await SERVICE.openWith(p, act.slice("open-with:".length));
          } catch (err) {
            flash(String(err.message || err));
          }
          return;
        }
        /* An id the page has no answer for; the table is shared. */
        flash(T("not in this face yet"));
    }
  });
  const hideMenu = () => { menu.hidden = true; };
  document.addEventListener("click", hideMenu);
  document.addEventListener("scroll", hideMenu, true);
  document.addEventListener("keydown", (e) => { if (e.key === "Escape") hideMenu(); });

  /* Toggled with Space, as every quick-look is. What can be shown is asked of
   * the bridge, and the bytes are reached by pointing an element at the URL:
   * a blob would hold the whole file to show one frame. */
  const peek = document.getElementById("peek");
  const peekBody = document.getElementById("peek-body");
  const peekName = document.getElementById("peek-name");
  const peekFacts = document.getElementById("peek-facts");
  const peekToggle = document.getElementById("peek-toggle");
  const peekCut = document.getElementById("peek-cut");
  const peekNative = document.getElementById("peek-native");
  const viewSearch = document.getElementById("view-search");

  const PEEK = {
    on: false,
    /* What is drawn now, so arrowing back does not restart a video. */
    path: null,
    ctrl: null,
    timer: 0,
  };

  /* The row with the keyboard; the list restores focus across a repaint. */
  const focusedRow = () => {
    const el = document.activeElement;
    return el && el.closest ? el.closest("tr[data-path]") : null;
  };

  /* `keeping` is false when the settings asked for this: no write back. */
  function setPeek(on, keeping = true) {
    PEEK.on = on;
    peek.hidden = !on;
    peekToggle.setAttribute("aria-pressed", on ? "true" : "false");
    if (keeping) keep({ preview: on });
    viewSearch.classList.toggle("peeking", on);
    if (!on) {
      /* Emptied on the way out: a hidden `<video>` keeps decoding. */
      showNothing("");
      PEEK.path = null;
      if (PEEK.ctrl) PEEK.ctrl.abort();
    } else {
      const row = focusedRow();
      if (row) drawPeek(row.__row);
    }
  }

  /* From the row the list already has, and no request. */
  function peekFactsOf(f) {
    const full = f.path + "/" + f.name;
    const shown = HOME && f.path.startsWith(HOME + "/")
      ? "~" + f.path.slice(HOME.length) : f.path;
    /* The same msgids the column headings use, so one field has one name. */
    const rows = [
      [T("Location"), shown],
      [T("Kind"), f.kind || ""],
      [f.is_dir ? T("Contents") : T("Size"),
       f.is_dir ? (f.items ? T("{n} items", { n: fmt(f.items) }) : "") : bytes(f.size)],
      [T("Modified"), f.mtime ? ago(f.mtime) : ""],
      [T("Created"), f.ctime ? ago(f.ctime) : ""],
      [T("Accessed"), f.atime ? ago(f.atime) : ""],
      [T("Mode"), f.perm || ""],
      [T("Owner"), [f.user, f.group].filter(Boolean).join(" · ")],
    ].filter(([, v]) => v);
    peekFacts.textContent = "";
    for (const [k, v] of rows) {
      const dt = document.createElement("dt");
      dt.textContent = k;
      const dd = document.createElement("dd");
      dd.textContent = v;
      peekFacts.append(dt, dd);
    }
    peekName.textContent = f.name;
    peekName.title = full;
  }

  function showNothing(message, thumbPath) {
    peekBody.className = "peek-body";
    peekBody.textContent = "";
    peekCut.hidden = true;
    const box = document.createElement("div");
    box.className = "none";
    /* The file manager's own picture, all there is for a format a browser
       cannot open. */
    if (thumbPath) {
      const img = document.createElement("img");
      img.src = `/api/icon?${new URLSearchParams({ p: thumbPath, t: TOKEN })}`;
      img.alt = "";
      box.appendChild(img);
    }
    box.appendChild(document.createTextNode(message));
    peekBody.appendChild(box);
  }

  /* The head of a text file, marked from the same folded terms the name column
   * uses. Built with nodes: this is somebody else's file and is never parsed. */
  function writePeekText(text, terms) {
    peekBody.className = "peek-body text";
    peekBody.textContent = "";
    const pre = document.createElement("pre");
    const hay = fold(text);
    const wanted = terms.filter((t) => t.length > 1);
    let at = 0;
    /* Bounded: a one-letter term in a quarter of a megabyte is tens of
       thousands of elements. */
    let left = wanted.length ? 2000 : 0;
    while (left > 0) {
      let best = -1, len = 0;
      for (const t of wanted) {
        const i = hay.indexOf(t, at);
        if (i >= 0 && (best < 0 || i < best)) { best = i; len = t.length; }
      }
      if (best < 0) break;
      pre.append(text.slice(at, best));
      const m = document.createElement("mark");
      m.textContent = text.slice(best, best + len);
      pre.appendChild(m);
      at = best + len;
      left--;
    }
    pre.append(text.slice(at));
    peekBody.appendChild(pre);
  }

  /* Dimensions and length are known only to a decoder, so they arrive from
   * the element rather than costing every row a decode at scan time. */
  function addFact(key, value) {
    if (!value) return;
    const dt = document.createElement("dt");
    dt.textContent = key;
    const dd = document.createElement("dd");
    dd.textContent = value;
    peekFacts.append(dt, dd);
  }

  const clock = (s) => {
    if (!isFinite(s) || s <= 0) return "";
    const m = Math.floor(s / 60), sec = Math.round(s % 60);
    return m >= 60
      ? `${Math.floor(m / 60)}:${String(m % 60).padStart(2, "0")}:${String(sec).padStart(2, "0")}`
      : `${m}:${String(sec).padStart(2, "0")}`;
  };

  function media(tag, url, type) {
    const el = document.createElement(tag);
    /* Caught now: by the time a large video has metadata, the row may have
       changed. */
    const mine = PEEK.path;
    if (tag === "img") {
      el.alt = "";
      el.addEventListener("load", () => {
        if (PEEK.path === mine) addFact("Boyutlar", `${el.naturalWidth} × ${el.naturalHeight}`);
      });
    } else {
      el.controls = true;
      /* No autoplay, and `metadata` gives the length without the whole file. */
      el.preload = "metadata";
      if (type) el.type = type;
      el.addEventListener("loadedmetadata", () => {
        if (PEEK.path !== mine) return;
        addFact(T("Length"), clock(el.duration));
        if (tag === "video" && el.videoWidth) {
          addFact(T("Dimensions"), `${el.videoWidth} × ${el.videoHeight}`);
        }
      });
    }
    el.src = url;
    return el;
  }

  /* Debounced: arrowing down a list previews where the hand stops. */
  function drawPeek(f) {
    if (!PEEK.on || !f) return;
    const full = f.path + "/" + f.name;
    if (full === PEEK.path) return;
    PEEK.path = full;
    peekFactsOf(f);
    clearTimeout(PEEK.timer);
    if (PEEK.ctrl) PEEK.ctrl.abort();
    peekBody.className = "peek-body";
    peekBody.textContent = "";
    peekCut.hidden = true;
    /* Hidden until the bridge says there is a previewer. */
    peekNative.hidden = true;
    if (f.is_dir) {
      showNothing(T("A folder — what is in it is in the list."));
      return;
    }
    PEEK.timer = setTimeout(() => {
      const ctrl = new AbortController();
      PEEK.ctrl = ctrl;
      SERVICE.peek(full, ctrl.signal)
        .then((meta) => {
          if (ctrl.signal.aborted) return;
          const url = SERVICE.peekUrl(full);
          /* Several desktops have no previewer; the bridge looks for it. */
          peekNative.hidden = !meta.native;
          if (meta.shape === "image") {
            peekBody.appendChild(media("img", url));
          } else if (meta.shape === "video") {
            peekBody.appendChild(media("video", url, meta.type));
          } else if (meta.shape === "audio") {
            peekBody.appendChild(media("audio", url, meta.type));
          } else if (meta.shape === "pdf") {
            /* `<embed>`: the PDF viewer is a plugin, and an iframe would be a
               document this origin answers for. */
            const e = document.createElement("embed");
            e.src = url;
            e.type = "application/pdf";
            peekBody.appendChild(e);
          } else if (meta.shape === "text") {
            fetch(url, { cache: "no-store", signal: ctrl.signal })
              .then((r) => r.text().then((t) => [r, t]))
              .then(([r, t]) => {
                if (ctrl.signal.aborted) return;
                /* Read at draw time: the query moves while a panel is open. */
                writePeekText(t, parse(q.value).text);
                if (r.headers.get("X-Scour-Complete") === "0") {
                  peekCut.textContent = T("the first {shown} — the file is {total}", {
                    shown: bytes(new Blob([t]).size), total: bytes(meta.size),
                  });
                  peekCut.hidden = false;
                }
              })
              .catch(() => {});
          } else {
            showNothing(T("This kind of file cannot be shown in a browser."),
                        meta.thumb ? full : null);
          }
        })
        .catch((e) => {
          if (ctrl.signal.aborted) return;
          /* 403 is a decision rather than a failure: `--no-preview`. */
          showNothing(String(e).includes("403")
            ? T("Previewing is off (--no-preview).")
            : T("It could not be previewed."));
        });
    }, 120);
  }

  /* Space toggles only inside the list; elsewhere it still scrolls. */
  body.addEventListener("keydown", (e) => {
    if (e.key !== " " || e.ctrlKey || e.altKey || e.metaKey) return;
    const row = e.target.closest("tr[data-path]");
    if (!row) return;
    e.preventDefault();
    if (PEEK.on && row.__row && row.__row.path + "/" + row.__row.name === PEEK.path) {
      setPeek(false);
    } else {
      PEEK.path = null;
      setPeek(true);
      drawPeek(row.__row);
    }
  });
  peekToggle.addEventListener("click", () => setPeek(!PEEK.on));

  /* Whatever takes the focus is what is previewed: one rule for all three. */
  body.addEventListener("focusin", (e) => {
    const row = e.target.closest && e.target.closest("tr[data-path]");
    if (row && PEEK.on) drawPeek(row.__row);
  });
  document.getElementById("peek-close").addEventListener("click", () => {
    setPeek(false);
    const row = focusedRow();
    if (row) row.focus();
  });
  peekNative.addEventListener("click", () => {
    if (PEEK.path) launch(PEEK.path, "preview");
  });
  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape" && PEEK.on && !peek.hidden) setPeek(false);
  });

  /* Kept, because `applyMarkup` blanks `#path-note` back to its msgid and the
   * next `/api/wait` reply can be twenty-five seconds away. */
  let LAST_STATUS = null;
  function applyStatus(s) {
    LAST_STATUS = s;
    TOTAL = s.entries;
    TOTAL_KNOWN = true;
    let moved = false;
    const note = document.getElementById("path-note");
    if (note) {
      const mb = MB.format(s.index_bytes / 1048576);
      // A singular msgid: most machines have one or two sources.
      const text = (s.sources === 1
        ? T("index {mb} MB · 1 source · {watching} watched", { mb, watching: s.watching })
        : T("index {mb} MB · {sources} sources · {watching} watched", {
            mb, sources: s.sources, watching: s.watching,
          }));
      if (text !== note.textContent) { note.textContent = text; moved = true; }
      /* The same msgid the window and the terminal draw. */
      const walking = document.getElementById("scanning");
      const sep = document.getElementById("scanning-sep");
      const said = s.scanning ? T("scanning {n}", { n: fmt(s.scanned || 0) }) : "";
      walking.textContent = said;
      walking.hidden = !said;
      sep.hidden = !said;

      /* Said only when it is due, and it says what to do about it. */
      const stale = document.getElementById("stale");
      const staleSep = document.getElementById("stale-sep");
      const advice = s.rebuild_advised
        ? fmt(s.unsorted || 0) + " " + T("unsorted") + " — " +
          T("`scour maintain rebuild` would speed searches up")
        : "";
      if (stale.textContent !== advice) { stale.textContent = advice; moved = true; }
      stale.hidden = !advice;
      staleSep.hidden = !advice;
    }
    /* `LIST`, not the capped reply: a heartbeat would put `1.000+` back. */
    if (LIST.query !== null) {
      const shown = LIST.exact ? fmt(LIST.total) : fmt(LIST.total) + "+";
      document.getElementById("count").textContent = withIndexTotal(shown);
    }
    /* The status sentence wraps in an `auto` row, so a longer one takes a line
     * from the rows. Guarded: this runs for every `/api/wait` reply. */
    if (moved) repaint(true);
  }

  /* Nothing polls: `/api/wait` answers when the index would, so an idle
   * desktop costs one round trip every twenty-five seconds. What arrives is a
   * revision number; the answer to a change is to ask again. */
  let REV = 0;                 /* the newest revision the service has told us of */
  /* The whole leash: `fillWindow` refetches a window whose stamp is not this,
     and only `refreshRows` moves it up to `REV`, so a missing window is
     fetched on the frame and an out-of-date one waits. */
  let SHOWING = 0;
  let missedWhileAway = false; /* something changed while the window was hidden */
  let freshTimer = null;
  /* What turned up and when, bounded by the highlight's own length. */
  const arrivals = new Map();
  const FRESH_MS = 1800;       /* and it must outlast the CSS animation */

  /* How many times its own cost a background refresh waits: on 1.35 M matches
   * the three-second count refresh took 930 ms each time, and at ten it can
   * never take more than about a tenth of a machine. */
  const COST = 10;

  /* Run `fn` once the calls stop for `ms`, lengthened to what the last cost
   * and capped at `PATIENCE`: one walk's length, so two never overlap. */
  const PATIENCE = 1500;
  function afterQuiet(fn, ms) {
    let timer = null, floor = ms;
    return () => {
      clearTimeout(timer);
      timer = setTimeout(() => {
        timer = null;
        const began = Date.now();
        const out = fn();
        if (out && typeof out.then === "function") {
          const charge = () => {
            floor = Math.min(PATIENCE, Math.max(ms, Date.now() - began));
          };
          out.then(charge, charge);
        }
      }, floor);
    };
  }

  function atMostEvery(fn, ms) {
    let last = -Infinity, timer = null, floor = ms, running = false, pending = false;
    const schedule = () => {
      if (running || timer !== null || !pending) return;
      const wait = Math.max(0, floor - (Date.now() - last));
      if (!wait) { call(); return; }
      timer = setTimeout(() => { timer = null; call(); }, wait);
    };
    const call = () => {
      pending = false;
      running = true;
      last = Date.now();
      const done = () => {
        floor = Math.max(ms, (Date.now() - last) * COST);
        running = false;
        schedule();
      };
      // The cost is unknown until completion, so one trailing call is kept.
      try {
        const out = fn();
        if (out && typeof out.then === "function") out.then(done, done);
        else done();
      } catch (error) {
        done();
        console.error("scour: a refresh failed:", error);
      }
    };
    return () => { pending = true; schedule(); };
  }

  /* The highlight marks the arrival, so it comes off on its own clock. */
  function armFresh() {
    clearTimeout(freshTimer);
    freshTimer = setTimeout(() => {
      const cut = Date.now() - FRESH_MS;
      let any = false;
      for (const [p, when] of arrivals) if (when <= cut) { arrivals.delete(p); any = true; }
      for (const f of LIST.rows.values()) {
        if (f.fresh && !arrivals.has(fullPath(f))) { delete f.fresh; any = true; }
      }
      if (any) repaint(true);
    }, FRESH_MS);
  }

  /* `fillWindow`'s job and nobody else's: a second fetcher asks for the same
   * windows a frame later and aborts the first. */
  function refreshRows() {
    if (document.hidden) { missedWhileAway = true; return; }
    if (LIST.query === null) return;           /* the first search has not landed */
