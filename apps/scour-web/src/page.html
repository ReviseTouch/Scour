   * The columns are the ones on screen, in the order they are on screen — they
   * are what the reader chose, and a column that is not showing is one click
   * from showing and then exported.
   *
   * **`sort` is no longer sent.** The service streams in the index's own order
   * and cannot be asked for another, and a parameter that is read and ignored
   * would make this look like a sort that had quietly stopped working. The
   * spreadsheet on the other end sorts in one click.
   *
   * A navigation rather than a fetch. The answer is a download with no length
   * declared, written as it is walked; letting the browser own it gives a
   * progress indicator, a cancel and a file on disk, none of it passing
   * through this page's memory. The cancel reaches all the way now: closing
   * the download stops the walk in the service, measured at zero further CPU
   * within 500 ms. */
  /* **The button this belongs to is not in the page, and that threw.**
   *
   * `a7789d8` added this listener, the route and the writer; its own message
   * says "A button in the meter bar downloads what the query matched", and no
   * such button was added — and the guard below stays, because a listener
   * that ends the script is a defect whatever the reason it fires.
   * `getElementById` therefore returned null and this line threw, and because
   * the whole window is one inline script, **this was the last line of it that
   * ever ran**. Everything below was dead, silently:
   *
   *   * `loadLanguage("")`, so the catalogue was never fetched. All 31 of the
   *     window's `data-t` elements stayed empty — including every word of the
   *     design notes, which is why the `?` opened a blank column.
   *   * the language menu, so `文` did nothing.
   *   * `window.SCOUR`, which the report tab reaches the bridge through — so
   *     every figure on that tab was a dash again. Its own comment, a few
   *     dozen lines below this one, describes that exact failure shipping
   *     once already and going unnoticed *because it looks like the service
   *     being down*. It had come back by a different road.
   *
   * Guarded rather than given a button: where the export belongs is a design
   * decision and this pass was asked for three others. The route, the writer
   * and this handler all still work the moment something with `id="csv"`
   * exists. What must not happen again is a missing element taking the rest of
   * the window with it, so the guard is the fix and the button is a question.
   */
  const csvBtn = document.getElementById("csv");
  if (csvBtn) {
    csvBtn.addEventListener("click", () => {
      const p = new URLSearchParams({
        q: q.value,
        cols: SHOWN.join(","),
        t: TOKEN,
      });
      location.href = `/api/csv?${p}`;
    });
  }


  /* ---------------- what is skipped ----------------
   *
   * Three sources reach the walk and only one of them can be changed from
   * here, so the panel keeps them apart: a remove button beside a built-in
   * rule would be a control that does nothing. The counts are not shown and
   * cannot be — what a rule excludes is by definition not in the index, so the
   * only way to know how many files it holds is to walk the disk, which took
   * nine minutes for `target` on this machine. A number nobody measured is
   * worse than no number.
   *
   * Writing goes through the settings, not through `config.toml`: that file is
   * hand-written and carries the measurements behind every value in it, and
   * rewriting it through a serialiser to record something typed into a box
   * would destroy the part worth keeping. */
  /* A rule is a name a person typed, and it goes into markup. Everything else
     in this file that builds HTML from a path does the same; there was no
     shared helper to reach for. */
  const esc = (v) =>
    String(v).replace(/[&<>"]/g, (c) =>
      ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);

  const rulesPanel = document.getElementById("rules-panel");
  const rulesBtn = document.getElementById("rules");
  let RULES = null;

  /* **A rule carries the list it came from, and it has to.** `target` as a
     directory name and `/home/x/target` as a path prefix are two different
     rules, and the switch is keyed by `kind:value` — flattening the four lists
     into one, as this did while every row was only ever shown, would leave two
     rules sharing one switch. */
  /* `RULE_KINDS` rather than `KINDS`, which this page already has for the file
     kinds in the rail — one script, one scope, and a redeclaration takes the
     whole of it down from that line on. It did: every one of the 43 translated
     strings came back empty. */
  const RULE_KINDS = [["path", "paths"], ["dir", "dirs"], ["file", "files"], ["allow", "allow"]];
  const rulesOf = (g) =>
    RULE_KINDS.flatMap(([kind, key]) => (g[key] || []).map((value) => ({ kind, value })));
  const ruleId = (kind, value) => kind + ":" + value;
  /* Case-insensitively, like the merge in the service that builds these lists:
     `NODE_MODULES` and `node_modules` are one rule everywhere else, and a
     switch that disagreed would look broken. */
  const isOff = (id) =>
    (RULES.off || []).some((o) => o.toLowerCase() === id.toLowerCase());

  const drawRules = () => {
    if (!RULES) return;
    const group = (title, note, entries, removable) => {
      if (!entries.length && !removable) return "";
      const rows = entries.map(({ kind, value }) => {
        const id = ruleId(kind, value);
        const off = isOff(id);
        /* The checkbox is the label, so the whole row is the target — these are
           short strings and a bare 13-pixel box beside them is a hard thing to
           hit. `aria-label` because a checkbox whose label is a rule needs to
           say what checking it means. */
        return `<li class="${off ? "off" : ""}">` +
          `<label><input type="checkbox" class="onoff" data-id="${esc(id)}"` +
          ` ${off ? "" : "checked"} aria-label="${esc(T("skip this"))}" />` +
          `<code>${esc(value)}</code></label>` +
          (removable ? `<button type="button" class="drop" data-kind="${kind}"` +
                       ` data-value="${esc(value)}" title="${esc(T("remove"))}">×</button>` : "") +
          `</li>`;
      }).join("");
      return `<section><h3>${esc(title)}</h3><p class="why">${esc(note)}</p>` +
             `<ul class="rules">${rows}</ul>` +
             (removable ? `<form class="add">` +
               `<input type="text" placeholder="${esc(T("a directory name, or a path"))}" />` +
               `<button type="submit">${esc(T("add"))}</button></form>` : "") +
             `</section>`;
    };
    rulesPanel.querySelector("#rules-body").innerHTML =
      group(T("Added here"), T("The only ones this window may delete. Any rule can be switched off."),
            rulesOf(RULES.added), true) +
      group(T("From config.toml"), T("Written by hand, and left alone — deleting it here would rewrite the file. Switch it off instead."),
            rulesOf(RULES.config), false) +
      group(T("Built in"), T("Part of the program. Mostly build output and package caches, which churn constantly and bury real results."),
            rulesOf(RULES.builtin), false);
  };

  const loadRules = () =>
    SERVICE.get("rules", {}).then((r) => { RULES = r; drawRules(); }).catch(() => {});

  /* ---------------------------------------------------------------- *
   * Which face to run.
   *
   * A press arms a row and says what choosing it would do; the button beside
   * that sentence is the thing that starts anything. The same shape as the
   * window's panel, for the same reason: a list where one press starts a
   * program is a list nobody can read safely.
   * ---------------------------------------------------------------- */
  const facesPanel = document.getElementById("faces-panel");
  const facesBtn = document.getElementById("faces");
  let ARMED = "";

  const drawFaces = () => {
    const row = (id, label, aside, note) => {
      const here = id === "browser";
      const armed = ARMED === id;
      return `<div class="face ${armed ? "armed" : ""}" data-face="${id}">` +
        `<button type="button" class="pick" ${here ? "disabled" : ""}>` +
        `<span class="dot">${here ? "●" : "○"}</span>` +
        `<span class="name">${esc(label)}</span>` +
        `<span class="aside">${esc(aside)}</span></button>` +
        (armed ? `<div class="say"><p>${esc(note)}</p>` +
                 `<button type="button" class="go">${esc(T("open"))}</button></div>` : "") +
        `</div>`;
    };
    document.getElementById("faces-body").innerHTML =
      row("browser", T("Browser"), T("running now"), "") +
      row("window", T("Window"),
          "",
          T("Starts the Scour window on this machine. This page stays open.")) +
      row("tui", T("Terminal"),
          "",
          T("Opens a terminal and runs Scour in it. This page stays open."));
  };

  facesPanel.addEventListener("click", (e) => {
    const pick = e.target.closest(".pick");
    if (pick) {
      const id = pick.closest(".face").dataset.face;
      ARMED = ARMED === id ? "" : id;
      drawFaces();
      return;
    }
    const go = e.target.closest(".go");
    if (!go) return;
    const id = go.closest(".face").dataset.face;
    go.disabled = true;
    SERVICE.face(id === "window" ? "window" : "tui")
      .then((r) => {
        ARMED = "";
        facesPanel.hidden = true;
        facesBtn.setAttribute("aria-expanded", "false");
        /* **This face is closing.** Switching is moving, not opening a second
           one, so the server goes — the window and the terminal do the same
           when they hand over. A tab cannot close itself unless a script
           opened it, and this one was opened by pointing a browser at a URL,
           so the honest half is to say so and stop asking a server that is on
           its way out. */
        if (r && r.closing) handedOver();
      })
      .catch((err) => {
        go.disabled = false;
        go.textContent = T("not found");
        console.warn("face:", err);
      });
  });

  /* The page after it has handed over: one line, and nothing still asking.
     Without the second half the list would spend the next minute retrying a
     server that has gone and end on "the service cannot be reached", which
     names the wrong thing — `scourd` is fine; it is this bridge that left. */
  function handedOver() {
    HANDED_OVER = true;
    if (PEEK.on) setPeek(false, false);
    const note = document.createElement("div");
    note.className = "handover";
    note.textContent = T("Scour is open elsewhere. You can close this tab.");
    document.body.append(note);
  }

  facesBtn.addEventListener("click", () => {
    const open = facesPanel.hidden;
    ARMED = "";
    facesPanel.hidden = !open;
    facesBtn.setAttribute("aria-expanded", open ? "true" : "false");
    if (open) drawFaces();
  });

  rulesBtn.addEventListener("click", () => {
    const open = rulesPanel.hidden;
    rulesPanel.hidden = !open;
    rulesBtn.setAttribute("aria-expanded", open ? "true" : "false");
    if (open) loadRules();
  });
  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape" && !rulesPanel.hidden) {
      rulesPanel.hidden = true;
      rulesBtn.setAttribute("aria-expanded", "false");
    }
  });

  /* A rule is added to `exclude_dirs` whatever it looks like, because that is
     the rule people mean: a name, matched wherever it appears. A path-shaped
     one is what `exclude_paths` is for, and telling them apart by guessing at
     a leading slash would be a rule nobody was told about. */
  rulesPanel.addEventListener("submit", (e) => {
    e.preventDefault();
    const box = e.target.querySelector("input");
    const v = box.value.trim();
    if (!v || !RULES) return;
    const key = v.startsWith("/") ? "paths" : "dirs";
    const next = [...RULES.added[key], v];
    RULES.added[key] = next;
    SERVICE.saveSettings({ ["exclude_" + key]: next });
    box.value = "";
    drawRules();
  });
  rulesPanel.addEventListener("click", (e) => {
    const b = e.target.closest(".drop");
    if (!b || !RULES) return;
    const v = b.dataset.value;
    for (const key of ["paths", "dirs", "files"]) {
      if (!RULES.added[key].includes(v)) continue;
      RULES.added[key] = RULES.added[key].filter((x) => x !== v);
      SERVICE.saveSettings({ ["exclude_" + key]: RULES.added[key] });
    }
    drawRules();
  });
  /* **Off is a note, not a deletion**, and that is what makes the two groups
     this window cannot edit — the program's own set, and a hand-written
     `config.toml` — something a person can still turn off. The note is kept
     beside the index with the column widths; neither the file nor the binary
     is touched, and switching the rule back on is deleting the note. */
  rulesPanel.addEventListener("change", (e) => {
    const box = e.target.closest(".onoff");
    if (!box || !RULES) return;
    const id = box.dataset.id;
    const rest = (RULES.off || []).filter((o) => o.toLowerCase() !== id.toLowerCase());
    RULES.off = box.checked ? rest : [...rest, id];
    SERVICE.saveSettings({ exclude_off: RULES.off });
    drawRules();
  });
  /* **No rescan button, and now nothing to put one there for.** Saving a rule
     is what asks for the walk — the service takes the new set, re-tunes the
     watchers to it, and scans — so a button would be a second way to ask for
     something that already happened. What was rejected is unchanged: a full
     walk of two volumes is not a thing to hand to a stray click, and this way
     the only thing that starts one is a deliberate change to what is indexed. */

  const langBtn = document.getElementById("lang");
  const langMenu = document.createElement("div");
  langMenu.className = "rowmenu langs";
  langMenu.hidden = true;
  document.body.appendChild(langMenu);

  /* Built from what the service ships, never from a list in here: a menu with
     its own list would offer a language nobody wrote a catalogue for, and the
     first thing it did would be to show an untranslated window. */
  function buildLangMenu() {
    langMenu.innerHTML = LANGUAGES.map(({ tag, name }) =>
      `<button type="button" data-lang="${escape_(tag)}">` +
      `<span class="tick">${tag === LANG ? "✓" : ""}</span>${escape_(name)}</button>`
    ).join("");
  }

  langBtn.addEventListener("click", (e) => {
    e.stopPropagation();
    const open = langMenu.hidden;
    langMenu.hidden = !open;
    langBtn.setAttribute("aria-expanded", String(open));
    if (!open) return;
    const r = langBtn.getBoundingClientRect();
    const m = langMenu.getBoundingClientRect();
    langMenu.style.left = Math.min(r.left, innerWidth - m.width - 8) + "px";
    langMenu.style.top = r.bottom + 4 + "px";
  });
  langMenu.addEventListener("click", (e) => {
    const btn = e.target.closest("button[data-lang]");
    if (btn) chooseLanguage(btn.dataset.lang);
  });
  document.addEventListener("click", () => {
    langMenu.hidden = true;
    langBtn.setAttribute("aria-expanded", "false");
  });

  /* No `lang` argument on the first load: the service is the one that knows
     what was chosen last time, and asking it is what makes the choice survive
     the window being closed. */
  loadLanguage("").catch(() => {
    /* An English window is a working window — every msgid in this file is its
       own English — so a catalogue that cannot be fetched is not a reason to
       stop. The kind labels are the exception and they come up empty, the same
       few milliseconds they are empty on every load. */
    applyLanguage();
  });

  /* What the report is allowed to reach in here.
   *
   * **The report is a separate closure and could not see into this one**, and
   * that was not a style choice — it was a bug that hid for as long as the
   * report was live. Wiring the report to the engine put `SERVICE.usage(...)`
   * inside a scope where `SERVICE` does not exist, so the first panel threw
   * `ReferenceError` into the `catch` that says the service cannot be reached,
   * every figure on the tab stayed a dash. It looked exactly like the service
   * being down, which is why nobody suspected the page.
   *
   * Published rather than merged, because the two halves really are two
   * programs: the list and the report share the bridge and nothing else. A
   * getter for `HOME` and not the value, since it arrives from `/api/places`
   * after this runs — handing over the empty string it holds now would show
   * everybody's paths unshortened for ever. */
  window.SCOUR = {
    service: SERVICE,
    escape: escape_,
    home: () => HOME,
    /* The catalogue, and the number formatters that go with it.
     *
     * Handed over rather than fetched again: `/api/strings` is one request and
     * two closures asking for it would be two, arriving at different moments —
     * the report would spend a frame in the old language every time somebody
     * switched. Functions rather than the objects themselves, because the
     * objects are replaced when the language changes and a captured `NUMBERS`
     * would keep formatting in the language it was captured in. */
    t: (msgid, vars) => T(msgid, vars),
    fmt: (n) => fmt(n),
    /* The report's own redraw, registered by the report and called from
       `applyLanguage`. Null until the second closure has run — which is after
       this one, so this half must never assume it is there. */
    relabel: null,
    // Both arrive from the service after this runs, so both are getters. The
    // kind panel was empty for the same reason the rest of the tab was blank:
    // it reached for `KINDS` and `BAR_EDGES` across a closure boundary and
    // threw into its own `catch`.
    kinds: () => KINDS,
    barEdges: () => BAR_EDGES,
    /* What the report remembers. It is a separate closure and cannot reach
       `keep`, so it hands over a change and this half sends it. */
    prefs: () => ({ dupes_open: DUPES_OPEN }),
    pref: (patch) => {
      if ("dupes_open" in patch) DUPES_OPEN = !!patch.dupes_open;
      keep(patch);
    },
  };
})();

// ---------------------------------------------------------------- REPORT
//
// **This was a mockup for a long time, and it showed.** The tree below used to
// be twenty-four folders written into the page — real numbers once, measured
// against a home directory in August, and frozen from then on. It sat three
// inches from a sidebar that says "Everything below is live", which made it the
// one place in this interface showing somebody invented figures about their own
// disk.
//
// The engine had answered this the whole time: `Request::Usage` ships and
// `scour du` uses it. Only the route was missing. Every number here now comes
// from the index, and the one panel nothing could answer — what is duplicated,
// which needs a grouping this index does not do — is gone rather than
// fabricated. `docs/REPORTS.md` §B is where it comes back, if it does.
(function () {
  /* Taken in by name, so that a reference to something this half was never
     handed is a `ReferenceError` here in one line rather than inside a
     `catch` three panels later. See the note where these are published. */
  const SERVICE = window.SCOUR.service;
  const escape_ = window.SCOUR.escape;
  const home = window.SCOUR.home;
  const kinds = window.SCOUR.kinds;
  const barEdges = window.SCOUR.barEdges;
  /* The catalogue and the number formatter, from the other half. Both are
     wrappers rather than the values, so a language change is picked up here
     without this closure being told about it. */
  const T = window.SCOUR.t;
  const fmt = window.SCOUR.fmt;

  /* The six age bands. Resolved at draw time rather than here: this runs
     before the catalogue has arrived, so a finished string built now would be
     the English of a window that had already gone Turkish.

     Named fields rather than a pair, so that the word is spelled `msgid:` —
     the same convention `COLUMNS` and `FIELDS` use, and what
     `the_page_says_nothing_the_catalogue_has_not_heard_of` reads. A msgid that
     a test cannot find is a msgid that can go missing from the catalogue
     without anything failing. */
  const AGE = [
    { msgid: "today",      c: "--t0" }, { msgid: "this week", c: "--t1" },
    { msgid: "this month", c: "--t2" }, { msgid: "six months", c: "--t3" },
    { msgid: "this year",  c: "--t4" }, { msgid: "older",     c: "--t5" },
  ];

  const bytes = (n) => {
    const u = ["B","KB","MB","GB","TB"]; let v = n, i = 0;
    while (v >= 1024 && i < u.length - 1) { v /= 1024; i++; }
    return (i ? v.toFixed(1) : v) + " " + u[i];
  };

  /* **Where the `%` goes is the language's business too.** It was written
     `%${shown}` — Turkish order, sign first — so an English window read
     `%38.4`; and the fallback for a folder holding nothing was the literal
     `"0,0"`, a Turkish decimal comma typed into the page. `Intl` places the
     sign, picks the separator, and knows about the space Turkish puts between
     them.

     Built per call rather than kept, which is the wrong instinct everywhere
     else in this file and is right here: a kept formatter belongs to a
     language, and this closure is not told when that changes. `stack` makes
     six per folder over twenty-four folders, plus a share cell each — 168 a
     redraw. Measured in the window rather than guessed: 168 constructions and
     formats in a loop, warmed first so that ICU's lazy set-up is not the
     reading, median of seven rounds, taken twice — **2.0 ms and 2.3 ms** per
     redraw, against the 96 ms index walk it is drawing, and paid only while
     the report tab is open. Cheap enough that a cache is not worth the
     language bug it would bring. */
  const percent = (v, digits) => {
    const dp = digits === undefined ? (v < 1 ? 1 : 0) : digits;
    return new Intl.NumberFormat(document.documentElement.lang, {
      style: "percent", minimumFractionDigits: dp, maximumFractionDigits: dp,
    }).format(v / 100);
  };
  const leafOf = (p) => p.slice(p.lastIndexOf("/") + 1) || p;
  /* `~` for the reader's own home, the same substitution the location column
     makes. Read at call time, not captured: `HOME` arrives from
     `/api/places` after this file has finished loading. */
  const shorten = (p) => {
    const h = home();
    return h && p.startsWith(h + "/") ? "~" + p.slice(h.length) : p;
  };

  /* Where the report is looking. Empty means everything indexed, which is what
     `Request::Usage` means by an empty path — so the first view is the whole
     index rather than a folder somebody's machine happened to have. */
  let scope = "";
  let drawing = 0;

  const crumb = document.getElementById("crumb");
  const kidsEl = document.getElementById("r-kids");

  /* ---------------- the box above this tab ----------------
   *
   * **The search bar did not go anywhere when this tab opened, and for a while
   * it did nothing here** — a live box over a report that ignored it, which is
   * worse than no box, because the reader has no way to tell an ignored filter
   * from one that matched everything.
   *
   * Read at draw time rather than tracked, so there is one answer to "what is
   * the filter" and it is whatever is in the box. Not owned here: this tab
   * borrows the search half's element and never writes to it except through
   * the clear button, which dispatches `input` so the other half hears it too.
   *
   * Asking is not a cost: the rollup walks what the query walks, so a filter
   * makes the report faster rather than slower — about a third off over the
   * whole index, and four fifths off inside a folder. It is not free, which is
   * why the redraw below waits rather than firing on every keystroke. */
  const qBox = document.getElementById("q");
  const filter = () => qBox.value.trim();

  /* The age spread, from bytes rather than percentages.
     `DirUsage.age` is six counts of bytes; the bar wants six widths. Computing
     the percentage here rather than sending it keeps the wire honest — a
     percentage of nothing is not zero, it is undefined, and the guard below is
     the difference between an empty bar and six NaNs. */
  function stack(age, total) {
    if (!total) return `<div class="stack"></div>`;
    return `<div class="stack">` + age.map((v, i) => {
      const pct = (v / total) * 100;
      if (pct < 0.05) return "";
      return `<i style="width:${pct}%;background:var(${AGE[i].c})"` +
             ` title="${escape_(T(AGE[i].msgid))} · ${escape_(percent(pct))}"></i>`;
    }).join("") + `</div>`;
  }

  function breadcrumb() {
    const parts = scope.split("/").filter(Boolean);
    const all = escape_(T("everything"));
    const home = `<button data-path="">${all}</button>`;
    const where = !parts.length ? `<span>${all}</span>` : home + parts.map((seg, i) => {
      const path = "/" + parts.slice(0, i + 1).join("/");
      const last = i === parts.length - 1;
      const label = last ? `<span>${seg}</span>` : `<button data-path="${path}">${seg}</button>`;
      return `<span class="s">/</span>` + label;
    }).join("");
    /* Beside the scope, because they are one sentence: these numbers are about
       *this much of* this folder. `escape_` and not a template hole — a query
       is text somebody typed, and `<b>` in it is a `<b>` to a browser. */
    const f = filter();
    return where + (f
      ? `<span class="filt">${escape_(T("filter"))} <b>${escape_(f)}</b>
           <button id="unfilter" title="${escape_(T("remove the filter"))}"
                   aria-label="${escape_(T("remove the filter"))}">×</button>
         </span>`
      : "");
  }

  async function drawReport() {
    const mine = ++drawing;
    crumb.innerHTML = breadcrumb();
    const q = filter();
    let res;
    try {
      res = await SERVICE.usage(scope, 24, q);
    } catch (e) {
      if (mine !== drawing) return;
      console.error("scour: the report did not load:", e);
      document.getElementById("r-bytes").textContent = "—";
      document.getElementById("r-meta").textContent = T("the service cannot be reached");
      kidsEl.innerHTML = "";
      return;
    }
    if (mine !== drawing) return;          /* a newer folder won */

    const n = res.root;
    document.getElementById("r-bytes").textContent = bytes(n.bytes);

    /* What the headline says, and every part of it is measured. `disk` beside
       `bytes` because showing the logical size and calling it disk usage is the
       standard lie — the engine's own words, and it stores both. */
    const stale = n.bytes ? Math.round(((n.age[4] + n.age[5]) / n.bytes) * 100) : 0;

    /* Every child folder is in the answer, filter or no filter — the rollup
       keeps them because its tree is the set of paths it holds, and a gap in
       that tree strands a match's bytes in some grandparent. What a *reader*
       wants from "where are my logs" is not twenty-one folders saying 0 B, so
       the empty ones are dropped here, where dropping them costs nothing: they
       are zero, so the rest still come to the root. */
    const kids = q ? res.children.filter((c) => c.files > 0) : res.children;
    const cut = q
      ? (res.child_count
          ? " · " + T("{shown} of {total} folders have a match",
                      { shown: fmt(kids.length), total: fmt(res.child_count) })
          : "")
      : res.child_count > kids.length
        ? " · " + T("the heaviest {shown} of {total} folders",
                    { shown: kids.length, total: fmt(res.child_count) })
        : "";
    /* **Said in words, not only in a chip.** With a filter on, this figure is
       what the matching files come to — not what the folder holds, and not what
       `du` would answer. The two readings differ by orders of magnitude and
       look identical, so the difference has to be written down where the
       number is. */
    const about = q
      ? "<br>" + T("only the <b>matching</b> files · not the whole folder")
      : "";
    document.getElementById("r-meta").innerHTML =
      T("{files} files · {disk} on disk", { files: fmt(n.files), disk: bytes(n.disk) })
      + "<br>"
      + T("<b>{percent}%</b> of it older than a year", { percent: stale })
      + "<br>"
      + `<b>${(res.took_us / 1000).toFixed(1)} ms</b>${cut}${about}`;

    /* Already heaviest-first from the engine, which is what `top` cuts on. */
    kidsEl.innerHTML = kids.map((v) => `
      <tr>
        <td class="nmcell"><button data-path="${v.path}">${leafOf(v.path)} <span style="color:var(--ink-3)">›</span></button></td>
        <td class="stack-wrap">${stack(v.age, v.bytes)}</td>
        <td class="r big">${bytes(v.bytes)}</td>
        <td class="r">${escape_(percent(n.bytes ? (v.bytes / n.bytes) * 100 : 0, 1))}</td>
        <td class="r">${fmt(v.files)}</td>
      </tr>`).join("") ||
      `<tr><td colspan="5" style="padding:24px 8px;color:var(--ink-3);font-size:12.5px">${
        escape_(q
          ? T("In this scope, none of the subfolders has a matching file.")
          : T("There are no further folders to show under this one."))
      }</td></tr>`;

    document.getElementById("agekey").innerHTML = AGE.map((band) =>
      `<span><i style="background:var(${band.c})"></i>${escape_(T(band.msgid))}</span>`).join("");

    drawKinds();
    drawBiggest();
    drawJump();
    // **Only if it was opened.** The panel used to run on every draw of this
    // tab, so looking at what a folder weighs also started a duplicate hunt
    // over thirty thousand candidates — cheap, and still not something to do
    // unasked. The choice is remembered, so somebody who wants it has it.
    // Read every time rather than once: the settings arrive a moment after
    // the page does, and this tab may be drawn on either side of that.
    if (window.SCOUR.prefs().dupes_open !== dupesOpen) {
      showDupes(!!window.SCOUR.prefs().dupes_open, false);
    }
    if (dupesOpen) drawDupes(0);
  }

  /* The type breakdown, from the same faceting the search sidebar uses.
   *
   * The filter goes in too, and it has to: a panel beside a filtered headline
   * that counts everything makes the reader trust whichever of the two they
   * read second. Both take the scope as `under:` and the filter as itself —
   * the terms are ANDed, so this is one query rather than a combination the
   * page has to reason about. */
  async function drawKinds() {
    const el = document.getElementById("p-kind");
    const q = ((scope ? `under:${scope} ` : "") + filter()).trim();
    try {
      const res = await SERVICE.sidebar(q, barEdges());
      const g = (res.groups || []).find((x) => x.by === "kind");
      const rows = (g ? g.facets : []).filter((f) => f.count > 0)
        .sort((a, b) => b.count - a.count).slice(0, 8);
      const max = Math.max(1, ...rows.map((r) => r.count));
      el.innerHTML = rows.map((r) => `
        <div class="line" style="position:relative">
          <span style="position:absolute;left:-4px;top:3px;bottom:3px;width:${(r.count / max * 100).toFixed(1)}%;background:var(--line);border-radius:0 2px 2px 0"></span>
          <span style="position:relative">${(kinds().find(([, t]) => t === r.key) || [r.key])[0]}</span>
          <span style="position:relative">${fmt(r.count)}</span>
        </div>`).join("") ||
        `<div class="line"><span style="color:var(--ink-3)">—</span></div>`;
    } catch (e) {
      console.error("scour: the kind panel did not load:", e);
    }
  }

  /* The heaviest files in scope, which is an ordinary search — the index sorts
     by size without walking, so this costs what any other query costs. */
  async function drawBiggest() {
    const el = document.getElementById("p-big");
    const q = ((scope ? `under:${scope} ` : "") + "file: " + filter()).trim();
    try {
      const res = await SERVICE.search(q, "size", true, 8, 0);
      el.innerHTML = res.rows.map((r) => `
        <div class="line" title="${r.dir}/${r.name}">
          <span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:60%">${r.name}</span>
          <span>${bytes(r.size)}</span>
        </div>`).join("") ||
        `<div class="line"><span style="color:var(--ink-3)">—</span></div>`;
    } catch (e) {
      console.error("scour: the largest-files panel did not load:", e);
    }
  }

  /* Yinelenenler — `docs/REPORTS.md` §B, and the panel this report used to
     fake before anything could answer it.
   *
   * Two numbers, always both. What *could* be freed is every file that shares
   * a size with another; what is *confirmed* was read end to end and compared.
   * On this disk they are 39.16 GiB and 4.16 GiB, and a panel that showed only
   * the first would be telling somebody to delete database pages that happen
   * to be the same length. Free means free: nothing is read until the button
   * is pressed, because the disk being read is theirs. */
  let dupeRun = 0;
  /* **The floor is the whole speed knob**, and it is a knob because the
     measurement made it one: a unique size rules out only 6.2% of files, so
     the candidate list below a megabyte is a million files covering 28 GB —
     while above ten megabytes it is under two thousand covering 90 GB. Asking
     for the big ones is not a filter on the answer, it is a much smaller
     question. */
  const FLOORS = [[1, "1 MB"], [10, "10 MB"], [100, "100 MB"], [1024, "1 GB"]];
  let dupeFloor = 10;

  async function drawDupes(budgetMb) {
    const mine = ++dupeRun;
    const list = document.getElementById("d-list");
    const sum = document.getElementById("d-sum");
    const btn = document.getElementById("d-confirm");
    sum.textContent = budgetMb ? T("reading…") : "…";
    btn.disabled = true;
    let res;
    try {
      res = await SERVICE.dupes(scope, budgetMb, dupeFloor);
    } catch (e) {
      if (mine !== dupeRun) return;
      console.error("scour: the duplicates panel did not load:", e);
      sum.textContent = T("the service cannot be reached");
      list.textContent = "";
      btn.disabled = false;
      return;
    }
    if (mine !== dupeRun) return;
    btn.disabled = false;

    sum.textContent =
      T("{proven} confirmed · {waste} candidate · {n} files",
        { proven: bytes(res.proven), waste: bytes(res.waste), n: fmt(res.candidates) }) +
      (res.read ? " · " + T("{n} read", { n: bytes(res.read) }) : "") +
      /* **This panel does not take the filter, and says so.** A copy of a file
         is a copy whether or not its name matches what was typed above, so
         narrowing here would hide the other half of a pair and call the
         remaining one unique. Sitting silently under a filtered headline it
         would read as filtered, which is the thing to prevent. */
      (filter() ? " · " + T("independent of the filter") : "");
    /* The one sentence that must never be dropped: a partial answer that looks
       complete is what gets files deleted on a guess. */
    document.getElementById("d-note").innerHTML = res.unconfirmed
      ? T("Being the same size is not being the same file. <b>{n} groups were not confirmed by reading</b> — those are candidates, not duplicates.", { n: fmt(res.unconfirmed) })
      : T("All of them were compared by reading.");

    /* The engine's three certainties, in the reader's language. The keys are
       `Certainty`'s own words and are not translated — they are what comes
       over the wire and what the CSS class is named after. */
    const word = {
      content: T("identical"), edges: T("same ends"), size: T("same size only"),
    };
    list.innerHTML = res.groups.map((g) => `
      <div class="dupe">
        <div class="top">
          <span class="save">${bytes(g.waste)}</span>
          <span class="of">×${g.paths.length} · ${bytes(g.size)}</span>
          <span class="sure ${g.certainty}">${escape_(word[g.certainty] || g.certainty)}</span>
        </div>
        <ul>${g.paths.slice(0, 6).map((p) => `<li>${escape_(shorten(p))}</li>`).join("")}${
          /* One group of twenty-eight qdrant pages otherwise swallows the
             panel, and the twenty-second path teaches nobody what the sixth
             did not. The count above still says how many there are. */
          g.paths.length > 6
            ? `<li style="color:var(--ink-3)">… ${escape_(T("{n} more", { n: fmt(g.paths.length - 6) }))}</li>`
            : ""
        }</ul>
      </div>`).join("") ||
      `<div class="dupe"><div class="top"><span class="of">${escape_(T("no duplicates in this scope"))}</span></div></div>`;
  }

  /* Open or shut, and remembered. Read from the settings the service holds,
     so the terminal interface will start from the same answer. */
  let dupesOpen = false;
  const dupeParts = ["d-sum", "d-floor", "d-confirm", "d-note", "d-list"];
  function showDupes(open, ask) {
    dupesOpen = open;
    const opener = document.getElementById("d-open");
    opener.textContent = open ? T("hide") : T("show");
    opener.setAttribute("aria-expanded", String(open));
    for (const id of dupeParts) {
      const el = document.getElementById(id);
      if (el) el.hidden = !open;
    }
    if (open && ask) drawDupes(0);
  }
  showDupes(false, false);
  document.getElementById("d-open").addEventListener("click", () => {
    showDupes(!dupesOpen, true);
    window.SCOUR.pref({ dupes_open: dupesOpen });
  });

  const floorBox = document.getElementById("d-floor");
  function drawFloors() {
    floorBox.innerHTML = FLOORS.map(([mb, label]) =>
      `<button type="button" data-mb="${mb}" aria-pressed="${mb === dupeFloor}"
        title="${escape_(T("do not look at anything smaller than this"))}">${label}+</button>`).join("");
  }
  floorBox.addEventListener("click", (e) => {
    const b = e.target.closest("[data-mb]");
    if (!b) return;
    dupeFloor = +b.dataset.mb;
    drawFloors();
    // Free again: a floor change goes back to the size groups rather than
    // keeping a confirmation that was about a different set of files.
    drawDupes(0);
  });
  drawFloors();

  document.getElementById("d-confirm").onclick = () => drawDupes(2048);

  function drawJump() {
    document.getElementById("p-jump").innerHTML =
      `<div class="line"><span>under:</span><span style="font-size:10.5px">${scope || "/"}</span></div>` +
      `<button class="facet" style="padding-left:0;margin-top:6px" id="jump">
         <span class="dot" style="background:var(--t1)"></span>
         <span class="nm">Bu kapsamda ara</span></button>`;
    document.getElementById("jump").onclick = () => {
      const q = document.getElementById("q");
      const rest = q.value.replace(/under:\S+\s*/g, "").trim();
      q.value = (scope ? "under:" + scope + " " + rest : rest).trim();
      q.dispatchEvent(new Event("input"));
      show("search");
    };
  }

  document.querySelector(".report").addEventListener("click", (e) => {
    const b = e.target.closest("button[data-path]");
    if (b) { scope = b.dataset.path; drawReport(); }
    /* Clearing the filter empties the box for both halves, which is why it
       goes through `input` rather than assigning and redrawing here: the
       search tab is listening on the same element and has its own idea of
       what to do about it. This tab's redraw comes back through that. */
    if (e.target.closest("#unfilter")) {
      qBox.value = "";
      qBox.dispatchEvent(new Event("input"));
    }
  });

  /* Retyping while the report is up redraws the report.
   *
   * Held off a quarter second, unlike the search box, which answers every
   * keystroke. It can afford to: a keystroke there is one prepared query,
   * where this is a roll-up over every matching row, and half-typed words —
   * `r`, `ra`, `rap` — are the widest queries anybody ever sends. The guard
   * `drawing` already discards the answer to a superseded draw.
   *
   * Nothing at all while the search tab is up: `show("report")` reads the box
   * when the tab opens, so a filter typed on the other side is picked up then
   * rather than kept in sync all along. */
  let waiting = 0;
  qBox.addEventListener("input", () => {
    if (document.getElementById("view-report").hidden) return;
    clearTimeout(waiting);
    waiting = setTimeout(drawReport, 250);
  });

  function show(which) {
    const s = which === "search";
    document.getElementById("view-search").hidden = !s;
    document.getElementById("view-report").hidden = s;
    document.getElementById("tab-search").setAttribute("aria-selected", String(s));
    document.getElementById("tab-report").setAttribute("aria-selected", String(!s));
    document.querySelector(".meter").style.display = s ? "" : "none";
    if (s) document.dispatchEvent(new Event("scour-search-shown"));
    else drawReport();
  }
  document.getElementById("tab-search").onclick = () => show("search");
  document.getElementById("tab-report").onclick = () => show("report");

  /* **What this half does when the language changes, which is less than it
   * looks.**
   *
   * `show("report")` redraws this whole tab every time it is opened, and the
   * language menu is in the meter bar, which `show` hides while this tab is
   * up — so nothing here can be *looked at* in a language it was not drawn in.
   * Two things escape that, because they are written once and no later draw
   * rewrites them: the floor buttons' titles, and the word on the show/hide
   * button. Both were caught in the window, reading `show` under a Turkish
   * heading.
   *
   * A `drawReport()` beside them would be a branch that cannot run today,
   * which is the kind of thing this change spent its morning deleting — see
   * the note where `matches()` used to be.
   *
   * Registered rather than reached for, because the two halves are separate
   * closures on purpose: the last time one reached into the other, the whole
   * tab came up as dashes inside its own `catch` and it looked exactly like
   * the service being down. */
  window.SCOUR.relabel = () => {
    drawFloors();
    showDupes(dupesOpen, false);
  };
})();

</script>
</body>
</html>
