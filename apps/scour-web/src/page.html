    SHOWING = REV;
    // Returned so the throttle above can charge for what this cost.
    return fillWindow();
  }

  /* How dear a sidebar refresh may be and still repeat unasked. `COST` alone
   * settles at a fixed share of the machine — 8.14% of a core on an untouched
   * window — so a dear sidebar keeps its numbers until the query changes. */
  const SIDEBAR_LIVE_UNDER_MS = 40;

  function reviseCounts() {
    if (document.hidden) { missedWhileAway = true; return; }
    if (LIST.query === null) return;
    if (sidebarCost > SIDEBAR_LIVE_UNDER_MS) return;
    // Returned so the throttle above can charge for what it cost.
    return sidebar(LIST.query);
  }

  const rowsSoon = atMostEvery(refreshRows, 400);
  const countsSoon = atMostEvery(reviseCounts, 3000);

  function indexMoved() {
    /* A hidden window is remembered and refetched once, on its return. */
    if (document.hidden) { missedWhileAway = true; return; }
    rowsSoon();
    countsSoon();
  }

  document.addEventListener("visibilitychange", () => {
    if (document.hidden) return;
    if (missedWhileAway) { missedWhileAway = false; indexMoved(); }
    watch();                                  /* and start waiting again */
  });

  let waiting = false;
  /* Set when this face has handed over; everything that asks reads it. */
  let HANDED_OVER = false;
  async function watch() {
    if (waiting || HANDED_OVER) return;
    waiting = true;
    try {
      /* A hidden window stops waiting: waiting puts the service on the burst
         clock rather than batching. */
      while (!document.hidden && !HANDED_OVER) {
        let s;
        try {
          s = await SERVICE.wait(REV, 25000);
        } catch {
          /* Gone: try again slowly rather than in a tight loop. */
          await new Promise((r) => setTimeout(r, 3000));
          continue;
        }
        applyStatus(s);
        if (s.revision !== REV) {             /* `!=`: a restart counts back from zero */
          REV = s.revision;
          indexMoved();
        }
      }
    } finally {
      waiting = false;
    }
  }
  /* Pictures, remembered under `view.web`. Off is a real off: the rows are
   * drawn without the `<img>` rather than hiding it, so nothing is fetched. */
  let ICONS = true;
  const iconBtn = document.getElementById("icons");
  function applyIcons() {
    iconBtn.setAttribute("aria-pressed", String(ICONS));
    document.body.classList.toggle("no-icons", !ICONS);
    draw(q.value, parse(q.value), FILES, lastMeter || { total: LIST.total, capped: !LIST.exact, took_us: 0, rows_visited: 0 });
  }
  iconBtn.addEventListener("click", () => {
    ICONS = !ICONS;
    keepView({ icons: ICONS });
    applyIcons();
  });
  iconBtn.setAttribute("aria-pressed", String(ICONS));

  /* A folder nobody has opened has no thumbnails, so the desktop's own
   * thumbnailer is asked; how many decoders run is the service's. The four
   * bounds below are quiet, batch, one request at a time, and memory. */
  const PICTURE_QUIET = 250;
  const PICTURE_BATCH = 24;
  const PICTURE_MEMORY = 4096;
  /* With `--no-thumbnails` the route answers 403; asked once. */
  let picturesRefused = false;
  let askingPictures = false;
  const askedForPictures = new Set();

  /* Oldest out first: a `Set` iterates in insertion order. */
  function rememberAsking(path) {
    if (askedForPictures.size >= PICTURE_MEMORY) {
      askedForPictures.delete(askedForPictures.values().next().value);
    }
    askedForPictures.add(path);
  }

  function askForPictures() {
    if (!ICONS || picturesRefused || askingPictures || LIST.query === null) return;
    const [from, to] = visibleRange();
    const paths = [];
    for (let i = from; i < to && paths.length < PICTURE_BATCH; i++) {
      const f = LIST.rows.get(i);
      /* `make` is the bridge saying the machine declares a thumbnailer for
         this type, so the page never guesses from an extension. */
      if (!f || !f.make || f.thumb) continue;
      const p = fullPath(f);
      if (askedForPictures.has(p)) continue;
      rememberAsking(p);
      paths.push(p);
    }
    if (!paths.length) return;
    askingPictures = true;
    /* Returned so `afterQuiet` charges itself: a batch of videos is seconds. */
    return SERVICE.thumbs(paths)
      .then((res) => {
        askingPictures = false;
        if (!res || !res.ready || !res.ready.length) return;
        const made = new Set(res.ready);
        /* Over the visible range: `LIST.rows` reaches twenty thousand. */
        const [nowFrom, nowTo] = visibleRange();
        let any = false;
        for (let i = nowFrom; i < nowTo; i++) {
          const f = LIST.rows.get(i);
          if (f && !f.thumb && made.has(fullPath(f))) { f.thumb = true; any = true; }
        }
        if (any) repaint(true);
        /* The rest of the screen, through the same quiet timer. */
        picturesSoon();
      })
      .catch((e) => {
        askingPictures = false;
        if (e && /\b403\b/.test(String(e.message))) {
          picturesRefused = true;
          return;
        }
        /* Not retried: a dead bridge then costs one request a screen. */
        console.error("scour: pictures could not be asked for:", e);
      });
  }
  const picturesSoon = afterQuiet(askForPictures, PICTURE_QUIET);

  /* The item is kept across the change, not the pixel, and the extent is
   * stated before the position because a browser clamps `scrollTop` to the one
   * it has. The only place here that writes it, and only from a click. */
  const viewBox = document.getElementById("views");
  const viewBtns = [...viewBox.querySelectorAll("button")];

  const topItem = () =>
    Math.min(reach(), Math.floor(scrollEl.scrollTop / pitch()) * PER_ROW);

  function applyMode(next) {
    const at = topItem();
    MODE = MODES.includes(next) ? next : "detail";
    for (const b of viewBtns) {
      b.setAttribute("aria-pressed", String(b.dataset.view === MODE));
    }
    /* Both: the sheet asks "a grid?" and "which of the two?" separately. */
    document.body.classList.toggle("grid", grid());
    document.body.dataset.view = MODE;
    applyWidths();
    // Forces the layout above, so the width below is the new one.
    measurePerRow();
    sizedTo = Math.round(lines() * pitch());
    sizer.style.height = `${sizedTo}px`;
    scrollEl.scrollTop = Math.round(Math.floor(at / PER_ROW) * pitch());
    for (const tr of pool) tr.__stamp = "";
    painted = "";
    repaint(true);
  }

  viewBox.addEventListener("click", (e) => {
    const b = e.target.closest("button[data-view]");
    if (!b || b.dataset.view === MODE) return;
    applyMode(b.dataset.view);
    keep({ layout: MODE });
  });

  /* The help, behind a button and remembered under `view.side`. */
  let SIDE = false;
  const aboutBtn = document.getElementById("about");
  const helpBox = document.getElementById("help");

  /* From the table the parser and the completions share; `about` is a msgid. */
  function buildHelpFields() {
    const dl = document.getElementById("help-fields");
    const out = [];
    for (const f of FIELDS) {
      const dt = document.createElement("dt");
      dt.textContent = f.eg || f.name;
      const dd = document.createElement("dd");
      dd.textContent = T(f.about);
      out.push(dt, dd);
    }
    dl.replaceChildren(...out);
  }

  /* Measured rather than positioned by constant: the bar's height depends on
   * the font and on how the meter wrapped. The clamp keeps it on screen. */
  function placeHelp() {
    const b = aboutBtn.getBoundingClientRect();
    const w = helpBox.offsetWidth;
    const left = Math.max(10, Math.min(b.right - w, innerWidth - w - 10));
    helpBox.style.left = `${Math.round(left)}px`;
    helpBox.style.top = `${Math.round(b.bottom + 8)}px`;
  }

  function applySide() {
    aboutBtn.setAttribute("aria-pressed", String(SIDE));
    helpBox.hidden = !SIDE;
    /* No `repaint`: an overlay changes no row and no column. */
    if (SIDE) placeHelp();
  }
  aboutBtn.addEventListener("click", (e) => {
    // Or the listener below reads it as "outside" and closes at once.
    e.stopPropagation();
    SIDE = !SIDE;
    keepView({ side: SIDE });
    applySide();
  });
  document.getElementById("help-x").addEventListener("click", () => {
    SIDE = false;
    keepView({ side: SIDE });
    applySide();
  });
  document.addEventListener("click", (e) => {
    if (SIDE && !e.target.closest("#help")) {
      SIDE = false;
      keepView({ side: SIDE });
      applySide();
    }
  });
  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape" && SIDE) {
      SIDE = false;
      keepView({ side: SIDE });
      applySide();
    }
  });
  addEventListener("resize", () => { if (SIDE) placeHelp(); });
  applySide();
  // The shape the window opens in, before the settings land.
  applyMode(MODE);

  /* This window's settings, once they land; defaults until then. */
  function applyView() {
    ICONS = VIEW.icons !== false;
    SIDE = VIEW.side === true;
    applyIcons();
    applySide();
  }

  /* The window opens on the whole index, not the last keystroke: an empty
   * query is the cheapest there is, its count from `stats().entries`. */
  q.focus();
  q.select();

  buildHeads();
  /* First: taxonomy, places, settings and status only decorate. */
  render();
  /* One status to start from — its revision is what the wait measures
     against — and after that the waiting loop is the heartbeat. */
  SERVICE.status()
    .then((s) => { applyStatus(s); REV = s.revision; })
    .catch(() => {})
    .finally(watch);

  /* What the window remembered, over the defaults it has already drawn with. */
  SERVICE.settings()
    .then(applySettings)
    .catch(() => {});

  SERVICE.get("places", {})
    .then((res) => {
      HOME = res.home || "";
      MOUNTS = res.mounts || [];
      SCOPES = (res.places || []).map((p) => [p.label, p.path, null]);
      /* Local display data, so nothing is refetched to redraw it. */
      syncFacets(parse(q.value));
      for (const tr of pool) tr.__stamp = "";
      repaint(true);
    })
    .catch(() => {});

  /* `/api/strings` carries the catalogue and the languages; `/api/kinds` the
   * kind labels, the one part of the window with no msgid here. Applied
   * together, or the rail changes a frame before the headings. */
  function applyKinds(res) {
    KINDS = res.kinds.map((k) => [k.label, k.token]);
    KIND_KEY = Object.fromEntries(res.kinds.map((k) => [k.token, k.label]));
    /* Only the word for a row's kind has changed. */
    for (const f of LIST.rows.values()) f.kind = labelOfToken(f.ktoken);
    for (const f of FILES) f.kind = labelOfToken(f.ktoken);
  }

  /* Everything with a word in it: a reload would lose the query, the scroll
   * position and the selection. */
  function applyLanguage() {
    document.documentElement.lang = LANG;
    buildFormatters();
    applyMarkup(document);
    buildLangMenu();
    /* The help's field list is generated, so `applyMarkup` cannot reach it. */
    buildHelpFields();
    buildHeads();               // the headings, and the picker's title
    syncFacets(parse(q.value)); // the three rails
    drawSelBar();               // the selection bar, if anything is selected
    /* The two lines nothing else rewrites until something happens. */
    drawCost();
    if (LAST_STATUS) applyStatus(LAST_STATUS);
    /* `drawPeek` returns early for the row it shows, so the labels stay. */
    if (PEEK.on && !peek.hidden) {
      const row = focusedRow();
      if (row && row.__row) peekFactsOf(row.__row);
    }
    if (window.SCOUR && window.SCOUR.relabel) window.SCOUR.relabel();
    /* The rows carry `ago(...)` and a kind label, and the pool skips a row
       whose stamp has not moved. */
    for (const tr of pool) tr.__stamp = "";
    painted = "";
    repaint(true);
  }

  /* An empty `tag` means whatever the service works out. */
  function loadLanguage(tag) {
    const params = tag ? { lang: tag } : {};
    return Promise.all([
      SERVICE.get("strings", params),
      SERVICE.get("kinds", params),
    ]).then(([words, kinds]) => {
      LANG = words.lang || "en";
      LANGUAGES = words.languages || [];
      STRINGS = words.strings || {};
      applyKinds(kinds);
      applyLanguage();
    });
  }

  /* Drawn whether or not the save lands: `keep` is fire-and-forget. */
  function chooseLanguage(tag) {
    keep({ language: tag });
    langMenu.hidden = true;
    langBtn.setAttribute("aria-expanded", "false");
    loadLanguage(tag).catch((e) => console.error("scour: language:", e));
  }

  /* The whole result set, not the list: every row, in the columns on screen
   * and the index's own order — no `sort` is sent. A navigation, so the browser
   * owns the progress, the cancel and the file. Guarded: one inline script. */
  const csvBtn = document.getElementById("csv");
  if (csvBtn) {
    csvBtn.addEventListener("click", () => {
      const p = new URLSearchParams({
        q: q.value,
        cols: SHOWN.join(","),
        t: TOKEN,
      });
      location.href = `/api/csv?${p}`;
    });
  }


  /* Three sources reach the walk and only one can be changed here. No counts:
   * what a rule excludes is not in the index, and walking the disk for it took
   * nine minutes for `target`. Writing never touches `config.toml`. */
  /* A rule is a name a person typed and it goes into markup. */
  const esc = (v) =>
    String(v).replace(/[&<>"]/g, (c) =>
      ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);

  const rulesPanel = document.getElementById("rules-panel");
  const rulesBtn = document.getElementById("rules");
  let RULES = null;

  /* A rule carries its list: `target` the name and `/home/x/target` the
     prefix are two rules, keyed `kind:value`. */
  /* `RULE_KINDS`, not `KINDS`: one script, one scope. */
  const RULE_KINDS = [["path", "paths"], ["dir", "dirs"], ["file", "files"], ["allow", "allow"]];
  const rulesOf = (g) =>
    RULE_KINDS.flatMap(([kind, key]) => (g[key] || []).map((value) => ({ kind, value })));
  const ruleId = (kind, value) => kind + ":" + value;
  /* Case-insensitively, as the service's own merge is. */
  const isOff = (id) =>
    (RULES.off || []).some((o) => o.toLowerCase() === id.toLowerCase());

  const drawRules = () => {
    if (!RULES) return;
    const group = (title, note, entries, removable) => {
      if (!entries.length && !removable) return "";
      const rows = entries.map(({ kind, value }) => {
        const id = ruleId(kind, value);
        const off = isOff(id);
        /* The checkbox is the label, so the whole row is the target. */
        return `<li class="${off ? "off" : ""}">` +
          `<label><input type="checkbox" class="onoff" data-id="${esc(id)}"` +
          ` ${off ? "" : "checked"} aria-label="${esc(T("skip this"))}" />` +
          `<code>${esc(value)}</code></label>` +
          (removable ? `<button type="button" class="drop" data-kind="${kind}"` +
                       ` data-value="${esc(value)}" title="${esc(T("remove"))}">×</button>` : "") +
          `</li>`;
      }).join("");
      return `<section><h3>${esc(title)}</h3><p class="why">${esc(note)}</p>` +
             `<ul class="rules">${rows}</ul>` +
             (removable ? `<form class="add">` +
               `<input type="text" placeholder="${esc(T("a directory name, or a path"))}" />` +
               `<button type="submit">${esc(T("add"))}</button></form>` : "") +
             `</section>`;
    };
    rulesPanel.querySelector("#rules-body").innerHTML =
      group(T("Added here"), T("The only ones this window may delete. Any rule can be switched off."),
            rulesOf(RULES.added), true) +
      group(T("From config.toml"), T("Written by hand, and left alone — deleting it here would rewrite the file. Switch it off instead."),
            rulesOf(RULES.config), false) +
      group(T("Built in"), T("Part of the program. Mostly build output and package caches, which churn constantly and bury real results."),
            rulesOf(RULES.builtin), false);
  };

  const loadRules = () =>
    SERVICE.get("rules", {}).then((r) => { RULES = r; drawRules(); }).catch(() => {});

  /* A press arms a row; the button beside the sentence starts anything. */
  const facesPanel = document.getElementById("faces-panel");
  const facesBtn = document.getElementById("faces");
  let ARMED = "";

  const drawFaces = () => {
    const row = (id, label, aside, note) => {
      const here = id === "browser";
      const armed = ARMED === id;
      return `<div class="face ${armed ? "armed" : ""}" data-face="${id}">` +
        `<button type="button" class="pick" ${here ? "disabled" : ""}>` +
        `<span class="dot">${here ? "●" : "○"}</span>` +
        `<span class="name">${esc(label)}</span>` +
        `<span class="aside">${esc(aside)}</span></button>` +
        (armed ? `<div class="say"><p>${esc(note)}</p>` +
                 `<button type="button" class="go">${esc(T("open"))}</button></div>` : "") +
        `</div>`;
    };
    document.getElementById("faces-body").innerHTML =
      row("browser", T("Browser"), T("running now"), "") +
      row("window", T("Window"),
          "",
          T("Starts the Scour window on this machine. This page stays open.")) +
      row("tui", T("Terminal"),
          "",
          T("Opens a terminal and runs Scour in it. This page stays open."));
  };

  facesPanel.addEventListener("click", (e) => {
    const pick = e.target.closest(".pick");
    if (pick) {
      const id = pick.closest(".face").dataset.face;
      ARMED = ARMED === id ? "" : id;
      drawFaces();
      return;
    }
    const go = e.target.closest(".go");
    if (!go) return;
    const id = go.closest(".face").dataset.face;
    go.disabled = true;
    SERVICE.face(id === "window" ? "window" : "tui")
      .then((r) => {
        ARMED = "";
        facesPanel.hidden = true;
        facesBtn.setAttribute("aria-expanded", "false");
        /* Switching is moving, so the server goes; a tab cannot close
           itself, so this says so and stops asking. */
        if (r && r.closing) handedOver();
      })
      .catch((err) => {
        go.disabled = false;
        go.textContent = T("not found");
        console.warn("face:", err);
      });
  });

  /* Nothing still asking: retrying would blame `scourd` for the bridge. */
  function handedOver() {
    HANDED_OVER = true;
    if (PEEK.on) setPeek(false, false);
    const note = document.createElement("div");
    note.className = "handover";
    note.textContent = T("Scour is open elsewhere. You can close this tab.");
    document.body.append(note);
  }

  facesBtn.addEventListener("click", () => {
    const open = facesPanel.hidden;
    ARMED = "";
    facesPanel.hidden = !open;
    facesBtn.setAttribute("aria-expanded", open ? "true" : "false");
    if (open) drawFaces();
  });

  rulesBtn.addEventListener("click", () => {
    const open = rulesPanel.hidden;
    rulesPanel.hidden = !open;
    rulesBtn.setAttribute("aria-expanded", open ? "true" : "false");
    if (open) loadRules();
  });
  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape" && !rulesPanel.hidden) {
      rulesPanel.hidden = true;
      rulesBtn.setAttribute("aria-expanded", "false");
    }
  });

  /* A name goes to `exclude_dirs`; a leading slash makes it a path. */
  rulesPanel.addEventListener("submit", (e) => {
    e.preventDefault();
    const box = e.target.querySelector("input");
    const v = box.value.trim();
    if (!v || !RULES) return;
    const key = v.startsWith("/") ? "paths" : "dirs";
    const next = [...RULES.added[key], v];
    RULES.added[key] = next;
    SERVICE.saveSettings({ ["exclude_" + key]: next });
    box.value = "";
    drawRules();
  });
  rulesPanel.addEventListener("click", (e) => {
    const b = e.target.closest(".drop");
    if (!b || !RULES) return;
    const v = b.dataset.value;
    for (const key of ["paths", "dirs", "files"]) {
      if (!RULES.added[key].includes(v)) continue;
      RULES.added[key] = RULES.added[key].filter((x) => x !== v);
      SERVICE.saveSettings({ ["exclude_" + key]: RULES.added[key] });
    }
    drawRules();
  });
  /* Off is a note, not a deletion, which is what lets the two groups this
     window cannot edit still be turned off. */
  rulesPanel.addEventListener("change", (e) => {
    const box = e.target.closest(".onoff");
    if (!box || !RULES) return;
    const id = box.dataset.id;
    const rest = (RULES.off || []).filter((o) => o.toLowerCase() !== id.toLowerCase());
    RULES.off = box.checked ? rest : [...rest, id];
    SERVICE.saveSettings({ exclude_off: RULES.off });
    drawRules();
  });
  /* No rescan button: saving a rule is what asks for the walk. */

  const langBtn = document.getElementById("lang");
  const langMenu = document.createElement("div");
  langMenu.className = "rowmenu langs";
  langMenu.hidden = true;
  document.body.appendChild(langMenu);

  /* From what the service ships, or it offers a language with no catalogue. */
  function buildLangMenu() {
    langMenu.innerHTML = LANGUAGES.map(({ tag, name }) =>
      `<button type="button" data-lang="${escape_(tag)}">` +
      `<span class="tick">${tag === LANG ? "✓" : ""}</span>${escape_(name)}</button>`
    ).join("");
  }

  langBtn.addEventListener("click", (e) => {
    e.stopPropagation();
    const open = langMenu.hidden;
    langMenu.hidden = !open;
    langBtn.setAttribute("aria-expanded", String(open));
    if (!open) return;
    const r = langBtn.getBoundingClientRect();
    const m = langMenu.getBoundingClientRect();
    langMenu.style.left = Math.min(r.left, innerWidth - m.width - 8) + "px";
    langMenu.style.top = r.bottom + 4 + "px";
  });
  langMenu.addEventListener("click", (e) => {
    const btn = e.target.closest("button[data-lang]");
    if (btn) chooseLanguage(btn.dataset.lang);
  });
  document.addEventListener("click", () => {
    langMenu.hidden = true;
    langBtn.setAttribute("aria-expanded", "false");
  });

  /* No `lang` on the first load: the service knows what was chosen. */
  loadLanguage("").catch(() => {
    /* Every msgid here is its own English, so a failed fetch still draws. */
    applyLanguage();
  });

  /* What the report may reach: it is a separate closure, so anything
   * unpublished throws into a `catch` that reads as the service being down. */
  window.SCOUR = {
    service: SERVICE,
    escape: escape_,
    home: () => HOME,
    /* Handed over, not fetched again: two closures would arrive at different
     * moments. Functions, since the objects are replaced on a switch. */
    t: (msgid, vars) => T(msgid, vars),
    fmt: (n) => fmt(n),
    /* The report's redraw, called from `applyLanguage`. Null until it runs. */
    relabel: null,
    // Both arrive from the service after this runs, so both are getters.
    kinds: () => KINDS,
    barEdges: () => BAR_EDGES,
    /* The report cannot reach `keep`, so it hands over a change. */
    prefs: () => ({ dupes_open: DUPES_OPEN }),
    pref: (patch) => {
      if ("dupes_open" in patch) DUPES_OPEN = !!patch.dupes_open;
      keep(patch);
    },
  };
})();

// ---------------------------------------------------------------- REPORT
// Every number here comes from the index, through `Request::Usage`.
(function () {
  /* By name, so an unhanded reference throws here and not in a `catch`. */
  const SERVICE = window.SCOUR.service;
  const escape_ = window.SCOUR.escape;
  const home = window.SCOUR.home;
  const kinds = window.SCOUR.kinds;
  const barEdges = window.SCOUR.barEdges;
  /* Wrappers rather than values, so a language change is picked up here. */
  const T = window.SCOUR.t;
  const fmt = window.SCOUR.fmt;

  /* The six age bands, resolved at draw time: this runs before the catalogue
     arrives. Named `msgid:`, which is what the catalogue test reads. */
  const AGE = [
    { msgid: "today",      c: "--t0" }, { msgid: "this week", c: "--t1" },
    { msgid: "this month", c: "--t2" }, { msgid: "six months", c: "--t3" },
    { msgid: "this year",  c: "--t4" }, { msgid: "older",     c: "--t5" },
  ];

  const bytes = (n) => {
    const u = ["B","KB","MB","GB","TB"]; let v = n, i = 0;
    while (v >= 1024 && i < u.length - 1) { v /= 1024; i++; }
    return (i ? v.toFixed(1) : v) + " " + u[i];
  };

  /* `Intl` places the sign, which is the language's business. Built per call,
     unlike the other half's: a kept formatter belongs to a language, and 168
     constructions a redraw is 2.0 ms against a 96 ms walk. */
  const percent = (v, digits) => {
    const dp = digits === undefined ? (v < 1 ? 1 : 0) : digits;
    return new Intl.NumberFormat(document.documentElement.lang, {
      style: "percent", minimumFractionDigits: dp, maximumFractionDigits: dp,
    }).format(v / 100);
  };
  const leafOf = (p) => p.slice(p.lastIndexOf("/") + 1) || p;
  /* `~` for the reader's home, read at call time: `HOME` arrives later. */
  const shorten = (p) => {
    const h = home();
    return h && p.startsWith(h + "/") ? "~" + p.slice(h.length) : p;
  };

  /* Where the report is looking; empty is everything, as `Usage` reads it. */
  let scope = "";
  let drawing = 0;

  const crumb = document.getElementById("crumb");
  const kidsEl = document.getElementById("r-kids");

  /* Read at draw time rather than tracked: this tab borrows the search half's
   * element and writes to it only through the clear button, which dispatches
   * `input`. A filter makes the rollup about a third faster, not free. */
  const qBox = document.getElementById("q");
  const filter = () => qBox.value.trim();

  /* From bytes: a percentage of nothing is undefined rather than zero. */
  function stack(age, total) {
    if (!total) return `<div class="stack"></div>`;
    return `<div class="stack">` + age.map((v, i) => {
      const pct = (v / total) * 100;
      if (pct < 0.05) return "";
      return `<i style="width:${pct}%;background:var(${AGE[i].c})"` +
             ` title="${escape_(T(AGE[i].msgid))} · ${escape_(percent(pct))}"></i>`;
    }).join("") + `</div>`;
  }

  function breadcrumb() {
    const parts = scope.split("/").filter(Boolean);
    const all = escape_(T("everything"));
    const home = `<button data-path="">${all}</button>`;
    const where = !parts.length ? `<span>${all}</span>` : home + parts.map((seg, i) => {
      const path = "/" + parts.slice(0, i + 1).join("/");
      const last = i === parts.length - 1;
      const label = last ? `<span>${seg}</span>` : `<button data-path="${path}">${seg}</button>`;
      return `<span class="s">/</span>` + label;
    }).join("");
    /* Beside the scope, and escaped: a query is text somebody typed. */
    const f = filter();
    return where + (f
      ? `<span class="filt">${escape_(T("filter"))} <b>${escape_(f)}</b>
           <button id="unfilter" title="${escape_(T("remove the filter"))}"
                   aria-label="${escape_(T("remove the filter"))}">×</button>
         </span>`
      : "");
  }

  async function drawReport() {
    const mine = ++drawing;
    crumb.innerHTML = breadcrumb();
    const q = filter();
    let res;
    try {
      res = await SERVICE.usage(scope, 24, q);
    } catch (e) {
      if (mine !== drawing) return;
      console.error("scour: the report did not load:", e);
      document.getElementById("r-bytes").textContent = "—";
      document.getElementById("r-meta").textContent = T("the service cannot be reached");
      kidsEl.innerHTML = "";
      return;
    }
    if (mine !== drawing) return;          /* a newer folder won */

    const n = res.root;
    document.getElementById("r-bytes").textContent = bytes(n.bytes);

    /* `disk` beside `bytes`: the logical size is not disk usage. */
    const stale = n.bytes ? Math.round(((n.age[4] + n.age[5]) / n.bytes) * 100) : 0;

    /* Every child is in the answer, since a gap in the rollup's tree strands
       bytes in a grandparent; the empty ones are dropped here. */
    const kids = q ? res.children.filter((c) => c.files > 0) : res.children;
    const cut = q
      ? (res.child_count
          ? " · " + T("{shown} of {total} folders have a match",
                      { shown: fmt(kids.length), total: fmt(res.child_count) })
          : "")
      : res.child_count > kids.length
        ? " · " + T("the heaviest {shown} of {total} folders",
                    { shown: kids.length, total: fmt(res.child_count) })
        : "";
    /* With a filter on this is the matching files, not the folder. */
    const about = q
      ? "<br>" + T("only the <b>matching</b> files · not the whole folder")
      : "";
    document.getElementById("r-meta").innerHTML =
      T("{files} files · {disk} on disk", { files: fmt(n.files), disk: bytes(n.disk) })
      + "<br>"
      + T("<b>{percent}%</b> of it older than a year", { percent: stale })
      + "<br>"
      + `<b>${(res.took_us / 1000).toFixed(1)} ms</b>${cut}${about}`;

    /* Already heaviest-first from the engine, which is what `top` cuts on. */
    kidsEl.innerHTML = kids.map((v) => `
      <tr>
        <td class="nmcell"><button data-path="${v.path}">${leafOf(v.path)} <span style="color:var(--ink-3)">›</span></button></td>
        <td class="stack-wrap">${stack(v.age, v.bytes)}</td>
        <td class="r big">${bytes(v.bytes)}</td>
        <td class="r">${escape_(percent(n.bytes ? (v.bytes / n.bytes) * 100 : 0, 1))}</td>
        <td class="r">${fmt(v.files)}</td>
      </tr>`).join("") ||
      `<tr><td colspan="5" style="padding:24px 8px;color:var(--ink-3);font-size:12.5px">${
        escape_(q
          ? T("In this scope, none of the subfolders has a matching file.")
          : T("There are no further folders to show under this one."))
      }</td></tr>`;

    document.getElementById("agekey").innerHTML = AGE.map((band) =>
      `<span><i style="background:var(${band.c})"></i>${escape_(T(band.msgid))}</span>`).join("");

    drawKinds();
    drawBiggest();
    drawJump();
    // Only if opened: drawing this tab must not start a hunt unasked.
    if (window.SCOUR.prefs().dupes_open !== dupesOpen) {
      showDupes(!!window.SCOUR.prefs().dupes_open, false);
    }
    if (dupesOpen) drawDupes(0);
  }

  /* From the sidebar's own faceting, filter included: a panel beside a
   * filtered headline must not count something else. */
  async function drawKinds() {
    const el = document.getElementById("p-kind");
    const q = ((scope ? `under:${scope} ` : "") + filter()).trim();
    try {
      const res = await SERVICE.sidebar(q, barEdges());
      const g = (res.groups || []).find((x) => x.by === "kind");
      const rows = (g ? g.facets : []).filter((f) => f.count > 0)
        .sort((a, b) => b.count - a.count).slice(0, 8);
      const max = Math.max(1, ...rows.map((r) => r.count));
      el.innerHTML = rows.map((r) => `
        <div class="line" style="position:relative">
          <span style="position:absolute;left:-4px;top:3px;bottom:3px;width:${(r.count / max * 100).toFixed(1)}%;background:var(--line);border-radius:0 2px 2px 0"></span>
          <span style="position:relative">${(kinds().find(([, t]) => t === r.key) || [r.key])[0]}</span>
          <span style="position:relative">${fmt(r.count)}</span>
        </div>`).join("") ||
        `<div class="line"><span style="color:var(--ink-3)">—</span></div>`;
    } catch (e) {
      console.error("scour: the kind panel did not load:", e);
    }
  }

  /* An ordinary search: the index sorts by size without walking. */
  async function drawBiggest() {
    const el = document.getElementById("p-big");
    const q = ((scope ? `under:${scope} ` : "") + "file: " + filter()).trim();
    try {
      const res = await SERVICE.search(q, "size", true, 8, 0);
      el.innerHTML = res.rows.map((r) => `
        <div class="line" title="${r.dir}/${r.name}">
          <span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:60%">${r.name}</span>
          <span>${bytes(r.size)}</span>
        </div>`).join("") ||
        `<div class="line"><span style="color:var(--ink-3)">—</span></div>`;
    } catch (e) {
      console.error("scour: the largest-files panel did not load:", e);
    }
  }

  /* Two numbers, always both: what shares a size against what was read end to
   * end, 39.16 GiB against 4.16 GiB here. Nothing is read unasked. */
  let dupeRun = 0;
  /* The whole speed knob: a unique size rules out only 6.2% of files, so
     below a megabyte the candidates are a million files covering 28 GB. */
  const FLOORS = [[1, "1 MB"], [10, "10 MB"], [100, "100 MB"], [1024, "1 GB"]];
  let dupeFloor = 10;

  async function drawDupes(budgetMb) {
    const mine = ++dupeRun;
    const list = document.getElementById("d-list");
    const sum = document.getElementById("d-sum");
    const btn = document.getElementById("d-confirm");
    sum.textContent = budgetMb ? T("reading…") : "…";
    btn.disabled = true;
    let res;
    try {
      res = await SERVICE.dupes(scope, budgetMb, dupeFloor);
    } catch (e) {
      if (mine !== dupeRun) return;
      console.error("scour: the duplicates panel did not load:", e);
      sum.textContent = T("the service cannot be reached");
      list.textContent = "";
      btn.disabled = false;
      return;
    }
    if (mine !== dupeRun) return;
    btn.disabled = false;

    sum.textContent =
      T("{proven} confirmed · {waste} candidate · {n} files",
        { proven: bytes(res.proven), waste: bytes(res.waste), n: fmt(res.candidates) }) +
      (res.read ? " · " + T("{n} read", { n: bytes(res.read) }) : "") +
      /* No filter, and it says so: narrowing hides half of a pair. */
      (filter() ? " · " + T("independent of the filter") : "");
    /* Never dropped: a partial answer that looks complete deletes files. */
    document.getElementById("d-note").innerHTML = res.unconfirmed
      ? T("Being the same size is not being the same file. <b>{n} groups were not confirmed by reading</b> — those are candidates, not duplicates.", { n: fmt(res.unconfirmed) })
      : T("All of them were compared by reading.");

    /* The engine's three certainties; the keys name the CSS class. */
    const word = {
      content: T("identical"), edges: T("same ends"), size: T("same size only"),
    };
    list.innerHTML = res.groups.map((g) => `
      <div class="dupe">
        <div class="top">
          <span class="save">${bytes(g.waste)}</span>
          <span class="of">×${g.paths.length} · ${bytes(g.size)}</span>
          <span class="sure ${g.certainty}">${escape_(word[g.certainty] || g.certainty)}</span>
        </div>
        <ul>${g.paths.slice(0, 6).map((p) => `<li>${escape_(shorten(p))}</li>`).join("")}${
          /* One group of dozens would otherwise swallow the panel. */
          g.paths.length > 6
            ? `<li style="color:var(--ink-3)">… ${escape_(T("{n} more", { n: fmt(g.paths.length - 6) }))}</li>`
            : ""
        }</ul>
      </div>`).join("") ||
      `<div class="dupe"><div class="top"><span class="of">${escape_(T("no duplicates in this scope"))}</span></div></div>`;
  }

  /* Remembered by the service, so every face starts from the same answer. */
  let dupesOpen = false;
  const dupeParts = ["d-sum", "d-floor", "d-confirm", "d-note", "d-list"];
  function showDupes(open, ask) {
    dupesOpen = open;
    const opener = document.getElementById("d-open");
    opener.textContent = open ? T("hide") : T("show");
    opener.setAttribute("aria-expanded", String(open));
    for (const id of dupeParts) {
      const el = document.getElementById(id);
      if (el) el.hidden = !open;
    }
    if (open && ask) drawDupes(0);
  }
  showDupes(false, false);
  document.getElementById("d-open").addEventListener("click", () => {
    showDupes(!dupesOpen, true);
    window.SCOUR.pref({ dupes_open: dupesOpen });
  });

  const floorBox = document.getElementById("d-floor");
  function drawFloors() {
    floorBox.innerHTML = FLOORS.map(([mb, label]) =>
      `<button type="button" data-mb="${mb}" aria-pressed="${mb === dupeFloor}"
        title="${escape_(T("do not look at anything smaller than this"))}">${label}+</button>`).join("");
  }
  floorBox.addEventListener("click", (e) => {
    const b = e.target.closest("[data-mb]");
    if (!b) return;
    dupeFloor = +b.dataset.mb;
    drawFloors();
    // Free again: a floor change is a different set of files.
    drawDupes(0);
  });
  drawFloors();

  document.getElementById("d-confirm").onclick = () => drawDupes(2048);

  function drawJump() {
    document.getElementById("p-jump").innerHTML =
      `<div class="line"><span>under:</span><span style="font-size:10.5px">${scope || "/"}</span></div>` +
      `<button class="facet" style="padding-left:0;margin-top:6px" id="jump">
         <span class="dot" style="background:var(--t1)"></span>
         <span class="nm">Bu kapsamda ara</span></button>`;
    document.getElementById("jump").onclick = () => {
      const q = document.getElementById("q");
      const rest = q.value.replace(/under:\S+\s*/g, "").trim();
      q.value = (scope ? "under:" + scope + " " + rest : rest).trim();
      q.dispatchEvent(new Event("input"));
      show("search");
    };
  }

  document.querySelector(".report").addEventListener("click", (e) => {
    const b = e.target.closest("button[data-path]");
    if (b) { scope = b.dataset.path; drawReport(); }
    /* Through `input`: the search tab listens on the same element. */
    if (e.target.closest("#unfilter")) {
      qBox.value = "";
      qBox.dispatchEvent(new Event("input"));
    }
  });

  /* Held off a quarter second: this is a roll-up over every matching row.
   * Nothing while the search tab is up — `show("report")` reads the box. */
  let waiting = 0;
  qBox.addEventListener("input", () => {
    if (document.getElementById("view-report").hidden) return;
    clearTimeout(waiting);
    waiting = setTimeout(drawReport, 250);
  });

  function show(which) {
    const s = which === "search";
    document.getElementById("view-search").hidden = !s;
    document.getElementById("view-report").hidden = s;
    document.getElementById("tab-search").setAttribute("aria-selected", String(s));
    document.getElementById("tab-report").setAttribute("aria-selected", String(!s));
    document.querySelector(".meter").style.display = s ? "" : "none";
    if (s) document.dispatchEvent(new Event("scour-search-shown"));
    else drawReport();
  }
  document.getElementById("tab-search").onclick = () => show("search");
  document.getElementById("tab-report").onclick = () => show("report");

  /* `show("report")` redraws the tab when it opens, so only what no later
   * draw rewrites is done here: the floor titles and the show/hide word. */
  window.SCOUR.relabel = () => {
    drawFloors();
    showDupes(dupesOpen, false);
  };
})();

</script>
</body>
</html>
