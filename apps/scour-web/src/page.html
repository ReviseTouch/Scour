    const nm = document.createElement("div");
    nm.className = "nm";
    td.append(rule, nm);
    tr.append(td);
    tr.__nm = nm;
    return tr;
  }

  /* Which shape the pool is made of, so a change of shape can throw it away. */
  let poolShape = "detail";
  /* What the sizer and the spacer were last *told*, which is not the same as
     what they would say if asked. See the note in `paintWindow`. */
  let sizedTo = -1;
  let spacedTo = -1;

  function paintWindow() {
    const [from, to] = visibleRange();
    const p = pitch();
    const cols = shownColumns();
    const parsed = parse(q.value);
    const tiles = grid();

    /* The shape first: one spacer with the right height, and enough rows after
       it. Only a resize or a column change gets past the `while`s. */
    if (body.firstElementChild !== spTop) {
      body.replaceChildren(spTop, farRow);
      pool = [];
    }
    /* **A tile and a row are different nodes.** The cell-count check below
       cannot tell them apart — a tile has one cell and so would a one-column
       table — and rows laid out as a grid are a screenful of thin strips.
       Thrown away rather than rewritten in place because changing shape is a
       click, which happens once, and not a scroll, which happens every frame. */
    if (poolShape !== MODE) {
      for (const tr of pool) tr.remove();
      pool = [];
      poolShape = MODE;
    }
    while (pool.length < to - from) {
      const tr = tiles ? makeTile() : makeRow();
      pool.push(tr);
      body.insertBefore(tr, farRow);
    }
    while (pool.length > to - from) {
      pool.pop().remove();
    }
    /* **How many across, said by the page rather than found out from it.**
       `auto-fill` would let the browser decide, and a browser that fitted one
       more than `PER_ROW` believes would put every tile after the first line
       at the wrong index with nothing to say so. */
    if (tiles) {
      const across = `repeat(${PER_ROW}, minmax(0, 1fr))`;
      if (body.style.gridTemplateColumns !== across) {
        body.style.gridTemplateColumns = across;
      }
    } else if (body.style.gridTemplateColumns) {
      body.style.gridTemplateColumns = "";
    }
    if (!tiles && pool.length && pool[0].children.length !== cols.length + 1) {
      for (const tr of pool) {
        tr.innerHTML =
          `<td class="age"><i></i></td>` + cols.map(() => "<td></td>").join("");
        /* The cells are new even though the row object and file are not. A
           cached stamp from the old shape would make `writeRow` return and
           leave every new cell blank until another search happened to land. */
        tr.__stamp = null;
        tr.__marks = null;
      }
    }
    /* **The list's height is stated, not summed. This is what "sonsuz scroll"
     * was.**
     *
     * It used to be a sum: a top spacer, the rows, a bottom spacer. Recorded
     * from the running window while it was misbehaving, that sum moved
     * constantly — 620,005, 620,004, 620,030, 620,081 — and a scrollable area
     * that changes size makes the browser correct the position it is holding.
     * Correcting the position fires a scroll. A scroll paints. Painting moves
     * the height again. Eight hundred steps in five seconds with nothing
     * touching it, then fifty-three seconds of travelling backwards; the page
     * never wrote a scroll position once, and never needed to.
     *
     * The reason the sum moved is worth stating, because it kills the obvious
     * repair. **There is no such thing as the row height here.** This screen is
     * scaled by 1.667, so a row asking for 31 CSS pixels is 51.67 device
     * pixels, and the browser rounds it to 51 or 52 depending on the fraction
     * the row happens to start at: the same row is 30.6 px in one place and
     * 30.99 px in another, measured, in one screenful. Measuring one row and
     * multiplying — which was tried — is unsound at every scale factor that is
     * not a whole number.
     *
     * So the rows are not asked. `.sizer` is as tall as the list is, from the
     * row count alone, and it is the only thing in the scroller that reaches
     * that far. The rows are pushed down by the top spacer and are always
     * shorter than what is left, so nothing they do can add to the total. The
     * height stops being a result and goes back to being a decision. */
    /* Said at the end of the list rather than not at all: a list that stops
       twenty thousand rows into two million has to say which of those two
       numbers it is showing. Decided here rather than below, because it is one
       more thing that has to fit above the bottom. */
    const far = LIST.total > REACH && to >= reach();
    if (farRow.hidden === far) farRow.hidden = !far;

    [spTop, farRow].forEach(widen);
    const tall = Math.round(lines() * p);
    /* **Remembered rather than read back off the element.**
     *
     * This compared `sizer.style.height` with the string it was about to
     * write, which works only while the number is short. Chromium
     * re-serialises a CSS length to six significant figures, so a height of
     * `1146724px` — a narrow window, large tiles, three across, six thousand
     * lines — reads back as `1.14672e+06px`. The comparison then failed every
     * time and the sizer's height was rewritten on **every frame**: the same
     * value, but a style write that dirties the one element whose height is
     * the scrollable extent, every frame, for as long as the window is open.
     * Nothing here was ever a measurement of the element, so nothing has to
     * ask it what it made of what it was told. */
    if (sizedTo !== tall) {
      sizedTo = tall;
      sizer.style.height = `${tall}px`;
    }
    /* Everything the table holds besides the spacer, generously: the headings,
       the lines at the largest they round to, the notice if it is showing, and
       a few pixels over. The spacer stops there, so whatever the table does
       with its own layout it stays inside what `.sizer` already claimed.

       Counted in lines, and the end-of-list note is measured against a *row*
       in both shapes because that is what it is — a line of prose, not a
       tile. */
    const drawn = Math.ceil((to - from) / PER_ROW);
    const inside =
      headPx + drawn * (linePx[MODE] + 0.5) + (far ? linePx.detail + 12 : 0) + 4;
    const above = Math.max(0, Math.min(tall - inside, Math.round((from / PER_ROW) * p)));
    // Remembered, for the reason the sizer's height is: the spacer runs to
    // seven figures at the far end of a grid too.
    if (spacedTo !== above) {
      spacedTo = above;
      spTop.firstElementChild.style.height = `${above}px`;
    }
    if (far) {
      const note = T(
        "the first {reach} rows · of {total} matches. Narrow the search to go further.",
        { reach: fmt(REACH), total: fmt(LIST.total) },
      );
      if (farRow.firstElementChild.textContent !== note) {
        farRow.firstElementChild.textContent = note;
      }
    }

    /* Whatever was selected keeps being selected. The rows are reused, so what
       has to be restored is which one holds the focus rather than the element
       itself — the index a row sits at is exactly what a change moves. */
    const had = document.activeElement;
    const keep = had && body.contains(had) ? had.dataset.path : null;

    // The marked letters move with the query, so a row whose file has not
    // changed still has to be rewritten when the terms have. Joined once here
    // rather than per row.
    const marks = parsed.text.join("\u0001");
    for (let i = from; i < to; i++) {
      // Which row of the whole list this slot is showing. A shift-range is
      // measured in these, and a slot shows a different one after every
      // scroll — so it is written every paint rather than once.
      pool[i - from].dataset.i = String(i);
      writeRow(pool[i - from], LIST.rows.get(i), cols, parsed, marks);
    }
    // After the writes and never inside them: `writeRow` assigns `className`
    // outright, and it returns early when a slot's file has not changed —
    // which is exactly the case where its selection has.
    paintSelection();
    /* And the clock's next wake, because scrolling changes which rows are on
       screen and therefore when any of them next reads differently. Without
       this, scrolling to a file saved a moment ago during a sixty-second sleep
       leaves it saying the wrong number until that sleep ends. */
    scheduleClock();
    if (keep) {
      const back = pool.find((tr) => tr.dataset.path === keep);
      if (back) back.focus({ preventScroll: true });
    }
  }

  /* One row, rewritten in place.
   *
   * Every cell is set from the row's own values, and none of them goes through
   * HTML. A row with no data yet is a ghost — the same node, emptied. */
  function writeRow(tr, f, cols, parsed, marks) {
    /* **The row this slot already shows.**
     *
     * Scrolling moves every slot onto a different file, so this saves nothing
     * there — but a live refresh repaints the same rows several times a second
     * on a machine whose index keeps moving, and a repaint that changes
     * nothing should cost nothing. */
    /* Every fact a visible cell can read. A live refresh replaces the row
       object, but it may leave its path, mtime and size unchanged: chmod,
       chown and an access-time update are the ordinary examples. The old
       four-field stamp made every other enabled column silently stale.

       External display state (HOME, MOUNTS, the chosen columns and translated
       kinds) invalidates the stamps where that state changes. */
    const under = f && f.under;
    const stamp = f ? [
      f.path, f.name, f.mtime, f.size, f.fresh || 0,
      f.is_dir ? 1 : 0, f.thumb ? 1 : 0, f.ktoken || "", f.kind || "",
      f.ext || "", f.ctime || 0, f.atime || 0, f.perm || "",
      f.user || "", f.group || "", f.disk || 0, f.items || 0,
      under ? under.disk : "", under ? under.files : "",
    ].join("\u0001") : "";
    if (tr.__stamp === stamp && tr.__marks === marks) {
      return;
    }
    tr.__stamp = stamp;
    tr.__marks = marks;
    if (!f) {
      if (tr.className !== "ghost") {
        tr.className = "ghost";
        tr.removeAttribute("data-path");
        tr.removeAttribute("title");
        tr.style.animationDelay = "";
        // **From the second cell on.** The first holds the age dot, which is
        // an element rather than text; emptying it took the dot away, and the
        // next time the row held a file the dot was not there to be coloured.
        // The throw landed in a `catch` that exists for a fetch failing, so
        // the list simply stopped filling after two rows and said nothing.
        if (tr.__nm) tr.__nm.textContent = "";
        else for (let i = 1; i < tr.children.length; i++) tr.children[i].textContent = "";
        // The glyph does have to go: a row waiting for its file must not wear
        // the picture of the one that was in the slot before it. The rule
        // keeps its colour, as it always has — a ghost is a row on its way,
        // not a row that is wrong.
        writeMark(tr.firstElementChild, null);
      }
      return;
    }
    const full = f.path + "/" + f.name;
    // The preview panel wants the row, not the path: it has every fact it
    // shows already, and re-asking the service for what is on the screen would
    // be a second round trip to learn nothing new.
    tr.__row = f;
    tr.className = f.fresh ? "fresh" : "";
    tr.style.animationDelay = f.fresh ? `-${Date.now() - f.fresh}ms` : "";
    if (tr.dataset.path !== full) {
      tr.dataset.path = full;
      tr.title = full;
    }
    // `firstElementChild` rather than `children[0]`: a row's first cell holds
    // the rule and the glyph, and a tile's only cell holds the rule, the
    // glyph and the name. Same call, same two elements, one place.
    const dot = writeMark(tr.firstElementChild, f);
    dot.style.background = `var(${bandOf(f.mtime)})`;
    /* A tile is a picture and a name and no columns at all — the columns are
       still there, they are what the headings sort by and what the detail
       list shows. Which of them a person has chosen says nothing about what a
       tile should hold, and forcing `name` to be shown so that a tile could
       borrow its cell would have been the shape deciding the settings. */
    if (tr.__nm) {
      writeName(tr.__nm, f, parsed.text);
      return;
    }
    for (let c = 0; c < cols.length; c++) {
      cols[c].write(tr.children[c + 1], f, parsed);
    }
  }

  /* **What is on the screen now, and nothing else.**
   *
   * A flick down a two-million-row list crosses a window boundary every few
   * frames. Every crossing used to start a request, none of them were ever
   * called off, and a browser opens six connections to an origin — so by the
   * time the hand stopped, the one window being looked at was queued behind
   * thirty nobody would ever see. Deep windows are dearer too (16 ms at the
   * top of the list, 84 ms at the far end, measured), so the queue got slower
   * exactly as it got longer. That is the "tıkanıyor".
   *
   * The policy is the one Hasan asked for: load what can be loaded now, skip
   * what cannot, and whatever went past while scrolling has gone past. So each
   * pass abandons every request outside the visible range — `AbortController`,
   * which frees the connection rather than merely ignoring the answer — and
   * starts at most `INFLIGHT` new ones, nearest the middle of the screen
   * first, because that is the window the eye is on.
   */
  /* **Ask at once, and abandon whatever the screen has left behind.**
   *
   * This waited ninety milliseconds for the hand to stop, and that was a
   * bandage over the engine. A window used to cost what it took to walk to its
   * offset — 16 ms at the top of a broad result and 114 ms at row nineteen
   * thousand — so a flick that crossed twenty-five of them queued twenty-five
   * increasingly expensive walks behind the one window anybody would look at.
   * Waiting made the flick free; it also made every stop cost a wait.
   *
   * The engine keeps the ordering of the query being looked at now, so a page
   * is a slice of it: **5.5 ms at row nineteen thousand, against 114**, and
   * flat at every depth. Nothing has to be rationed at that price. The list
   * asks the moment the range changes, calls off anything that has scrolled out
   * of view — `AbortController`, so the connection is freed rather than the
   * answer ignored — and whatever went past while the hand was moving has gone
   * past, which is what was wanted in the first place. */
  const INFLIGHT = 4;

  /* How long a result set has to have stood still before the page reads ahead
     into it. Long enough that typing does not start a hundred fetches, short
     enough that a pause is indistinguishable from having stopped. */
  const SETTLED = 400;

  /* What a window may cost before reading ahead stops being worth it, in
     milliseconds of the service's own measure.
     A hundred windows is the whole reachable list, so this is the price of
     filling it in: two and a half seconds at 25 ms, four minutes at 2,464.
     The number is a budget for the *whole* read-ahead rather than a judgement
     about one request. */
  const READ_AHEAD_MAX = 25;

  /* **The rest of the list, quietly, while nothing nearer is waiting.**
   *
   * Asking only for what is on the screen leaves it blank whenever the hand
   * outruns the answer, and it can: a fast drag covers sixty to a hundred and
   * sixty rows a *frame*, so even four hundred rows of headroom is three frames
   * of it. No reaching distance survives a hand that means it.
   *
   * What survives is the rows already being here. The list reaches twenty
   * thousand, a thousand of them are 378 KB on the wire, and a window is 5.5 ms
   * now that the engine keeps the ordering — so the whole of what can be
   * scrolled to is about a hundred requests and well under a second of a
   * machine that is otherwise idle. One at a time, only when nothing nearer the
   * screen is outstanding, nearest the viewport first, abandoned the moment the
   * query changes. */

  /* The missing window nearest the screen, out of the whole reachable list.
     Outward from the viewport rather than from row zero, so a list being read
     from the middle fills around where it is being read. */
  function nextMissing(from, to) {
    const end = reach();
    const here = Math.floor((from + to) / 2 / WINDOW) * WINDOW;
    for (let step = 0; step * WINDOW <= end; step++) {
      const tries = step === 0 ? [here] : [here + step * WINDOW, here - step * WINDOW];
      for (const start of tries) {
        if (start < 0 || start >= end) continue;
        /* `at` rather than `rows`: a window that came back empty is fetched,
           and asking `rows` about it answered "missing" for ever. On a list
           whose reachable length is a guess until the exact count lands —
           which is every list, for the first fifth of a second — that was a
           request a frame, at the same offset, until the count arrived. */
        if (!LIST.at.has(start) && !LIST.pending.has(start)) return start;
      }
    }
    return null;
  }

  function fillWindow() {
    if (LIST.query === null) return Promise.resolve();  /* no search has landed */
    const [from, to] = visibleRange();

    const first = Math.floor(from / WINDOW) * WINDOW;
    const wanted = [];
    for (let start = first; start < to; start += WINDOW) {
      if (LIST.pending.has(start)) continue;
      // On screen, out of date is as good as missing. Off screen it is not.
      if (LIST.at.get(start) === SHOWING) continue;
      wanted.push(start);
    }
    /* **A list with nothing in it still has to be asked about.** `reach()` is
       zero once the exact count says nothing matched, so the range is `[0, 0]`
       and the loop above covers no window at all. Carried over from the
       refresh this replaced, which had the same line for the same reason
       (`if (!starts.length) starts.push(0)`). Once per revision like any other
       window: the answer stamps `LIST.at`, so it is not asked again until the
       clock moves.
     *
     * It was not enough on its own, and the reason turned out to be nothing to
     * do with this line. The note that stood here said: with the query on
     * something nothing matched, creating a file that does match moved the
     * counter to `1 / 2.235.320` and drew no row, identically on both
     * binaries. It did — because *this* is on the clock and the counter is
     * not. `SHOWING` moves only when `refreshRows` runs, and `rowsSoon` waits
     * `max(400 ms, what the last refresh cost x COST)` — seconds of it, if the
     * list was on folder order a moment ago — while `countsSoon` keeps its
     * three. Measured in the running window: the count said `1` at 2.5 s and
     * the first window of rows was not asked for until 15.1 s. See
     * `dropShort`, which is what now says that a count contradicting the rows
     * makes those rows missing rather than merely old. */
    if (first >= to && LIST.at.get(0) !== SHOWING && !LIST.pending.has(0)) wanted.push(0);
    /* Nearest the middle of the window first. */
    const eye = (from + to) / 2;
    wanted.sort((a, b) => Math.abs(a + WINDOW / 2 - eye) - Math.abs(b + WINDOW / 2 - eye));

    /* **Anything in flight that the screen has left behind — except the one
     * window the reading-ahead started, which is off the screen on purpose.**
     *
     * That exception was missing and it cost exactly double. The reading-ahead
     * asks for a window at row nineteen thousand; the next call of this
     * function — one frame later, or from the answer to the window before it —
     * saw a request outside the viewport and abandoned it, and the
     * reading-ahead then asked for the same window again. Measured in the
     * running window on an untouched list, the offsets asked for came back
     *
     *     19000 abort, 19000 abort, 19000 ok, 19200 abort, 19200 ok,
     *     19400 ok, 19600 abort, 19600 ok, 19800 abort, 19800 ok
     *
     * — every one of those aborts a page of the index the service had already
     * built and nobody read.
     *
     * It is still let go of the moment the screen wants something, which is
     * what the abandoning was for: a request nobody is waiting for holding one
     * of the six connections a browser opens to an origin. */
    for (const [start, request] of LIST.pending) {
      const behind = start + WINDOW <= from || start >= to;
      if (request.ahead ? !wanted.length : !behind) continue;
      request.stop.abort();
      LIST.pending.delete(start);
    }

    /* **And only once the query has stopped changing.** Reading ahead is for a
       list somebody is looking at; a result set one keystroke old is about to
       be thrown away. Measured while typing a five-letter word: 123 window
       requests, nearly all for orderings that no longer existed by the time
       they arrived. */
    /* **And only while a window is cheap.**
     *
     * The whole case for reading ahead was the price: "a window is 5.5 ms now
     * that the engine keeps the ordering, so the whole of what can be scrolled
     * to is about a hundred requests and well under a second of a machine that
     * is otherwise idle." That sentence is true of the *stored* order and of
     * nothing else. Measured on this index, 2,241,762 rows, one window of two
     * hundred:
     *
     *     sort: modified      3.2 ms      1,734 rows visited
     *     sort: size      1,220.0 ms  2,241,640
     *     sort: path      2,463.6 ms  2,241,762
     *
     * Every order but the stored one has to look at every match to know which
     * two hundred come first — the count cap bounds the counting, not the
     * ordering. So a hundred windows of read-ahead is four minutes of the
     * service rather than under a second, and the list becomes unusable
     * exactly when somebody sorts it by name or by folder. That is what "arama
     * süreleri felaket oldu" was: eleven seconds for one screen, with the
     * reading-ahead queued behind it.
     *
     * The rows on screen are still fetched at any price — that is what was
     * asked for. This governs only the rows nobody has looked at. */
    const affordable = LIST.cost <= READ_AHEAD_MAX;
    let ahead = null;
    if (affordable && Date.now() - LIST.since > SETTLED &&
        !wanted.length && LIST.pending.size === 0) {
      ahead = nextMissing(from, to);
      if (ahead !== null) wanted.push(ahead);
    }

    const started = [];
    for (const start of wanted.slice(0, Math.max(0, INFLIGHT - LIST.pending.size))) {
      const request = {
        generation,
        query: LIST.query,
        sort: LIST.sort,
        desc: LIST.desc,
        /* The revision this answer will be current as of. Recorded at the ask
           rather than read at the answer, so a refresh that starts while this
           one is in flight leaves the window correctly out of date instead of
           stamping it with a revision it was never fetched at. */
        rev: SHOWING,
        ahead: start === ahead,
        stop: new AbortController(),
      };
      LIST.pending.set(start, request);
      started.push(SERVICE.search(request.query, request.sort, request.desc, WINDOW, start, request.stop.signal)
        .then((res) => {
          /* Clearing an old result set does not cancel its fetch. Compare the
             request object before deleting: an old answer for window 400 must
             not delete a newer query's pending window 400. */
          if (LIST.pending.get(start) !== request) return;
          if (request.generation !== generation ||
              request.query !== LIST.query || request.sort !== LIST.sort ||
              request.desc !== LIST.desc) {
            LIST.pending.delete(start);
            return;
          }
          /* Convert the whole answer before committing it or clearing the
             pending token. If one malformed row throws, the catch below can
             still identify and report this request instead of silently
             returning because its token was already gone. */
          const rows = res.rows.map(fromService);
          LIST.pending.delete(start);
          // What this one cost, so the reading-ahead knows what a hundred more
          // would. The service's own measure rather than the round trip: a
          // window queued behind three others took as long as all four, and
          // charging it for their time would stop the reading-ahead for a
          // list that is actually cheap.
          LIST.cost = res.took_us / 1000;
          /* A window that was already here is being *refreshed*, and what is
             in it now that was not in the cache a moment ago is a file that
             turned up. See `putRows` for why a first fetch is not marked. */
          const refreshing = LIST.at.has(start);
          putRows(start, rows, refreshing);
          LIST.at.set(start, request.rev);
          /* **The exact total, off any window that carries one.**
           *
           * This came here with the live refresh that used to be a second
           * fetcher: it is the one thing that fetcher did that this one did
           * not. Only when the engine reached the end of the matching set — a
           * search answers under a count cap so that it can keep up with
           * typing, and taking the capped number would snap the scrollbar back
           * to 1.000 every time a file changed. */
          if (!res.capped && (!LIST.exact || LIST.total !== res.total)) {
            setTotal(res.total, true);
          }
          if (refreshing) now = Math.floor(Date.now() / 1000);  /* "5 min ago" moves */
          repaint(true);
          /* A slot has just come free, and the screen may be somewhere else
             now. Asking again here is what keeps a still list filling in
             without waiting for the hand to move. */
          fillWindow();
        })
        .catch((e) => {
          if (LIST.pending.get(start) !== request) return;
          LIST.pending.delete(start);
          // Being scrolled past is the ordinary case, not a fault.
          if (e && e.name === "AbortError") return;
          // Not silent. A failed window remains a ghost until another event
          // chooses a retry policy, but it must not masquerade as a draw.
          console.error("scour: a window did not load:", e);
        }));
    }
    /* What this call set going, so a caller that is paying for it can be
       charged — `refreshRows` is the one that does. Every branch above is
       already caught, so this settles rather than rejects. */
    return Promise.all(started);
  }

  /* **One door into the painter, and it opens on a frame.**
   *
   * A scroll fires far more often than a screen refreshes, so the paint is
   * coalesced to the frame: the work happens as often as it can be seen and no
   * oftener, and a scroll inside the rows already drawn costs nothing at all,
   * which is most of them.
   *
   * The part that was missing is that everything *else* painted immediately —
   * a window of rows landing from the service, a live revision, a layout
   * toggle — and an immediate paint reads `scrollTop` and `clientHeight` while
   * the tree is still dirty from the paint before it. That read is not free:
   * the browser has to lay the document out before it can answer, and with a
   * table under a thirty-million-pixel spacer the answer cost **24 to 32 ms**,
   * measured by the browser itself as forced style and layout inside a script.
   * Twice in a hundred and fifty frames, which is exactly what a scroll that is
   * mostly smooth and occasionally lurches feels like.
   *
   * So nothing paints inline. Ask for a paint and it happens at the top of the
   * next frame, where the layout is settled and the same read is free.
   */
  let paintQueued = false;
  let dirty = false;          /* the rows changed, though the range did not */
  let painted = "";
  /* ---------------- the clock behind "12 sec ago" ----------------
   *
   * `now` was refreshed in two places: when a live revision landed and when a
   * search ran. Nothing else moved it. At minute granularity that is invisible
   * for up to a minute and on a busy machine never noticed at all — the index
   * here moves every few seconds, so the text was dragged along by accident.
   * At second granularity the same arrangement is wrong within one second, and
   * on a quiet machine it freezes altogether.
   *
   * **Not a fixed tick.** The service had one — ten times a second, firing
   * whether or not there was anything to do — and it was replaced by a sleep
   * to the next real deadline for reasons that were measured. The same shape
   * applies here: wake when the soonest row's text would change, and not
   * otherwise.
   *
   *   a row younger than a minute   →  the next second
   *   nothing young, a date shown   →  the next minute
   *   no date column, or hidden     →  no timer at all
   *
   * So a list of files last touched in March schedules nothing, and a window
   * behind another window schedules nothing, which is most windows most of
   * the time.
   *
   * Only the date cells are rewritten. A full repaint would not do it anyway:
   * `writeRow` returns early when a slot's file has not changed, and what has
   * changed here is not the file. */
  let clockTimer = null;
  const HOUR = 3600;

  /* When `Math.round(s / unit)` next lands on a different number.
   *
   * Early is harmless — one extra rewrite of a cell that says the same thing —
   * and late is the bug, so this rounds the boundary up. */
  const nextRound = (s, unit) =>
    Math.max(1, Math.ceil((Math.round(s / unit) + 0.5) * unit - s));

  /* How long until this row's text is no longer what it says.
   *
   * One line per band of `ago`, and they have to stay in step: a band written
   * in days that is watched in minutes wakes 1,440 times for nothing, and one
   * written in seconds that is watched in minutes is wrong for 59 of them. */
  function nextChange(s) {
    if (s < 0) return Math.max(1, -s);          // a timestamp in the future
    if (s < 60) return 1;                       // seconds, counted not rounded
    if (s < HOUR) return nextRound(s, 60);
    if (s < DAY) return nextRound(s, HOUR);
    if (s < 30 * DAY) return nextRound(s, DAY);
    if (s < 365 * DAY) return nextRound(s, 30 * DAY);
    return nextRound(s, 365 * DAY);
  }

  function dateCells() {
    const keys = new Set(["modified", "created", "accessed"]);
    return shownColumns()
      .map((c, i) => (keys.has(c.key) ? { at: i + 1, col: c } : null))
      .filter(Boolean);
  }

  /* The value a date column reads, without asking the column to write itself. */
  const stampOf = (f, key) =>
    key === "modified" ? f.mtime : key === "created" ? f.ctime : f.atime;

  /* **One walk, and only what a second can change** — the text, and once in a
   * great while the freshness colour.
   *
   * Two things were wrong with the first version and the measurement found
   * both. It called the column's own `write`, which is right in the sense that
   * one place then knows what a date cell looks like and wrong in every other:
   * that path also sets the title, and the title is the exact time the file
   * was written — the one thing about a row that cannot change. Fifty-eight of
   * them were being rebuilt through `Intl` every second. And the tick and the
   * scheduling were two passes over the same rows, each with its own DOM
   * query, to answer two questions about the same numbers.
   *
   * Measured on the live index, alternating binaries, a list where dozens of
   * rows are seconds old: **0.39% of a core**, about 3.9 ms a tick, against
   * 0.067 ms for the writes themselves.
   *
   * So: one pass over `pool` — the rows the painter already holds, no query —
   * writing what moved and returning when anything next moves.
   */
  function clockPass(write) {
    const where = dateCells();
    const awake = where.length && !document.hidden &&
      !document.getElementById("view-search").hidden;
    if (!awake) return 0;
    let soonest = HOUR;
    for (const tr of pool) {
      const f = tr.__row;
      if (!f) continue;
      for (const { at, col } of where) {
        if (col.key === "accessed" && frozenAtime(f)) continue;
        const v = stampOf(f, col.key);
        if (!v) continue;
        soonest = Math.min(soonest, nextChange(now - v));
        if (!write) continue;
        const td = tr.children[at];
        if (!td) continue;
        const text = ago(v);
        if (td.textContent !== text) td.textContent = text;
        if (col.key === "modified") {
          // Guarded: an unconditional inline-style write invalidates the cell
          // every second to set it to what it already was.
          const c = `var(${bandOf(v)})`;
          if (td.style.color !== c) td.style.color = c;
        }
      }
    }
    return soonest;
  }

  function tickClock() {
    clockTimer = null;
    now = Math.floor(Date.now() / 1000);
    arm(clockPass(true));
  }

  function scheduleClock() {
    arm(clockPass(false));
  }

  /* Zero means nothing on screen can change — no date column, a hidden window,
     the report tab — and nothing is armed at all. */
  function arm(soonest) {
    clearTimeout(clockTimer);
    clockTimer = null;
    if (soonest > 0) clockTimer = setTimeout(tickClock, soonest * 1000);
  }

  /* A hidden window has nothing to keep current, and a shown one may have been
     hidden for an hour. Both are the same event. */
  document.addEventListener("visibilitychange", () => {
    if (document.hidden) { clearTimeout(clockTimer); clockTimer = null; }
    else tickClock();
  });

  function repaint(rowsChanged) {
    if (rowsChanged) dirty = true;
    if (paintQueued) return;
    paintQueued = true;
    requestAnimationFrame(() => {
      paintQueued = false;
      /* **Every frame, from a row that has something in it.**
       *
       * At the top of a frame the layout is settled, so this read is free —
       * which is the whole reason the painter has one door. Measuring once was
       * tried and was wrong: the first paint has nothing in its rows yet, an
       * empty row is not the height of a full one, and a number taken then is
       * kept forever. It is cheaper to ask every time than to be wrong once. */
      /* And how many tiles fit across, for the same reason and at the same
         cost: the layout is settled here and both reads are free. Before the
         range is asked for, because the range is computed from it. */
      measurePerRow();
      const sample = pool.find((tr) => tr.dataset.path) || pool[0];
      if (sample) {
        const h = sample.getBoundingClientRect().height;
        /* A clearance bound can grow, never oscillate. In particular it does
           not become the logical pitch: device-pixel rounding is paint output,
           not list state. */
        if (h > linePx[MODE]) { linePx[MODE] = h; painted = ""; }
      }
      // The header sits inside the table and is as much of its height as any
      // row is. Read here for the same reason and at the same cost.
      const head = body.previousElementSibling;
      if (head) headPx = Math.max(headPx, head.getBoundingClientRect().height || 0);
      const now = visibleRange().join();
      if (now === painted && !dirty) {
        return;
      }
      /* Commit the bookkeeping after the draw. Previously a bad row could
         throw after `painted` and `dirty` said the work was complete; every
         later scroll inside the same range then skipped the wedged window. */
      try {
        paintWindow();
      } catch (e) {
        dirty = true;
        console.error("scour: a window did not draw:", e);
        return;
      }
      painted = now;
      dirty = false;
      fillWindow();
      /* **After the draw, and on a timer of its own.** Making a thumbnail is
         a separate process doing image decoding; nothing about it may be in
         front of a paint, a scroll or a keystroke. `picturesSoon` restarts its
         wait on every repaint, so a scroll that is still moving never gets as
         far as asking — see the picture section further down. */
      picturesSoon();
    });
  }
  const onScroll = () => repaint(false);
  scrollEl.addEventListener("scroll", onScroll, { passive: true });
  addEventListener("resize", () => { charW = 0; painted = ""; repaint(true); });
  document.addEventListener("scour-search-shown", () => { painted = ""; repaint(true); });
  document.fonts.ready.then(() => { charW = 0; painted = ""; repaint(true); });

  /* Only the newest answer is allowed to draw.
     Typing produces one request a keystroke and they do not come back in the
     order they were sent; without this, pausing after "rapor" can leave the
     screen showing what "rapo" matched. */
  let generation = 0;
  /* The search this keystroke started, so the next one can let it go. */
  let typingSearch = null;
  let lastMeter = null;

  function render() {
    const text = q.value;
    /* Facets describe the matching set, not its order. Keep that distinction
       before the search lands: by then `LIST.query` has moved to `text` and
       there is no longer a way to tell a new query from a re-sort. */
    const queryChanged = LIST.query !== text;
    /* Everything that depends only on the text happens now, at typing speed.
       The list catches up when the service answers, and the two being
       separate is why the caret never waits for a search. */
    paint(text);
    // The colouring and the sentence both arrive from the engine, a moment
    // behind the keystroke; the caret never waits for them.
    refreshReading(text);
    showHints();
    syncHeads();

    /* One search in flight, and the older ones let go of.
     *
     * This asks for a whole window of rows — around a hundred kilobytes of
     * them for a query that matches a lot, which on the Windows volume is
     * most of them. Seven letters typed at speed meant seven of those at
     * once, and a browser opens **six** connections to an origin: the last
     * keystroke, the only one anybody is waiting for, queued behind six
     * answers already on their way to being thrown out — and each of those
     * six was still downloaded and still parsed on the main thread before
     * `generation` discarded it.
     *
     * `SERVICE.search` has taken a signal since the list learned to abandon
     * windows scrolled past, and its own note says why: a request nobody is
     * waiting for still holds one of the six. The typing path was the one
     * caller that never passed one. `generation` stays — it decides which
     * answer may draw, which is a different question from which request is
     * still worth finishing. */
    const mine = ++generation;
    if (typingSearch) typingSearch.abort();
    typingSearch = new AbortController();
    SERVICE.search(text, sortKey, sortDesc, WINDOW, 0, typingSearch.signal)
      .then((res) => {
        if (mine !== generation) return;   // a newer keystroke won
        /* Facets and an exact total belong to the matching set, not its order.
           A sort-only search still answers under the typing cap; replacing a
           known exact total with that floor would leave the meter at `1000+`
           forever, because sort-only work deliberately does not recount the
           sidebar below. A genuinely new query, or an uncapped fresher answer,
           is authoritative. */
        const keepExact = !queryChanged && LIST.exact && res.capped;
        /* A new result set: everything cached belonged to the old one. */
        LIST.query = text; LIST.sort = sortKey; LIST.desc = sortDesc;
        /* And so did the selection. It is keyed by path so it would survive a
           re-sort intact, which is right — but a *different query* is a
           different set of files, and rows that are no longer on screen going
           on being selected is how somebody copies a list they cannot see. */
        if (queryChanged) clearSel();
        clearRows();
        for (const request of LIST.pending.values()) request.stop.abort();
        LIST.pending.clear();
        /* Before `putRows` below, which is what fills the cache this reads —
           the sweeps inside it have nothing to look at yet and `clearRows`
           has just emptied `LIST.at`, so they are no-ops here. Said in one
           place all the same; see `setTotal`. */
        if (!keepExact) setTotal(res.total, !res.capped);
        LIST.since = Date.now();
        /* The first window of the new set, and therefore the first word on
           what the rest of it would cost. */
        LIST.cost = res.took_us / 1000;
        /* **And this window is current.** Without saying so, `fillWindow` found
           window zero present but unstamped one frame later, called it out of
           date and asked the service for the same two hundred rows again —
           one wasted request per keystroke, every keystroke. */
        SHOWING = REV;
        const rows = res.rows.map(fromService);
        putRows(0, rows, false);
        LIST.at.set(0, SHOWING);
        scrollEl.scrollTop = 0;
        FILES = rows;
        lastMeter = res;
        /* The new rows and the old sidebar must never describe two different
           matching sets. Keep the taxonomy in place, but blank its old counts
           until the quiet, query-scoped answer arrives. */
        if (queryChanged) markSidebarStale();
        draw(text, parse(text), FILES, res);
        /* And everything else about a *new matching set* — but not on this
           keystroke. A sort changes only the order, so asking the index to
           count the same facets again would be pure work. See `sidebarSoon`. */
        if (queryChanged) {
          sidebarCost = 0;
          sidebarSoon();
        }
      })
      .catch((e) => {
        // Abandoned on purpose, by the next keystroke. Not a service that
        // went away, and saying so would put the window offline mid-word.
        if (e.name === "AbortError") return;
        if (mine !== generation) return;
        offline(e);
      });
  }

  /* The service has answered. Everything from here down is the page the mockup
     already was — it never learns where the rows came from. */
  function draw(text, p, hits, res) {
    now = Math.floor(Date.now() / 1000);

    /* Which rows are on screen is `paintWindow`'s business, not this one's;
       what changed here is the query, so every row has to be written again
       even where the file is the same — the marked letters moved. */
    for (const tr of pool) tr.__stamp = "";
    repaint(true);
    /* "No matches" is not decided here any more; `setTotal` is the one place
       that moves the length and the message together. This used to write it
       and got it the wrong way round once — the one case the message exists
       for was the one case it was hidden in — which is a good argument for
       there being a single place rather than four. */

    /* The meter is the service's arithmetic rather than the page's. Read the
       query-scoped state, not necessarily this capped search reply:
       A sort-only response deliberately preserves the exact total that the
       sidebar already paid for, while a new broad query still reads `1000+`
       instead of claiming a number the engine did not actually reach. */
    const shown = LIST.exact ? fmt(LIST.total) : fmt(LIST.total) + "+";
    document.getElementById("count").textContent = withIndexTotal(shown);
    drawCost(res.took_us, res.rows_visited);

    syncFacets(p);
  }

  /* What the last search cost, kept rather than only printed.
   *
   * **Kept because the two halves of it are in a language.** The separator is
   * — `0,29 ms` in Turkish and `0.29 ms` in English — and "rows read" is a
   * sentence. Written once and never revisited, a switch left the two figures
   * beside a count and a status line that had both changed, in the language
   * before last, until somebody happened to type. Measured in the window:
   * `10,48 ms · 200 satır okundu` under an English heading row. */
  let LAST_COST = null;
  function drawCost(us, rowsVisited) {
    if (us !== undefined) LAST_COST = { us, rowsVisited };
    if (!LAST_COST) return;
    /* **The decimal separator is the language's, not a `replace`.** This read
       `.toFixed(2).replace(".", ",")` — a comma written in by hand because the
       window was Turkish — which printed `0,29 ms` under an English interface
       showing `4,864 rows`, two different meanings for one character in one
       line. `Intl` knows which is which. */
    document.getElementById("ms").textContent = MS.format(LAST_COST.us / 1000) + " ms";
    document.getElementById("rows").textContent =
      T("{n} rows read", { n: fmt(LAST_COST.rowsVisited) });
  }

  /* The rest of the answer: the exact total, the rail and the chart, from
     one walk of the matching set.
     A later deadline than the rows, which are already on screen — and one
     request rather than three, because they are three views of the same rows
     and asking separately walked them three times. */
  /* **The count and the rail wait for the typing to stop.**
   *
   * The rows do not: a window of them is 7 to 13 ms whatever is typed, so
   * every keystroke can have its own. The sidebar is a walk of the *whole*
   * matching set, and the shorter the query the larger that is — measured
   * while typing one word:
   *
   *     r        rows  10 ms      sidebar  1,291 ms
   *     ra             13 ms                  88 ms
   *     rap            10 ms                  62 ms
   *     rapor          12 ms                  29 ms
   *
   * Asked per keystroke, the first letters start walks that are still running
   * when the next letter arrives, and several of them at once are enough to
   * make the rows late as well. That is the second of lag while typing fast.
   *
   * So it is asked once the letters stop, and it charges for itself the same
   * way the live refresh does: whatever the last one cost, the next waits at
   * least that long again. Someone who stops at `r` still pays for `r` —
   * they asked a broad question — but they pay once. */
  const sidebarSoon = afterQuiet(() => {
    /* The timer belongs to the query whose rows scheduled it. A newer query
       can be in flight for longer than this quiet period; checking only after
       the facet reply would still spend the whole old walk before dropping it. */
    if (LIST.query !== null && LIST.query === q.value) sidebar(LIST.query);
  }, 220);

  let sidebarGeneration = 0;
  /* What the last one cost, so the live refresh can decline to repeat it.
     Reset by a new query, because a new query's cost is its own. */
  let sidebarCost = 0;

  /* The query with one control's own terms taken out of it.
   *
   * **A filter rail must not be counted through its own filter.** The service
   * answers a facet with the keys that matched and no others, so under
   * `kind:image` the kind group comes back `[{image: 210551}]` — every other
   * row in the rail then reads `0`, which is true and useless. A rail exists
   * to answer "what would I get if I switched to that instead", and that
   * question is about the query WITHOUT the term this rail put there.
   * Measured on the live index: `scour facets "kind:image" --by kind` returns
   * exactly one key. The age chart has it worse — `dm:27d` left 21 of its 24
   * bars at zero, so the control for widening the range was the part that had
   * been erased.
   *
   * Only a rail's OWN terms come out. A scope or a size stays in, because
   * switching kind while keeping the scope really does give the scoped count —
   * that rail is already right and was never part of this.
   *
   * `field()` rather than a prefix match, so the aliases resolve: `tur:image`
   * and `type:image` are the same term as `kind:image`, and `modified:` is
   * `dm:`. `toggleTerm` compares the same way, as of the commit after this
   * one; this comment used to say it did not, and said so for one commit
   * longer than it was true.
   *
   * A term the parser cannot read is plain text to the engine (see `parse`),
   * so `kind:nope` is a name search and stays: taking it out would change
   * which rows the rail counts. **`accepts` is what decides that**, and its
   * kind vocabulary being five short of the engine's is exactly how this
   * function came to return null for `kind:data` and leave the rail counted
   * through its own filter. See `KIND_VALUES`.
   *
   * Null when there was nothing to take out, which is what tells the caller
   * this rail needs no question of its own. */
  function without(text, names) {
    const toks = tokenise(text);
    const kept = toks.filter((tok) => {
      if (/^\s+$/.test(tok)) return true;
      const bare = tok.startsWith("!") ? tok.slice(1) : tok;
      const sp = fieldSplit(bare);
      const f = sp && field(sp[0]);
      return !(f && names.includes(f.name) && accepts(f, sp[1]));
    });
    /* Compared by count, not by text: dropping a term leaves the space that
       was beside it, and a query that differs from itself only by a double
       space would ask the service the same question twice. */
    if (kept.length === toks.length) return null;
    return kept.join("").trim();
  }

  function sidebar(text) {
    /* The live-refresh caller can race a keystroke too. This guard is before
       the service call because a stale answer costs CPU even when it is never
       painted. JavaScript cannot change `q.value` between this check and the
       synchronous construction of the request. */
    if (text !== q.value) return Promise.resolve();
    const ours = ++sidebarGeneration;
    const began = Date.now();
    /* A stale walk must not poison the current query's refresh budget. An old
       broad query can finish after a newer narrow one and otherwise make the
       narrow query look expensive for the rest of its lifetime. */
    const charge = () => {
      if (ours === sidebarGeneration && text === q.value)
        sidebarCost = Date.now() - began;
    };
    /* A re-sort advances `generation`, but it does not change these counts.
       Only a newer facet request or different query makes an answer stale. */
    const current = () => ours === sidebarGeneration && text === q.value;

    const forKind = without(text, ["kind"]);
    const forAge = without(text, ["dm"]);

    /* One request per DISTINCT query. With no filter of either kind on — the
     * ordinary case, and the one every keystroke goes through — all three
     * questions are about the same rows and this is the single call it has
     * always been. A second is paid for only by somebody who has clicked a
     * filter, and a third only by somebody who has clicked both.
     *
     * **Every call keeps `by=kind,age`, and that is load-bearing rather than
     * lazy.** `NativeIndex::facets` picks its scan cap from the questions
     * asked: `AGE_SCAN_CAP` (unbounded) when any age band is wanted,
     * `FACET_SCAN_CAP` (200,000 rows) otherwise. So asking the stripped query
     * for `by=kind` alone — the obvious way to write this — silently moves
     * the rail onto the sampled path, and the sample is not proportional. It
     * is simply the first 200,000 rows the walk reaches. Measured against the
     * exact answer on the empty query: images came back 210,551 exact against
     * 1,430 sampled (0.007 of the true share where a proportional sample
     * would be 0.089, a twelvefold understatement) while video came back
     * 3.1x overstated. That would have replaced thirteen honest zeros with
     * thirteen plausible wrong numbers, which is the worse of the two.
     *
     * The extra group is close to free anyway: the walk is the cost and the
     * counting is not — `facets` was made to answer several questions from
     * one walk for exactly that reason. */
    const asked = new Map();
    const ask = (which) => {
      if (!asked.has(which)) asked.set(which, SERVICE.sidebar(which, BAR_EDGES));
      return asked.get(which);
    };
    const inForce = ask(text);
    const kindFrom = forKind === null ? inForce : ask(forKind);
    const ageFrom = forAge === null ? inForce : ask(forAge);

    const groupOf = (res, by) => (res.groups || []).find((g) => g.by === by);

    /* **The total and the scrollbar belong to the query actually in force**,
     * and to no stripped one. A rail counts what switching would give; the
     * meter under the list counts what is in the list. Reading the total off
     * the broader walk would say `2.238.902` over two hundred thousand rows.
     *
     * **The scrollbar's real size, and with it where the list ends.**
     *
     * And this is the one that gets there first when the rows are on a
     * long leash, which is why it goes through `setTotal` rather than
     * writing the two fields itself. See `dropShort`: a count that says
     * the list is longer than the rows we hold is a count that says those
     * rows are stale, and saying so here is what puts the window back in
     * the class `fillWindow` fetches on the frame. */
    const total = inForce.then((res) => {
      if (!current()) return;
      setTotal(res.total, !res.capped);
      repaint(true);
      const shown = res.capped ? fmt(res.total) + "+" : fmt(res.total);
      document.getElementById("count").textContent = withIndexTotal(shown);
    });

    /* Each group is drawn as its own answer lands rather than after all of
       them. Waiting for the slowest would hold the rail blank for the length
       of the broadest walk, which is the one a filtered query adds. The
       staleness guard is per-answer, so nothing this paints belongs to a
       query that has since been replaced. */
    const kinds = kindFrom.then((res) => {
      if (!current()) return;
      const g = groupOf(res, "kind");
      if (!g) return;
      KIND_COUNTS = Object.fromEntries(g.facets.map((f) => [f.key, f.count]));
      sidebarSettled();
      syncFacets(parse(q.value));
    });

    const ages = ageFrom.then((res) => {
      if (!current()) return;
      const g = groupOf(res, "age");
      if (!g) return;
      const by = Object.fromEntries(g.facets.map((f) => [f.key, f.count]));
      const counts = BAR_EDGES.map((e) => by[String(e)] || 0).reverse();
      /* Anything older than the last edge belongs to the last bar rather
         than to nothing. Two years is where the scale ends, not where
         the files do. */
      counts[0] += by.older || 0;
      paintBars(counts, res.capped);
    });

    /* Charged for the whole set, not for the first answer back. The live
       refresh declines to repeat a sidebar dearer than `SIDEBAR_LIVE_UNDER_MS`
       and `afterQuiet` waits out whatever the last one cost; both would be
       reading a third of the true price if this charged for one call. */
    return Promise.all([total, kinds, ages]).then(charge, (e) => {
      charge();
      console.error("scour: sidebar did not draw:", e);
    });
  }

  /* The service could not be reached. Say which, rather than showing an empty
     list that looks like "nothing matched". */
  function offline(err) {
    /* **Said out loud, because this is not only reached when the service is
       away.** The search's `catch` also catches anything the drawing throws,
       and a page that answers a rendering fault with "the service cannot be
       reached" sends whoever is debugging it to the wrong end of the program.
       Once cost half an hour of looking at a healthy daemon. */
    console.error("scour:", err);
    LIST.query = null;
    clearSel();
    clearRows();
    for (const request of LIST.pending.values()) request.stop.abort();
    LIST.pending.clear();
    body.innerHTML = "";
    /* Which shows the message, as the line that used to be here did: a length
       of nought is a length of nought however it was arrived at, and the
       sentence under the list is what says the service is the reason. */
    setTotal(0, true);
    painted = "";
    repaint(true);
    document.getElementById("count").textContent = "—";
    document.getElementById("ms").textContent = "—";
    document.getElementById("rows").textContent =
      String(err.message || err).includes("403")
        ? T("connection refused — the key in the link is not this run's")
        : T("the service cannot be reached — is scourd running?");
  }


  /* ---------------- the time distribution ----------------
   *
   * **This must not be drawn from the loaded rows**, and it was — which is
   * exactly as wrong as it sounds. The list is virtual, the first window is
   * two hundred rows, and the default sort is newest first, so the chart was
   * a picture of the two hundred newest matches and said "today" whatever was
   * typed. A chart that answers the same regardless of the question is not a
   * chart.
   *
   * So the engine is asked instead, over the whole matching set, with the
   * bands this chart happens to want. The bands are sent rather than assumed
   * because the shape of a histogram is a presentation choice — the report tab
   * wants six named periods out of the same rows.
   */
  const BAR_COUNT = 24;
  const BAR_SPAN_DAYS = 730;

  /* The upper edge of each bar, in days, on the same logarithmic scale the
     bars are drawn on: the last day, the last week and the last year all have
     room on one screen. */
  const BAR_EDGES = Array.from({ length: BAR_COUNT }, (_, i) =>
    Math.max(1, Math.round(((10 ** (1 - i / BAR_COUNT) - 1) / 9) * BAR_SPAN_DAYS))
  ).reverse();

  function paintBars(counts, capped) {
    const max = Math.max(1, ...counts);
    const edges = [...BAR_EDGES].reverse();
    bars.innerHTML = counts.map((v, i) => {
      const h = v === 0 ? 2 : Math.max(4, Math.round((v / max) * 46));
      const days = edges[i];
      const oldest = i === 0;
      const c = v === 0 ? "--line" : bandOf(now - days * DAY);
      /* The oldest bar has no upper bound, so clicking it cannot mean
         `dm:730d` — it would select everything. It selects nothing instead. */
      const span = oldest
        ? T("older than {days} days", { days })
        : T("up to {days} days", { days });
      const title = T("{n} results · {span}", { n: fmt(v), span })
        + (capped ? T(" (sampled)") : "");
      const label = oldest
        ? T("{n} results, older than {days} days", { n: v, days })
        : T("{n} results, the last {days} days", { n: v, days });
      return `<button type="button" ${oldest ? "" : `data-days="${days}"`}
                title="${escape_(title)}"
                aria-label="${escape_(label)}">
                <i style="height:${h}px;background:var(${c})"></i></button>`;
    }).join("");
  }

  function facetRow(label, term, count, share, on) {
    const fill = share > 0
      ? `<span class="fill" style="width:${(share * 100).toFixed(1)}%"></span>` : "";
    return `<button class="facet${share > 0 ? " bar" : ""}" type="button"
        data-term="${term}" aria-pressed="${on}">${fill}
      ${share > 0 ? "" : `<span class="dot"></span>`}
      <span class="nm">${label}</span><span class="ct">${count === null || count === undefined ? "" : fmt(count)}</span></button>`;
  }

  /* What the service last counted, by kind token — **under the query with its
     `kind:` term taken out**, which is not always the query in force. See
     `without`: the number on a row is what that row would give if it were
     clicked, so a row can and should read more than the list is showing.
     Null until the first reply, and then it wins over the numbers baked in
     above — those exist only so the rail is not blank for the instant before
     it arrives. */
  let KIND_COUNTS = null;

  /* **The old counts stay up, dimmed, until the new ones land.**
   *
   * This used to blank them: `KIND_COUNTS = null`, twenty-four bars painted to
   * zero. The intent was right — a count from the previous query must not be
   * read as this one's — and while a facet answer took twenty-seven
   * milliseconds nobody ever saw the gap.
   *
   * Then the rail started asking a second, broader question so that it could
   * say what switching would give, and the gap became **247 ms for a kind and
   * 556 for an age band**. Half a second of an empty sidebar on every click,
   * reported as "tüm rapor kısmı flash yapıyor".
   *
   * So the numbers stay where they are and the rail says it is thinking. What
   * the blanking was protecting against — mistaking an old number for a new
   * one — is protected better this way: a dimmed count reads as provisional,
   * where a zero reads as an answer. Nothing is thrown away, so nothing has to
   * be drawn again from nothing when the reply arrives; only the numbers that
   * actually moved are rewritten. */
  function markSidebarStale() {
    /* Nothing to dim on the first query — the rail is an honest blank, and
       fading it would only add start-up movement. */
    if (KIND_COUNTS === null) return;
    document.querySelector(".rail").classList.add("settling");
  }

  function sidebarSettled() {
    document.querySelector(".rail").classList.remove("settling");
  }

  function syncFacets(p) {
    const count = ([, key]) => (KIND_COUNTS ? (KIND_COUNTS[key] || 0) : null);
    const top = Math.max(1, ...KINDS.map((r) => count(r) || 0));
    document.getElementById("kinds").innerHTML =
      KINDS.map((row) => {
        const [tr, key] = row;
        const n = count(row);
        return facetRow(tr, "kind:" + key, n, n === null ? 0 : n / top, p.kind === key);
      }).join("");
    document.getElementById("scopes").innerHTML =
      SCOPES.map(([tr, path, n]) => facetRow(tr, "under:" + path, n, 0, p.under === path)).join("");
    document.getElementById("sizes").innerHTML =
      SIZES.map(([tr, v, n]) => facetRow(tr, "size:" + v, n, 0, p.size === v)).join("");
  }

  /* ---------------- column widths ----------------
   *
   * Dragged from the edge of a heading, and remembered.
   *
   * **Kept by the service**, keyed by column id, beside everything else
   * somebody has chosen. This comment used to say they were in the browser
   * "until the window becomes the real one" and to point at a `ui.columns` in
   * the config file that no longer exists; both outlived their arrangement by
   * some months. A width is a preference, the service is what every frontend
   * talks to, and a browser profile is a thing that gets deleted.
   *
   * `table-layout: fixed` is what makes a width mean anything — under `auto`
   * the browser re-decides on every render and a dragged column springs back
   * the moment a longer path arrives. */
  /* ---------------- which columns ----------------
   *
   * The table used to be five headings in the markup. It is a list now,
   * because the index holds more than a list of files: who owns a row, what
   * it is allowed to do, when it was made as against when it was touched.
   * Which of those matter is the user's question, not the page's — a person
   * looking for a photo wants none of them and somebody auditing a home
   * directory wants little else.
   *
   * `key` is what the engine sorts by, so a column that cannot be sorted
   * says so by leaving it out. `cell` renders one row's value and is given
   * the whole row, because a column is sometimes two fields — the age ruler
   * reads the date and paints with it. */
  /* The columns, and how each one writes itself into a cell it is given.
   *
   * `write` rather than a string of HTML: the rows are reused, so a paint sets
   * text and attributes on cells that already exist. Only the name is HTML,
   * because the matched letters are marked inside it and the picture sits in
   * front of it; everything else is `textContent`, which is a copy rather than
   * a parse. */
  const writeText = (td, f, cls, get) => {
    if (td.className !== cls) td.className = cls;
    const v = get(f);
    if (td.textContent !== v) td.textContent = v;
  };
  const cell = (cls, get) => (td, f) => writeText(td, f, cls, get);

  /* **`msgid`, not `label`.** The field held a finished Turkish word and was
     read in two places — the heading row and the column picker — so a language
     switch would have had to find both. It holds the catalogue's key now and
     both readers translate it at draw time, which makes one rule for when a
     word is resolved instead of two. `id` is what the settings are keyed by
     and `key` is what the engine sorts by; neither is a word and neither
     moves. */
  const COLUMNS = [
    { id: "name",  msgid: "Name",      key: "name",  w: 240,
      write: (td, f, p) => {
        if (td.className !== "name") td.className = "name";
        writeName(td, f, p.text);
      } },
    { id: "path",  msgid: "Location",  key: "path",  w: 320,
      write: (td, f) => {
        if (td.className !== "") td.className = "";
        let div = td.firstElementChild;
        if (!div || div.className !== "path") {
          td.textContent = "";
          div = document.createElement("div");
          div.className = "path";
          td.appendChild(div);
        }
        const v = HOME && f.path.startsWith(HOME + "/") ? "~" + f.path.slice(HOME.length) : f.path;
        if (div.textContent !== v) div.textContent = v;
      } },
    /* **A folder's number is what is under it, and it is marked.**
     *
     * The column was blank for folders, which is what every file manager does
     * and what makes "which of these is eating the disk" a question you have
     * to leave the list to answer. It is not blank now — but the number is the
     * size of what *this index holds* under that folder, and the scan rules
     * leave things out: `target`, `node_modules`, whatever else is configured.
     *
     * So it carries a `~`. Not decoration and not an apology: without it the
     * number claims to be the folder's size and is not, and a folder that
     * hides nothing gets the mark too because the index cannot tell which ones
     * those are without a walk it is not going to do. Over-marking is the
     * direction to be wrong in. What is excluded is in the settings, which is
     * what the title says. */
    { id: "size",  msgid: "Size",      key: "size",  w: 90,  num: true,
      write: (td, f) => {
        cell("n", (x) => (x.is_dir
          ? (x.under ? "~" + bytes(x.under.disk) : "")
          : bytes(x.size)))(td, f);
        const t = f.is_dir && f.under
          ? T("indexed size · {n} files", { n: fmt(f.under.files) })
            + "\n"
            + T("what is excluded (target, node_modules…) is not counted — see the settings")
          : "";
        if (td.title !== t) td.title = t;
      } },
    { id: "mtime", msgid: "Modified",  key: "modified", w: 120,
      write: (td, f) => {
        cell("n left", (x) => ago(x.mtime))(td, f);
        td.style.color = `var(${bandOf(f.mtime)})`;
        const t = exact(f.mtime);
        if (td.title !== t) td.title = t;
      } },
    { id: "kind",  msgid: "Kind",      key: "kind",  w: 110,
      write: cell("kind", (f) => f.kind || "") },
    { id: "ext",   msgid: "Extension", key: "ext",   w: 80,
      write: cell("kind", (f) => f.ext || "") },
    { id: "ctime", msgid: "Created",   key: "created", w: 120,
      write: (td, f) => {
        cell("n left", (x) => (x.ctime ? ago(x.ctime) : ""))(td, f);
        const t = exact(f.ctime);
        if (td.title !== t) td.title = t;
      } },
    /* **A dash where nothing is recorded, not a stale number.**
     *
     * Checked against the mounts rather than assumed: `/mnt/depo` is
     * `relatime` and its access times are real, `/home` here is `noatime` and
     * its are frozen at creation. The same column, two volumes, two different
     * meanings — so the one that means nothing says nothing, and the title
     * says why rather than leaving somebody to work it out from the numbers. */
    { id: "atime", msgid: "Accessed",  key: "accessed", w: 120,
      write: (td, f) => {
        const dead = frozenAtime(f);
        cell("n left", (x) => (dead ? "—" : x.atime ? ago(x.atime) : ""))(td, f);
        // On a volume that records nothing the explanation is worth more than
        // a timestamp; where it records, the timestamp is the whole point.
        // One literal rather than two joined with `+`: the msgid is what the
        // catalogue is keyed by and what `the_page_says_nothing_the_catalogue_
        // has_not_heard_of` reads out of this file, and it cannot see a string
        // the parser has not folded yet.
        const t = dead
          ? T("this volume does not record reads (noatime) — the number shown would be left over from when the file was created")
          : exact(f.atime);
        if (td.title !== t) td.title = t;
        td.style.color = dead ? "var(--ink-3)" : "";
      } },
    { id: "perm",  msgid: "Mode",      key: "mode",  w: 108,
      write: cell("mono", (f) => f.perm || "") },
    { id: "user",  msgid: "Owner",     key: "uid",   w: 100,
      write: cell("mono", (f) => f.user || "") },
    { id: "group", msgid: "Group",     key: "gid",   w: 100,
      write: cell("mono", (f) => f.group || "") },
    { id: "disk",  msgid: "On disk",   key: "disk",  w: 90, num: true,
      write: cell("n", (f) => (f.disk > 0 ? bytes(f.disk) : "")) },
  ];
  const COL_DEFAULT = ["name", "path", "size", "mtime", "kind"];

  /* **The service holds these, and nothing here does.**
   *
   * There were two stores. `localStorage` kept the chosen columns and their
   * widths under `scour.columns.shown.v1` and `scour.columns.v1`, and the
   * service kept the same two things — so the page read the browser's copy at
   * boot, drew with it, and then the service's reply arrived and won. Nothing
   * had written the browser's copy since `scour-settings` landed, so what it
   * held was whatever this profile happened to have in it the day the move
   * happened. Dead data, read on every launch, and a second answer to a
   * question that must have one for a terminal and a Slint window to agree
   * with this one.
   *
   * Defaults until the reply lands. See `applySettings`. */
  let SHOWN = COL_DEFAULT.slice();
  const shownColumns = () => SHOWN.map((id) => COLUMNS.find((c) => c.id === id)).filter(Boolean);

  const MIN_COL = 56;
  /* **Keyed by column id**, the same names `SHOWN` uses — not by the sort key,
     which is what this did. The two agree for seven columns and differ for
     five (`ctime`/`created`, `atime`/`accessed`, `perm`/`mode`, `user`/`uid`,
     `group`/`gid`), so half a layout came back after a restart and half did
     not, and a width dragged in one frontend meant nothing in another. */
  let WIDTHS = {};

  /* **A column always has a width, and the table never gives one up.**
   *
   * Neither was true, and together they took the list apart in a narrow
   * window. `COLUMNS[].w` was written down and then never read, so a column
   * nobody had dragged had no width at all — and under `table-layout: fixed`
   * an unspecified column is the first thing a browser takes space from when
   * the total does not fit. At 900 pixels the *name* column was zero: the list
   * showed paths and no names, and the headings had run into each other
   * (`ADKONUM`, and three more piled up on the right).
   *
   * So: the default is used, and the table declares what it needs. Below that
   * the surrounding `.scroll` — already `overflow: auto` — scrolls sideways,
   * which is what a file manager does and what keeps a dragged width meaning
   * the width somebody dragged it to.
   *
   * The two fixed cells are counted in: the mark column and the picker.
   * Without them the last column loses their width.
   *
   * **Thirty rather than three for the first of them, which is what it always
   * measured.** It was declared `width: 3px` and rendered at thirty — a
   * heading's own padding — so this sum has been twenty-seven pixels short of
   * the table it describes for as long as it has existed. The declaration says
   * thirty now and so does this, and they agree with the ruler. */
  function applyWidths() {
    const table = document.querySelector(".results table");
    /* **A grid has no columns to be wide.** The headings stay — they are the
       sort control — but a width describes a column of cells, and under a
       grid there are none. Left declared, the table's `min-width` is the sum
       of columns nothing is drawn in, which is a sideways scrollbar over
       tiles that fit; and `PER_ROW` is read from a width, so a scroller that
       scrolls sideways would be one more thing feeding a layout number back
       into the arithmetic. Cleared here and restored the moment the detail
       list comes back, because `WIDTHS` is untouched by any of it. */
    if (grid()) {
      for (const th of document.querySelectorAll("thead th[data-col]")) {
        th.style.width = "";
      }
      if (table) table.style.minWidth = "";
      return;
    }
    let sum = 30 + 30;
    for (const th of document.querySelectorAll("thead th[data-col]")) {
      const col = COLUMNS.find((c) => c.id === th.dataset.col);
      const w = WIDTHS[th.dataset.col] || (col && col.w) || 120;
      th.style.width = w + "px";
      sum += w;
    }
    if (table) table.style.minWidth = sum + "px";
  }

  /* Everything this window remembers, sent to the service.
   *
   * Debounced, because dragging a column edge fires per pixel and a settings
   * write per pixel would be a file rewritten a hundred times a second. A
   * quarter of a second after the hand stops is soon enough for something
   * nobody reads until the next launch. */
  /* **What is sent is what changed, and nothing else.**
   *
   * This used to send five named fields and everything in `EXTRA` on every
   * save — the whole object, every time. That works exactly as long as this
   * window is the only writer. The moment a terminal interface is open beside
   * it, whatever the terminal understands and this page does not is erased by
   * the next column drag here, and the reverse. The service folds a change in
   * now (`scour_settings::Change`), so a field this page has never heard of
   * survives it.
   *
   * `pending` accumulates until the debounce fires, so a drag that moves a
   * column and then resizes it is one write of two fields rather than two
   * writes of everything. */
  let pending = {};
  let keepTimer = null;
  function keep(change) {
    Object.assign(pending, change || {});
    clearTimeout(keepTimer);
    keepTimer = setTimeout(() => {
      const change = pending;
      pending = {};
      if (Object.keys(change).length) SERVICE.saveSettings(change);
    }, 250);
  }

  /* What this window remembers and no other frontend can act on: whether the
     thumbnails are drawn, whether the notes are showing. Namespaced under
     `web` in the settings, merged key by key, so saving one says nothing
     about the others. */
  const keepView = (patch) => keep({ view: { web: patch } });

  /* What the service handed back, applied to a window that has already drawn
     itself with defaults. The request is one round trip and the page must not
     wait for it — a blank window while a socket answers is worse than a
     window whose columns settle a moment later. */
  function applySettings(s) {
    const oldSort = sortKey;
    const oldDescending = sortDesc;
    if (Array.isArray(s.columns) && s.columns.length) {
      const ok = s.columns.filter((id) => COLUMNS.some((c) => c.id === id));
      if (ok.length) SHOWN = ok;
    }
    if (s.widths && typeof s.widths === "object") WIDTHS = { ...s.widths };
    /* Validated against the column *keys*, which are now the protocol's own
       words — so a settings file written by the Slint window, which says
       `modified` as the CLI and the MCP server do, is accepted rather than
       silently thrown away for not being this page's spelling of it. */
    if (s.sort && COLUMNS.some((c) => c.key === s.sort)) sortKey = s.sort;
    if (typeof s.descending === "boolean") sortDesc = s.descending;
    HISTORY = Array.isArray(s.history) ? s.history : [];
    DUPES_OPEN = !!s.dupes_open;
    /* **A shared field, like the layout.** Somebody who pinned the panel open
       in the window means it here too — it is a decision about how they work,
       not about which program they happened to open. */
    if (s.preview) setPeek(true, false);
    peekToggle.setAttribute("aria-pressed", s.preview ? "true" : "false");
    VIEW = (s.view && s.view.web) || {};
    applyView();
    showPastAffordance();
    buildHeads();
    applyWidths();
    /* **A shared field, so it is read from the top of the settings rather than
       from `view.web`.** An empty string is "nobody has chosen" and is not the
       same as `detail`; a word this version has never heard of is somebody
       else's frontend, and falls back rather than blanking the list. After the
       headings, because it decides whether they carry widths. */
    if (typeof s.layout === "string" && MODES.includes(s.layout)) applyMode(s.layout);
    /* The list has already started with the defaults. Only an ordering that
       actually differs needs another service search; columns, widths and
       view options were applied locally above. */
    if (sortKey !== oldSort || sortDesc !== oldDescending) render();
  }

  /* This window's own corner of the settings, and what it does when it lands.
     Held rather than read through, because the two closures in this file both
     want it and only one of them owns the transport. */
  let VIEW = {};
  /* Shared rather than local: whether a duplicate hunt runs when the report
     opens is a decision about Scour, and a terminal report would mean the
     same thing by it. */
  let DUPES_OPEN = false;

  /* Past queries, newest first. Filled by the service, added to only when a
     search was *meant* — see `remember`. */
  let HISTORY = [];

  function saveWidths() {
    keep({ widths: WIDTHS });
  }

  /* One grip a heading, on its trailing edge. The last column has none: there
     is nothing to its right to give the space to, so dragging it would only
     be a way to make the table narrower than its own container. */
  /* The heading row, rebuilt whenever the column list changes. The sort
     arrow and the drag grip are put on afterwards by the two functions that
     own them, so this stays the one place that knows what a heading *is*. */
  function buildHeads() {
    const row = document.getElementById("heads");
    const cols = shownColumns();
    /* **Kept, not rebuilt.** The mark heading holds the glyph switch, and this
       function runs on every column change and every language change — an
       `innerHTML` that included it would hand back a button with no listener
       on it, so the switch would work until the first time somebody added a
       column. Detached first so the assignment below cannot take it. */
    const mark = document.getElementById("markhead");
    mark.remove();
    row.innerHTML =
      cols
        .map(
          (c) =>
            `<th data-col="${c.id}"${c.key ? ` data-sort="${c.key}"` : ""}` +
            `${c.num ? ' class="num"' : ""}` +
            `${c.key ? "" : ` title="${escape_(T("this column cannot be sorted by"))}"`}>` +
            `${escape_(T(c.msgid))}</th>`
        )
        .join("") +
      // The picker lives where a column would be, so it is where the eye
      // already is when the question "why is this column here" comes up.
