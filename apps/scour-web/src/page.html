     Empty until then, which is a few milliseconds and honest. */
  let SCOPES = [];
  /* Mount points where the kernel does not record reads. See `noatime_mounts`
     in the bridge: with `noatime`, `st_atime` is written when the file is made
     and never again, so a browser profile rewritten every second reports
     "accessed eleven days ago" — the day it was installed. True, and not an
     answer to the question the column asks. */
  let MOUNTS = [];
  let HOME = "";
  const SIZES = [[">10 MB", ">10mb", null], [">1 MB", ">1mb", null], ["= 0", "=0", null]];

  const BANDS = [
    [0,        3600,       "--t0"],
    [3600,     DAY,        "--t0"],
    [DAY,      7 * DAY,    "--t1"],
    [7 * DAY,  30 * DAY,   "--t2"],
    [30 * DAY, 180 * DAY,  "--t3"],
    [180 * DAY, 365 * DAY, "--t4"],
    [365 * DAY, Infinity,  "--t5"]
  ];
  const bandOf = (mtime) => {
    const ago = now - mtime;
    for (const b of BANDS) if (ago < b[1]) return b[2];
    return "--t5";
  };

  const fmt = (n) => NUMBERS.format(n);
  const bytes = (n) => {
    const u = ["B", "KB", "MB", "GB"];
    let i = 0, v = n;
    while (v >= 1024 && i < u.length - 1) { v /= 1024; i++; }
    return (i === 0 ? v : v.toFixed(v < 10 ? 1 : 0)) + " " + u[i];
  };
  /* **Seconds, but only for the first minute.**
   *
   * Under a minute everything said "1 min ago", which is the one range where
   * the difference matters: watching whether a file you just saved has reached
   * the index is a question about seconds, and it was the only question this
   * column could not answer.
   *
   * It stops at sixty on purpose. This page has one loud voice and it is
   * freshness; a screenful of rows all counting up would be a second one, and
   * a louder one. Above a minute nothing moves that did not move before.
   *
   * A number this fine needs its own clock — see `tickClock`. `now` used to be
   * refreshed only when the index moved, which is invisible at minute
   * granularity and wrong within a second at this one. */
  const ago = (mtime) => {
    const s = now - mtime;
    /* **One second is the floor, and it is the whole range too.** The first
       version said "just now" below one — and there is nothing below one
       second to be vaguer about, so a word where the ladder already had a
       number was a word that said less. The clamp still does the work it was
       there for: a timestamp in the future — clock skew, a copy that kept its
       times — reads as one second rather than as minus four.

       Six rungs rather than one string with a unit substituted in: a unit is
       not a word that can be lifted out of one language's sentence and dropped
       into another's, and this column is narrow enough that the abbreviation is
       part of the translator's decision.

       **The singular is a second msgid, and it is standing in for plural
       forms.** `po.rs` carries no `msgid_plural`, deliberately and with a note
       saying so, because Turkish does not inflect a noun after a numeral: "1
       gün önce" and "5 gün önce" take the same word. English does, and this
       column is the one place where getting it wrong is on screen in every
       list — a machine like this one has years-old files in every folder, so
       `1 years ago` would be everywhere. The three rungs where the noun is a
       whole word pick their own string; the abbreviated ones do not need to.

       Nine other `{n} …` strings in this file still read `1 files` in English.
       That is a gap and not an oversight: closing it properly means plural
       forms in the catalogue, which is the change `po.rs` invites and which
       buys Turkish nothing. */
    if (s < 60) return T("{n} sec ago", { n: Math.max(1, s) });
    if (s < 3600) return T("{n} min ago", { n: Math.max(1, Math.round(s / 60)) });
    if (s < DAY) return T("{n} hr ago", { n: Math.round(s / 3600) });
    if (s < 30 * DAY) {
      const n = Math.round(s / DAY);
      return n === 1 ? T("1 day ago") : T("{n} days ago", { n });
    }
    if (s < 365 * DAY) {
      const n = Math.round(s / (30 * DAY));
      return n === 1 ? T("1 month ago") : T("{n} months ago", { n });
    }
    const years = Math.round(s / (365 * DAY));
    return years === 1 ? T("1 year ago") : T("{n} years ago", { n: years });
  };

  /* The reading behind the reading. "4 days ago" is what a list wants and
     never what a person wants at the moment they stop and ask; the exact time
     was in the row all along and had nowhere to be shown. Costs nothing and
     moves nothing — it is only read when the pointer rests.

     **The formatter is built once, and that is not a micro-optimisation.**
     `toLocaleString` with an options object constructs one of these on every
     call. This is called once per row per paint, and on a machine whose index
     moves every few seconds that is fifty-odd constructions every few seconds
     — for a string that cannot change, because it is when the file was
     written. It lives at the top of the file now, beside the language it is
     built from; `buildFormatters` is the one place that replaces it. */
  const exact = (at) => (!at ? "" : STAMP.format(new Date(at * 1000)));

  /* Does this file live somewhere that records when it was read?
   *
   * The deepest mount point containing it is the one it is on: `/` is
   * `noatime` here and `/mnt/depo` under it is not, so anything shorter than
   * the longest match answers about the wrong filesystem.
   *
   * **Out here rather than inside the column**, because the clock has to know
   * it too: a cell showing `—` must not be quietly replaced with an age by a
   * tick that only knew how to count. One rule, two readers. */
  function frozenAtime(f) {
    let owner = null;
    for (const m of MOUNTS) {
      const under = m.at === "/" || (f.path + "/").startsWith(m.at + "/");
      if (under && (!owner || m.at.length > owner.at.length)) owner = m;
    }
    return !!owner && !owner.reads;
  }

  const q      = document.getElementById("q");
  const shadow = document.getElementById("shadow");
  const body   = document.getElementById("rows-body");
  const empty  = document.getElementById("empty");
  const bars   = document.getElementById("bars");

  /* **The protocol's word for the order, throughout.** The page said `mtime`
     and reached the right answer only through the bridge's `_ =>` fallthrough,
     while writing that word into a settings file the CLI, the MCP server and
     the Slint window all read as `modified`. One vocabulary; the column is
     still `mtime`, because that is a column, not an order. */
  let sortKey = "modified", sortDesc = true;

  // --- query parsing (mockup level; the real grammar is in scour-query)
  function parse(text) {
    const terms = text.trim().split(/\s+/).filter(Boolean);
    const out = { text: [], not: [], kind: null, under: null, parent: null,
                  size: null, band: null, ext: null, path: null, isDir: null };
    for (const raw of terms) {
      const neg = raw.startsWith("!");
      const t = neg ? raw.slice(1) : raw;
      if (!t) continue;
      const sp = fieldSplit(t);
      const f = sp && field(sp[0]);
      // A field that cannot be read is PLAIN TEXT — the parser's own rule,
      // and the highlighter's wavy red is exactly what announces it.
      if (!f || (f.takes !== "none" && !accepts(f, sp[1]))) {
        (neg ? out.not : out.text).push(fold(t).replace(/"/g, ""));
        continue;
      }
      const v = sp[1];
      switch (f.name) {
        case "kind":   out.kind   = fold(v); break;
        case "under":  out.under  = v;       break;
        case "parent": out.parent = v.replace(/\/$/, ""); break;
        case "size":   out.size   = fold(v); break;
        case "ext":    out.ext    = fold(v); break;
        case "path":   out.path   = fold(v); break;
        case "dm": case "dc": case "da": out.band = fold(v); break;
        case "file":   out.isDir  = false;   break;
        case "folder": out.isDir  = true;    break;
        // `content:` is the one field the mockup's data cannot answer; in
        // the product it works when contents are indexed, here nothing matches.
        case "content": out.text.push("\u0000"); break;
      }
    }
    return out;
  }

  /* Kind token to label, from `/api/kinds`. Empty until it lands. */
  let KIND_KEY = {};

  /* **`matches()` and its `KIND_TR` table were here and are gone.**
   *
   * The last of the mockup's engine: a row filter that decided in the page
   * whether a file matched a query, from twenty invented files, before there
   * was a service to ask. Nothing has called it since the list started coming
   * from `/api/search` — every predicate in it is now `scour-query`'s.
   *
   * It is removed rather than left because of what it was carrying. `KIND_TR`
   * mapped Turkish spellings to kind tokens and mapped them to the *old*
   * taxonomy: `ses` and `video` both to `media`, a kind the engine still
   * parses and stopped producing, and `klasör` to `dir` where the token is
   * `folder`. A dead table is harmless; a dead table of Turkish words in the
   * one file being emptied of Turkish words is a trap laid for the next
   * translator, who would have found it, believed it, and translated the
   * taxonomy the engine gave up on.
   *
   * The live version of what it did is `KIND_ALIASES` below, which is copied
   * from `Kind::from_name` and is grammar rather than vocabulary — the engine
   * parses those words, so they are not translated and do not belong to the
   * catalogue. */

  const escape_ = (s) => s.replace(/[&<>"']/g, (c) => (
    { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

  /* ------------------------------------------------------------------
     The query language — the field table.

     In the product this table is NOT HERE: it lives in `scour-query`'s
     `fields.rs`, and the parser, the highlighter, the completions and the
     syntax reference all read it. The frontend calls `explain` and gets the
     pieces already cut. The mockup has no engine behind it, so it rebuilds
     the same rules here — and the cost of rebuilding them is exactly this:
     the day the two tables drift, the box says something the engine never
     said. That is why the product takes this over the wire.
  ------------------------------------------------------------------ */
  /* **`name` and `alias` are grammar; `about` is a sentence.** The first two
     are what the engine parses — `tür:` finds images whatever language the
     window is in, because `Kind::from_name` reads it and `Kind::from_name`
     does not know there is a window. Routing them through the catalogue would
     mean a query that works in one language and not in another, and a query
     somebody wrote down would stop working when they switched. Only `about`,
     which nothing parses and a person reads, is a msgid. */
  const FIELDS = [
    { name: "ext",     alias: [],                          takes: "ext",   about: "the extension is this, or one of these separated by ;", eg: "ext:pdf" },
    { name: "path",    alias: [],                          takes: "text",  about: "the whole path contains this",                   eg: "path:src/api" },
    { name: "under",   alias: ["in", "altinda"],           takes: "path",  about: "under this folder, at any depth",                eg: "under:/home" },
    { name: "parent",  alias: ["child", "children"],       takes: "path",  about: "directly inside this folder, one level",         eg: "parent:/etc" },
    { name: "file",    alias: ["files"],                   takes: "none",  about: "files only",                                     eg: "" },
    { name: "folder",  alias: ["folders", "dir"],          takes: "none",  about: "folders only",                                   eg: "" },
    { name: "size",    alias: [],                          takes: "size",  about: "size, in binary units, comparison optional",      eg: "size:>1mb" },
    { name: "kind",    alias: ["type", "tur", "tür"],      takes: "kind",  about: "the rough kind of file",                         eg: "kind:image" },
    { name: "dm",      alias: ["modified"],                takes: "time",  about: "when it last changed",                           eg: "dm:7d" },
    { name: "dc",      alias: ["created"],                 takes: "time",  about: "when it was created",                            eg: "dc:2026-01-31" },
    { name: "da",      alias: ["accessed"],                takes: "time",  about: "when it was last read",                          eg: "da:>2026-01-01" },
    { name: "content", alias: ["text", "icerik", "içerik"],takes: "text",  about: "the document's contents contain this (if contents are indexed)", eg: "content:invoice" },
  ];
  /* The values `kind:` takes, in the order a list should show them.
   *
   * **This is `Kind::OFFERED` through `Kind::token`** — the same thirteen
   * `/api/kinds` sends and `scour-query`'s own `KIND_VALUES` offers. It used
   * to be eight, from the mockup: `folder file code image doc media archive
   * exec`. Five of the engine's kinds were missing — `data`, `config`,
   * `audio`, `font`, `build` — and `media` was in, which the engine still
   * parses but no longer produces.
   *
   * What that cost is the reason for the length of this comment. This list is
   * not only what the completion menu offers. `accepts` is the page's answer
   * to "can this field read this value", and two things that reach the screen
   * ask it: `parse`, where a value it cannot read makes the whole term plain
   * text, and `without`, which strips a rail's own term before counting the
   * rail. So a kind missing from here did two visible things at once. The
   * clicked row did not read as pressed, because `parse` never set `p.kind`.
   * And `without` found nothing to strip, returned null, and the kind rail was
   * counted through `kind:data` — which answers with the one key that matched,
   * so the other twelve rows settled at zero.
   *
   * Measured in the window rather than argued: clicking Veri made ONE facet
   * call, `q=kind:data`, and `KIND_COUNTS` came back `{data: 209320}`;
   * clicking Image made TWO, the second `q=`, and `KIND_COUNTS` came back
   * with all thirteen keys. The five the owner named — data, config, audio,
   * font and build — are exactly the five that were missing here. `video`
   * escaped only by accident: the word is spelled the same in both languages
   * and so was already in the alias list below.
   *
   * The box's colours were never wrong, and that is worth saying because it is
   * why this went unnoticed: they come from `/api/explain` over the wire, so
   * `kind:veri` read back correctly in the reading line while the rail beside
   * it went to zeros.
   *
   * The comment above the field table already predicted this — "the day the
   * two tables drift, the box says something the engine never said". It drifted
   * because `Kind` gained Audio, Video, Build, Data, Config and Font and this
   * copy did not. `the_page_takes_the_engines_kind_vocabulary` is what now
   * fails when it drifts again, rather than a rail full of zeros. */
  const KIND_VALUES = ["folder", "code", "doc", "image", "data", "config",
                       "archive", "exec", "audio", "video", "font", "build", "file"];
  /* Every other spelling `Kind::from_name` takes, copied literally from it,
     including the ones only folding tells apart. Accepted but not offered, and
     the difference is deliberate on both sides of the wire: `media` is retired
     and still parses so that a query somebody wrote down keeps working, and
     `text` is a group alias with no kind of its own. Offering either would
     invite new queries into a spelling the taxonomy is moving away from. */
  const KIND_ALIASES = [
    "dir", "klasor", "klasör",
    "source", "kod", "kaynak",
    "img", "pic", "gorsel", "görsel", "resim",
    "arsiv", "arşiv", "zip",
    "document", "belge",
    "exe", "bin", "executable", "calistirilabilir", "çalıştırılabilir",
    "ses", "muzik", "müzik",
    "film",
    "media", "medya",
    "derleme", "cikti", "çıktı",
    "veri",
    "conf", "settings", "ayar", "yapilandirma", "yapılandırma",
    "yazitipi", "yazıtipi",
    "dosya",
    "text", "metin",
  ];
  const TIME_VALUES = ["today", "yesterday", "7d", "30d", "1y"];

  /* Turkish folding — the same rule as the engine's `DefaultFolder`: dotted
     and dotless i are ONE letter. That is why the table lists `altinda` and
     not `altında`: folding sends both to the same place.

     **The `"tr"` here is not the interface's language and must not follow it.**
     It is the rule the engine applies to every query in every locale, so that
     `ISTANBUL`, `İstanbul` and `ıstanbul` find each other whoever is looking.
     Made to follow the menu, an English window would fold `I` to `i` and `İ`
     to `i̇`, disagree with the service about what a term matches, and paint as
     understood a query the service read differently. The catalogue itself
     folds nothing — `T` is an exact lookup — for the neighbouring reason: a
     msgid is a key, not text to be compared loosely, and `highlight.rs` has
     already had a panic out of treating one as the other. */
  const fold = (t) => t.replace(/[İIı]/g, "i").toLocaleLowerCase("tr");
  const field = (name) => {
    const f = fold(name);
    return FIELDS.find((x) => x.name === f || x.alias.includes(f)) || null;
  };

  const SIZE_RE = /^(?:[<>]=?|=)?\s*\d+(?:[.,]\d+)?\s*(?:b|kb|mb|gb|tb)?$/;
  const TIME_RE = /^(?:[<>]=?|=)?\s*(?:\d+(?:h|s|saat|d|g|gun|gün|w|hafta|m|ay|y|yil|yıl)|today|yesterday|week|month|year|bugun|bugün|dun|dün|hafta|ay|yil|yıl|\d{4}-\d{2}-\d{2})$/;

  /* CAN the field read this value? In the engine the parser's own value
     parsers answer this — there is no second opinion. */
  function accepts(f, value) {
    const v = fold(value);
    switch (f.takes) {
      case "none": return true;
      case "text": case "path": return v.length > 0;
      case "ext":  return v.split(";").some((e) => e.replace(/^\./, "").length > 0);
      case "size": return SIZE_RE.test(v);
      case "time": return TIME_RE.test(v);
      case "kind": return KIND_VALUES.includes(v) || KIND_ALIASES.includes(v);
    }
    return false;
  }

  /* `field:value` — the parser's rule: two or more LETTERS and nothing else.
     `C:/Users` is therefore not a field, which is what keeps every absolute
     path on Windows from being painted as a mistake. */
  function fieldSplit(t) {
    const i = t.indexOf(":");
    if (i < 0) return null;
    const name = t.slice(0, i);
    if ([...name].length < 2 || !/^\p{L}+$/u.test(name)) return null;
    return [name, t.slice(i + 1)];
  }

  /* Split into terms and the whitespace between them — WITHOUT SPLITTING A
     QUOTED RUN. This was a regex (`split(/(\s+)/)`) and it cut the query
     `"iki kelime"` in two: the mockup read the first half as a quote and the
     second as plain text. Colouring the same queries with the engine caught
     it — 27 of 28 agreed. This kind of silent drift is exactly why the
     product takes its spans over the wire. */
  function tokenise(text) {
    const out = [];
    let i = 0;
    while (i < text.length) {
      const start = i;
      const space = /\s/.test(text[i]);
      let quoted = false;
      while (i < text.length) {
        const c = text[i];
        if (c === '"') quoted = !quoted;
        else if (!quoted && /\s/.test(c) !== space) break;
        i++;
      }
      out.push(text.slice(start, i));
    }
    return out;
  }

  /* Cut the query into roles. The pieces cover it BYTE FOR BYTE — concatenate
     them and the query comes back. A highlighter that quietly lost a
     character would put every colour after it in the wrong place. */
  function spans(text) {
    const out = [];
    const toks = tokenise(text).filter(Boolean);
    /* A list is a context, not a character. `ext:rs ; toml` is one filter, so
       the spaces in it are separators and the word after one is a value — not
       a new search term. The engine closes these spaces up; colouring them as
       boundaries would show a query it does not see. */
    let list = null, expectValue = false;
    toks.forEach((tok, i) => {
      if (/^\s+$/.test(tok)) {
        const next = toks.slice(i + 1).find((t) => !/^\s+$/.test(t));
        const joins = list && (expectValue || (next && next.startsWith(";")));
        out.push([joins ? "sep" : "space", tok]);
        if (!joins) { list = null; expectValue = false; }
        return;
      }
      if (list && (expectValue || tok.startsWith(";"))) {
        let rest = tok;
        if (rest.startsWith(";")) { out.push(["sep", ";"]); rest = rest.slice(1); expectValue = true; }
        if (rest) expectValue = rest.endsWith(";");
        valueSpans(out, rest, list);
        return;
      }
      if (tok === "|") { out.push(["or", tok]); list = null; expectValue = false; return; }
      if (tok === "!") { out.push(["not", tok]); list = null; expectValue = false; return; }
      const quoted = tok.startsWith('"');
      tok.split("|").forEach((alt, j) => {
        if (j > 0) out.push([quoted ? "phrase" : "or", "|"]);
        alternative(out, alt);
      });
      list = fieldOf(tok);
      expectValue = !!list && tok.endsWith(";");
    });
    return out;
  }

  /* The field a token filters on, if it is a field term at all. */
  function fieldOf(tok) {
    if (tok.startsWith('"')) return null;
    const sp = fieldSplit(tok.startsWith("!") ? tok.slice(1) : tok);
    return sp ? field(sp[0]) : null;
  }

  function alternative(out, text) {
    let rest = text;
    if (rest.startsWith("!")) { out.push(["not", "!"]); rest = rest.slice(1); }
    if (!rest) return;
    const split = fieldSplit(rest);
    if (!split) return plain(out, rest);
    const [name, value] = split;
    const f = field(name);
    if (!f) { out.push(["unknown", rest]); return; }
    out.push(["field", name]);
    out.push(["colon", ":"]);
    valueSpans(out, value, f);
  }

  /* The value after a field's colon, or a later item in its list. */
  function valueSpans(out, value, f) {
    if (!value) return;                       // being typed — not yet wrong
    if (!accepts(f, value)) { out.push(["bad", value]); return; }
    let v = value;
    if (f.takes === "size" || f.takes === "time") {
      const m = /^(<=|>=|<|>|=)/.exec(v);
      if (m) { out.push(["cmp", m[1]]); v = v.slice(m[1].length); }
    }
    if (f.takes === "ext") {
      v.split(";").forEach((part, i) => {
        if (i > 0) out.push(["sep", ";"]);
        if (part) out.push(["value", part]);
      });
      return;
    }
    if (v) out.push(["value", v]);
  }

  function plain(out, text) {
    if (text.startsWith('"')) {
      out.push(["quote", '"']);
      const closed = text.length > 1 && text.endsWith('"');
      const inner = text.slice(1, closed ? -1 : undefined);
      if (inner) out.push(["phrase", inner]);
      if (closed) out.push(["quote", '"']);
      return;
    }
    out.push([/[*?]/.test(text) ? "glob" : "text", text]);
  }

  /* Term boundaries, from the same spans the colouring uses.
     A term is a run between whitespace, so this is the span list with the
     spaces taken out and the rest coalesced — never a second tokenisation,
     which would be the same mistake at one remove. */
  function terms(text) {
    const out = [];
    let at = 0, start = null;
    for (const [role, t] of spans(text)) {
      if (role === "space") {
        if (start !== null) { out.push([start, at]); start = null; }
      } else if (start === null) {
        start = at;
      }
      at += t.length;
    }
    if (start !== null) out.push([start, at]);
    return out;
  }

  /* One character's width, measured rather than assumed.
     The face is monospace, so this is the whole of the geometry: the caret
     index under the pointer is `x / charWidth`. Measured once on a hundred
     characters, because measuring one rounds badly at fractional widths. */
  let charW = 0;
  function charWidth() {
    if (charW) return charW;
    const probe = document.createElement("span");
    probe.style.cssText =
      "position:absolute;visibility:hidden;white-space:pre;font:600 20px/1.3 " +
      getComputedStyle(q).fontFamily + ";letter-spacing:-.01em";
    probe.textContent = "0".repeat(100);
    document.body.appendChild(probe);
    charW = probe.getBoundingClientRect().width / 100;
    probe.remove();
    return charW;
  }

  const acts = document.getElementById("qacts");
  let hoverTerm = null;

  /* Which term is under the pointer, if any. */
  function termAt(clientX) {
    const box = q.getBoundingClientRect();
    const i = Math.floor((clientX - box.left + q.scrollLeft) / charWidth());
    // Byte offsets on the wire, character offsets here. They agree for
    // everything but non-ASCII, and the terms are found by scanning the same
    // string either way, so this stays a character index throughout.
    const text = q.value;
    for (const [a, b] of terms(text)) {
      if (i >= a && i < b) return [a, b];
    }
    return null;
  }

  /* Draw the band and its two buttons over the hovered term. */
  function drawActs(term) {
    hoverTerm = term;
    if (!term) { acts.innerHTML = ""; return; }
    const [a, b] = term;
    const w = charWidth();
    const left = a * w - q.scrollLeft;
    const width = (b - a) * w;
    const negated = q.value[a] === "!";
    // The pair is 38 px wide and sits at the term's right edge, pulled back
    // inside the field when the term ends at it — a button half off the edge
    // is a button nobody can press.
    const pair = 38;
    const room = q.clientWidth - pair - 2;
    const x = Math.max(0, Math.min(left + width - pair + 18, room));
    acts.innerHTML =
      `<div class="band" style="left:${left - 3}px;width:${width + 6}px"></div>` +
      `<div class="pair" style="left:${x}px">` +
      `<button class="neg" ` +
      `title="${escape_(negated ? T("Stop excluding this") : T("Exclude this term"))}">` +
      `${negated ? "+" : "!"}</button>` +
      `<button class="drop" title="${escape_(T("Remove this term"))}">✕</button>` +
      `</div>`;
  }

  /* Replace one term, keeping the spaces around it tidy. */
  function editTerm(term, replacement) {
    const [a, b] = term;
    let before = q.value.slice(0, a), after = q.value.slice(b);
    if (!replacement) {
      // Removing a term must not leave a double space behind, and must not
      // leave a leading one either — both would show up as a stray gap in a
      // line whose whole job is to be read.
      if (before.endsWith(" ") && after.startsWith(" ")) after = after.slice(1);
      else if (before.endsWith(" ") && !after) before = before.slice(0, -1);
      // The first term has nothing before it, so neither branch above fires
      // and the space that followed it is left at the head of the query.
      // Measured by pressing the button: "hasan raporu" became " raporu".
      else if (!before && after.startsWith(" ")) after = after.slice(1);
    }
    q.value = before + replacement + after;
    const caret = (before + replacement).length;
    q.setSelectionRange(caret, caret);
    drawActs(null);
    render();
    q.focus();
  }

  q.addEventListener("mousemove", (e) => {
    const t = termAt(e.clientX);
    /* **Moving off a term does not put its buttons away.**
     *
     * They sit at the term's right edge and above the line, so reaching them
     * means leaving the term — and this used to answer that by clearing them.
     * The target was destroyed by aiming at it, which is why neither button
     * could be pressed. Only a *different* term replaces them; leaving the
     * field is what puts them away, and that is handled below. */
    if (!t) return;
    const same = hoverTerm && t[0] === hoverTerm[0] && t[1] === hoverTerm[1];
    if (!same) drawActs(t);
  });
  // The buttons live inside the layer, so leaving the input for them must not
  // clear them — only leaving the whole field does.
  document.querySelector(".qfield").addEventListener("mouseleave", (e) => {
    // Moving onto the buttons is not leaving. They are descendants, so this
    // should not fire at all — but they are drawn outside the box, and one
    // layout change is all it takes to open a gap under them again.
    if (e.relatedTarget && acts.contains(e.relatedTarget)) return;
    drawActs(null);
  });
  q.addEventListener("scroll", () => drawActs(hoverTerm));

  acts.addEventListener("mousedown", (e) => {
    const b = e.target.closest("button");
    if (!b || !hoverTerm) return;
    e.preventDefault();
    const [a, end] = hoverTerm;
    const term = q.value.slice(a, end);
    if (b.classList.contains("drop")) return editTerm(hoverTerm, "");
    // Negation toggles rather than accumulating: `!!a` is not a thing anyone
    // means, and the button that added the `!` is the one that takes it away.
    editTerm(hoverTerm, term.startsWith("!") ? term.slice(1) : "!" + term);
  });

  /* The roles that make a query worth reading back. Anything here means the
     text is not simply words to look for: a field name, a comparison, a
     quoted phrase, a pattern, an exclusion, an alternative. */
  const TELLING = new Set([
    "field", "colon", "cmp", "quote", "phrase", "glob", "regex", "not", "or",
    "unknown_field", "bad_value",
  ]);

  /* Words a person writes as operators and this language does not read as
     operators. Whitespace is AND, `|` is OR, `!` is NOT — so `a or b` looks
     for three words, one of which is "or", and says nothing about it. That is
     the one case where a query is wrong and nothing is marked wrong, so the
     reading is shown for it whether or not anything else in the query earns
     a line. */
  const MISTAKEN = new Set(["or", "and", "not", "ve", "veya", "değil"]);

  /* Which roles are punctuation rather than something typed to search for.
     In the product this is `Role::is_syntax` and comes over the wire with the
     spans; the mockup keeps the same list so the two agree. */
  const SYNTAX = new Set(["colon", "sep", "quote", "cmp", "not", "or"]);

  // --- the shadow layer: roles to colours. The frontend's ONLY job here.
  /* ---------------- what the query means ----------------
   *
   * **The engine says, the page draws.** This used to hold its own copy of the
   * field table and its own tokeniser, which is a second parser — and it had
   * already drifted: `node:`, `perm:`, `user:`, `depth:` and `regex:` all
   * existed in the language and were coloured here as plain text, because this
   * table had never heard of them. `Request::Explain` exists precisely so that
   * there is one parser, and the doc comment on it says why: the day the two
   * disagree, the box is confidently colouring a lie.
   *
   * So the spans, the readable sentence and the completions all come from one
   * call, on the same keystroke, and this file maps role to colour and nothing
   * else. A term added to the engine tomorrow is coloured correctly here with
   * no change at all. */
  let readGeneration = 0;
  let LAST_SPANS = [];
  /* The reading this keystroke asked for. Cheap on the service — under a
     millisecond — but it is a request, and requests are the scarce thing: six
     to an origin, shared with the search that the same keystroke started. */
  let reading = null;

  function refreshReading(text) {
    const mine = ++readGeneration;
    // In bytes: see `jsIndexByByte`. Sent as a code-unit index, one `İ` before
    // it was enough to put it inside a character, and the service sliced there.
    const where = document.activeElement === q ? (q.selectionStart ?? null) : null;
    const caret = where === null ? null : bytesBefore(text, where);
    if (reading) reading.abort();
    reading = new AbortController();
    SERVICE.explain(text, caret, reading.signal)
      .then((res) => {
        if (mine !== readGeneration) return;
        LAST_SPANS = res.spans || [];
        paint(text);
        qread.textContent = res.description || "";
        const wrong = LAST_SPANS.some(
          (s) => s.role === "unknown_field" || s.role === "bad_value",
        );
        qread.classList.toggle("warn", wrong);
        /* **Shown when it has something to say.**
         *
         * The line exists to tell you whether the engine read the query the
         * way you meant it: which word was taken as a field, what a `!`
         * excludes, whether `size:>1mb` was understood as a size. For
         * `ext:rs !cache` that is worth a line. For `hasan` it reads the word
         * back to you — "name contains \"hasan\"" — which is not information,
         * it is furniture.
         *
         * So the rule is not a preference but a property of the query: if
         * anything in it is more than a plain word, or anything in it is
         * wrong, the reading appears. Its being there is then a signal in
         * itself. */
        // Byte offsets, so through the map — the same reason `paintSpans`
        // uses it. Without it a word with `ş` in it is cut short here and
        // stops being recognised as one of the mistaken ones.
        const js = jsIndexByByte(text);
        qread.hidden =
          !wrong &&
          !LAST_SPANS.some((s) => TELLING.has(s.role)) &&
          !LAST_SPANS.some(
            (s) =>
              s.role === "text" &&
              MISTAKEN.has(text.slice(js(s.start), js(s.start + s.len)).toLowerCase()),
          );
        /* The reading lives in an `auto` grid row. A longer one can wrap
           after the list's frame has already painted, changing its client
           height without producing a window resize or a scroll. */
        repaint(true);
      })
      .catch((e) => {
        // Let go of by the next keystroke, which is the normal case while
        // someone is typing rather than something to write down.
        if (e.name === "AbortError") return;
        console.error("scour: query explanation did not draw:", e);
      });
  }

  /* The engine's role names, as the palette spells them. Anything unknown is
     drawn as text, which is what an older page should do with a newer role. */
  const ROLE_CLASS = {
    field: "key", colon: "key", cmp: "key", sep: "key",
    value: "val", phrase: "val", quote: "val",
    glob: "glob", regex: "glob",
    // `|` is structure, not exclusion: it says how terms combine, which is
    // what the key colour is for. Painting it in the exclusion colour would
    // say "this removes things", and it does the opposite.
    not: "not", or: "key",
    unknown_field: "bad", bad_value: "bad",
  };

  /* The engine counts bytes; a string here is counted in UTF-16 code units.
   *
   * The two agree exactly until the first character that is not ASCII, which
   * in Turkish is usually the first word. After that every span is cut a byte
   * or two off its own start: a coloured term ends mid-character and the next
   * one begins inside it. The same mismatch, sent the other way, was landing
   * the caret inside a character and panicking the service — `İ` is one unit
   * here and two bytes there.
   *
   * This is the one place the two are reconciled. Everything downstream of
   * `paintSpans` is in the units the page uses, and `caret` is turned into
   * bytes before it is sent. Built per call rather than kept: the string is
   * whatever fits in a search box, and a cached map is one more thing that can
   * be stale.
   */
  const ENCODER = new TextEncoder();
  const bytesBefore = (text, i) => ENCODER.encode(text.slice(0, i)).length;

  function jsIndexByByte(text) {
    const at = new Map([[0, 0]]);
    let b = 0;
    for (let i = 0; i < text.length; ) {
      const cp = text.codePointAt(i);
      const wide = cp > 0xffff;
      b += cp < 0x80 ? 1 : cp < 0x800 ? 2 : wide ? 4 : 3;
      i += wide ? 2 : 1;
      at.set(b, i);
    }
    /* An offset that is not a boundary means the engine and the page are
       looking at different strings, which is a different bug from this one.
       The end is a wrong answer that still draws; `undefined` slices from
       `NaN` and empties the box. */
    return (off) => (at.has(off) ? at.get(off) : text.length);
  }

  function paintSpans(text) {
    if (!LAST_SPANS.length) return [["text", text]];
    const js = jsIndexByByte(text);
    const out = [];
    let at = 0;
    for (const s of LAST_SPANS) {
      const start = js(s.start);
      const end = js(s.start + s.len);
      if (start > at) out.push(["text", text.slice(at, start)]);
      out.push([s.role, text.slice(start, end)]);
      at = end;
    }
    if (at < text.length) out.push(["text", text.slice(at)]);
    return out;
  }

  /* One pill a term: what it says, in its own colour, with a way to take it
     off. Terms are the spans between spaces — the engine has already decided
     where a term begins and ends, and splitting the text again here would be
     the second parser walking back in through a different door. */

  function paint(text) {
    // A caret sits *between* characters, so both neighbours are candidates:
    // backspace takes the one behind, Delete the one ahead.
    const caret = document.activeElement === q ? (q.selectionStart ?? -1) : -1;
    const touch = new Set();
    if (caret >= 0 && q.selectionEnd === caret) {
      if (caret > 0) touch.add(caret - 1);
      if (caret < text.length) touch.add(caret);
    }
    let at = 0;
    let html = "";
    for (const [role, t] of paintSpans(text)) {
      const plain = role === "text" || role === "space";
      const cls = ROLE_CLASS[role] || "";
      const marked = SYNTAX.has(role) && [...t].some((_, k) => touch.has(at + k));
      if (marked) {
        // Only the touched character is marked, not the whole run: `<=` is one
        // span and backspace takes one of its two characters.
        html += [...t].map((ch, k) =>
          touch.has(at + k)
            ? '<span class="r-' + role + ' caret-touch">' + escape_(ch) + "</span>"
            : '<span class="r-' + role + '">' + escape_(ch) + "</span>").join("");
      } else {
        html += plain ? escape_(t) : '<span class="r-' + role + '">' + escape_(t) + "</span>";
      }
      at += t.length;
    }
    shadow.innerHTML = html;
  }

  /* A picture for a row, when the file has one of its own.
   *
   * **The thumbnail if one exists, a drawn glyph otherwise**, and which it is
   * was decided by the service — a page cannot ask the filesystem whether a
   * thumbnail is there, and asking the bridge per row would be two hundred
   * requests a screen. `thumb` comes back with the row, from one `stat`.
   *
   * This used to answer for types too, and the bridge would go looking through
   * the desktop's icon theme. It does not any more: see the glyphs in the
   * style block. The route is still the only cacheable one in the bridge,
   * which now matters for a screenful of photographs rather than for a dozen
   * repeated type icons.
   *
   * **Not `loading="lazy"`.** The list is already virtual — the rows in the
   * document are the rows on the screen — so deferring buys nothing, and it
   * cost something: a browser will not start a lazy load for a page it thinks
   * is not being looked at, and every picture stayed at zero by zero. */
  const iconUrl = (f) =>
    `/api/icon?t=${TOKEN}&p=${encodeURIComponent(f.path + "/" + f.name)}`;

  /* The type tokens something is drawn for. Anything else — an old index
     holding a discriminant this version dropped, a source that invents one —
     falls back to the plain page rather than to no picture at all. */
  const GLYPHS = new Set([
    "folder", "file", "doc", "code", "image", "video", "media",
    "audio", "archive", "exec", "data", "config", "font", "build",
  ]);

  /* The first cell: the freshness rule, and the type glyph beside it.
   *
   * Both belong to the row rather than to any column, which is why this is
   * called from `writeRow` and not from a column's `write` — the glyph used to
   * be prepended inside the name cell by `writeName`, and a cell that holds a
   * picture *and* a name has to sort out which of its children are which on
   * every repaint. Here the rule is `<i>` and the glyph is whatever comes
   * after it, and neither has to look at the other.
   *
   * **Off means the element is not there.** A screenful of hidden nodes is
   * still a screenful of nodes to lay out on every scroll, and the point of
   * the switch is that a list of names costs what a list of names costs. So
   * this removes rather than hides, which is what it did before the move and
   * is the behaviour worth keeping.
   *
   * A thumbnail is a picture and has to be fetched; a type is a class name and
   * must not be. The two use different tags so that neither pays for the other
   * — a `<span>` never has a `src` to load or fail — and swapping the tag only
   * happens on the rows that change between the two, a handful per scroll
   * rather than one per row. */
  function writeMark(td, f) {
    /* The rule is first and stays first: `writeRow` reaches for it as
       `firstElementChild`, and a ghost row keeps it when everything else in
       the row is emptied. */
    let rule = td.firstElementChild;
    if (!rule || rule.tagName !== "I") {
      rule = document.createElement("i");
      td.prepend(rule);
    }
    /* **Only the picture, and a tile keeps something else here.** In the table
       the rule's next sibling is the glyph or nothing at all; a tile also
       holds its name, and taking *that* away when the pictures were switched
       off left a grid of empty boxes. Asked by class rather than by tag,
       because the glyph is a `<span>` and a thumbnail is an `<img>`. */
    let el = rule.nextElementSibling;
    if (el && !el.classList.contains("ico")) el = null;
    if (!f || !ICONS) {
      if (el) el.remove();
      return rule;
    }
    const want = f.thumb ? "IMG" : "SPAN";
    if (el && el.tagName !== want) {
      el.remove();
      el = null;
    }
    if (!el) {
      el = f.thumb ? new Image() : document.createElement("span");
      el.className = "ico";
      if (f.thumb) {
        el.alt = "";
        // A thumbnail that has gone since the row was read is an ordinary
        // state: the box stays, empty, and the row does not jump.
        el.onerror = () => { el.style.visibility = "hidden"; };
      }
      // Straight after the rule rather than at the end of the cell: in a tile
      // the name is already there and the picture goes above it.
      rule.after(el);
    }
    if (f.thumb) {
      const url = iconUrl(f);
      if (el.getAttribute("src") !== url) {
        el.style.visibility = "";
        el.setAttribute("src", url);
      }
    } else {
      const cls = "ico k-" + (GLYPHS.has(f.ktoken) ? f.ktoken : "file");
      if (el.className !== cls) el.className = cls;
    }
    return rule;
  }

  /* The name, written into a cell without going through HTML.
   *
   * This used to build a string — the picture's tag and the name with a
   * `<mark>` in it — and hand it to `innerHTML`, which is a parse per row.
   * With two hundred rows on the screen that measured **15 ms a paint**: most
   * of a frame spent turning text back into the nodes it had just come from,
   * and the reason scrolling stuttered even after the rows themselves stopped
   * being thrown away. The pieces are the same. `append` puts them in as text
   * nodes and one element, the picture is one `<img>` that stays and has its
   * `src` set only when it changes, and nothing is parsed at all.
   */
  function writeName(td, f, terms) {
    // The whole cell is this name, and it is rewritten whole — the marked run
    // moves with every keystroke. The picture used to live in front of it and
    // is in the mark column now; see `writeMark`.
    td.replaceChildren();
    const at = span(f.name, terms);
    if (!at) {
      td.append(f.name);
      return;
    }
    const mark = document.createElement("mark");
    mark.textContent = f.name.slice(at[0], at[0] + at[1]);
    td.append(f.name.slice(0, at[0]), mark, f.name.slice(at[0] + at[1]));
  }

  /* Where the first term matches, if any of them do. */
  function span(name, terms) {
    if (!terms.length) return null;
    const lower = name.toLowerCase();
    let best = null;
    for (const t of terms) {
      const i = lower.indexOf(t);
      if (i >= 0 && (!best || i < best[0])) best = [i, t.length];
    }
    return best;
  }

  /* The sentence under the line used to be built here, from the page's own
     reading of the query. It is the engine's now — one parser, one opinion —
     and what is left of that machinery below serves the completion hints,
     which have not been moved yet. */

  /* Completions for the word the caret is in. Field names come from the
     table, so a field that does not exist cannot be offered; values likewise
     — a completion the parser would read as plain text is worse than none. */
  function completions(text, cursor) {
    let a = cursor, b = cursor;
    while (a > 0 && !/\s/.test(text[a - 1])) a--;
    while (b < text.length && !/\s/.test(text[b])) b++;
    const typed = text.slice(a, cursor).replace(/^!/, "");
    const sp = fieldSplit(typed);
    if (sp) {
      const f = field(sp[0]);
      if (!f) return [];
      const list = f.takes === "kind" ? KIND_VALUES : f.takes === "time" ? TIME_VALUES : [];
      const pre = fold(sp[1]);
      return list.filter((v) => v.startsWith(pre)).map((v) => ({
        insert: sp[0] + ":" + v, label: f.name + ":" + v, about: T(f.about), at: [a, b],
      }));
    }
    const pre = fold(typed);
    return FIELDS
      .filter((f) => f.name.startsWith(pre) || f.alias.some((x) => x.startsWith(pre)))
      .map((f) => ({ insert: f.name + ":", label: f.eg || f.name + ":", about: T(f.about), at: [a, b] }));
  }

  const hintBox = document.getElementById("hints");
  const qread   = document.getElementById("qread");
  let hints = [], hintSel = 0;

  function showHints() {
    // Two conditions, both learned by trying. Opening the list while the box
    // is NOT focused — `render()` also runs on page load — started the
    // interface by answering a question nobody had asked. And listing twelve
    // fields while the word under the caret is EMPTY means a list covering
    // the screen after every space; it opens once typing starts.
    if (document.activeElement !== q) { hideHints(); return; }
    const cur = q.selectionStart ?? q.value.length;
    let a = cur;
    while (a > 0 && !/\s/.test(q.value[a - 1])) a--;
    if (cur === a) { hideHints(); return; }
    hints = completions(q.value, cur);
    if (hints.length === 0) { hideHints(); return; }
    hintSel = Math.min(hintSel, hints.length - 1);
    hintBox.innerHTML = hints.map((h, i) =>
      '<button role="option" data-i="' + i + '" aria-selected="' + (i === hintSel) + '">' +
      "<code>" + escape_(h.label) + "</code><span>" + escape_(h.about) + "</span></button>").join("");
    hintBox.hidden = false;
    q.setAttribute("aria-expanded", "true");
  }
  function hideHints() {
    hintBox.hidden = true;
    hints = [];
    hintSel = 0;
    q.setAttribute("aria-expanded", "false");
    const arrow = document.getElementById("qpast");
    if (arrow) arrow.setAttribute("aria-expanded", "false");
  }

  /* The past, in the same box the completions use.
   *
   * **One dropdown, not two.** A second list with its own keys and its own
   * idea of what Escape means would be two things to get right and two things
   * to explain. So a remembered query is a completion whose insert is the
   * whole line: the arrows, Enter, Escape and the mouse already work.
   *
   * `Alt+↓` opens it, which is what a combo box has meant since Windows 95
   * and what a browser's address bar still does. Plain `↓` keeps its job of
   * walking into the results. */
  function showHistory() {
    const typed = q.value.trim().toLowerCase();
    // What was typed narrows it, because a hundred past queries is a list
    // nobody reads. An empty box offers everything, newest first.
    const past = HISTORY.filter((h) => !typed || h.toLowerCase().includes(typed));
    if (!past.length) { hideHints(); return; }
    hints = past.map((h) => ({ insert: h, label: h, about: "", at: [0, q.value.length] }));
    hintSel = 0;
    hintBox.innerHTML = hints.map((h, i) =>
      '<button role="option" data-i="' + i + '" aria-selected="' + (i === hintSel) + '">' +
      "<code>" + escape_(h.label) + "</code><span></span></button>").join("");
    hintBox.hidden = false;
    q.setAttribute("aria-expanded", "true");
  }

  /* A query somebody meant, rather than one they were halfway through typing.
   *
   * The box searches per keystroke, so what was *searched* is `r`, `ra`,
   * `rap`. What goes in the history is what was committed to — Enter, or
   * opening a result — and only this half of the program knows which keys
   * those are. */
  const qpast = document.getElementById("qpast");
  /* Shown only when there is a past. An arrow that opens an empty list is a
     promise of something that is not there. */
  function showPastAffordance() {
    qpast.hidden = HISTORY.length === 0;
  }
  qpast.addEventListener("mousedown", (e) => {
    // `mousedown`, for the same reason the hint list uses it: by `click` the
    // input has lost focus and the list has already closed itself.
    e.preventDefault();
    if (hintBox.hidden) { q.focus(); showHistory(); } else { hideHints(); }
    qpast.setAttribute("aria-expanded", String(!hintBox.hidden));
  });

  function remember(text) {
    text = (text || "").trim();
    if (!text || HISTORY[0] === text) return;
    HISTORY = [text, ...HISTORY.filter((h) => h !== text)].slice(0, 100);
    showPastAffordance();
    /* The query, not the list. The service holds the history and applies the
       cap — which is where it belongs, because the cap was written down in
       `scour-settings` and never ran: the only writer sent a list it had
       already trimmed, so every frontend would have had to know the number and
       one that did not would grow the file without bound. The slice above is
       this window keeping its own copy in step, not the rule. */
    keep({ remember: text });
  }
  function acceptHint(i) {
    const h = hints[i];
    if (!h) return;
    const before = q.value.slice(0, h.at[0]);
    const after = q.value.slice(h.at[1]);
    /* **A space, unless there is one.** A completion offered while the caret
       sits against the end of another word used to be welded to it —
       `raporkind:exec`, which is one term nobody meant and a search that
       quietly answers nothing. The same at the other end: whatever follows
       has to stay a separate word. */
    const lead = before && !/\s$/.test(before) ? " " : "";
    const tail = after && !/^\s/.test(after) ? " " : "";
    q.value = before + lead + h.insert + tail + after;
    const caret = before.length + lead.length + h.insert.length + tail.length;
    q.setSelectionRange(caret, caret);
    hideHints();
    render();
    q.focus();
  }

  hintBox.addEventListener("mousedown", (e) => {
    // `mousedown`, not `click`: by the time `click` arrives the input has
    // lost focus and the list has closed itself — the click never landed.
    const b = e.target.closest("button");
    if (!b) return;
    e.preventDefault();
    acceptHint(+b.dataset.i);
  });

  q.addEventListener("keydown", (e) => {
    /* `Alt+↓` opens what was searched before — the combo box gesture. Plain
       `↓` still walks into the results, which is the more common move and
       should not be taken from it. */
    if (e.altKey && e.key === "ArrowDown") {
      e.preventDefault();
      if (hintBox.hidden) showHistory(); else hideHints();
      return;
    }
    /* Enter commits: the query goes into the history, and the box keeps the
       text so the next keystroke can still edit it. When the list is open,
       Enter takes the selection instead — handled below. */
    if (e.key === "Enter" && hintBox.hidden) {
      remember(q.value);
      return;
    }
    /* **Down goes to the list**, which is where a person's hand goes after
       typing: type, look, arrow down, Enter. Only when no completion is
       showing — there the arrows belong to the completions, and Escape puts
       them away and gives the key back. */
    if (hintBox.hidden && e.key === "ArrowDown") {
      const first = [...body.querySelectorAll("tr[data-path]")][0];
      if (first) {
        e.preventDefault();
        first.focus();
        return;
      }
    }
    if (hintBox.hidden) return;
    if (e.key === "ArrowDown" || e.key === "ArrowUp") {
      e.preventDefault();
      hintSel = (hintSel + (e.key === "ArrowDown" ? 1 : hints.length - 1)) % hints.length;
      [...hintBox.children].forEach((b, i) => b.setAttribute("aria-selected", i === hintSel));
      return;
    }
    if (e.key === "Enter" || e.key === "Tab") { e.preventDefault(); acceptHint(hintSel); return; }
    if (e.key === "Escape") { e.preventDefault(); hideHints(); }
  });
  q.addEventListener("blur", hideHints);

  /* ---------------- the list, which is virtual ----------------
   *
   * Two million rows do not go in a table. Everything's answer, and this one,
   * is to draw only what is on screen and to lie convincingly about the rest:
   * a spacer row above and below, sized in pixels, so the table is exactly as
   * tall as the whole result set would be and the scrollbar is right from the
   * first frame rather than growing while you use it.
   *
   * Which needs three things to be true, and they are:
   *
   *   * every row is the same height — 31px, measured, because the path is one
   *     line with `text-overflow: ellipsis` and nothing wraps;
   *   * the engine can be asked for an arbitrary window rather than only the
   *     next page, which `Page { offset, limit }` already is;
   *   * and it answers fast enough that dragging the thumb does not stutter.
   *     A window is 200 rows and lands in single-digit milliseconds.
   */
  /* How far down the list you can actually go.
   *
   * **Not a stylistic limit — a measured one.** A window of rows at offset N
   * costs the engine one built row per row it skips, because paging happens
   * after the merge and every segment has to offer its own best `N + 200`
   * before the merge can know which of them survive. Measured on 2,083,959
   * entries, empty query:
   *
   *   offset       0 →     3 ms
   *   offset  10,000 →    26 ms
   *   offset  50,000 →   174 ms
   *   offset 200,000 →   541 ms
   *   offset 750,000 → 1,373 ms
   *
   * A list that lets you drag the thumb to two million therefore stops filling
   * in — which is what it did, and it looked like the lazy loading being
   * broken rather than like the engine being asked something unreasonable.
   *
   * Twenty thousand is where a window still lands inside a frame or two. Past
   * it the answer is a better query, not more scrolling: `docs/ROADMAP.md` has
   * said so since phase 2.2 and the page had simply never enforced it.
   *
   * Raising it needs the engine to stop building rows it is about to discard —
   * a hit that carries a segment and a row number, materialised after the
   * page is chosen rather than before. */
  const REACH = 20_000;

  /* One row in the list's logical coordinate system.
   *
   * This is deliberately not a measurement. At 1.667 scale the browser can
   * draw the same requested row as 30.6 or 30.99 CSS pixels depending on where
   * it starts. Feeding either answer back into the sizer makes a paint decide
   * the next scroll extent, which is the loop the sizer exists to break. The
   * virtual coordinate is 31 CSS pixels whether a device pixel happens to
   * land on its edge or not; actual rows are measured only as a conservative
   * clearance bound for the table below. */
  const ROW_H = 31;

  /* ---------------- the three shapes, and the whole of the sum ------------
   *
   * A file browser offers a table of rows and a grid of pictures; this had one
   * of the two. What changes between them is **arithmetic and not machinery**:
   * the list is still virtual, the nodes are still reused rather than rebuilt,
   * and the height is still stated rather than summed. One item per line
   * becomes n per line, and that is all of it.
   *
   * So every number below is written in **lines**, and the detail list is the
   * case where a line holds one item. Substituting `PER_ROW = 1` and
   * `lineH() = ROW_H` turns each expression back into exactly the one that was
   * here before, which is the point: the shape that works is not being rewritten
   * to make room for two that are new.
   *
   *   items       reach()                    what the list may hold, ≤ REACH
   *   per line    PER_ROW                    1 in `detail`
   *   lines       ceil(reach() / PER_ROW)
   *   pitch       lineH(), or MAX_PX / lines when the ceiling is in the way
   *   sizer       round(lines * pitch)       the only thing that reaches that far
   *   first line  floor(scrollTop / pitch) - margin, clamped to lines - drawn
   *   drawn       ceil(clientHeight / pitch) + 2 * margin      (lines)
   *   first item  firstLine * PER_ROW
   *   last item   min(reach(), (firstLine + drawn) * PER_ROW)
   *   spacer      round(firstLine * pitch), clamped so the drawn lines fit
   *
   * `from` is a multiple of `PER_ROW` by construction, which is what puts a
   * tile in the column it belongs to. `visibleRange` still answers in *items*,
   * so every part of this page that fetches, caches, selects, highlights or
   * counts is untouched by any of it.
   *
   * The two things that had to be new are `PER_ROW` — a width, which is a
   * layout read and therefore dangerous here — and the tile's own height. Both
   * are handled the way `ROW_H` is: see `measurePerRow` for how the loop a
   * width could close is cut, and `TILE` for why its height is a decision. */

  /* One tile, in the same logical coordinates `ROW_H` is in, and for the same
   * reason: **these are decisions and not measurements.**
   *
   * `w` is a minimum. The grid is `repeat(PER_ROW, minmax(0, 1fr))`, so tiles
   * stretch into whatever is left over — but the *count* is stated by the page
   * rather than left to `auto-fill`, because a browser that fitted one more
   * across than this arithmetic believes would put every tile after the first
   * line at the wrong index, and nothing would say so.
   *
   * `h` is the pitch and the tile's whole outer box: no margin, no row gap, the
   * air is padding inside it. The style sheet declares the same number as
   * `--tile-h`, and `the_tile_the_page_draws_is_the_tile_it_counts` fails the
   * build if the two ever drift apart. */
  const TILE = {
    icons: { w: 132, h: 104 },
    large: { w: 204, h: 172 },
  };
  const MODES = ["detail", "icons", "large"];
  /* Which of the three is showing. The service holds it — see `applySettings`
     — and it is `detail` until that answer lands, because the window draws
     before the round trip. */
  let MODE = "detail";
  const grid = () => MODE !== "detail";

  /* The largest line each shape has been seen to draw. A clearance bound for
     the table and nothing else, never the logical pitch. Kept per shape
     because a 31-pixel row and a 188-pixel tile must not share a maximum, and
     seeded at the stated pitch so it is usable before anything is drawn. */
  const linePx = { detail: ROW_H, icons: TILE.icons.h, large: TILE.large.h };
  let headPx = ROW_H;        /* largest heading seen; likewise */
  /* **A browser will not make an element taller than about 33.5 million
     pixels**, and 2.1 M rows at 31px want 66 M. Past the ceiling the scroll
     position stops mapping to a row and the list jumps.
     So above it the rows are packed at whatever height does fit — the bar
     still spans the whole set and dragging it still lands where it points,
     and what is lost is that one wheel notch covers more rows than it looks
     like it should. The alternative is a scrollbar that lies about how much
     is left, which is the thing this design refuses to do. */
  const MAX_PX = 33_000_000;
  const WINDOW = 200;        /* rows fetched at a time */
  /* Extra rows drawn either side of the viewport.
   *
   * **Sixty was four times too many and it cost a frame.** Fourteen rows fit
   * on this screen; with sixty on each side, every scroll event rebuilt a
   * hundred and thirty-seven of them — measured at **18.5 ms of main thread**,
   * against a frame budget of 16.7. Every frame was late, which is what
   * "laggy" is.
   *
   * The margin is not what keeps the list from showing blanks — the rows are
   * *fetched* two hundred at a time and kept, so a flick lands on data that is
   * already in memory. All the margin buys is drawing slightly ahead of the
   * edge, and twenty is more than a frame's worth of scrolling. */
  const MARGIN = 20;

  /* Extra *lines* drawn either side of the viewport in a grid.
   *
   * **Counted in nodes rather than in pixels**, which is the lesson `MARGIN`
   * records. Twenty rows either side is forty nodes to write on every scroll;
   * two lines either side is `2 * PER_ROW`, which is the same order at any
   * width this window is used at. In pixels it is 208 for `icons` and 344 for
   * `large`, and a paint happens on the frame the scroll does, so the headroom
   * only ever has to cover one frame's travel.
   *
   * Deriving it from MARGIN's 620 pixels was worked out and rejected: that is
   * six lines of `icons`, which at ten across is a hundred and twenty extra
   * tiles — each one carrying an `<img>` — against the detail list's forty
   * rows. The margin is not what stops blanks in either shape; the rows are
   * fetched two hundred at a time and kept. */
  const GRID_MARGIN = 2;

  const LIST = {
    query: null, sort: null, desc: null,
    total: 0,                /* what the scrollbar is sized by */
    /* **Index to row, for every window that has been fetched and not thrown
     * away** — which is up to `REACH` of them, not "only the rows on screen".
     *
     * A comment here used to say the opposite: "only the rows that are on
     * screen; everything cached outside the viewport is dropped". Nothing ever
     * dropped anything, and it must not: the reading-ahead below deliberately
     * fetches the whole reachable list on a cheap ordering, and a cache that
     * evicted what it had just read ahead into would ask for it again for as
     * long as the window stayed open.
     *
     * So the bound is `REACH` rows — twenty thousand, a few megabytes — and it
     * is cleared when the query changes. The one thing that *is* deleted is
     * the tail past the end of the list once the exact count says where the
     * end is; see `dropBeyond`. */
    rows: new Map(),         /* index -> row, for every window fetched */
    /* **Every path the cache holds, and how many rows hold it.**
     *
     * One question is asked of the cache whenever a window is refreshed — "is
     * this a file that has just turned up?" — and it used to be answered by
     * rebuilding a set over the whole thing:
     * `new Set([...LIST.rows.values()].map(fullPath))`. Three passes and about
     * sixty thousand allocations over a map that reaches twenty thousand
     * entries once the reading-ahead has run, to decide something about the
     * two hundred rows on screen.
     *
     * Kept in step with `rows` instead, by `putRows` and `dropRows`, which are
     * the only two things that write to either. Counted rather than a plain
     * set because a file that moves one place down is briefly at two indices —
     * one window has been refetched and its neighbour has not — and the last
     * row to let go of a path is what makes it unknown again. */
    seen: new Map(),         /* path -> how many rows hold it */
    pending: new Map(),      /* start -> the exact request in flight */
    exact: false,            /* has the exact count landed yet */
    since: 0,                /* when this result set landed */
    /* **What one window of this result set costs the service**, in
     * milliseconds, as the service itself measured it. Read by the
     * reading-ahead, which is the only thing here that asks for rows nobody
     * has looked at yet — see `READ_AHEAD_MAX`. */
    cost: 0,
    /* **Which revision each cached window came from.**
     *
     * The cache is keyed by position and positions move: the list is sorted by
     * time, so a file being written walks to the top and everything under it
     * shifts down. A window fetched two revisions ago is not wrong enough to
     * throw away — it is the right rows, a place or two out — but it is not
     * something to go on showing either.
     *
     * So the visible windows are fetched again when the index moves and the
     * rest are left alone until the eye reaches them. What happened instead
     * was that the whole map was replaced on every revision; once the page
     * started reading ahead, that meant discarding twenty thousand rows and
     * asking for them again — **1.26 times a second on this machine, which is
     * what held the daemon at 100% CPU with nobody touching it.**
     *
     * Stamped with `SHOWING` rather than `REV`, which is what puts the live
     * refresh on a leash without putting a *missing* window on one. See
     * `refreshRows`. An entry here also means "this window has been fetched",
     * including one that came back empty — `rows` cannot say that, and asking
     * `rows` was how the reading-ahead came to request the same empty window
     * for ever on a list shorter than it thought. */
    at: new Map(),           /* window start -> the revision it was fetched at */
  };

  /* ---------------- the row cache, and the only two doors into it ----------
   *
   * Everything that writes to `LIST.rows` goes through `putRows`, and
   * everything that removes from it through `dropRows`, so that `LIST.seen`
   * cannot drift from what the cache actually holds. `seen` is what answers
   * "is this file one that has just turned up?" in constant time; the version
   * before this rebuilt a set over the whole cache to answer it, once per
   * index revision, which on this machine is about once a second. */

  const fullPath = (f) => f.path + "/" + f.name;

  /* One window's worth of rows, replacing whatever was at those indices.
   *
   * `mark` says whether this is a *refresh* of a window the page already had.
   * Only then can a row be an arrival: a window arriving for the first time
   * has no "a moment ago" to be compared with, every row in it is new to this
   * page and none of them is new to the disk — and marking those would flash
   * the whole list the first time the reading-ahead ran. */
  function putRows(start, rows, mark) {
    const at = Date.now();
    if (mark) {
      /* Aged out here as well as on the timer below, because the timer only
         gets to run when the refreshes stop. On a busy machine they do not:
         rescheduling it on every refresh kept rows highlighted for **7.8 s**
         against a 1.8 s intent. */
      for (const [p, when] of arrivals) if (when <= at - FRESH_MS) arrivals.delete(p);
      /* Asked before the swap below, while `seen` still describes the list as
         it was a moment ago. */
      for (const f of rows) {
        const p = fullPath(f);
        if (!LIST.seen.has(p) && !arrivals.has(p)) arrivals.set(p, at);
      }
    }
    /* The whole window, not only what came back. A window that comes back
       short is a list that has shrunk, and the rows past the new end are not
       rows any more. */
    dropRows(start, WINDOW);
    rows.forEach((f, i) => {
      const p = fullPath(f);
      /* The moment it arrived, not a flag: the row is redrawn several times
         while it is highlighted and the fade has to carry on from where it was
         rather than start again. */
      if (arrivals.has(p)) f.fresh = arrivals.get(p);
      LIST.rows.set(start + i, f);
      LIST.seen.set(p, (LIST.seen.get(p) || 0) + 1);
    });
    if (mark && arrivals.size) armFresh();
  }

  function dropRows(start, count) {
    for (let i = start; i < start + count; i++) {
      const f = LIST.rows.get(i);
      if (!f) continue;
      LIST.rows.delete(i);
      const p = fullPath(f);
      const n = LIST.seen.get(p);
      if (n > 1) LIST.seen.set(p, n - 1);
      else LIST.seen.delete(p);
    }
  }

  function clearRows() {
    LIST.rows.clear();
    LIST.seen.clear();
    LIST.at.clear();
  }

  /* Rows past the end of the list, once the exact count has said where the end
     is. `visibleRange` clamps to `reach()`, so these can never be painted and
     never asked for again — and their paths would otherwise sit in `seen` for
     the life of the query, which is what decides whether a file that comes
     back counts as an arrival. */
  function dropBeyond() {
    const end = reach();
    if (LIST.rows.size <= end) return;
    for (const i of [...LIST.rows.keys()]) if (i >= end) dropRows(i, 1);
    for (const s of [...LIST.at.keys()]) if (s >= end) LIST.at.delete(s);
  }

  /* **And the windows the exact count has just contradicted.**
   *
   * `dropBeyond` is the shrinking half of this and has been here a while: once
   * the count says where the list ends, the rows past the end are not rows.
   * The growing half was missing, and it is the half somebody sees. A window
   * that came back *short* came back short because the list ended inside it —
   * so if the count now says it does not, that window is out of date however
   * recently it was fetched.
   *
   * Which matters because the count and the rows are on different leashes.
   * `countsSoon` waits three seconds. `rowsSoon` waits `max(400 ms, what the
   * last refresh cost x COST)` and is made once at module scope, so the wait
   * it is holding when the query changes is the *previous* query's price — and
   * one window of a path-sorted list is seconds (2,463.6 ms measured, see
   * docs/MEASUREMENTS.md). Measured in the running window: list on folder
   * order showing everything, then a query nothing matched, then a matching
   * file created. `/api/facets` said `total=1` at 13.6 s; the first window of
   * rows was not asked for until 14.9 s, because the rows were still serving
   * out a 13.35 s leash the empty query had bought. For that second and a
   * third the screen read `1 / 2.235.938` over a list with nothing in it.
   *
   * Only the stamp is dropped, never the rows. `fillWindow` fetches a
   * *missing* window on the frame and makes an *out-of-date* one wait for the
   * clock — so removing the stamp is precisely what moves this window into the
   * class that does not wait, and what is on screen stays on screen until the
   * answer lands.
   *
   * The test is one row rather than a count: `putRows` clears the whole window
   * and then writes an answer's rows contiguously from `start`, so a window
   * that came back with n rows holds exactly `start`..`start+n-1` and the last
   * row it ought to hold is the only one worth asking about. That keeps this
   * at one lookup per cached window — a hundred of them at `REACH` — rather
   * than one per row. */
  function dropShort() {
    /* A capped count is a floor, not a length, and contradicts nothing. */
    if (!LIST.exact) return;
    const end = reach();
    for (const start of [...LIST.at.keys()]) {
      if (start >= end) continue;              /* dropBeyond's half */
      const last = start + Math.min(WINDOW, end - start) - 1;
      if (!LIST.rows.has(last)) LIST.at.delete(start);
    }
  }

  /* **The one way to say how long the list is.**
   *
   * `empty.hidden` is derived from this and used to be written by whoever
   * happened to move `LIST.total`. Three of the four did: the search that
   * lands on a keystroke, a window of rows carrying a total the count cap did
   * not cut, and going offline. The fourth is the count refresh, which walks
   * the matching set on its own leash and moved `LIST.total` without a word
   * about the message — and when it got there first, the branch in
   * `fillWindow` that hides the message was skipped for having nothing left to
   * change. The screen then said "No matches" over a list with a row in it,
   * and went on saying it until the query changed.
   *
   * So the two are moved together or not at all. `dropBeyond` and `dropShort`
   * come along for the same reason: what the cache may still be trusted for is
   * a fact about the length, and every caller had to remember it separately. */
  function setTotal(total, exact) {
    LIST.total = total;
    LIST.exact = exact;
    empty.hidden = LIST.total !== 0;
    dropBeyond();
    dropShort();
  }

  const scrollEl = document.querySelector(".scroll");

  /* Which rows the viewport is over, plus a margin so a flick does not show
     blank space before the fetch lands. */
  /* How many rows the list is allowed to be, which is not how many matched.
   *
   * **A capped count is a floor, not a length.** The first answer comes back
   * fast because the engine stops counting at the cap and says "1.000+"; the
   * exact number lands about two hundred milliseconds later. Sizing the list by
   * that first number made the scrollbar go 620,004 px → 31,005 → 620,005 in
   * two tenths of a second — a twentyfold collapse and an instant recovery.
   *
   * If a drag is in progress when that happens, the ground moves under it: the
   * thumb is somewhere else on release and the list keeps travelling. If the
   * position was past the thousandth row it lands beyond the end and the screen
   * goes empty. Both were reported, and they were this.
   *
   * So an unfinished count sizes the list by what it can reach rather than by a
   * bound it is about to contradict. Every row inside that is fetchable — the
   * engine will serve row nineteen thousand whether or not it has finished
   * counting — so this is not a promise the list cannot keep. */
  const reach = () => {
    if (LIST.query === null) return 0;
    return LIST.exact ? Math.min(LIST.total, REACH) : REACH;
  };

  /* **How many tiles fit across, read once a frame and never oftener.**
   *
   * A width is a layout read, which is the thing this file is careful about —
   * so the loop one could close is *cut* rather than reasoned about. Left
   * alone, `PER_ROW` would depend on how tall the list is: more across → fewer
   * lines → a shorter list → no scrollbar → a wider scroller → more across.
   * That is the sizer's own bug wearing a different hat. `scrollbar-gutter:
   * stable`, set on `.scroll` whenever the grid is showing, reserves the bar's
   * width whether or not there is a bar, so `clientWidth` is a fact about the
   * window rather than about what is in it.
   *
   * Taken at the top of the frame beside the row-height sample, where the
   * layout is settled and a read costs nothing. Everything downstream uses the
   * number instead of asking again — `fillWindow` runs outside a frame and
   * must not measure anything at all. */
  let PER_ROW = 1;
  function measurePerRow() {
    PER_ROW = grid()
      ? Math.max(1, Math.floor(scrollEl.clientWidth / TILE[MODE].w))
      : 1;
  }

  /* How many lines the list is, and how tall one of them is. In `detail` these
     are `reach()` and `ROW_H`, which is what makes every expression below the
     one that was here before. */
  const lines = () => Math.ceil(reach() / PER_ROW);
  const lineH = () => (grid() ? TILE[MODE].h : ROW_H);

  /* Pixels per logical line until the set is too tall to draw, then whatever
     fits. A painted row never feeds this number back into the scrollbar. */
  const pitch = () => (lines() * lineH() > MAX_PX ? MAX_PX / lines() : lineH());

  /* The margin, in lines. `MARGIN` is already a count of lines in the shape
     where a line is a row. */
  const marginLines = () => (grid() ? GRID_MARGIN : MARGIN);

  function visibleRange() {
    const p = pitch();
    const m = marginLines();
    const rows = lines();
    const count = Math.ceil(scrollEl.clientHeight / p) + m * 2;
    const end = reach();
    const wanted = Math.max(0, Math.floor(scrollEl.scrollTop / p) - m);
    /* `end` can move before Chromium has clamped the old `scrollTop`: an exact
       count can land during a thumb drag, or live updates can remove the tail.
       Without this clamp the range is `[19000, 1500]`; the painter then pops
       past an empty pool and the list never gets another successful draw.

       Clamping to the last *full* window also keeps the pool size from losing
       one row at a time at the bottom, where removing an anchor candidate is
       exactly the wrong response to a scroll. */
    const first = Math.min(wanted, Math.max(0, rows - count));
    /* Out in items, because that is what every reader of this wants: a window
       to fetch, a row to select, a slot to write. The multiplication is the
       only place the two coordinate systems meet. */
    return [first * PER_ROW, Math.min(end, (first + count) * PER_ROW)];
  }

  /* Draw the window that is on screen, after one top spacer.
   *
   * **The nodes are kept and rewritten, never rebuilt.** Replacing the body's
   * HTML meant that every scroll paid for parsing a table, allocating a row
   * and a cell for each line, creating an `<img>` per row and laying all of it
   * out again — measured at **18.5 ms** for one scroll event with sixty rows
   * of margin either side, against a frame budget of 16.7. A tall window made
   * it worse, because the cost is per row drawn and a tall window draws more.
   *
   * So the table holds a fixed shape — a spacer, a pool of rows and a note —
   * and a paint changes text and attributes in place. Nodes are created
   * only when the window has to hold *more* rows than before, which happens
   * when the window is resized and at no other time.
   *
   * The separate sizer is what makes the scrollbar honest; the spacer only
   * places the drawn window inside it. */
  let pool = [];
  const sizer = document.getElementById("sizer");
  const spTop = document.createElement("tr");
  const farRow = document.createElement("tr");
  spTop.className = "spacer";
  farRow.className = "far";
  spTop.innerHTML = "<td></td>";
  farRow.innerHTML = "<td></td>";

  function widen(node) {
    /* Age + shown columns + the picker. This used to omit the picker and write
       the same wrong span on every paint, forcing the table grid to reconcile
       a short row while it was being scrolled. */
    const span = SHOWN.length + 2;
    if (node.firstElementChild.colSpan !== span) {
      node.firstElementChild.colSpan = span;
    }
  }

  /* One row's worth of cells, made once. */
  function makeRow() {
    const tr = document.createElement("tr");
    tr.tabIndex = 0;
    tr.innerHTML = `<td class="age"><i></i></td>` + shownColumns().map(() => "<td></td>").join("");
    return tr;
  }

  /* One tile's worth of nodes, made once.
   *
   * Still a `<tr>`, and that is the whole reason a grid cost as little as it
   * did: selection, the row menu, the keyboard walk, the double-click and the
   * shift-range all reach for `closest("tr")` and `tr[data-path]`, and none of
   * them had to learn a second kind of node. What the grid changes is `display`
   * and the arithmetic above it.
   *
   * Two children: the freshness rule and the name. The picture is not made
   * here — `writeMark` owns it in both shapes and puts it directly after the
   * rule — which is why the name is reached through `__nm` rather than by
   * position. */
  function makeTile() {
    const tr = document.createElement("tr");
    tr.tabIndex = 0;
    const td = document.createElement("td");
    td.className = "tile";
    const rule = document.createElement("i");
