<!doctype html>
<!-- This page began as an artifact, where the surrounding document was
     supplied for it. Served on its own it has to bring its own, and the
     doctype is not a formality: without it the browser is in quirks mode,
     where the `height: 100%` chain from `html` down to the results list
     does not connect and the window collapses to the height of its content. -->
<!-- `lang` is the source language, and `applyLanguage` rewrites it as soon as
     the catalogue lands. It matters beyond politeness: the attribute is what a
     screen reader picks a voice from, and what the browser hyphenates and
     spell-checks by. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark light">
<title>Scour</title>
</head>
<body>

<style>
  /* ------------------------------------------------------------------
     The palette. One loud voice: FRESHNESS. The thin rule down the left of
     each row says in colour when the file last changed — warm yellow for "a
     moment ago", cold slate for "years ago". Not decoration but data: the
     engine already stores rows in date order, so an unbroken spectrum runs
     the length of the list.
     The neutrals lean blue; chosen, not inherited.
  ------------------------------------------------------------------ */
  /* @THEME@ — see `scour-ui`; the bridge writes this block when it serves
     the page, so that the window and this page cannot drift apart. */

  * { box-sizing: border-box; }

  /* The window is the window. Nothing outside the results list scrolls —
     the search box, the meter, the rail and the column headings are all
     fixed furniture, and a list of two million things is the only thing long
     enough to need moving. A page that scrolls as a whole would take the
     query line off the screen, which is the one element that must never
     leave it. */
  html, body { height: 100%; overflow: hidden; margin: 0; }

  .wrap {
    background: var(--ground);
    color: var(--ink);
    font-family: var(--sans);
    font-size: 14px;
    line-height: 1.45;
    padding: calc(var(--u) * 5);
    height: 100%;
    box-sizing: border-box;
    display: grid;
    /* **One column, and the help no longer takes one.** The prose used to sit
       beside the tool in a second 34ch track, which meant opening it re-laid
       out the table: every column narrowed, and at any ordinary window width
       the list gained a horizontal scrollbar it did not have a moment before.
       The help is an overlay now and the window has one thing in it. */
    grid-template-columns: minmax(0, 1fr);
    grid-template-rows: minmax(0, 1fr);
    align-items: stretch;
  }

  .app  { grid-column: 1; grid-row: 1; }

  /* `.note` used to wrap the panel's opening prose. The panel styles its own
     now — `.help` below — and the one rule worth carrying over is this, which
     the `<b>` in the "permission" paragraph still depends on. */
  .help b { color: var(--ink); font-weight: 620; }

  /* ---------------- uygulama penceresi ---------------- */
  .app {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 3px;
    overflow: hidden;
    box-shadow: 0 18px 50px -28px rgba(0,0,0,.7);
    /* Fills the column, and every child that is not the list is `auto` —
       so whatever height is left over lands on the one thing that can use it. */
    display: grid;
    grid-template-rows: auto auto auto minmax(0, 1fr);
    min-height: 0;
    height: 100%;
  }

  /* --- the query line: not a box, the page itself --- */
  .query {
    display: flex;
    align-items: baseline;
    gap: calc(var(--u) * 3);
    padding: calc(var(--u) * 4) calc(var(--u) * 5) calc(var(--u) * 3);
    border-bottom: 1px solid var(--line-soft);
  }
  .brand {
    font-size: 12px;
    font-weight: 700;
    letter-spacing: .28em;
    text-transform: uppercase;
    color: var(--ink-3);
    flex: none;
    padding-top: 3px;
  }
  /* Something to take hold of.
     The first version had no box and no border, and the result was this: with
     an empty query the strip was blank — no text, no frame, just a caret. The
     "no box" idea is right; erasing every affordance is not. Three marks are
     left: a prompt glyph, an underline, and a colour that lights on focus. */
  .qline {
    display: flex;
    align-items: baseline;
    gap: calc(var(--u) * 3);
    flex: 1;
    min-width: 0;
    border-bottom: 2px solid var(--line);
    padding-bottom: calc(var(--u) * 1.5);
  }
  .qline:focus-within { border-bottom-color: var(--t1); }
  .prompt {
    flex: none;
    font: 600 17px/1.35 var(--mono);
    color: var(--ink-3);
    user-select: none;
  }
  .qline:focus-within .prompt { color: var(--t1); }

  .qfield { flex: 1; min-width: 0; position: relative; overflow: visible; }
  .qfield input {
    width: 100%;
    background: none;
    border: 0;
    outline: 0;
    color: transparent;
    caret-color: var(--ink);
    font: 600 20px/1.3 var(--mono);
    letter-spacing: -.01em;
    padding: 0;
    position: relative;
    z-index: 2;
  }
  /* The query stays exactly as typed — selectable, copyable — while the terms
     it recognises are coloured. Real text, structured presentation. */
  .qshadow {
    position: absolute;
    inset: 0;
    font: 600 20px/1.3 var(--mono);
    letter-spacing: -.01em;
    white-space: pre;
    overflow: hidden;
    pointer-events: none;
    color: var(--ink);
    z-index: 1;
  }
  /* Role → colour. That mapping is the frontend's ONLY job here: the engine
     sends the pieces (`explain` → `spans`), because a frontend that tokenised
     the query itself would be a second parser, and the day the two disagree
     the box colours a lie with complete confidence. */
  .qshadow .r-field { color: var(--q-key); font-weight: 700; }
  .qshadow .r-value { color: var(--q-val); }
  .qshadow .r-cmp   { color: var(--q-key); }
  .qshadow .r-colon,
  .qshadow .r-sep,
  .qshadow .r-quote { color: var(--ink-3); }
  .qshadow .r-phrase{ color: var(--q-val); }
  .qshadow .r-glob  { color: var(--q-glob); }
  .qshadow .r-not   { color: var(--q-not); font-weight: 700; }
  .qshadow .r-or    { color: var(--q-not); font-weight: 700; }

  /* The two warning roles. The parser never fails — a term it cannot read is
     searched for as ITS OWN TEXT — and that is what keeps a half-typed query
     usable. It is also the one place the engine can quietly answer the wrong
     question: `kind:zurna` looks for files *named* "kind:zurna". The wavy
     underline says so while it is being typed, not in the results. */
  .qshadow .r-bad,
  .qshadow .r-unknown {
    color: var(--q-bad);
    text-decoration: underline wavy var(--q-bad);
    text-underline-offset: 4px;
    text-decoration-thickness: 1px;
  }

  /* The syntax character the caret is touching.

     What backspace is about to remove, said before the key is pressed rather
     than after. Deleting a piece of syntax changes what the query *means*
     rather than how it is worded — take the `:` out of `ext:pdf` and it stops
     being a filter and becomes a search for the text "extpdf" — so the one
     character that is about to go says so. Both sides count: a caret is
     between two characters, and backspace takes the one behind it while
     Delete takes the one ahead. */
  .qshadow .caret-touch {
    border-radius: 2px;
    background: var(--q-not);
    color: var(--panel);
    box-shadow: 0 0 0 1px var(--q-not);
  }

  .qfield input::placeholder { color: var(--ink-3); font-weight: 500; }

  /* Term actions — the layer that makes the query line something you can
     operate rather than only read.

     The text stays one real `<input>`: a query is a sentence and has to be
     selectable, copyable and typable end to end. So the hover target is not a
     DOM node per term — there is no node — it is arithmetic. The face is
     monospace, so the caret index under the pointer is `x / charWidth`, and
     from that the term under it is a lookup in the same spans the colouring
     uses. Slint will get this for free later: there the terms really are
     separate elements. */
  /* No z-index on the layer itself, so its two children can sit on opposite
     sides of the text. Putting the whole layer above it — which is what this
     did first — hid the very term it was pointing at. */
  /* The chevron sits inside the field, at its trailing edge, clear of the
     text: the input's own padding-right leaves room for it. */
  #qpast {
    position: absolute;
    right: 0;
    top: 50%;
    transform: translateY(-50%);
    z-index: 3;
    width: 20px;
    height: 20px;
    padding: 0;
    border: 0;
    border-radius: 3px;
    background: none;
    color: var(--ink-3);
    font: 600 11px/1 var(--sans);
    cursor: pointer;
  }
  #qpast[hidden] { display: none; }
  #qpast:hover { color: var(--ink); background: var(--line-soft); }
  #qpast[aria-expanded="true"] { color: var(--ink); background: var(--line-soft); }
  #qpast:focus-visible { outline: 2px solid var(--focus); outline-offset: 1px; }
  .qfield input { padding-right: 22px; }

  .qacts {
    position: absolute;
    inset: 0;
    pointer-events: none;
  }
  /* The soft ground goes BEHIND the shadow layer (z-index 1) and the input
     (2). It is a highlight, and a highlight that covers what it highlights is
     not one. */
  .qacts .band {
    position: absolute;
    top: -3px;
    bottom: -3px;
    z-index: 0;
    border-radius: 4px;
    background: var(--line-soft);
  }
  /* The buttons go above everything, and entirely clear of the glyphs: the
     line box is 26 px and the text sits centred in it, so -19px puts them in
     the air above the query rather than over its last two characters. */
  .qacts button {
    width: 17px;
    height: 17px;
    padding: 0;
    border: 0;
    border-radius: 50%;
    background: var(--line);
    color: var(--ink-2);
    font: 600 10px/1 var(--sans);
    cursor: pointer;
    pointer-events: auto;
    display: grid;
    place-items: center;
  }
  /* **The holes a hand fell through.**
   *
   * The buttons are drawn in the air above the query and are put away when the
   * pointer leaves the field, and there were three ways to leave it without
   * meaning to. Two pixels between a button's bottom edge (38) and the field's
   * top (40). Three pixels between the two buttons. And the whole width of the
   * field to the right of the term, because they sit at the term's *right
   * edge* — so reaching for them meant leaving the term that drew them.
   *
   * All three were the same bug in different clothes: aiming at the target
   * destroyed it. Neither button could be pressed, and that is what was
   * reported.
   *
   * So the pair is one box now. It covers both buttons and the gap between
   * them, it reaches down past the field's edge, and the pointer stays inside
   * it the whole way. Measured with real mouse events walking the path a hand
   * takes: at 37, 38, 39 and 40 pixels the element under the pointer is the
   * button. */
  .qacts .pair {
    position: absolute;
    top: -19px;
    display: flex;
    gap: 3px;
    padding-bottom: 8px;
    pointer-events: auto;
    z-index: 4;
  }
  .qacts button:hover { background: var(--ink-3); color: var(--panel); }
  /* Removing is destructive, so it says so on hover and nowhere else. */
  .qacts button.drop:hover { background: var(--q-bad); color: #fff; }
  /* Negation is not destructive — it is the same term, asked the other way. */
  .qacts button.neg:hover { background: var(--q-not); color: #fff; }
  .qacts button:focus-visible { outline: 2px solid var(--focus); outline-offset: 1px; }

  /* The query as a sentence. In the product this is `explain`'s `description`;
     here it is the mockup's stand-in for the same rules. A misread term turns
     it red — the colour says WHAT, this line says WHY. */
  .qread {
    margin: calc(var(--u) * 2) 0 0;
    min-height: 15px;
    font: 500 11.5px/1.3 var(--sans);
    color: var(--ink-3);
    letter-spacing: .01em;
  }
  .qread b { color: var(--ink-2); font-weight: 600; }
  .qread.warn { color: var(--q-bad); }

  /* Completions. Field names come from one source — the engine's field table —
     so a field that exists is offered and a field that does not cannot be. */
  .hints {
    position: absolute;
    top: calc(100% + 8px);
    left: 0;
    min-width: 280px;
    max-height: 232px;
    overflow-y: auto;
    background: var(--panel-2);
    border: 1px solid var(--line);
    border-radius: 8px;
    box-shadow: 0 20px 44px -24px rgba(0,0,0,.75);
    padding: calc(var(--u) * 1);
    z-index: 30;
  }
  .hints[hidden] { display: none; }
  .hints button {
    display: flex;
    align-items: baseline;
    gap: calc(var(--u) * 3);
    width: 100%;
    background: none;
    border: 0;
    border-radius: 5px;
    padding: calc(var(--u) * 1.5) calc(var(--u) * 2);
    text-align: left;
    cursor: pointer;
    color: var(--ink-2);
    font: 500 12px/1.3 var(--sans);
  }
  .hints button code {
    font: 700 12.5px/1.3 var(--mono);
    color: var(--q-key);
    flex: none;
  }
  .hints button[aria-selected="true"] { background: var(--line-soft); color: var(--ink); }
  .hints button:hover { background: var(--line-soft); }

  /* --- the meter line: the engine's work is not hidden --- */
  .meter {
    display: flex;
    align-items: center;
    gap: calc(var(--u) * 4);
    padding: 0 calc(var(--u) * 5) calc(var(--u) * 3);
    font: 500 11.5px/1 var(--mono);
    font-variant-numeric: tabular-nums;
    color: var(--ink-3);
    letter-spacing: .02em;
    flex-wrap: wrap;
  }
  .meter .big { color: var(--ink); font-size: 12.5px; font-weight: 650; }
  .meter .ms  { color: var(--t0); font-weight: 650; }
  .meter .sep { color: var(--line); }

  /* ---------------- body ---------------- */
  .body { display: grid; grid-template-columns: 186px minmax(0, 1fr); min-height: 0; overflow: hidden; }
  /* `hidden` has to win over `display: grid`, or the inactive tab keeps its row. */
  .body[hidden], .report[hidden] { display: none; }
  #view-search, #view-report { grid-row: 4; }
  .rail { overflow-y: auto; min-height: 0; }
  /* Counts that belong to the query before this one: still readable, plainly
     not final. Slow enough in to not flicker on a fast answer. */
  .rail.settling { opacity: .55; transition: opacity .18s ease-in .12s; }
  @media (max-width: 720px) { .body { grid-template-columns: 1fr; } .rail { display: none; } }

  .rail {
    border-right: 1px solid var(--line-soft);
    padding: calc(var(--u) * 3) 0;
    background: var(--panel-2);
  }
  .rail h2 {
    margin: calc(var(--u) * 3) calc(var(--u) * 4) calc(var(--u) * 1.5);
    font-size: 10px;
    letter-spacing: .18em;
    text-transform: uppercase;
    color: var(--ink-3);
    font-weight: 650;
  }
  .rail h2:first-child { margin-top: 0; }
  .facet {
    display: flex;
    align-items: center;
    gap: calc(var(--u) * 2);
    width: 100%;
    background: none;
    border: 0;
    text-align: left;
    padding: 3px calc(var(--u) * 4);
    color: var(--ink-2);
    font: inherit;
    font-size: 12.5px;
    cursor: pointer;
    border-left: 2px solid transparent;
  }
  .facet:hover { background: var(--panel); color: var(--ink); }
  .facet:focus-visible { outline: 2px solid var(--focus); outline-offset: -2px; }
  .facet[aria-pressed="true"] { color: var(--ink); border-left-color: var(--t1); background: var(--panel); }
  .facet .dot { width: 7px; height: 7px; border-radius: 1px; flex: none; }
  /* Kinds get no colour. In this design colour means *time*, and giving kinds
     a colour too would dilute that. A bar proportional to the count instead:
     which kind is crowded reads at a glance, and the palette stays single-
     voiced. */
  .facet.bar { position: relative; }
  .facet.bar > .fill {
    position: absolute; left: 0; top: 2px; bottom: 2px;
    background: var(--line); border-radius: 0 2px 2px 0; z-index: 0;
  }
  .facet.bar > .nm, .facet.bar > .ct { position: relative; z-index: 1; }
  .facet.bar[aria-pressed="true"] > .fill { background: var(--line); opacity: 1; }
  .facet .nm { flex: 1; min-width: 0; }
  .facet .ct {
    font-family: var(--mono);
    font-variant-numeric: tabular-nums;
    font-size: 11px;
    color: var(--ink-3);
  }

  /* ---------------- results ---------------- */
  .results { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
  .scroll {
    flex: 1;
    overflow: auto;
    position: relative;
    /* A virtual row does not stay where its DOM node stays: the node is reused
       and the top spacer moves it to another index. Chromium's scroll anchor
       cannot know that. If it anchors one of those rows, changing the spacer
       makes it correct `scrollTop`; that correction fires `scroll`, which
       moves the spacer again. The sizer makes the extent stable, and this
       makes the position stable for the same reason. */
    overflow-anchor: none;
  }
  /* **What the list is as tall as.** Nothing is drawn in it and nothing can be
     clicked through it; it exists so that the scrollable height is a number the
     page states outright rather than a sum of whatever the rows happened to
     lay out as. See `paintWindow`. */
  .sizer { position: absolute; top: 0; left: 0; width: 1px; height: 0; pointer-events: none; }
  table { width: 100%; border-collapse: collapse; table-layout: fixed; }
  /* Every cell keeps to its column: a long path is cut, not allowed to widen
     the table. Without this a fixed layout still lets an unbreakable word
     push the row out. */
  tbody td { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  thead th {
    position: sticky; top: 0; z-index: 3;
    background: var(--panel);
    border-bottom: 1px solid var(--line);
    padding: calc(var(--u) * 2) calc(var(--u) * 3);
    text-align: left;
    font-size: 10px;
    letter-spacing: .14em;
    text-transform: uppercase;
    color: var(--ink-3);
    font-weight: 650;
    white-space: nowrap;
    cursor: pointer;
    user-select: none;
  }
  thead th { position: sticky; }
  /* The grip straddles the line, because the line is what a hand aims at.
     Nine pixels centred on it, not a one-pixel border — the chip's × taught
     that lesson earlier today and this is the same one again.
     `z-index` here only ranks it inside its own heading; what puts it above
     the heading to its right is that headings are numbered downwards as they
     go across. See `buildHeads`. */
  thead th .grip {
    position: absolute; top: 0; right: -4px; bottom: 0;
    width: 9px; cursor: col-resize; z-index: 4;
  }
  thead th .grip::after {
    content: ""; position: absolute; top: 25%; bottom: 25%; left: 4px;
    width: 1px; background: var(--line);
  }
  thead th .grip:hover::after,
  thead th .grip.dragging::after { background: var(--q-key); top: 0; bottom: 0; }
  /* Carrying a column somewhere else. The heading fades so the line is what
     the eye follows — the line says where it lands, and the heading is only
     what it came from. */
  thead th.moving { opacity: .4; }
  .dropline {
    position: absolute; top: 0; bottom: 0; width: 2px;
    background: var(--t1); z-index: 6; pointer-events: none;
  }
  .dropline[hidden] { display: none; }
  body.moving-col { cursor: grabbing; user-select: none; }
  body.moving-col * { cursor: grabbing !important; }
  /* While a column is being dragged, nothing else reacts to the pointer —
     otherwise crossing a row selects text and crossing a header sorts. */
  body.resizing { cursor: col-resize; user-select: none; }
  body.resizing * { cursor: col-resize !important; }

  thead th:hover { color: var(--ink); }
  thead th.num { text-align: right; }
  thead th[aria-sort]:not([aria-sort="none"]) { color: var(--ink); }
  thead th .arrow { color: var(--t1); }

  tbody tr { border-bottom: 1px solid var(--line-soft); }
  tbody tr:hover { background: var(--panel-2); }
  /* **A wash, and translucent for the same reason the match is.** A selected
     row still has to answer "is the pointer on me" and "does my name match",
     so all three stack rather than replace each other.
   *
     On the cells rather than on the row, which is what makes the stacking work
     without a second rule for hover: a cell's background paints over its row's
     by the ordinary rules, so this sits above `tr:hover` and shows it
     through. */
  tbody tr.sel td { background: var(--pick); }
  tbody td { padding: 0 calc(var(--u) * 3); height: var(--row); vertical-align: middle; }

  /* What is selected, said in a line rather than left to be counted.
     Between the list and the ribbon, and gone when nothing is selected — a bar
     that is always there is a bar nobody reads. */
  .selbar {
    display: flex; align-items: center; gap: calc(var(--u) * 3);
    padding: calc(var(--u) * 2) calc(var(--u) * 3);
    border-top: 1px solid var(--line);
    background: var(--panel-2);
    font: 500 12px/1 var(--mono); color: var(--ink-2);
    flex-wrap: wrap;
  }
  .selbar[hidden] { display: none; }
  .selbar .n { color: var(--ink); font-weight: 650; }
  .selbar .sum { color: var(--ink-3); }
  .selbar .grow { flex: 1; }
  .selbar button {
    background: none; border: 1px solid var(--line); border-radius: 3px;
    padding: calc(var(--u) * 1.25) calc(var(--u) * 2.5);
    font: inherit; color: var(--ink-2); cursor: pointer;
  }
  .selbar button:hover { color: var(--ink); border-color: var(--ink-3); }
  .selbar button:focus-visible { outline: 2px solid var(--focus); outline-offset: 1px; }
  /* The one that is about to open a pile of windows, waiting to be told again. */
  .selbar button.asking { color: var(--q-not); border-color: var(--q-not); }

  /* ---------------- the mark column ----------------
   *
   * The freshness rule — three pixels down the left of each row. The list is
   * in date order, so an unbroken spectrum runs the length of the page. The
   * type glyph now shares the cell with it; see `writeMark`.
   *
   * **The column was already this wide.** It was written `width: 3px` and it
   * measured thirty: a heading's own padding is 24px of that and the fixed
   * table handed it the rest. So twenty-seven pixels of every row were blank
   * and had been since the rule was added — which is the gap that was asked
   * about, and the reason moving the glyph in costs no width at all. The name
   * text lands 25px further left and no other column moves.
   *
   * **The rule keeps the edge, the glyph takes the middle.** Absolutely
   * positioned rather than a block in the flow, so that it is exactly as tall
   * as the cell however the row rounds. `height: var(--row)` was a second
   * opinion about a height this file has one hard-won rule about (see
   * `paintWindow`): a flat 30px against a cell measured at 29.4 inside a row
   * measured at 30.6, so how much of the row a segment covered depended on
   * the fraction that row happened to start at. `top: 0; bottom: 0` asks the
   * cell instead of guessing.
   *
   * What this does *not* close is the line between segments, and that is the
   * row's own `border-bottom` rather than a gap — measured at 1px before this
   * change and 1px after. Left alone deliberately: the spectrum the design
   * note claims is a progression of colour down the list, which survives a
   * hairline, and taking the border away here would take it away from the
   * one column that has it and leave the rows below looking unruled.
   *
   * Rejected: shrinking this back to three pixels when the glyphs are off.
   * The toggle lives in the heading now and would have nowhere to sit, and
   * every column in the table would jump sideways on a click that was
   * supposed to be about pictures. */
  td.age { padding: 0 0 0 3px; width: 30px; position: relative; text-align: center; }
  td.age i { position: absolute; left: 0; top: 0; bottom: 0; width: 3px; }

  .name { font: 500 13px/1 var(--mono); color: var(--ink); white-space: nowrap; }
  /* **A wash, not a highlighter.** This used to be solid yellow with near-black
     text, which on a list where every third row matches turned the column into
     a page of stickers — and inverting the ink meant the matched letters were
     the only ones not in the row's own colour, so the eye read the *marks* as
     the content. Translucent, and the letters keep their colour: the run is
     visible without shouting, and it stacks correctly over a selected row
     because it is an overlay rather than a replacement. */
  .name mark { background: var(--mark); color: inherit; padding: 1px 0; border-radius: 2px; }
  /* **No width of its own.** This carried `max-width: 34ch`, left over from a
     mockup whose columns could not be dragged. The cap is narrower than the
     column's own default, so widening the column bought nothing: the path
     stopped growing at thirty-four characters and the rest of the space stayed
     empty with an ellipsis sitting in the middle of it. The cell is the
     constraint — it is `table-layout: fixed` and the grip sets its width — so
     this only has to agree to be cut at whatever that turns out to be. */
  .path {
    font: 400 11.5px/1 var(--mono);
    color: var(--ink-3);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .path b { color: var(--ink-2); font-weight: 400; }
  /* The date columns are right-aligned numbers everywhere else and left
     where they are words. */
  td.n.left { text-align: left; }
  td.n {
    font: 400 12px/1 var(--mono);
    font-variant-numeric: tabular-nums;
    text-align: right;
    color: var(--ink-2);
    white-space: nowrap;
  }
  td.kind { font-size: 11.5px; color: var(--ink-2); white-space: nowrap; }
  .empty { padding: calc(var(--u) * 12); text-align: center; color: var(--ink-3); font-size: 13px; }
  .empty code { font-family: var(--mono); color: var(--ink-2); }

  /* ---------------- the grid, which is the same list ----------------
   *
   * Two of the three shapes are a grid of tiles, and the change is arithmetic
   * rather than machinery: the same `<tr>` per row, the same pool, the same
   * spacer and the same sizer. What moves is that a line holds `PER_ROW` of
   * them instead of one. See the block above `TILE` in the script for the
   * whole of the sum.
   *
   * **The tile's height here and `TILE[…].h` there are one number.** They are
   * written twice because one of them has to be a declaration and the other
   * has to be arithmetic, and `the_tile_the_page_draws_is_the_tile_it_counts`
   * fails the build if they drift.
   *
   * The heading row **stays**, and that is not an oversight. It is the sort
   * control — clicking a heading is the only way to order this list — and it
   * carries the picture switch and the column picker as well. Hidden, a grid
   * would be a list nobody could sort. What it gives up is its widths, which
   * describe columns that are not underneath it any more; see `applyWidths`. */
  body.grid[data-view="icons"] { --tile-h: 104px; --pic: 56px; --nm: 11px; }
  body.grid[data-view="large"] { --tile-h: 172px; --pic: 120px; --nm: 12px; }
  /* **The gutter is reserved whether or not there is a bar.**
   *
   * `PER_ROW` is `floor(clientWidth / tile width)`, so without this the width
   * would depend on the list's own height: more across → fewer lines → a
   * shorter list → no scrollbar → a wider scroller → more across. That is the
   * sizer's feedback loop wearing a different hat, and it is cut here rather
   * than reasoned about. */
  body.grid .scroll { scrollbar-gutter: stable; }
  body.grid .results table { display: block; }
  body.grid .results thead { display: block; }
  body.grid .results thead tr { display: flex; align-items: stretch; }
  body.grid .results thead th { width: auto; flex: 0 0 auto; }
  /* Nothing to drag: the widths mean nothing while the tiles are showing. */
  body.grid .results thead th .grip { display: none; }
  body.grid #rows-body { display: grid; gap: 0; }
  body.grid #rows-body > tr { display: block; border-bottom: 0; }
  body.grid #rows-body > tr.spacer,
  body.grid #rows-body > tr.far { grid-column: 1 / -1; }
  body.grid #rows-body > tr.ghost { height: auto; }
  body.grid #rows-body > tr > td { display: block; padding: 0; }
  body.grid #rows-body > tr.spacer > td { height: 0; }
  /* One tile: the freshness rule down its left edge, a picture, a name.
     `height` is the pitch and the whole outer box — no margin, no gap — so
     that `lines * pitch` is the height the list actually occupies. The air
     between tiles is padding inside them.

     Written out to the same depth as the rule above rather than as
     `body.grid td.tile`, which is what it was: that one loses on specificity,
     the cell stayed `display: block`, and an inline `<span>` takes no width or
     height — so every glyph was 0×0 and a grid of pictures had none in it. */
  body.grid #rows-body > tr > td.tile {
    position: relative;
    height: var(--tile-h);
    /* **The border is what separates one tile's rule from the next one's.**
       Transparent, and inside the box — `box-sizing` is `border-box`, so the
       outer height is still exactly `--tile-h` and the pitch is still stated.
       Without it the rules of a whole column abut into one unbroken orange
       line and read as a table border rather than as eight marks. The detail
       list solves the same problem with its own `border-bottom`, which is
       visible there because a list wants ruling and a grid does not. */
    border-bottom: 1px solid transparent;
    padding: calc(var(--u) * 2) calc(var(--u) * 2) 0;
    display: flex; flex-direction: column; align-items: center;
    gap: calc(var(--u) * 1.5);
    overflow: hidden;
  }
  /* **The ruler keeps its three pixels and its edge.** In the table an
     unbroken spectrum runs the length of the page; in a grid it runs down
     each column instead, which is less of a picture but is the same fact in
     the same place — and losing it to save three pixels of a hundred-pixel
     tile would be giving up the one thing on this screen that is nowhere
     else. `top: 0; bottom: 0` asks the cell rather than guessing, for the
     reason `td.age i` does. */
  body.grid td.tile > i { position: absolute; left: 0; top: 0; bottom: 0; width: 3px; }
  body.grid td.tile .ico {
    width: var(--pic); height: var(--pic);
    object-fit: contain;
    flex: none;
  }
  body.grid td.tile span.ico {
    background-color: var(--k, var(--ink-3));
    -webkit-mask: var(--g) center / var(--pic) var(--pic) no-repeat;
    mask: var(--g) center / var(--pic) var(--pic) no-repeat;
  }
  /* Two lines and then an ellipsis. A name is what tells two thumbnails
     apart, so it is not cut at one line; and it is not allowed a third,
     because the tile's height is the pitch and the pitch is stated. */
  body.grid td.tile .nm {
    font: 500 var(--nm)/1.35 var(--mono);
    color: var(--ink);
    text-align: center;
    width: 100%;
    display: -webkit-box;
    -webkit-box-orient: vertical;
    -webkit-line-clamp: 2;
    overflow: hidden;
    overflow-wrap: anywhere;
    white-space: normal;
  }
  body.grid td.tile .nm mark { background: var(--mark); color: inherit; border-radius: 2px; }
  body.grid tbody tr:hover td.tile { background: var(--panel-2); }
  body.grid tbody tr:focus-visible { outline: none; }
  body.grid tbody tr:focus-visible td.tile { outline: 2px solid var(--focus); outline-offset: -2px; }
  /* The end-of-list note is a line of prose, not a tile. */
  body.grid #rows-body > tr.far > td { height: auto; }

  /* The three shapes, as three buttons. In the meter bar because that is
     where this window keeps what is true of the *window* rather than of what
     it is looking at — the same argument that moved the picture switch out of
     here and into the column it fills. */
  .views { display: flex; gap: 2px; }
  .views button {
    background: none; border: 1px solid var(--line); color: var(--ink-3);
    width: 18px; height: 18px; border-radius: 3px; cursor: pointer;
    font: 600 11px/1 var(--sans); padding: 0;
  }
  .views button:hover { color: var(--ink); border-color: var(--ink-3); }
  .views button[aria-pressed="true"] { color: var(--q-key); border-color: var(--q-key); }
  .views button:focus-visible { outline: 2px solid var(--focus); outline-offset: 1px; }

  /* ---------------- the time ribbon ---------------- */
  .ribbon {
    border-top: 1px solid var(--line);
    background: var(--panel-2);
    padding: calc(var(--u) * 2.5) calc(var(--u) * 5) calc(var(--u) * 3);
  }
  .ribbon-head {
    display: flex; justify-content: space-between; align-items: baseline;
    font-size: 10px; letter-spacing: .14em; text-transform: uppercase;
    color: var(--ink-3); font-weight: 650; margin-bottom: calc(var(--u) * 2);
  }
  .ribbon-head span { letter-spacing: .02em; text-transform: none; font-weight: 500;
                      font-family: var(--mono); font-size: 10.5px; }
  .bars { display: flex; align-items: flex-end; gap: 2px; height: 46px; }
  .bars button {
    flex: 1; border: 0; padding: 0; background: none; cursor: pointer;
    display: flex; align-items: flex-end; height: 100%;
    border-radius: 1px;
  }
  .bars button:focus-visible { outline: 2px solid var(--focus); outline-offset: 1px; }
  .bars i { display: block; width: 100%; border-radius: 1px 1px 0 0; opacity: .9; }
  .bars button:hover i { opacity: 1; }
  .bars button[aria-pressed="true"] i { opacity: 1; box-shadow: 0 0 0 1px var(--ink) inset; }
  .scale {
    display: flex; justify-content: space-between;
    margin-top: 5px;
    font: 500 9.5px/1 var(--mono);
    letter-spacing: .04em;
    color: var(--ink-3);
  }

  /* ---------------- yinelenenler ---------------- */
  .dupes { margin-top: calc(var(--u) * 7); }
  .dupes-head {
    display: flex; align-items: baseline; gap: calc(var(--u) * 3);
    border-top: 2px solid var(--line); padding-top: calc(var(--u) * 3);
  }
  .dupes-head h4 {
    margin: 0; flex: none;
    font-size: 11px; letter-spacing: .16em; text-transform: uppercase;
    color: var(--ink); font-weight: 650;
  }
  .dupes-sum {
    flex: 1; min-width: 0;
    font-family: var(--mono); font-size: 11.5px; color: var(--ink-2);
  }
  .floors { flex: none; display: flex; gap: 1px; }
  .floors button {
    font: inherit; font-size: 11px; font-family: var(--mono);
    background: none; color: var(--ink-3);
    border: 1px solid var(--line); border-right-width: 0;
    padding: 2px calc(var(--u) * 1.5); cursor: pointer;
  }
  .floors button:first-child { border-radius: 3px 0 0 3px; }
  .floors button:last-child { border-radius: 0 3px 3px 0; border-right-width: 1px; }
  .floors button:hover { color: var(--ink); }
  .floors button[aria-pressed="true"] { color: var(--ink); background: var(--panel-2); border-color: var(--ink-3); }
  .floors button:focus-visible { outline: 2px solid var(--focus); outline-offset: 1px; }
  #d-open {
    flex: none; font: inherit; font-size: 11.5px;
    background: var(--panel-2); color: var(--ink-2);
    border: 1px solid var(--line); border-radius: 3px;
    padding: 3px calc(var(--u) * 2.5); cursor: pointer;
  }
  #d-open:hover { color: var(--ink); border-color: var(--ink-3); }
  #d-open:focus-visible { outline: 2px solid var(--focus); outline-offset: 1px; }
  .dupes-head button {
    flex: none; font: inherit; font-size: 11.5px;
    background: var(--panel-2); color: var(--ink-2);
    border: 1px solid var(--line); border-radius: 3px;
    padding: 3px calc(var(--u) * 2.5); cursor: pointer;
  }
  .dupes-head button:hover:enabled { color: var(--ink); border-color: var(--ink-3); }
  .dupes-head button:disabled { opacity: .5; cursor: default; }
  .dupes-head button:focus-visible { outline: 2px solid var(--focus); outline-offset: 1px; }
  .dupe {
    border-top: 1px solid var(--line-soft);
    padding: calc(var(--u) * 2) 0;
  }
  .dupe .top {
    display: flex; align-items: baseline; gap: calc(var(--u) * 2.5);
    font-family: var(--mono); font-size: 11.5px;
  }
  .dupe .save { color: var(--ink); font-weight: 650; }
  .dupe .of { color: var(--ink-3); }
  /* **The word that decides whether a file gets deleted**, so it is coloured
     rather than left as one more grey label: proven and merely-the-same-length
     are different claims. */
  .dupe .sure { margin-left: auto; font-size: 10.5px; letter-spacing: .04em; }
  /* Read and compared is the calm state; not-yet-read is the one that needs
     to catch the eye, because that is the one somebody must not act on. */
  .dupe .sure.content { color: var(--ink-2); }
  .dupe .sure.size, .dupe .sure.edges { color: var(--t1); font-weight: 650; }
  .dupe ul { margin: 3px 0 0; padding: 0 0 0 calc(var(--u) * 3); list-style: none; }
  .dupe li {
    font-family: var(--mono); font-size: 11px; color: var(--ink-2);
    overflow-wrap: anywhere; line-height: 1.5;
  }

  /* This face has handed over to another one, so the server is going. A line
     across the middle rather than a banner at the top: what is behind it is a
     list nothing will refresh again, and it should read as finished rather
     than as broken. */
  .handover {
    position: fixed; inset: auto 0 0 0; z-index: 40;
    padding: calc(var(--u) * 3);
    background: var(--panel-2);
    border-top: 1px solid var(--line);
    font: 500 12.5px/1.4 var(--sans); color: var(--ink-2);
    text-align: center;
  }

  /* ---------------- the preview ----------------

     A third column, shut by default: most of what this list is used for is
     finding a path and getting out of the way, and a panel that is always
     there costs the list a third of its width to say so. */
  .body { --peek-w: 380px; }
  .body.peeking { grid-template-columns: 186px minmax(0, 1fr) var(--peek-w); }
  /* Under this there is no room for three, so the panel becomes the window:
     the list is what you came from, not what you are reading. */
  @media (max-width: 900px) {
    .body.peeking { grid-template-columns: 0 0 1fr; }
    .body.peeking .rail, .body.peeking .results { display: none; }
  }
  .peek {
    border-left: 1px solid var(--line-soft);
    background: var(--panel-2);
    display: flex; flex-direction: column;
    min-width: 0; min-height: 0; overflow: hidden;
  }
  .peek[hidden] { display: none; }
  .peek-head {
    display: flex; align-items: center; gap: calc(var(--u) * 2);
    padding: calc(var(--u) * 2.5) calc(var(--u) * 3);
    border-bottom: 1px solid var(--line-soft);
    flex: none;
  }
  .peek-head .nm {
    flex: 1; min-width: 0;
    font-size: 12.5px; font-weight: 600; color: var(--ink);
    /* **It wraps rather than truncating**, and that is a correction. The first
       version clipped with `direction: rtl`, which keeps the *end* of a name
       visible — the end being what tells `rapor-v2.pdf` from `rapor-v3.pdf`.
       It also reorders the string: `2023 NTP.pdf` came out as `NTP.pdf 2023`,
       because a leading run of digits is bidi-neutral and an rtl paragraph
       puts it on the far side. A header has room for two lines, and losing
       nothing beats a clever ellipsis that renames the file. */
    overflow-wrap: anywhere;
    max-height: 2.8em; overflow: hidden;
    line-height: 1.35;
  }
  .peek-head button {
    flex: none; background: none; border: 0; cursor: pointer;
    color: var(--ink-3); font-size: 15px; line-height: 1;
    padding: 2px 6px; border-radius: 3px;
  }
  .peek-head button:hover { color: var(--ink); background: var(--line-soft); }
  .peek-head button:focus-visible { outline: 2px solid var(--focus); outline-offset: 1px; }

  .peek-body {
    flex: 1; min-height: 0; overflow: auto;
    display: flex; align-items: center; justify-content: center;
    padding: calc(var(--u) * 3);
  }
  /* Text fills the panel; a picture is centred in it. One box, two jobs, and
     the difference is which way the content wants to grow. */
  .peek-body.text { display: block; padding: 0; }
  .peek-body pre {
    margin: 0; padding: calc(var(--u) * 3);
    font: 400 11.5px/1.55 var(--mono);
    color: var(--ink-2);
    white-space: pre-wrap; word-break: break-word;
    tab-size: 4;
  }
  .peek-body pre mark {
    background: var(--mark); color: inherit;
    padding: 1px 0; border-radius: 2px;
  }
  .peek-body img, .peek-body video {
    max-width: 100%; max-height: 100%;
    object-fit: contain;
    /* A transparent PNG on a dark panel is a picture of nothing. */
    background:
      repeating-conic-gradient(var(--line-soft) 0% 25%, transparent 0% 50%) 50% / 16px 16px;
    border-radius: 2px;
  }
  .peek-body audio { width: 100%; }
  .peek-body embed { width: 100%; height: 100%; border: 0; }
  .peek-body .none {
    text-align: center; color: var(--ink-3); font-size: 12px; line-height: 1.6;
  }
  .peek-body .none img {
    display: block; margin: 0 auto calc(var(--u) * 2);
    max-width: 128px; max-height: 128px; background: none;
  }
  .peek-cut {
    flex: none;
    padding: calc(var(--u) * 1.5) calc(var(--u) * 3);
    border-top: 1px solid var(--line-soft);
    font: 500 10.5px var(--mono); color: var(--ink-3);
  }
  .peek-facts {
    flex: none; margin: 0;
    border-top: 1px solid var(--line-soft);
    padding: calc(var(--u) * 2.5) calc(var(--u) * 3);
    display: grid; grid-template-columns: auto 1fr;
    gap: 3px calc(var(--u) * 3);
    font-size: 11.5px;
    max-height: 42%; overflow: auto;
  }
  .peek-facts dt { color: var(--ink-3); white-space: nowrap; }
  .peek-facts dd {
    margin: 0; color: var(--ink-2);
    font-family: var(--mono); font-size: 11px;
    overflow-wrap: anywhere;
  }

  /* ---------------- the help panel ----------------
   *
   * Over the window rather than beside it. `fixed` because it is anchored to
   * a button by measurement (see `placeHelp`) and the page itself never
   * scrolls, so viewport coordinates are the button's coordinates.
   *
   * It is deliberately not modal: nothing behind it is disabled and it does
   * not dim the window. Somebody reading "what can I type" wants to type it,
   * and a help that has to be dismissed before the box will take a keystroke
   * is a help you close before you have finished reading it. */
  .help {
    position: fixed;
    z-index: 60;
    width: min(430px, calc(100vw - 40px));
    max-height: min(560px, calc(100vh - 120px));
    overflow-y: auto;
    overscroll-behavior: contain;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 4px;
    box-shadow: 0 24px 60px -20px rgba(0,0,0,.75);
    padding: calc(var(--u) * 4) calc(var(--u) * 5) calc(var(--u) * 5);
    color: var(--ink-2);
    font-size: 13px;
    line-height: 1.55;
  }
  .help[hidden] { display: none; }

  /* ---------------- what is skipped ----------------
     The panel shipped with no styling at all: it opened, it was legible, and
     it sat in the page's flow pushing the table down. It carries switches now
     — a control somebody aims at rather than reads — so it is an overlay like
     the help, positioned the same way and off the same tokens. */
  .sheet {
    position: fixed;
    top: 64px; right: 20px;
    z-index: 60;
    width: min(400px, calc(100vw - 40px));
    max-height: min(620px, calc(100vh - 120px));
    overflow-y: auto;
    overscroll-behavior: contain;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 4px;
    box-shadow: 0 24px 60px -20px rgba(0,0,0,.75);
    padding: calc(var(--u) * 4) calc(var(--u) * 5) calc(var(--u) * 5);
    color: var(--ink-2);
    font-size: 13px;
    line-height: 1.55;
  }
  .sheet[hidden] { display: none; }
  /* One face per row: a dot saying which one is running, the name, and — once
     the row is armed — the sentence and the button that acts on it. */
  .face { border-radius: 3px; }
  .face.armed { background: var(--hover); }
  .face .pick {
    display: flex; align-items: center; gap: 8px; width: 100%;
    padding: 6px; background: none; border: 0; color: var(--ink);
    font: inherit; font-size: 12px; text-align: left; cursor: pointer;
  }
  .face .pick:hover:not(:disabled) { background: var(--hover); border-radius: 3px; }
  .face .pick:disabled { color: var(--ink-3); cursor: default; }
  .face .dot { width: 12px; color: var(--ink-3); }
  .face .pick:disabled .dot { color: var(--q-key); }
  .face .name { flex: 1; }
  .face .aside { color: var(--ink-3); font-size: 11px; }
  .face .say {
    display: flex; align-items: center; gap: 8px;
    padding: 0 6px 8px 26px;
  }
  .face .say p { flex: 1; margin: 0; color: var(--ink-2); font-size: 11px; }
  .face .say .go {
    padding: 5px 12px; border: 1px solid var(--q-key); border-radius: 3px;
    background: none; color: var(--q-key); font: inherit; font-size: 11px;
    cursor: pointer; white-space: nowrap;
  }
  .sheet h2 {
    font-size: 13px; letter-spacing: .16em; text-transform: uppercase;
    font-weight: 650; color: var(--ink); margin: 0 0 calc(var(--u) * 3);
  }
  .sheet h3 {
    font-size: 10px; letter-spacing: .16em; text-transform: uppercase;
    font-weight: 650; color: var(--ink-3);
    margin: calc(var(--u) * 5) 0 calc(var(--u) * 2);
    padding-top: calc(var(--u) * 3);
    border-top: 1px solid var(--line);
  }
  .sheet .why { margin: 0 0 calc(var(--u) * 2); font-size: 12px; color: var(--ink-3); }
  ul.rules { list-style: none; margin: 0; padding: 0; }
  ul.rules li {
    display: flex; align-items: center; gap: calc(var(--u) * 2);
    padding: 2px 0;
  }
  /* The label is the hit target, not the box: these are short strings and a
     13-pixel checkbox beside them is a hard thing to aim at. */
  ul.rules label {
    flex: 1; display: flex; align-items: center; gap: calc(var(--u) * 2);
    cursor: pointer; min-width: 0;
  }
  ul.rules code {
    font-family: var(--mono); font-size: 11.5px; color: var(--ink);
    overflow-wrap: anywhere;
  }
  /* Switched off has to look switched off from across the room — the checkbox
     alone reads as decoration in a list of forty. */
  ul.rules li.off code { color: var(--ink-3); text-decoration: line-through; }
  ul.rules .drop {
    background: none; border: 0; padding: 0 calc(var(--u));
    color: var(--ink-3); font-size: 15px; line-height: 1; cursor: pointer;
  }
  ul.rules .drop:hover { color: var(--q-bad, var(--ink)); }
  form.add { display: flex; gap: calc(var(--u) * 2); margin-top: calc(var(--u) * 3); }
  form.add input {
    flex: 1; min-width: 0;
    background: var(--panel-2); color: var(--ink);
    border: 1px solid var(--line); border-radius: 2px;
    padding: 3px 6px; font: inherit; font-size: 12px;
  }
  form.add button {
    background: var(--panel-2); color: var(--ink);
    border: 1px solid var(--line); border-radius: 2px;
    padding: 3px 10px; font: inherit; font-size: 12px; cursor: pointer;
  }
  form.add button:hover { border-color: var(--ink-3); }

  .help-head { display: flex; align-items: baseline; gap: calc(var(--u) * 3); }
  .help h1 {
    flex: 1;
    font-size: 13px; letter-spacing: .16em; text-transform: uppercase;
    font-weight: 650; color: var(--ink); margin: 0;
  }
  .help-head button {
    background: none; border: 0; padding: 0 calc(var(--u));
    color: var(--ink-3); font-size: 17px; line-height: 1; cursor: pointer;
  }
  .help-head button:hover { color: var(--ink); }
  .help-head button:focus-visible { outline: 2px solid var(--focus); outline-offset: 1px; }
  .help h2 {
    font-size: 10px; letter-spacing: .16em; text-transform: uppercase;
    font-weight: 650; color: var(--ink-3);
    margin: calc(var(--u) * 5) 0 calc(var(--u) * 2);
    padding-top: calc(var(--u) * 3);
    border-top: 1px solid var(--line);
  }
  .help-lead { margin: 0 0 calc(var(--u) * 3); font-size: 12.5px; }
  .help code {
    font-family: var(--mono); font-size: 11.5px;
    color: var(--ink); background: var(--panel-2);
    padding: 1px 4px; border-radius: 2px;
  }
  /* Two columns of text, and the left one is grammar: it is the thing being
     named, so it gets the monospace and the ink. `grid` rather than a real
     `<dl>` flow, so the descriptions line up against the longest term instead
     of against each other. */
  .help-fields, .help-keys {
    display: grid;
    grid-template-columns: max-content minmax(0, 1fr);
    gap: calc(var(--u) * 1.5) calc(var(--u) * 4);
    margin: 0;
    align-items: baseline;
  }
  .help-fields dt, .help-keys dt {
    font: 500 11.5px/1.4 var(--mono);
    color: var(--ink);
    white-space: nowrap;
  }
  .help-fields dd, .help-keys dd {
    margin: 0; font-size: 12.5px; color: var(--ink-2);
  }

  /* ---------------- the design notes, inside the help ---------------- */
  /* **One column.** This was `repeat(auto-fit, minmax(240px, 1fr))` with a
     1180px cap — the shape it had when this page was a full-width artifact
     being shown off. Dropped into a 34ch sidebar, the 240px minimum was wider
     than the track it was in, so the notes laid themselves out sideways and
     three and a half of the five sat off the right edge behind a horizontal
     scrollbar. It is prose in a narrow panel now, which is one column. */
  .legend { display: flex; flex-direction: column; gap: calc(var(--u) * 4); }
  .legend section { padding-top: 0; }
  .legend h3 {
    margin: 0 0 calc(var(--u) * 1.5);
    font-size: 11px; letter-spacing: .16em; text-transform: uppercase;
    color: var(--ink); font-weight: 650;
  }
  .legend p { margin: 0; color: var(--ink-2); font-size: 12.5px; line-height: 1.5; }
  /* The maker, at the foot of the panel. Quiet on purpose: it is a fact about
     the program, not a banner, and it sits below the last note the way a
     colophon sits below the text. */
  .made {
    margin: calc(var(--u) * 5) 0 0;
    padding-top: calc(var(--u) * 3);
    border-top: 1px solid var(--line);
    font-size: 11.5px; color: var(--ink-3);
  }
  .made a { color: var(--ink-2); text-decoration: none; border-bottom: 1px solid var(--line); }
  .made a:hover { color: var(--ink); border-bottom-color: var(--ink-3); }
  .legend code {
    font-family: var(--mono); font-size: 11.5px;
    color: var(--ink); background: var(--panel-2);
    padding: 1px 4px; border-radius: 2px;
  }

  /* ---------------- theme switch ---------------- */
  .tabs { display: flex; gap: 1px; padding: 0 calc(var(--u) * 5); background: var(--panel); }
  .tabs button {
    background: none; border: 0; border-bottom: 2px solid transparent;
    padding: calc(var(--u) * 2) calc(var(--u) * 3);
    font: 650 10.5px/1 var(--sans); letter-spacing: .16em; text-transform: uppercase;
    color: var(--ink-3); cursor: pointer;
  }
  .tabs button:hover { color: var(--ink-2); }
  .tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--t1); }
  .tabs button:focus-visible { outline: 2px solid var(--focus); outline-offset: -2px; }

  /* ---------------- rapor ---------------- */
  /* The other tab occupies the same last row, so it scrolls inside too rather
     than growing the window. */
  .report {
    padding: calc(var(--u) * 4) calc(var(--u) * 5) calc(var(--u) * 5);
    overflow-y: auto;
    min-height: 0;
  }
  .crumb { font: 500 12.5px/1 var(--mono); color: var(--ink-3); margin-bottom: calc(var(--u) * 3); }
  .crumb button {
    background: none; border: 0; padding: 0 2px; font: inherit;
    color: var(--ink-2); cursor: pointer; border-radius: 2px;
  }
  .crumb button:hover { color: var(--ink); text-decoration: underline; }
  .crumb button:last-child { color: var(--ink); font-weight: 650; }
  .crumb .s { color: var(--line); padding: 0 1px; }
  /* The filter, said where the scope is said — the two together are what the
     numbers below are about, and a reader who misses this reads a `du` figure
     that is not one. Marked in the same yellow a matched name is. */
  .crumb .filt {
    display: inline-flex; align-items: center; gap: 3px;
    margin-left: calc(var(--u) * 2); padding: 2px 3px 2px 6px;
    border-radius: 3px; background: var(--mark); color: var(--ink-2);
  }
  .crumb .filt b { color: var(--ink); font-weight: 650; }
  .crumb .filt button { color: var(--ink-3); padding: 0 3px; }
  .crumb .filt button:hover { color: var(--ink); text-decoration: none; }

  .headline { display: flex; align-items: baseline; gap: calc(var(--u) * 5); flex-wrap: wrap;
              margin-bottom: calc(var(--u) * 4); }
  .headline .b {
    font: 700 34px/1 var(--mono); letter-spacing: -.02em;
    font-variant-numeric: tabular-nums; color: var(--ink);
  }
  .headline .m { font: 500 12px/1.4 var(--mono); color: var(--ink-3); }
  .headline .m b { color: var(--ink-2); font-weight: 500; }

  .kids { width: 100%; border-collapse: collapse; }
  .kids th {
    text-align: left; padding: 0 calc(var(--u) * 2) calc(var(--u) * 1.5);
    font-size: 9.5px; letter-spacing: .16em; text-transform: uppercase;
    color: var(--ink-3); font-weight: 650; border-bottom: 1px solid var(--line);
  }
  .kids th.r { text-align: right; }
  .kids td { padding: calc(var(--u) * 1.5) calc(var(--u) * 2); border-bottom: 1px solid var(--line-soft); }
  .kids tr:hover td { background: var(--panel-2); }
  .kids .nmcell button {
    background: none; border: 0; padding: 0; cursor: pointer;
    font: 500 12.5px/1 var(--mono); color: var(--ink); text-align: left;
  }
  .kids .nmcell button:hover { text-decoration: underline; }
  .kids .nmcell button:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
  .kids td.r {
    text-align: right; font: 400 12px/1 var(--mono);
    font-variant-numeric: tabular-nums; color: var(--ink-2); white-space: nowrap;
  }
  .kids td.r.big { color: var(--ink); font-weight: 600; }

  /* The stacked age bar — the report's central idea. */
  .stack { display: flex; height: 13px; border-radius: 2px; overflow: hidden; background: var(--line-soft); }
  .stack i { display: block; height: 100%; }
  .stack-wrap { min-width: 120px; }

  .agekey { display: flex; gap: calc(var(--u) * 3); flex-wrap: wrap;
            margin: calc(var(--u) * 3) 0 calc(var(--u) * 5);
            font: 500 10px/1 var(--mono); color: var(--ink-3); }
  .agekey span { display: inline-flex; align-items: center; gap: 5px; }
  .agekey i { width: 9px; height: 9px; border-radius: 1px; display: block; }

  .panels { display: grid; grid-template-columns: repeat(auto-fit, minmax(215px, 1fr));
            gap: calc(var(--u) * 4); margin-top: calc(var(--u) * 5); }
  .panel {
    border: 1px solid var(--line-soft); border-radius: 3px;
    background: var(--panel-2); padding: calc(var(--u) * 3);
  }
  .panel h4 {
    margin: 0 0 calc(var(--u) * 2); font-size: 9.5px; letter-spacing: .16em;
    text-transform: uppercase; color: var(--ink-3); font-weight: 650;
  }
  .panel .line {
    display: flex; justify-content: space-between; gap: calc(var(--u) * 2);
    font: 400 11.5px/1.7 var(--mono); color: var(--ink-2);
  }
  .panel .line span:last-child { color: var(--ink); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .panel .line em { font-style: normal; color: var(--ink-3); }
  .panel .hint { margin: calc(var(--u) * 2) 0 0; font-size: 10.5px; color: var(--ink-3); line-height: 1.5; }

  /* What the window can be told to do: language, rules, export, help.
     
     **The group carries the alignment, not the buttons.** Each of these used
     to declare `margin-left: auto` for itself — a line copied forward every
     time one was added — which in a flex row means "take the slack before me".
     The first one took it and the rest inherited a rule that did nothing,
     leaving four buttons that looked placed by accident because they were.
     One `auto`, on the group, is the whole of the alignment now.
     
     Square rather than round, to match the view switch beside them: two shapes
     in eighteen pixels of bar read as two unrelated things, and these are the
     same kind of thing — a control over the window. */
  .tools { display: flex; gap: 2px; margin-left: auto; align-items: center; }
  .about {
    background: none; border: 1px solid var(--line); color: var(--ink-3);
    width: 18px; height: 18px; border-radius: 3px; cursor: pointer;
    font: 600 11px/1 var(--sans); padding: 0;
  }
  .about:hover { color: var(--ink); border-color: var(--ink-3); }
  .about[aria-pressed="true"] { color: var(--q-key); border-color: var(--q-key); }
  .about[aria-expanded="true"] { color: var(--q-key); border-color: var(--q-key); }
  .about:focus-visible { outline: 2px solid var(--focus); outline-offset: 1px; }
  /* The line is the sentence: everything left of it is about the window,
     everything right of it is about the shape of the list. */
  .tools + .views {
    margin-left: calc(var(--u) * 3);
    padding-left: calc(var(--u) * 3);
    border-left: 1px solid var(--line);
  }

  /* ---------------- the row menu ---------------- */
  tbody tr { cursor: default; }
  /* The rows that are not drawn, standing in for their own height. */
  tbody tr.spacer, tbody tr.ghost { pointer-events: none; }
  tbody tr.spacer td, tbody tr.ghost td { padding: 0; border: 0; }
  tbody tr.ghost { height: 31px; }
  /* **A row on its way looks like a row on its way.**
   *
   * It was blank — no text, no border, nothing — so a screenful of them was
   * indistinguishable from a broken list, and that is what it was taken for.
   * Fast scrolling reaches them every time: the hand moves further in a moment
   * than the service can answer for, and the first window of a *new ordering*
   * costs seconds because the engine has a whole order to prepare (measured on
   * the live index: 2.1 s cold for `sort:name`, 24 ms once prepared).
   *
   * Two bars, where the two widest columns are. **Not animated**: this page has
   * one moving thing and it is freshness, and a shimmer on sixty rows would be
   * compositor work every frame for as long as a list is filling. Still enough
   * to say the difference between "nothing here" and "not yet". */
  tbody tr.ghost td:nth-child(2)::after,
  tbody tr.ghost td:nth-child(3)::after {
    content: ""; display: block; height: 8px; border-radius: 2px;
    margin: 11px calc(var(--u) * 3); background: var(--line);
  }
  tbody tr.ghost td:nth-child(3)::after { background: var(--line-soft); }
  tbody tr.far td {
    padding: calc(var(--u) * 4) calc(var(--u) * 5);
    color: var(--ink-3); font-size: 12px;
    border-top: 1px solid var(--line);
  }
  tbody tr.far:hover { background: none; }
  tbody tr.spacer:hover, tbody tr.ghost:hover { background: none; }
  tbody tr:focus-visible { outline: 2px solid var(--q-key); outline-offset: -2px; }

  /* A row that was not in the list a moment ago.
     The list updates itself while it is open, and a list that changes under
     you without saying so is one you stop trusting — so what arrived is shown
     arriving. It fades rather than staying: this marks the event, not the row,
     and a permanent badge would still be there tomorrow. */
  tbody tr.fresh { animation: arrived 1.6s ease-out; }
  tbody tr.fresh td:first-child { box-shadow: inset 2px 0 0 var(--t0); }
  @keyframes arrived {
    from { background: color-mix(in srgb, var(--t0) 22%, transparent); }
    to   { background: transparent; }
  }
  @media (prefers-reduced-motion: reduce) {
    tbody tr.fresh { animation: none; }
  }

  .rowmenu {
    position: fixed; z-index: 60;
    background: var(--panel); border: 1px solid var(--line);
    border-radius: 3px; padding: 3px;
    box-shadow: 0 14px 36px -18px rgba(0,0,0,.8);
    display: flex; flex-direction: column; min-width: 168px;
  }
  .rowmenu[hidden] { display: none; }
  .rowmenu button {
    background: none; border: 0; text-align: left;
    font: inherit; font-size: 12.5px; color: var(--ink-2);
    padding: calc(var(--u) * 1.5) calc(var(--u) * 2.5);
    border-radius: 2px; cursor: pointer;
  }
  .rowmenu.cols { max-height: 60vh; overflow-y: auto; }
  .rowmenu.cols .tick {
    display: inline-block; width: 14px; color: var(--q-val); font-size: 11px;
  }
  .rowmenu.cols button[disabled] { opacity: .4; cursor: default; }
  /* The language menu borrows the column picker's tick, because it is the same
     gesture — a list where one entry is the one in force. Narrower: two
     language names do not need the width of "Back to the default". */
  .rowmenu.langs { min-width: 132px; }
  .rowmenu.langs .tick {
    display: inline-block; width: 14px; color: var(--q-val); font-size: 11px;
  }
  .rowmenu.cols .reset {
    border-top: 1px solid var(--line); margin-top: 3px; padding-top: 6px;
    color: var(--ink-3);
  }
  thead th.pick { width: 30px; padding: 0; }
  thead th.pick button {
    background: none; border: 0; cursor: pointer; color: var(--ink-3);
    width: 28px; height: 100%; font-size: 15px; line-height: 1;
  }
  thead th.pick button:hover { color: var(--ink); }
  thead th[data-sort] { cursor: pointer; }
  thead th:not([data-sort]):not(.pick) { cursor: default; }
  tbody td.mono { font: 400 11.5px/1 var(--mono); color: var(--ink-2); }

  /* The picture beside a name, in the column of its own to the left of it.
     Eighteen pixels in a thirty-one pixel row, so a thumbnail reads as an
     image without the row growing; `contain` because a photograph is not
     square and cropping one to a tile is a lie about what is in it.

     `display: block` with automatic side margins rather than an inline-block:
     a table cell centres its content box vertically for `vertical-align:
     middle`, so this needs no baseline nudge, and the old `vertical-align:
     -4px` was tuned against text that is no longer in the same cell. */
  tbody td.age .ico {
    width: 18px; height: 18px;
    object-fit: contain;
    display: block;
    margin: 0 auto;
    /* Nothing shifts while they arrive: the box is there from the first
       frame, whether or not the theme has anything to put in it. */
    flex: none;
  }

  /* ---------------- the type glyphs ----------------
   *
   * **Drawn here rather than taken from the desktop**, and the desktop's were
   * tried first. Adwaita's mimetype icons are what the bridge resolved: a blue
   * rhombus for an executable, an all-but-blank page for a document, and at
   * eighteen pixels on a dark list they read as coloured lint. Worse, they are
   * a Linux answer — `find` looks under XDG icon directories, so on Windows
   * and macOS every row got a 404 and an empty box where a picture should be.
   *
   * A mask rather than an `<img>`: the glyph is one CSS custom property and the
   * colour is another, so a row that changes type changes a class name and
   * nothing is fetched, decoded or parsed. Thumbnails still come down the wire
   * as pictures, because those are the file itself.
   *
   * **Muted on purpose.** This page has one loud voice and it is freshness —
   * the three-pixel rule down each row uses all the saturation there is. These
   * sit under it: enough hue to sort a screenful at a glance, not enough to
   * argue with the thing that is actually data. Most types are simply grey,
   * and the shape carries the meaning. */
  tbody td.age span.ico {
    background-color: var(--k, var(--ink-3));
    -webkit-mask: var(--g) center / 18px 18px no-repeat;
    mask: var(--g) center / 18px 18px no-repeat;
  }

  /* **The switch for the glyphs, in the heading of the column they fill.**
     It was in the meter bar beside the language menu — which is where this
     window keeps the things that are about the *window* — and a picture in
     every row is about a column. Over the thing it controls, so the question
     "what are these and how do I stop them" has its answer in the place it is
     asked.

     The heading gives up its padding: `thead th` carries 24px of it, which is
     most of a thirty-pixel column, and a button cannot be centred in what is
     left. */
  thead th.mark { width: 30px; padding: 0; text-align: center; }
  thead th.mark button {
    background: none; border: 1px solid transparent; border-radius: 3px;
    width: 20px; height: 20px; padding: 0; cursor: pointer;
    color: var(--ink-3); font: 600 11px/1 var(--sans);
    vertical-align: middle;
  }
  thead th.mark button:hover { color: var(--ink); border-color: var(--line); }
  thead th.mark button[aria-pressed="true"] { color: var(--q-key); }
  thead th.mark button:focus-visible { outline: 2px solid var(--focus); outline-offset: 1px; }

<script>
(function () {
  /* ------------------------------------------------------------------ *
   * The words.
   *
   * **The catalogue is the service's, not this file's.** Every string below
   * is written in English and looked up; the English *is* the key, the way
   * gettext keys by the source text, so a string nobody has translated
   * degrades to correct English rather than to `hint.empty.3`. The Turkish
   * lives in `lang/tr/LC_MESSAGES/scour.po`, is compiled into `scour-i18n`,
   * and reaches this page through `/api/strings` — the same catalogue the
   * CLI and the Slint window read, because the alternative is three
   * frontends translated separately and drifting.
   *
   * `{name}` is the only substitution, and there is no plural machinery.
   * Turkish does not inflect a noun after a numeral — "5 dosya", not
   * "5 dosyalar" — so the one language shipped beside English needs none, and
   * the English strings are written to avoid needing it either. The day a
   * language that does need it arrives, this is where it goes and `po.rs`
   * says what it would cost.
   *
   * **Called `T` and not `t`.** Nineteen local variables in this file are
   * already called `t` — a token, a term, a timestamp — and a lookup that can
   * be shadowed by one of them is a lookup that fails somewhere inside a
   * `catch`. `T(` is also the thing `the_page_says_nothing_the_catalogue_has_
   * not_heard_of` greps for, and it cannot be confused with `at(` or `format(`.
   * ------------------------------------------------------------------ */
  let LANG = "en";
  let LANGUAGES = [];
  let STRINGS = {};
  const T = (msgid, vars) => {
    let s = Object.hasOwn(STRINGS, msgid) ? STRINGS[msgid] : msgid;
    if (vars) {
      for (const k of Object.keys(vars)) s = s.split("{" + k + "}").join(vars[k]);
    }
    return s;
  };

  /* Numbers and dates follow the language too, and they were welded as hard
     as the words were: `toLocaleString("tr-TR")` printed `4.864` and
     `Intl.DateTimeFormat("tr-TR")` printed a Turkish month, whatever the rest
     of the window said. Rebuilt on a switch rather than read per call —
     `STAMP` is used once per row per paint, and constructing a formatter
     there was measured as the wrong place for it long before this. */
  const DATE_PARTS = {
    day: "numeric", month: "long", year: "numeric",
    hour: "2-digit", minute: "2-digit", second: "2-digit",
  };
  /* Two decimals always, so the meter does not change width between `0.3 ms`
     and `0.29 ms` while somebody types; one for the index's size, which is
     megabytes and does not need more. */
  const MS_PARTS = { minimumFractionDigits: 2, maximumFractionDigits: 2 };
  const MB_PARTS = { minimumFractionDigits: 1, maximumFractionDigits: 1 };
  let NUMBERS = new Intl.NumberFormat("en");
  let MS = new Intl.NumberFormat("en", MS_PARTS);
  let MB = new Intl.NumberFormat("en", MB_PARTS);
  let STAMP = new Intl.DateTimeFormat("en", DATE_PARTS);
  function buildFormatters() {
    NUMBERS = new Intl.NumberFormat(LANG);
    MS = new Intl.NumberFormat(LANG, MS_PARTS);
    MB = new Intl.NumberFormat(LANG, MB_PARTS);
    STAMP = new Intl.DateTimeFormat(LANG, DATE_PARTS);
  }

  /* Write the catalogue into the markup.
   *
   * `data-t` is a msgid and the element holds nothing else, so this can run
   * again on a switch and read the same key it read the first time. An
   * earlier sketch harvested the element's own text as the msgid, which works
   * exactly once: the second pass looks up the Turkish and finds nothing. */
  function applyMarkup(root) {
    for (const el of root.querySelectorAll("[data-t]")) {
      el.textContent = T(el.dataset.t);
    }
    /* `innerHTML` for the handful of sentences with `<code>` or `<b>` inside
       them. The strings are the catalogue's own — they are not user input and
       never touch a path or a query — and the alternative is either prose
       chopped into a span per clause or a design note that cannot say
       `kind:` in the face it is talking about. */
    for (const el of root.querySelectorAll("[data-t-html]")) {
      el.innerHTML = T(el.dataset.tHtml);
    }
    for (const el of root.querySelectorAll("[data-t-title]")) {
      el.title = T(el.dataset.tTitle);
    }
    for (const el of root.querySelectorAll("[data-t-aria]")) {
      el.setAttribute("aria-label", T(el.dataset.tAria));
    }
    for (const el of root.querySelectorAll("[data-t-ph]")) {
      el.placeholder = T(el.dataset.tPh);
    }
  }

  let TOTAL = 0;   /* from /api/status, once the page is up */
  let TOTAL_KNOWN = false;
  /* The search is deliberately sent before status. Until status lands there
     is no meaningful denominator: `1000+ / 0` says the whole index is empty
     while its first page is visibly proving otherwise. A genuinely empty
     index still says `0 / 0` once status has made that fact known. */
  const withIndexTotal = (shown) =>
    TOTAL_KNOWN ? shown + " / " + fmt(TOTAL) : shown;

  // Real measurements (docs/MEASUREMENTS.md, 1,217,362 entries, 40 rows, count cap 500).
  const MEASURED = {
    "": [0.11, 500], "r": [0.16, 3965], "ra": [0.29, 25272], "rap": [0.59, 39028],
    "rapo": [0.54, 11264], "rapor": [0.29, 4864], "ab": [0.59, 16850],
    "main": [0.71, 21468], "ext:rs": [0.34, 9723], "*.pdf": [0.55, 24192],
    "kind:image": [2.38, 102460], "size:>10mb": [0.71, 15798],
    "kind:code dm:7d": [0.60, 5510]
  };

  const DAY = 86400;
  /* The mockup froze the clock so its twenty invented files would always read
     the same. Real rows carry real mtimes, and against a fixed `now` a file
     modified yesterday came out as "1 min ago" — the age was negative and the
     ruler clamped it. Recomputed on every draw, because a search box stays
     open for hours and "5 min ago" has to stop being true. */
  let now = Math.floor(Date.now() / 1000);
  const F = (p, name, size, ago, kind) =>
    ({ path: p, name, size, mtime: now - ago, kind });

  /* ------------------------------------------------------------------ *
   * The service.
   *
   * Everything below this object is the same page it was as a mockup; this
   * is the only thing that knows there is a daemon. A browser cannot open a
   * Unix socket and neither can an extension — an extension's way in is a
   * native-messaging host, which is a local process talking to the socket,
   * which is `scour-web` with a different mouth. So swapping HTTP for that
   * later is this object and nothing else.
   * ------------------------------------------------------------------ */
  const TOKEN = new URLSearchParams(location.search).get("t") || "";

  const SERVICE = {
    async get(route, params, signal) {
      const q = new URLSearchParams({ ...params, t: TOKEN });
      const r = await fetch(`/api/${route}?${q}`, { cache: "no-store", signal });
      if (!r.ok) throw new Error(`${route}: ${r.status}`);
      const j = await r.json();
      if (j.error) throw new Error(j.error);
      return j;
    },
    /* `signal` is not decoration. A flick down a two-million-row list crosses
       a window boundary every few frames, and a request nobody is waiting for
       still holds one of the six connections a browser will open to an origin.
       Abandoning them is what keeps the one window that is finally being looked
       at from queueing behind thirty that are not. */
    search: (q, sort, desc, limit, offset, signal) =>
      SERVICE.get("search", { q, sort, desc: desc ? 1 : 0, limit, offset: offset || 0 }, signal),
    /* Every question about the matching set, in one request. The index
       answers them from one walk of it — see `FacetResponse::groups`. */
    explain: (q, cursor, signal) =>
      SERVICE.get("explain", cursor === null ? { q } : { q, cursor }, signal),
    sidebar: (q, edges) =>
      SERVICE.get("facets", { q, by: "kind,age", edges: edges.join(",") }),
    /* What a folder weighs, and its heaviest children. One walk of the index —
       96 ms over 658,360 files — and no filesystem access at all: the sizes and
       the parent links are already there.

       `q` narrows it to the matching files. Cheaper, but not by the order of
       magnitude the row counts suggest — the folder tree costs the same
       whatever is asked, so the whole index is 376 ms unfiltered and 243 ms
       for a query nothing answers. Scoping is what makes it quick: 57 ms and
       13.9 ms for the same pair under one folder. An empty `q` is the `du`
       question, unchanged. */
    usage: (path, top, q) => SERVICE.get("usage", { path, top: top || 24, q: q || "" }),
    /* The same file, several times over, under one folder.
       `budget_mb: 0` reads nothing — 84 ms over thirty thousand candidates —
       and answers "which of these *might* be copies". Confirming means reading
       them, which is somebody's disk and therefore a button rather than a
       default. */
    dupes: (under, budgetMb, minMb, signal) =>
      SERVICE.get("dupes",
        { under, budget_mb: budgetMb || 0, min_mb: minMb || 1, top: 25 }, signal),
    /* What this window remembers, kept by the service.
     *
     * **Not `localStorage`, and that is a correction.** A browser writes it on
     * a clean shutdown and loses it when the process is killed — measured both
     * ways, and this window is killed often enough that its own launcher has a
     * comment about it. It also cannot be read by a terminal interface or a
     * Slint one, and a person who turns off a column has said something about
     * Scour rather than about Chromium. */
    settings: () => SERVICE.get("settings", {}),
    saveSettings: (s) => fetch(
      `/api/settings?${new URLSearchParams({ set: JSON.stringify(s), t: TOKEN })}`,
      { method: "POST" },
    ).catch(() => {}),
    /* Ask the desktop to make the pictures it has not made yet, and say which
       ones exist afterwards. No bytes come back through here: the page then
       fetches them from `/api/icon`, exactly as it fetches the ones that were
       already there.

       `POST`, because it starts programs — a `GET` form of this would be an
       `<img src>` that quietly makes a machine decode a video, which is the
       shape the method split exists to stop. The paths go in the body rather
       than the query because a screenful of them is several kilobytes and a
       request line is bounded at sixteen; over that it is cut rather than
       refused. */
    thumbs: async (paths) => {
      const r = await fetch(`/api/thumb?${new URLSearchParams({ t: TOKEN })}`, {
        method: "POST",
        cache: "no-store",
        body: paths.join("\n"),
      });
      if (!r.ok) throw new Error(`thumb: ${r.status}`);
      return r.json();
    },
    /* Start another face. `POST`, like everything else here that runs a
       program, and the name is one of two words the server knows rather than
       a path it would run. */
    face: async (which) => {
      const r = await fetch(
        `/api/face?${new URLSearchParams({ face: which, t: TOKEN })}`,
        { method: "POST" },
      );
      if (!r.ok) throw new Error(await r.text());
      return r.json();
    },
    status: () => SERVICE.get("status", {}),
    /* The one request that is meant to take a long time: it does not answer
       until the index would answer differently. See the live section at the
       bottom of this file. */
    wait: (rev, ms) => SERVICE.get("wait", { rev, ms }),
    /* What can be shown of this file, asked *before* anything is fetched.
       A page cannot tell that `notes.bak` is readable and `model.safetensors`
       is not — that is decided by looking at the bytes, which happens in the
       bridge — and it must not find out by pulling a four-gigabyte video into
       memory to read its content type. */
    peek: (path, signal) => SERVICE.get("preview", { path, meta: 1 }, signal),
    /* The bytes themselves, as a URL rather than a fetch. An `<img>` or a
       `<video>` given this streams it and seeks in it; a `fetch` into a blob
       would hold the whole file to show the first frame. */
    peekUrl: (path) =>
      `/api/preview?${new URLSearchParams({ path, t: TOKEN })}`,
  };

  /* The rows the last search returned. Filled by `render`, read by the table
     and the histogram — nothing else keeps a copy. */
  let FILES = [];

  /* The label for one row's kind, in three places that all had their own copy.
   *
   * **"Klasör" used to be written here**, which made this file the fourth
   * holder of a word `/api/kinds` already sends: the engine has a `folder`
   * kind, its msgid is "Folder", and the rail was already showing the
   * translation of it one column to the left. Three literals, one for each
   * place a row's kind is filled in, and nothing that would have noticed if
   * they disagreed with the rail.
   *
   * So the folder label is looked up like every other one. `KIND_KEY` is empty
   * until `/api/kinds` lands, which is a few milliseconds — the same few in
   * which every other row label is also blank, and the same reload path
   * repaints them all. */
  const labelOfToken = (token) => KIND_KEY[token] || T("Other");
  const kindLabel = (row) => labelOfToken(row.is_dir ? "folder" : row.kind);

  /* The service answers in its own vocabulary: a full path, and a kind as the
     token the query language uses. The page wants a folder, a name and the
     label in the reader's language. One place converts.

     Everything the service sent, with the two fields the page names
     differently laid over it. Listing the fields here instead was how a
     column switched on in the picker rendered blank: the value had arrived
     and this had thrown it away, which is the kind of bug that looks like the
     column is broken rather than like the mapping is. */
  const fromService = (row) => ({
    ...row,
    path: row.dir,
    /* The engine's own word for it, kept beside the translated one: the label
       is for reading and the token is what the icon is asked for by. */
    ktoken: row.is_dir ? "folder" : row.kind,
    kind: kindLabel(row),
  });


  // Real numbers, derived from this machine's 1,564,335 entries.
  /* The kinds the rail offers, and the engine is what says which those are.
     They used to be a list in this file, from the mockup, and it did not match
     the taxonomy: it had `package`, `db` and `other`, which are not tokens the
     engine has, and it was missing `exec`, `config` and `file`, which are. So
     three rows read zero forever and executables — every extensionless binary
     in ~/.local/bin, found perfectly well by `kind:exec` — had no row to
     appear in at all.

     Filled from `/api/kinds` on load. Empty until then, which is a few
     milliseconds and honest. */
  let KINDS = [];
  /* Counts deliberately absent. The kind rail's come from `/api/facets`,
     which answers for the query as it stands; there is no equivalent for these
     two, and the mockup's numbers were about a different index on a different
     day. A label with no number is honest, a stale number is not. */
  /* **Both of these were the author's own home directory, written out.** Four
     literal paths under `/home/hasan` for the scope shortcuts, and the same
     string again where a path is shortened to `~`. On anyone else's machine
     that is four shortcuts to folders that are not there and no path that ever
     shortens — the two most visible things in the window, wrong for everybody
     but one person.

     Filled from `/api/places` on load, which reads the desktop's own record of
     what its owner calls Documents and Downloads, in their own language.
