[package]
name        = "scourd"
description = "The Scour service. The only place that names a concrete implementation."
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
repository.workspace   = true
publish.workspace      = true

[[bin]]
name = "scourd"
path = "src/main.rs"

[lints]
workspace = true

[features]
# Diagnostics for measurements in docs/REVIEW-MEMORY.md. Nothing in the
# normal service reads these environment variables or runs the sampler.
memory-trace = [
    "scour-engine/memory-trace",
    "scour-index-native/memory-trace",
]

[dependencies]
scour-core          = { workspace = true }
scour-query         = { workspace = true }
scour-proto         = { workspace = true }
scour-ipc           = { workspace = true }
scour-config        = { workspace = true }
scour-engine        = { workspace = true }
scour-index-native  = { workspace = true }
scour-source-fs     = { workspace = true }
anyhow              = { workspace = true }
clap                = { workspace = true }
ctrlc               = { workspace = true }
serde               = { workspace = true }
serde_json          = { workspace = true }

[dev-dependencies]
tempfile = "3"

[target.'cfg(all(target_os = "linux", target_env = "gnu"))'.dependencies]
# Not optional any more. The arena cap in `main` is part of the shipped
# service rather than a diagnostic — see `cap_allocator_arenas`.
libc = { workspace = true }
