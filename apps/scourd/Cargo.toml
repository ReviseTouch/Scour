[package]
name        = "scourd"
description = "The Scour service. The only place that names a concrete implementation."
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
repository.workspace   = true
publish.workspace      = true

[[bin]]
name = "scourd"
path = "src/main.rs"

[lints]
workspace = true

[features]
# Diagnostics for measurements in docs/REVIEW-MEMORY.md. Nothing in the
# normal service reads these environment variables or runs the sampler.
memory-trace = [
    "scour-engine/memory-trace",
    "scour-index-native/memory-trace",
]

[dependencies]
scour-core          = { workspace = true }
scour-query         = { workspace = true }
scour-proto         = { workspace = true }
scour-ipc           = { workspace = true }
scour-launch        = { workspace = true }
scour-config        = { workspace = true }
scour-dupes         = { workspace = true }
scour-grep          = { workspace = true }
scour-engine        = { workspace = true }
scour-index-native  = { workspace = true }
scour-settings      = { workspace = true }
scour-places        = { workspace = true }
scour-volumes       = { workspace = true }
scour-thumbs        = { workspace = true }
scour-preview       = { workspace = true }
scour-flow          = { workspace = true }
scour-source-fs     = { workspace = true }
scour-extract       = { workspace = true }
scour-textcache     = { workspace = true }
parking_lot         = { workspace = true }
anyhow              = { workspace = true }
clap                = { workspace = true }
# `termination`: SIGTERM and SIGHUP too. systemd stops a service with SIGTERM,
# and without it the process died there, before the shutdown that writes down
# what the index still held in memory.
ctrlc               = { workspace = true, features = ["termination"] }
serde               = { workspace = true }
serde_json          = { workspace = true }

[dev-dependencies]
tempfile = "3"

# The arena cap in `main` on glibc, and the extractor's limits everywhere
# else on Unix — see `documents/pool.rs`.
[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

# The Windows service mode: the Service Control Manager's calls, through the
# crate already in the tree. See `service.rs` and docs/WINDOWS-SERVICE.md.
[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = [
    "Win32_System_Services",
    "Win32_System_SystemInformation",
    "Win32_System_Console",
    "Win32_System_RemoteDesktop",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_System_JobObjects",
] }

# A Mac has nowhere to write a global key, so the one process of Scour's that
# stays holds it. See `hold_key` in `main.rs`.
[target.'cfg(target_os = "macos")'.dependencies]
scour-hotkey = { workspace = true }

[build-dependencies]
scour-icon = { workspace = true }
