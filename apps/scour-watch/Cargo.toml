[package]
name        = "scour-watch"
description = "Sets the filesystem marks Scour watches with, then drops privilege and runs it."
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
repository.workspace   = true
publish.workspace      = true

[[bin]]
name = "scour-watch"
path = "src/main.rs"

[lints]
workspace = true

# **No dependency on anything of Scour's.** This is the one program that runs as
# root, so what it can be made to do is bounded by how little it can reach: the
# config crate would mean root parsing a file the user can write.
[target.'cfg(target_os = "linux")'.dependencies]
libc = { workspace = true }
