[package]
name        = "scour-tui"
description = "Scour in a terminal."
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
repository.workspace   = true
publish.workspace      = true

[[bin]]
name = "scour-tui"
path = "src/main.rs"

[lints]
workspace = true

# A frontend like the window and the bridge: it holds no index, walks no
# filesystem, and does not link the engine. Everything it knows arrived over a
# socket.
[dependencies]
scour-core     = { workspace = true }
scour-proto    = { workspace = true }
scour-ipc      = { workspace = true }
scour-config   = { workspace = true }
# The service, started by the face when nothing is listening. Knows only a
# binary, a socket and a log file; whether something answers is asked through
# a function this crate passes it.
scour-launch   = { workspace = true }
scour-i18n     = { workspace = true }
scour-settings = { workspace = true }
scour-places   = { workspace = true }
scour-preview  = { workspace = true }
scour-ui       = { workspace = true }
# **The language, for one function: `without`.** The rails are counted over
# the query with their own term taken out, and deciding which token is such a
# term is the parser's judgement — `kind:zurna` is text, `tür:code` is a kind.
# Asking the crate that owns the field table is what keeps that from becoming
# a second, quietly different opinion about the query language.
scour-query    = { workspace = true }
# The desktop's key that opens Scour. Reaches no service and nothing of
# Scour's: setting a key binding is the desktop's business, spoken to through
# `gsettings` or `kwriteconfig`.
scour-hotkey = { workspace = true }
# The wastebasket and the clipboard, the same two the window uses.
scour-trash  = { workspace = true }
scour-clip   = { workspace = true }
scour-name   = { workspace = true }
# Which programs claim a kind of file, for `Open with…`.
scour-openers = { workspace = true }
scour-sendto  = { workspace = true }
# And what kind of file it is, which that crate deliberately does not answer.
scour-thumbs = { workspace = true }
scour-page     = { workspace = true }
# The numbers behind the report's pictures — shares that add up, block bars,
# a bar cut into segments. Arithmetic, shared with the window and the page so
# one folder is the same percentage in all three.
scour-chart    = { workspace = true }

ratatui = { workspace = true }
anyhow  = { workspace = true }
clap    = { workspace = true }

[build-dependencies]
scour-icon = { workspace = true }
