[package]
name        = "scour-gui"
description = "The Scour window."
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
repository.workspace   = true
publish.workspace      = true

[[bin]]
name = "scour-gui"
path = "src/main.rs"

[lints]
workspace = true

# A frontend, exactly like `apps/scour`: it holds no index, walks no
# filesystem, and does not link the engine. Everything it knows it learned
# over a socket.
# Skia, behind a flag and off by default. **The only alternative kept**, for
# the day the scene stops being flat rectangles — thumbnails at grid size, say.
# femtovg is not a choice here; see the dependency below.
[features]
skia = ["slint/renderer-skia"]

[dependencies]
scour-core   = { workspace = true }
scour-proto  = { workspace = true }
scour-ipc    = { workspace = true }
scour-config = { workspace = true }
scour-i18n   = { workspace = true }
# The palette, shared with the browser page so the two cannot drift.
scour-ui       = { workspace = true }
# **The language, for one function: `without`.** The rails are counted over
# the query with their own term taken out, and deciding which token is such a
# term is the parser's judgement — `kind:zurna` is text, `tür:code` is a kind.
# Asking the crate that owns the field table is what keeps that from becoming
# a second, quietly different opinion about the query language.
scour-query    = { workspace = true }
scour-page     = { workspace = true }
# For `Change` alone: what this window remembers goes to the service, so the
# browser page opens in the same language and the same shape.
scour-settings = { workspace = true }
# The desktop's thumbnail cache: where a picture lives, and which kinds are
# never worth looking for one. **Nothing here makes a thumbnail** — that starts
# processes, and the service is the only thing allowed to; this window asks it,
# exactly as the browser page does.
scour-thumbs   = { workspace = true }
# For the `Preview` reply's type alone: what a file *is* is the service's
# decision — it needs the file's first eight kilobytes — and this only draws it.
scour-preview  = { workspace = true }
# For the `Places` reply's type alone; the answer comes over the socket.
scour-places   = { workspace = true }
# The wastebasket and the clipboard, both by way of what the desktop already
# has. Neither knows anything about Scour; see their own headers for why
# each is a subprocess rather than a binding.
scour-trash    = { workspace = true }
scour-clip     = { workspace = true }
# What a file may be called — the same rules in all three faces.
scour-name     = { workspace = true }
# Which programs claim a kind of file, for `Open with…`.
scour-openers  = { workspace = true }
anyhow       = { workspace = true }
# The same two flags the terminal face has, spelled the same way — and an
# answer to `--version` that is not a window.
clap         = { workspace = true }
humansize    = { workspace = true }
# Pinned exactly, and not out of caution. 1.17's winit backend divides by a
# refresh rate it reads as zero (`frame_throttle.rs:58`), which crashes on
# every start under Wine — and a caret is enough for Cargo to pick it.
# **CPU drawing, and no OpenGL.** The owner's call, made twice: once on the
# argument, and once again after the GPU renderer was compiled in and measured
# against this one. Alternating runs, window left to settle, this machine:
#
#     idle CPU   software 0.5-1.3%   femtovg 0.6-0.95%   — a tie
#     memory     software 10-14 MB   femtovg 34-36 MB    — 24 MB
#     first rows software ~100 ms    femtovg 170-340 ms  — the GL context
#
# The scene is a list of text on flat rectangles: no gradients, no transforms,
# no image larger than an icon. A GPU has nothing to do here and charges for
# turning up. Software rendering also works where a GL context is not there to
# be had — a virtual machine, a remote session, a broken driver — which for a
# file search tool is the difference between running and not.
#
# **And the fallback everyone assumes is there is not there.** Compiling both
# renderers in does not buy a safety net: femtovg is preferred, its
# `new_suspended` cannot fail, and the GL context is created much later at
# `resume()`. Slint's fallback array only runs when the *factory* errors, so it
# never runs. Verified by taking EGL away: `Error: the event loop failed`, exit
# 1, no window. Choosing femtovg means writing the fallback by hand.
#
# The price of this choice is real and worth writing down: the software
# renderer places every glyph at an `i16` coordinate, so a single text laid out
# past 32 767 physical pixels panics with no error path. That is Slint's own
# bug — slint-ui/slint#12985, filed 2026-08-23, fixed on master in #12994, in
# no release — and it closed this window for days. Five places where a string
# could reach it are capped and tested: the preview, the query field, and the
# rules field. **A new `Text` bound to something unbounded reopens it**, so
# anything of that shape needs a cap or `overflow: elide`.
slint        = { version = "=1.16.1", default-features = false, features = [
    "compat-1-2", "backend-winit", "renderer-software", "std",
] }
# For `WinitWindowAccessor` alone: raising the window when a second copy is
# started. Same pin as `slint`, and no renderer of its own.
i-slint-backend-winit = { version = "=1.16.1", default-features = false }
rfd = { version = "0.15", default-features = false, features = ["async-std", "xdg-portal"] }

[build-dependencies]
scour-icon = { workspace = true }
slint-build  = "=1.16.1"
